<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등불</title>
<style>[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one full-bleed canvas — a night journey seen from above, four places in a row — and two round
   icon buttons. No words on screen until the very last line. Single dark world on purpose. */
:root{
  color-scheme: dark;
  --night:#05070D;
  --ink:#E9DFCB;
  --ember:#F4B860;
  --glass:rgba(233,223,203,.07);
  --edge:rgba(233,223,203,.16);
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:10px;z-index:2}
.ui button,.end button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,transform .15s}
.ui button:hover,.end button:hover{background:rgba(233,223,203,.14)}
.ui button:active,.end button:active{transform:scale(.94)}
.ui svg,.end svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
#snd .off{display:none} #snd[aria-pressed="false"] .on{display:none} #snd[aria-pressed="false"] .off{display:inline}
.end{position:fixed;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:14px 18px;border-radius:999px;border:1px solid var(--edge);background:rgba(5,7,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2;animation:up 1s cubic-bezier(.2,.8,.2,1) both;max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
.end .marks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.end .marks svg{width:22px;height:22px}
.end .sep{width:1px;height:26px;background:var(--edge)}
.end button{width:52px;height:52px;border-color:rgba(244,184,96,.5);color:var(--ember)}
.end button svg{width:24px;height:24px}
@media (max-width:480px){.end{flex-direction:column;border-radius:24px;gap:12px;padding:14px 16px}.end .sep{display:none}}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<canvas id="c" aria-label="어두운 밤길. 빛을 움직여 아이를 집까지 데려다주세요." role="img"></canvas>
<div class="ui">
  <button id="snd" aria-label="소리" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>
    <svg class="off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
  </button>
  <button id="re" aria-label="이 장 처음부터"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M5 4.5V8h3.5"/></svg></button>
</div>
<div class="end" id="end" hidden>
  <div class="marks" id="marks"></div>
  <span class="sep"></span>
  <button id="again" aria-label="처음부터 다시"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M5 4.5V8h3.5"/></svg></button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seedN = 1;
const setSeed = n => { seedN = n; };
const rnd = () => { seedN |= 0; seedN = seedN + 0x6D2B79F5 | 0; let t = Math.imul(seedN ^ seedN >>> 15, 1 | seedN); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const fx = () => Math.random();
function distSeg(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1, u = clamp(((px - ax) * dx + (py - ay) * dy) / L2, 0, 1); return hyp(ax + dx * u - px, ay + dy * u - py); }
function distPoly(px, py, pts) { let m = Infinity; for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, distSeg(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1])); return m; }

/* =========================================================
   Sound — synthesized. Truth is in tune; lies are not.
   ========================================================= */
const A = {
  ctx: null, master: null, on: true, started: false, fogGain: null,
  start() {
    if (this.started || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .9; this.master.connect(this.ctx.destination);
    this.started = true; this.ambience();
  },
  setOn(v) {
    this.on = v; document.getElementById('snd').setAttribute('aria-pressed', String(v));
    if (v && !this.started) this.start();
    if (this.master) this.master.gain.setTargetAtTime(v ? .9 : 0, this.ctx.currentTime, .05);
    if (v && this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  nb: null,
  noise() { if (!this.nb) { const b = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nb = b; } const s = this.ctx.createBufferSource(); s.buffer = this.nb; return s; },
  tone(f, dur, { type = 'sine', vol = .04, when = 0, pan = 0, glide = 0, attack = .006 } = {}) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain(), p = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    o.type = type; o.frequency.setValueAtTime(f, t); if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); if (p) { p.pan.value = clamp(pan, -1, 1); g.connect(p).connect(this.master); } else g.connect(this.master);
    o.start(t); o.stop(t + dur + .05);
  },
  burst(dur, freq, q, vol, type = 'bandpass', when = 0) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + when, s = this.noise(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t, Math.random()); s.stop(t + dur + .05);
  },
  ambience() {
    const s = this.noise(); s.loop = true; const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = .6;
    const g = this.ctx.createGain(); g.gain.value = .018; const l = this.ctx.createOscillator(), lg = this.ctx.createGain(); l.frequency.value = .07; lg.gain.value = .01;
    l.connect(lg).connect(g.gain); s.connect(f).connect(g).connect(this.master); s.start(); l.start();
    const s2 = this.noise(); s2.loop = true; const f2 = this.ctx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 220;
    this.fogGain = this.ctx.createGain(); this.fogGain.gain.value = 0; s2.connect(f2).connect(this.fogGain).connect(this.master); s2.start();
    const chirp = () => {
      if (this.on && !document.hidden && !(G && G.si === 1 && G.fogHere > .5)) { const pan = Math.random() * 1.6 - .8, f0 = 3900 + Math.random() * 900; for (let i = 0; i < 3; i++) this.tone(f0, .045, { vol: .0042, when: i * .07, pan, type: 'triangle' }); }
      setTimeout(chirp, 900 + Math.random() * 2600);
    };
    chirp();
  },
  fog(v) { if (this.fogGain) this.fogGain.gain.setTargetAtTime(v * .05, this.ctx.currentTime, .4); },
  SCALE: [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66],
  step() { this.burst(.05, 700 + Math.random() * 300, .8, .024); },
  wet() { this.burst(.07, 420 + Math.random() * 120, 1.4, .03); },
  reveal(i, pan) { const f = this.SCALE[i % this.SCALE.length]; this.tone(f, 1.4, { vol: .045, pan }); this.tone(f * 2, .7, { vol: .012, pan, when: .01 }); },
  lie(pan) { this.tone(466, .5, { type: 'triangle', vol: .022, pan }); this.tone(483, .55, { type: 'triangle', vol: .02, pan }); this.burst(.35, 5200, 2, .035, 'highpass'); },
  shimmer(pan) { this.tone(1900 + Math.random() * 700, .12, { vol: .006, pan }); },
  fall() { this.tone(620, 1.1, { vol: .06, glide: 70 }); this.burst(.9, 300, .7, .03, 'lowpass'); },
  splash() { this.burst(.8, 900, .5, .07, 'lowpass'); this.tone(300, .9, { vol: .04, glide: 60 }); },
  wake() { this.tone(330, .7, { vol: .04, glide: 523, attack: .08 }); this.tone(660, .5, { vol: .012, when: .5 }); },
  edge() { this.tone(118, .22, { vol: .05 }); },
  joy() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, .9, { vol: .035, when: i * .11 })); },
  sigh() { this.tone(392, .6, { vol: .03, glide: 294 }); },
  pop() { this.tone(880, .25, { vol: .03, glide: 440 }); },
  ignite() { this.burst(.9, 500, .6, .05, 'lowpass'); this.tone(196, 1.8, { vol: .05, glide: 392, attack: .2 }); this.tone(587.33, 1.6, { vol: .02, when: .35, attack: .1 }); },
  flame() { [392, 523.25, 659.25].forEach((f, i) => this.tone(f, 2.2, { vol: .035, when: i * .2, attack: .08 })); this.burst(.6, 700, .6, .03, 'lowpass'); },
  beacon(pan) { [329.63, 440, 587.33, 880].forEach((f, i) => this.tone(f, 2.4, { vol: .03, when: i * .09, pan, attack: .02 })); this.burst(1.6, 300, .4, .04, 'lowpass', .1); },
  whisper(pan) { this.tone(1244 + Math.random() * 40, .9, { vol: .012, pan, attack: .3 }); this.tone(1290, .9, { vol: .009, pan, attack: .3 }); },
  wispPop(pan) { this.tone(740, .3, { type: 'triangle', vol: .03, pan, glide: 300 }); this.tone(762, .32, { type: 'triangle', vol: .025, pan, glide: 290 }); this.burst(.4, 4200, 1.5, .03, 'highpass'); },
  goal() { [261.63, 329.63, 392, 523.25, 659.25].forEach((f, i) => this.tone(f, 3.2, { vol: .03, when: i * .16, attack: .05 })); },
  melody() { const n = [0, 2, 4, 5, 4, 7, 9, 7, 5, 4, 2, 4, 0]; n.forEach((k, i) => { this.tone(this.SCALE[k], 1.8, { vol: .03, when: i * .42, attack: .03 }); if (i % 4 === 0) this.tone(this.SCALE[k] / 2, 3, { vol: .02, when: i * .42, attack: .2 }); }); },
  star() { this.tone(2093, 2.5, { vol: .02, attack: .4 }); this.tone(3136, 2, { vol: .008, when: .3, attack: .4 }); }
};
document.getElementById('snd').addEventListener('click', e => { e.stopPropagation(); A.setOn(!A.on); });
const unlock = () => { A.start(); if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume(); };
addEventListener('pointerdown', unlock, { passive: true }); addEventListener('keydown', unlock);

/* =========================================================
   The four places
   ========================================================= */
const H = 800;
function T(M, x, y, r) { M.trees.push({ x, y, r, h: rnd() }); }
function borderTrees(M, skip = () => false) {
  for (let x = -10; x < M.w + 60; x += 62 + rnd() * 20) { if (skip(x)) continue; T(M, x, 22 + rnd() * 24, 40 + rnd() * 18); T(M, x + 30, H - 22 - rnd() * 24, 40 + rnd() * 18); }
  for (let y = 80; y < H - 60; y += 70) { T(M, 10 + rnd() * 20, y, 44 + rnd() * 10); T(M, M.w - 20 - rnd() * 20, y, 44 + rnd() * 10); }
}
function stonesAlong(pts, gap) {
  const out = []; let carry = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], L = hyp(bx - ax, by - ay);
    for (let d = carry; d < L; d += gap) { const t = d / L; out.push({ x: lerp(ax, bx, t) + (rnd() - .5) * 6, y: lerp(ay, by, t) + (rnd() - .5) * 6, r: 24 + rnd() * 6, rot: rnd() * TAU }); }
    carry = (gap - ((L - carry) % gap)) % gap;
  }
  return out;
}
function makeStage(i) {
  setSeed(1000 + i * 77);
  const M = { id: i, w: 3000, trees: [], chasms: [], holes: [], real: [], lies: [], cst: [], flowers: [], beacons: [], wdefs: [], wisps: [], fog: null, goal: null, start: null, checks: [], route: [], look: 'forest', flies: 16, own: null };
  if (i === 0) {
    M.w = 3400; M.look = 'forest'; M.flies = 26;
    M.chasms = [{ x0: 1150, x1: 1430 }, { x0: 1950, x1: 2470 }];
    const inCh = x => M.chasms.some(c => x > c.x0 - 30 && x < c.x1 + 30);
    borderTrees(M, inCh);
    [[520, 200, 46], [560, 610, 50], [640, 320, 40], [700, 540, 34], [760, 160, 42], [820, 430, 58], [900, 650, 44], [960, 240, 40], [1040, 540, 38], [1090, 170, 36], [1010, 700, 40],
     [1520, 610, 44], [1600, 150, 38], [1760, 540, 46], [1860, 270, 40], [1700, 690, 40], [1540, 250, 30],
     [2600, 620, 44], [2720, 220, 40], [2810, 570, 38], [2900, 190, 44], [3000, 650, 40], [3050, 260, 36], [3310, 240, 52], [3310, 610, 52], [2660, 470, 28]].forEach(([x, y, r]) => T(M, x, y, r));
    setSeed(77);
    M.real = [[[1120, 420], [1200, 400], [1290, 356], [1380, 392], [1462, 430]], [[1930, 380], [1990, 292], [2070, 212], [2170, 172], [2280, 190], [2380, 228], [2470, 244], [2510, 262]]]
      .flatMap((p, k) => stonesAlong(p, 44).map(s => ({ ...s, seen: 0, rung: false, k })));
    M.lies = [[[1935, 452], [2200, 446], [2485, 440]], [[2205, 205], [2330, 315], [2470, 420]]].flatMap(p => stonesAlong(p, 46)).map(s => ({ ...s, hp: 1, gone: false, tw: rnd() * TAU }));
    M.flowers = [{ x: 1662, y: 322, st: 'wait' }];
    M.start = { x: 230, y: 430 }; M.sleep = true;
    M.checks = [{ x: 230, y: 430, at: 0 }, { x: 1085, y: 420, at: 1080 }, { x: 1895, y: 410, at: 1885 }];
    M.goal = { type: 'hut', x: 3215, y: 420, r: 66, door: { x: 3142, y: 420 } };
    M.route = [[160, 430], [480, 430], [620, 420], [760, 300], [900, 320], [1000, 400], [1120, 420], [1462, 430], [1640, 400], [1800, 420], [1930, 390], [2510, 262], [2650, 330], [2800, 420], [3000, 430], [3142, 420]];
  } else if (i === 1) {
    M.w = 2900; M.look = 'marsh'; M.flies = 10;
    borderTrees(M);
    [[360, 240, 40], [430, 610, 44], [520, 320, 28], [2460, 240, 42], [2560, 610, 46], [2700, 320, 38]].forEach(([x, y, r]) => T(M, x, y, r));
    M.fog = { x0: 600, x1: 2300 };
    M.route = [[200, 420], [600, 420], [760, 360], [900, 250], [1060, 240], [1180, 360], [1260, 520], [1400, 600], [1560, 560], [1680, 420], [1760, 290], [1900, 230], [2040, 300], [2140, 440], [2300, 450], [2780, 430]];
    const decoys = [[[1180, 360], [1330, 300], [1450, 262]], [[1680, 420], [1820, 520], [1950, 600]]];
    M.beacons = [[900, 250], [1260, 520], [1470, 252], [1680, 420], [2040, 300]].map(([x, y]) => ({ x, y, act: 0, on: false, t: 0, rot: rnd() * TAU }));
    M.flowers = [{ x: 1428, y: 296, st: 'wait' }];
    for (let x = 650; x < 2270; x += 64) for (let y = 100; y < 712; y += 64) {
      const px = x + (rnd() - .5) * 30, py = y + (rnd() - .5) * 30, r = 26 + rnd() * 12;
      if (distPoly(px, py, M.route) < r + 44) continue;
      if (decoys.some(d => distPoly(px, py, d) < r + 42)) continue;
      if (M.beacons.some(b => hyp(b.x - px, b.y - py) < r + 52)) continue;
      if (M.flowers.some(f => hyp(f.x - px, f.y - py) < r + 40)) continue;
      M.holes.push({ x: px, y: py, r, kind: 'pit', seen: 0 });
    }
    M.start = { x: 200, y: 420 };
    M.checks = [{ x: 200, y: 420, at: 0 }, { x: 1260, y: 520, at: 1240 }, { x: 2040, y: 300, at: 2020 }];
    M.goal = { type: 'gate', x: 2780, y: 430 };
  } else if (i === 2) {
    M.w = 3000; M.look = 'bog'; M.flies = 12;
    borderTrees(M);
    M.route = [[200, 420], [500, 420], [700, 300], [950, 300], [1150, 480], [1400, 520], [1600, 380], [1850, 300], [2100, 420], [2350, 520], [2600, 450], [2860, 420]];
    M.flowers = [{ x: 1262, y: 352, st: 'wait' }];
    for (let x = 430; x < 2720; x += 140) for (let y = 140; y < 690; y += 140) {
      const px = x + (rnd() - .5) * 70, py = y + (rnd() - .5) * 70, r = 58 + rnd() * 54;
      if (distPoly(px, py, M.route) < r + 62) continue;
      if (M.flowers.some(f => hyp(f.x - px, f.y - py) < r + 70)) continue;
      if (M.holes.some(h => hyp(h.x - px, h.y - py) < (h.r + r) * .75)) continue;
      if (py - r < 70 || py + r > H - 70) continue;

    }
    [[620, 520, 34], [1020, 180, 38], [1480, 660, 36], [1720, 160, 40], [2240, 270, 36], [2500, 640, 40]].forEach(([x, y, r]) => {
      if (distPoly(x, y, M.route) > r + 40 && !M.holes.some(h => hyp(h.x - x, h.y - y) < h.r + r)) T(M, x, y, r);
    });
    M.wdefs = [430, 780, 1120, 1450, 1760, 2080, 2380].map(at => ({ at, done: false }));
    M.start = { x: 200, y: 420 };
    M.checks = [{ x: 200, y: 420, at: 0 }, { x: 1150, y: 480, at: 1130 }, { x: 2100, y: 420, at: 2080 }];
    M.goal = { type: 'gate', x: 2860, y: 420 };
  } else {
    M.w = 2600; M.look = 'meadow'; M.flies = 46;
    M.chasms = [{ x0: 950, x1: 1650, river: true }];
    const inCh = x => x > 920 && x < 1680;
    borderTrees(M, inCh);
    [[380, 230, 44], [520, 620, 46], [700, 300, 36], [820, 600, 40], [1850, 230, 42], [1990, 620, 44], [2150, 250, 36]].forEach(([x, y, r]) => T(M, x, y, r));
    setSeed(4321);
    const cp = [[930, 420], [1040, 380], [1150, 440], [1260, 400], [1380, 462], [1500, 410], [1610, 432], [1690, 420]];
    M.cst = stonesAlong(cp, 42).map(s => ({ ...s, vis: 0 }));
    M.own = [...M.cst.map(s => [s.x, s.y]), [1760, 420], [1920, 400], [2100, 430], [2290, 420], [2330, 420]];
    M.start = { x: 200, y: 420 };
    M.checks = [{ x: 200, y: 420, at: 0 }, { x: 900, y: 420, at: 880 }];
    M.goal = { type: 'home', x: 2400, y: 420, r: 70, door: { x: 2326, y: 420 } };
    M.route = [[160, 420], [600, 430], [900, 420], [1700, 420], [2326, 420]];
  }
  M.ground = paintGround(M);
  return M;
}

/* ---------- ground painting ---------- */
const LOOK = {
  forest: { base: '#13201A', h0: 95, h1: 145, s: 25, l: 7 },
  marsh: { base: '#121B1E', h0: 150, h1: 200, s: 18, l: 7 },
  bog: { base: '#0F1A19', h0: 160, h1: 190, s: 22, l: 6 },
  meadow: { base: '#16241A', h0: 80, h1: 130, s: 30, l: 9 }
};
function paintGround(M) {
  const c = document.createElement('canvas'); c.width = M.w; c.height = H; const g = c.getContext('2d');
  const lk = LOOK[M.look]; setSeed(9 + M.id * 13);
  g.fillStyle = lk.base; g.fillRect(0, 0, M.w, H);
  for (let i = 0; i < M.w * 4; i++) {

  if (M.id === 3 && K.own && G.waitT > 5) { const p = (G.t * .5) % 1; ctx.strokeStyle = `rgba(255,214,160,${.35 * (1 - p)})`; ctx.lineWidth = 1.5; ctx.setLineDash([2, 8]); ctx.beginPath(); ctx.arc(K.x, K.y, 60 + p * 200, 0, TAU); ctx.stroke(); ctx.setLineDash([]); }
}

/* =========================================================
   End: wordless tally — flowers, sources, false lights, falls
   ========================================================= */
function showEnd() {
  const m = document.getElementById('marks');
  const svg = (inner, label) => `<svg viewBox="0 0 24 24" role="img" aria-label="${label}">${inner}</svg>`;
  const petals = (fill, stroke) => `<g fill="${fill}" stroke="${stroke}"><ellipse cx="12" cy="6.5" rx="3" ry="4"/><ellipse cx="17.2" cy="10.4" rx="3" ry="4" transform="rotate(72 17.2 10.4)"/><ellipse cx="15.2" cy="16.6" rx="3" ry="4" transform="rotate(144 15.2 16.6)"/><ellipse cx="8.8" cy="16.6" rx="3" ry="4" transform="rotate(216 8.8 16.6)"/><ellipse cx="6.8" cy="10.4" rx="3" ry="4" transform="rotate(288 6.8 10.4)"/></g>`;
  let h = P.flowers.map(v => v ? svg(petals('#FFB8D8', 'none') + '<circle cx="12" cy="12" r="2.4" fill="#FFE7A8" stroke="none"/>', '함께 본 꽃') : svg(petals('none', '#6E5F68'), '지나친 꽃')).join('');
  h += svg(`<circle cx="12" cy="12" r="3.5" fill="#FFE2A8" stroke="none"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2" stroke="#FFE2A8"/>`, `켠 기둥 ${P.beacons}개`) + `<span style="font:600 12px ui-monospace,monospace;color:#cbbd9f" aria-hidden="true">${P.beacons}</span>`;
  h += svg('<circle cx="12" cy="12" r="6" stroke="#AFC8F0" stroke-dasharray="2 3"/>', `드러낸 가짜 불빛 ${P.wisps}개`) + `<span style="font:600 12px ui-monospace,monospace;color:#AFC8F0" aria-hidden="true">${P.wisps}</span>`;
  h += P.falls ? svg('<path d="M6 8c2-3 10-3 12 0l-2 4-3-1-2 3-2-2-3 1z" stroke="#9FB0D0"/><path d="M12 15v5" stroke="#9FB0D0" stroke-dasharray="2 2"/>', `떨어진 횟수 ${P.falls}`) + `<span style="font:600 12px ui-monospace,monospace;color:#9FB0D0" aria-hidden="true">${P.falls}</span>` : svg('<path d="M5 12.5l4.5 4.5L19 7.5" stroke="#9BD3A8"/>', '한 번도 떨어지지 않았어요');
  m.innerHTML = h;
  document.getElementById('end').hidden = false;
  setTimeout(() => document.getElementById('again').focus({ preventScroll: true }), 50);
}
function restartStage() {
  if (G.endT >= 0 || G.trans) return;
  Object.assign(P, G.stageStart, { flowers: [...G.stageStart.flowers] });
  const si = G.si, ign = G.ignited; loadStage(si, ign); G.icon = -99; G.fade = 1;
}
function restartAll() {
  document.getElementById('end').hidden = true;
  Object.assign(P, { joy: 0, falls: 0, beacons: 0, wisps: 0, flowers: [0, 0, 0] });
  loadStage(0, true); G.icon = -99; G.fade = 1;
}
document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); restartAll(); });
document.getElementById('re').addEventListener('click', e => { e.stopPropagation(); restartStage(); });

/* =========================================================
   Loop
   ========================================================= */
function resize() {
  DPR = Math.min(1.75, devicePixelRatio || 1); W = innerWidth; VH = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(VH * DPR); dark.width = cv.width; dark.height = cv.height;
  S = clamp(Math.min(W / 560, VH / 600), .58, 1.9);
}
addEventListener('resize', resize); resize();
loadStage(0, false);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, .05) * (window.__speed || 1); last = now;
  if (document.hidden) return;
  try { update(dt); render(); } catch (err) { if (!frame.warned) { frame.warned = true; console.error(err); } }
}
update(0); render(); requestAnimationFrame(frame);
window.__lantern = { get state() { return G; }, get map() { return M; }, get P() { return P; }, go(i) { loadStage(i, true); } };
})();
</script>
