<style>
/* Layout: one full-bleed canvas — a night forest seen from above — with two round icon buttons.
   No words on screen. Single dark world on purpose. */
:root{
  color-scheme: dark;
  --night:#05070D;
  --ink:#E9DFCB;
  --ember:#F4B860;
  --glass:rgba(233,223,203,.07);
  --edge:rgba(233,223,203,.16);
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:10px;z-index:2}
.ui button,.end button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s,transform .15s}
.ui button:hover,.end button:hover{background:rgba(233,223,203,.14)}
.ui button:active,.end button:active{transform:scale(.94)}
.ui svg,.end svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
#snd .off{display:none} #snd[aria-pressed="false"] .on{display:none} #snd[aria-pressed="false"] .off{display:inline}
.end{position:fixed;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:14px 18px;border-radius:999px;border:1px solid var(--edge);background:rgba(5,7,13,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:2;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.end .marks{display:flex;align-items:center;gap:8px}
.end .marks svg{width:22px;height:22px}
.end .sep{width:1px;height:26px;background:var(--edge)}
.end button{width:52px;height:52px;border-color:rgba(244,184,96,.5);color:var(--ember)}
.end button svg{width:24px;height:24px}
@keyframes up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

/* =========================================================

   ========================================================= */

for (let y = 80; y < WH - 60; y += 70) { T(10 + rnd() * 20, y, 44 + rnd() * 10); T(WW - 20 - rnd() * 20, y, 44 + rnd() * 10); }
[[520, 200, 46], [560, 610, 50], [640, 320, 40], [700, 540, 34], [760, 160, 42], [820, 430, 58], [900, 650, 44], [960, 240, 40], [1040, 540, 38], [1090, 170, 36], [1010, 700, 40],

].forEach(([x, y, r]) => T(x, y, r));
const HOUSE = { x: 3215, y: 420, r: 66, door: { x: 3142, y: 420 } };

  [[1930, 380], [1990, 292], [2070, 212], [2170, 172], [2280, 190], [2380, 228], [2470, 244], [2510, 262]]

const LIE_PATHS = [[[1935, 452], [2200, 446], [2485, 440]], [[2205, 205], [2330, 315], [2470, 420]]];

/* =========================================================

  const faceLit = (o, rad) => { const dx = L.x - o.x, dy = L.y - o.y, d = hyp(dx, dy) || 1, ex = o.x + dx / d * rad, ey = o.y + dy / d * rad, de = hyp(L.x - ex, L.y - ey); return de > R || blocked(L.x, L.y, ex, ey, o) ? 0 : clamp(1 - de / R, 0, 1); };
  for (const t of trees) { if (t.x < vx0 - 60 || t.x > vx1 + 60) continue; const f = faceLit(t, t.r * .82); if (f > .01) { ctx.globalAlpha = Math.min(1, f * 1.3); drawTree(t, L); ctx.globalAlpha = 1; } }
  { const f = faceLit(HOUSE, HOUSE.r * .9); if (f > .01) { ctx.globalAlpha = Math.min(1, f * 1.3); drawHouse(); ctx.globalAlpha = 1; } }

  /* warm tint inside the light */
  ctx.globalCompositeOperation = 'lighter';
  const wg = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, R);
  wg.addColorStop(0, 'rgba(255,170,80,.16)'); wg.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = wg; ctx.beginPath(); for (let i = 0; i < poly.length; i += 2) i ? ctx.lineTo(poly[i], poly[i + 1]) : ctx.moveTo(poly[i], poly[i + 1]); ctx.closePath(); ctx.fill();
  if (K.glow > 1) { const kg = ctx.createRadialGradient(K.x, K.y, 0, K.x, K.y, K.glow * 2); kg.addColorStop(0, 'rgba(255,200,130,.22)'); kg.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = kg; ctx.beginPath(); ctx.arc(K.x, K.y, K.glow * 2, 0, TAU); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-over';

  /* things that shine on their own */
  for (const s of REAL) if (s.seen > .5 && !litAt(s.x, s.y, R_LIGHT * 1.1)) drawStone(s, .16, '#8A8270');
  /* a lie looks like a path in the dark, and almost like a stone in the light: no shadow, the odd glint */
  for (const s of LIES) if (!s.gone) {
    const tw = .5 + .5 * Math.sin(G.t * 2.4 + s.tw), a = clamp(s.hp, 0, 1), crack = 1 - a;
    const near = hyp(s.x - L.x, s.y - L.y), inLight = clamp((near - R * .55) / (R * .5), 0, 1);
    if (inLight > 0) drawStone(s, inLight * (.2 + tw * .1) * a, '#9AA3B4', false);
    ctx.globalCompositeOperation = 'lighter';
    if (tw > .97) { ctx.fillStyle = `rgba(230,240,255,${.8 * a})`; ctx.fillRect(s.x + Math.cos(s.tw) * 9, s.y + Math.sin(s.tw) * 5, 2, 2); }
    if (crack > .05) { ctx.strokeStyle = `rgba(200,220,255,${crack * .8})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(s.x - s.r * .6, s.y - 3); ctx.lineTo(s.x - 2, s.y + 4); ctx.lineTo(s.x + s.r * .5, s.y - 5); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';
  }
  if (G.flower !== 'left') {
    const fx = FLOWER.x, fy = FLOWER.y, op = G.flower === 'joy' ? 1 : .75 + Math.sin(G.t * 2) * .15;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 34); g.addColorStop(0, `rgba(255,170,210,${.28 * op})`); g.addColorStop(1, 'rgba(255,170,210,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, 34, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    for (let k = 0; k < 5; k++) { const a = k / 5 * TAU + G.t * .2; ctx.fillStyle = `rgba(255,${180 + k * 8},215,${op})`; ctx.beginPath(); ctx.ellipse(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 5.5, 3.4, a, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#FFE7A8'; ctx.beginPath(); ctx.arc(fx, fy, 2.6, 0, TAU); ctx.fill();
  } else { ctx.fillStyle = 'rgba(180,140,160,.35)'; for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; ctx.beginPath(); ctx.ellipse(FLOWER.x + Math.cos(a) * 5, FLOWER.y + Math.sin(a) * 5 + 3, 4.5, 2.4, a, 0, TAU); ctx.fill(); } }
  const win = G.ended ? 1 : .6 + Math.sin(G.t * 1.3) * .08;
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, r, a] of [[HOUSE.x - 30, HOUSE.y - 20, 30, .5 * win], [HOUSE.door.x - 6, HOUSE.door.y, 34 + (G.ended ? 30 : 0), .35 * win]]) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(255,190,110,${a})`); g.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(255,214,150,${.9 * win})`; ctx.fillRect(HOUSE.x - 38, HOUSE.y - 28, 16, 16);
  ctx.fillStyle = `rgba(255,200,130,${.75 * win})`; ctx.fillRect(HOUSE.door.x - 2, HOUSE.door.y - 12, 6, 24);
  if (K.st !== 'fall') drawKid(K, .22);
  ctx.globalCompositeOperation = 'lighter';
  for (const f of G.flies) { if (f.x < vx0 || f.x > vx1) continue; const a = .35 + .35 * Math.sin(f.p); ctx.fillStyle = `rgba(210,240,140,${a})`; ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, TAU); ctx.fill(); ctx.fillStyle = `rgba(210,240,140,${a * .18})`; ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, TAU); ctx.fill(); }
  for (const p of G.parts) { ctx.fillStyle = `rgba(${p.col},${clamp(p.life / p.max, 0, 1)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  ctx.globalCompositeOperation = 'source-over';
  hintLayer(K, L);
  drawLantern(L);
  if (G.fade > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(5,7,13,${G.fade})`; ctx.fillRect(0, 0, cv.width, cv.height); }
}

/* =========================================================
   End: wordless tally — the flower, the falls, the child's own light
   ========================================================= */
function showEnd() {
  const K = G.kid, m = document.getElementById('marks'); m.innerHTML = '';
  const svg = (inner, label) => `<svg viewBox="0 0 24 24" role="img" aria-label="${label}">${inner}</svg>`;
  const flower = G.flower === 'joy'
    ? svg('<g fill="#FFB8D8" stroke="none"><ellipse cx="12" cy="6.5" rx="3" ry="4"/><ellipse cx="17.2" cy="10.4" rx="3" ry="4" transform="rotate(72 17.2 10.4)"/><ellipse cx="15.2" cy="16.6" rx="3" ry="4" transform="rotate(144 15.2 16.6)"/><ellipse cx="8.8" cy="16.6" rx="3" ry="4" transform="rotate(216 8.8 16.6)"/><ellipse cx="6.8" cy="10.4" rx="3" ry="4" transform="rotate(288 6.8 10.4)"/></g><circle cx="12" cy="12" r="2.4" fill="#FFE7A8" stroke="none"/>', '꽃을 함께 봤어요')
    : svg('<g stroke="#8E7C86"><ellipse cx="12" cy="6.5" rx="3" ry="4"/><ellipse cx="17.2" cy="10.4" rx="3" ry="4" transform="rotate(72 17.2 10.4)"/><ellipse cx="15.2" cy="16.6" rx="3" ry="4" transform="rotate(144 15.2 16.6)"/><ellipse cx="8.8" cy="16.6" rx="3" ry="4" transform="rotate(216 8.8 16.6)"/><ellipse cx="6.8" cy="10.4" rx="3" ry="4" transform="rotate(288 6.8 10.4)"/></g>', '꽃을 지나쳤어요');
  const light = svg(`<circle cx="12" cy="12" r="${K.joy ? 5 : 2}" fill="${K.joy ? '#F4B860' : 'none'}" stroke="#F4B860"/>${K.joy ? '<path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="#F4B860"/>' : ''}`, K.joy ? '아이에게 작은 빛이 생겼어요' : '아이는 아직 빛이 없어요');
  const falls = K.falls ? Array.from({ length: Math.min(K.falls, 6) }, () => svg('<path d="M6 8c2-3 10-3 12 0l-2 4-3-1-2 3-2-2-3 1z" stroke="#9FB0D0"/><path d="M12 15v5" stroke="#9FB0D0" stroke-dasharray="2 2"/>', '떨어졌어요')).join('') : svg('<path d="M5 12.5l4.5 4.5L19 7.5" stroke="#9BD3A8"/>', '한 번도 떨어지지 않았어요');
  m.innerHTML = flower + light + falls;
  document.getElementById('end').hidden = false;
  setTimeout(() => document.getElementById('again').focus({ preventScroll: true }), 50);
}
function restart() {
  document.getElementById('end').hidden = true; seedN = 4242;
  G = fresh(); ptr.has = false; G.fade = 1; G.ignited = true; G.igT = 0;
}
document.getElementById('again').addEventListener('click', e => { e.stopPropagation(); restart(); });
document.getElementById('re').addEventListener('click', e => { e.stopPropagation(); restart(); });

/* =========================================================
   Loop
   ========================================================= */
function resize() {
  DPR = Math.min(1.75, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); dark.width = cv.width; dark.height = cv.height;
  S = clamp(Math.min(W / 560, H / 600), .58, 1.9);
}
addEventListener('resize', resize); resize();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * (window.__speed || 1); last = now;
  if (!document.hidden) { update(dt); if (G.fade > 0) G.fade = Math.max(0, G.fade - dt * 1.6); render(); }
  requestAnimationFrame(frame);
}
G.cam.x = G.kid.x + 60; G.cam.y = G.kid.y;
update(0); render(); requestAnimationFrame(frame);
window.__lantern = { get state() { return G; }, REAL: () => REAL, LIES: () => LIES };
})();
</script>
