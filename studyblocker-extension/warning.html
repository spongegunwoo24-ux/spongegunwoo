<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>차단된 사이트</title>
<style>
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  .card {
    max-width: 420px; width: 90%; text-align: center; background: #1e293b;
    border: 1px solid #334155; border-radius: 24px; padding: 40px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
    background: rgba(239, 68, 68, 0.15); color: #f87171; display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; color: #f1f5f9; }
  p { font-size: 13px; color: #94a3b8; line-height: 1.6; margin: 0 0 20px; }
  .target { font-size: 11px; color: #64748b; word-break: break-all; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; margin-bottom: 24px; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700;
    background: #4f46e5; color: white; cursor: pointer; transition: background 0.2s;
  }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>지금은 집중 시간이에요</h1>
    <p>공부 타이머가 실행 중이거나 잠금모드가 켜져 있어서<br>이 사이트는 접속이 차단되었습니다.</p>
    <div class="target" id="target-url">-</div>
    <button onclick="goBack()">돌아가기</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target');
    if (target) {
      try { document.getElementById('target-url').innerText = decodeURIComponent(target); }
      catch (e) { document.getElementById('target-url').innerText = target; }
    }
    function goBack() {
      if (window.history.length > 1) window.history.back();
      else window.close();
    }
  </script>
</body>
</html>
