<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공부 타이머 사이트 차단기</title>
<style>
  body { width: 280px; margin: 0; background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; }
  .wrap { padding: 16px; }
  h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
  .status-row { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 11px; }
  .badge { font-weight: 700; padding: 2px 8px; border-radius: 999px; font-size: 10px; }
  .on { background: rgba(239,68,68,0.15); color: #f87171; }
  .off { background: rgba(100,116,139,0.2); color: #94a3b8; }
  h2 { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px; }
  .kw-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .kw-item { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 5px 8px; font-size: 11px; }
  .kw-item button { background: none; border: none; color: #f87171; cursor: pointer; font-size: 12px; }
  .add-row { display: flex; gap: 6px; }
  .add-row input { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; color: #f8fafc; font-size: 11px; outline: none; }
  .add-row button { background: #4f46e5; border: none; color: white; border-radius: 8px; padding: 0 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .note { font-size: 10px; color: #64748b; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🔒 공부 타이머 사이트 차단기</h1>

    <div class="status-row">
      <span>타이머 실행 상태</span>
      <span id="status-timer" class="badge off">OFF</span>
    </div>
    <div class="status-row">
      <span>잠금모드 상태</span>
      <span id="status-lock" class="badge off">OFF</span>
    </div>

    <h2>차단 키워드 목록</h2>
    <div class="kw-list" id="kw-list"></div>
    <div class="add-row">
      <input type="text" id="kw-input" placeholder="예: netflix">
      <button id="kw-add-btn">추가</button>
    </div>

    <div class="note">타이머가 실행 중이거나 잠금모드가 켜져 있을 때, 주소에 위 키워드가 포함된 사이트가 자동으로 차단됩니다. 잠금모드를 끄려면 일일플래너 페이지에서 비밀번호를 입력해야 합니다.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
