<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>별자리 자장가</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체가 밤하늘 캔버스. HUD는 귀퉁이에 떠 있는 손글씨, 건설 메뉴는 없다. */
:root{
  color-scheme:dark;
  --sky:#0a0c26; --sky2:#2a1750; --ink:#f4eeff; --dim:#aaa1d4;
  --gold:#ffd97a; --bad:#ff5d8f; --panel:rgba(22,17,58,.9); --edge:rgba(255,255,255,.18);
  --display:'Gaegu','Gowun Dodum',system-ui,sans-serif;
  --body:'Gowun Dodum',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;font-family:var(--display)}
#dust{font-size:30px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;min-width:90px}
#night{text-align:center;font-size:clamp(20px,6vw,30px);font-weight:700;line-height:1;white-space:nowrap}
#night small{display:block;font-size:16px;font-weight:400;color:var(--dim);margin-top:4px}
#btns{display:flex;gap:6px;pointer-events:auto;min-width:90px;justify-content:flex-end}
#btns button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--edge);background:var(--panel);
  color:var(--ink);font:700 18px var(--display);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#foot{position:absolute;inset:auto 0 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
#hint{font:400 20px var(--display);color:var(--ink);text-align:center;text-shadow:0 2px 8px var(--sky);min-height:24px}
#call{pointer-events:auto;border:1.5px solid var(--gold);background:var(--panel);color:var(--gold);
  font:700 20px var(--display);padding:9px 20px;border-radius:999px;cursor:pointer}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,30,.9);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.box{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.box h1{font:700 clamp(44px,11vw,72px)/1 var(--display);margin:0;color:var(--gold);text-wrap:balance}
.box h2{font:700 38px/1.1 var(--display);margin:0;text-wrap:balance}
.box p{margin:0;color:var(--dim);font-size:16px;line-height:1.6}
.how{list-style:none;margin:0;padding:0;display:grid;gap:4px;text-align:left;font-size:15px;line-height:1.45}
.how b{color:var(--gold);font-family:var(--display);font-size:20px;margin-right:6px}
.go{border:0;background:var(--gold);color:#2a1750;font:700 26px var(--display);padding:10px 34px;border-radius:999px;cursor:pointer}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.card{flex:1 1 150px;max-width:190px;min-width:0;background:var(--panel);border:1.5px solid var(--edge);border-radius:18px;
  padding:18px 14px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px;font-family:var(--body)}
.card:hover{border-color:var(--gold)}
.card b{font:700 26px/1.1 var(--display);color:var(--gold)}
.card span{font-size:14px;line-height:1.5;color:var(--ink)}
#maps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#maps .card{flex:1 1 150px;max-width:175px;padding:14px 12px}
#maps .card b{font-size:23px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{border:1.5px solid var(--edge);background:var(--panel);color:var(--ink);font:700 20px var(--display);padding:9px 20px;border-radius:999px;cursor:pointer}
</style>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="dust">✦ <span id="dustN">300</span></div>
    <div id="night"><span id="nightN">밤이 오기 전</span><small id="best"></small></div>
    <div id="btns">
      <button id="bSpeed" aria-label="배속">×1</button>
      <button id="bPause" aria-label="일시정지">Ⅱ</button>
      <button id="bSnd" aria-label="소리">♪</button>
    </div>
  </div>
  <div id="foot"><div id="hint"></div><button id="call">첫 번째 밤 시작 ▶</button></div>

  <div class="ov" id="ovStart"><div class="box">
    <h1>별자리 자장가</h1>
    <p>별은 싸우지 않아요. 별과 별을 이은 <b>빛줄</b>이 악몽을 막아요.</p>
    <ul class="how">
      <li><b>톡</b>빈 하늘을 누르면 별을 심어요</li>
      <li><b>쭉</b>별에서 별로 끌면 빛줄. 요람, 행성, 혜성에도 걸 수 있어요</li>
      <li><b>팅</b>빛줄을 누르거나 쓸면 튕겨서 충격파</li>
      <li><b>△</b>세 곳을 삼각형으로 이으면 안쪽이 결계</li>
      <li><b>휙</b>별에서 악몽으로 끌면 올가미로 묶어요</li>
      <li><b>합성</b>별을 누르고 합성을 고르면 두 별이 하나로</li>
    </ul>
    <div id="maps"></div>
  </div></div>

  <div class="ov" id="ovCards" hidden><div class="box">
    <h2>별들이 선물을 가져왔어요</h2>
    <div id="cards"></div>
  </div></div>

  <div class="ov" id="ovOver" hidden><div class="box">
    <h2 id="overTitle">아이가 깼어요</h2>
    <p id="overTxt"></p>
    <div class="row">
      <button class="go" id="bAgain">다시 재우기</button>
      <button class="ghost" id="bMaps">밤하늘 고르기</button>
      <button class="ghost" id="bMore" hidden>끝없는 밤</button>
    </div>
  </div></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
const PI=Math.PI,TAU=PI*2;
const FONT='Gaegu,"Gowun Dodum",sans-serif';
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=1,H=1,DPR=1,S=1,bg=null;
const twk=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),p:Math.random()*TAU,r:.5+Math.random()*1.3}));
function resize(){
  const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*DPR;cv.height=H*DPR;
  S=Math.min(1.4,Math.sqrt(W*H)/900);
  bg=cx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.75);
  bg.addColorStop(0,'#2a1750');bg.addColorStop(.55,'#141038');bg.addColorStop(1,'#0a0c26');
}
addEventListener('resize',resize);

/* ---------- 소리 ---------- */
let AC=null,mute=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,f2,delay){
  if(!AC||mute)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}
const SCALE=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880,1046.5];
function pluckSnd(len,str){
  const k=Math.max(0,Math.min(1,1-(len-60)/(maxRange()*1.4-60)));
  const f=SCALE[Math.round(k*(SCALE.length-1))];
  tone(f,.75,'triangle',.17*str);tone(f*2,.35,'sine',.06*str);
}
const buzz=()=>tone(140,.15,'square',.05);

/* ---------- 데이터 ---------- */
const T={
  fire:{n:'타닥',c:'#ff6a3c',cost:30,pow:10,d:'화상',f:'닿은 악몽에 3초 불을 붙여요'},
  frost:{n:'꽁꽁',c:'#7fd8ff',cost:30,pow:6,d:'둔화',f:'악몽을 느리게. 불붙은 악몽을 얼리면 열충격!'},
  bolt:{n:'찌릿',c:'#fff06a',cost:40,pow:8,d:'연쇄',f:'번개가 옆 악몽으로 튀어요. 느려진 악몽에겐 1.8배'},
  moon:{n:'토닥',c:'#c9a7ff',cost:45,pow:13,d:'밀기',f:'힘이 세고, 닿은 악몽을 온 길로 밀어내요'},
  thorn:{n:'따끔',c:'#ff6fa8',cost:50,pow:5,d:'체력%',f:'악몽의 최대 체력에 비례해 깎아요. 큰 놈 잡이'},
  gold:{n:'반짝',c:'#ffb52e',cost:40,pow:4,d:'별가루',f:'이 빛에 닿았던 악몽은 별가루를 1.5배 넘게 흘려요'},
  bell:{n:'딩동',c:'#e58bff',cost:45,pow:5,d:'튕김',f:'이 별의 빛줄은 튕기기가 훨씬 세고 빨리 차올라요'},
  eye:{n:'또렷',c:'#8effc1',cost:40,pow:7,d:'유령',f:'유령 스르륵을 붙잡아요. 닿은 유령은 모든 빛줄에 맞아요'},
  guard:{n:'포근',c:'#ffe3cf',cost:45,pow:6,d:'보호',f:'잠들지 않고 빛줄도 안 끊겨요. 이웃 별도 금방 깨요'},
  whirl:{n:'빙글',c:'#6f8dff',cost:45,pow:6,d:'끌기',f:'닿은 악몽을 이 별 쪽으로 끌어당겨요'},
  cradle:{n:'요람',c:'#ffe9a8',pow:12,anchor:1,cap:3,f:'아이의 요람. 여기 건 빛줄은 악몽이 오는 길목에 놓여요 (3줄까지)'},
  planet:{n:'떠돌이 행성',c:'#9ad0c2',pow:9,anchor:1,cap:6,f:'여기 건 빛줄은 1.6배 멀리 닿아요 (6줄까지)'},
  comet:{n:'혜성',c:'#bff4ff',pow:16,anchor:1,cap:4,f:'하늘을 돌아요. 빛줄이 따라 움직이며 쓸고 가고, 너무 멀어지면 잠깐 꺼져요'}
};
const TK=Object.keys(T).filter(k=>!T[k].anchor),LV=[1,1.7,2.8],UPC=[60,130];
const C={hpA:.13,hpB:.032,hpW:1.9,budA:8,budB:5.5,dust0:300,rest:15,sticky:.6,zone:.45,pluck:1.8,waveA:30,waveB:10,dustK:1.5};
const NIGHTS=10;
const F={
  blob:{n:'꼬물이',hp:26,sp:40,r:12,dust:5,c:'#8f7bff'},
  bat:{n:'파닥이',hp:14,sp:80,r:9,dust:5,c:'#ff7bd0'},
  split:{n:'몽글이',hp:50,sp:34,r:15,dust:6,c:'#b48cff'},
  mini:{n:'몽글',hp:14,sp:54,r:8,dust:2,c:'#b48cff'},
  snip:{n:'싹둑이',hp:42,sp:44,r:12,dust:9,c:'#7dffb0'},
  tank:{n:'쿵쿵이',hp:150,sp:22,r:20,dust:14,c:'#ff7a5c',dmg:2,mass:2.5},
  ghost:{n:'스르륵',hp:40,sp:34,r:13,dust:10,c:'#bfe9ff'},
  thief:{n:'슬쩍이',hp:30,sp:62,r:10,dust:9,c:'#ffc24d'},
  boss:{n:'악몽왕',hp:600,sp:14,r:38,dust:150,c:'#ff4d7a',dmg:8,mass:8}
};
const POOL=[['blob',1,1],['bat',1,2],['split',2.5,3],['snip',2.5,4],['tank',5,5],['ghost',3,6],['thief',2.5,7]];
const INTRO={2:['bat','파닥이: 빠르지만 약해요'],3:['split','몽글이: 터지면 둘로 갈라져요'],4:['snip','싹둑이: 빛줄을 끊어요. 끊기 전에 튕겨요!'],
  6:['ghost','스르륵: 빛줄을 통과해요. 결계, 튕기기, 올가미, 또렷 별만 통해요'],7:['thief','슬쩍이: 별을 재워요. 잠든 별은 톡 쳐서 깨워요']};
const MAPS=[
  {n:'고요한 밤',lv:'쉬움',d:'사방에서 몰려와요. 떠돌이 행성 둘이 떠 있어요',kids:[[0,0]],mode:'direct',anchors:[['planet',-.55,-.45],['planet',.55,.45]]},
  {n:'은하수 강',lv:'쉬움',d:'악몽이 은하수를 따라 굽이굽이 흘러와요',kids:[[.68,-.35]],mode:'path',
    path:[[-1.2,-.55],[-.35,-.55],[-.35,.5],[.25,.5],[.25,-.35]],anchors:[['planet',-.05,0],['planet',-.7,.1]]},
  {n:'쌍둥이 달',lv:'어려움',d:'아이가 둘! 악몽은 가까운 아이에게 가요. 별가루를 더 들고 시작해요',kids:[[-.42,0],[.42,0]],mode:'direct',dust:180,anchors:[['planet',0,-.5],['planet',0,.5]]},
  {n:'혜성의 밤',lv:'보통',d:'혜성에 빛줄을 걸면 줄이 하늘을 쓸고 지나가요',kids:[[0,0]],mode:'direct',anchors:[['comet',.62,.3,0],['comet',.62,.3,PI],['comet',.34,-.5,1]]},
  {n:'소용돌이',lv:'보통',d:'악몽이 빙글빙글 나선으로 빨려 들어와요',kids:[[0,0]],mode:'spiral',anchors:[['planet',-.5,.4],['comet',.55,-.35,2]]}
];
const CARDS=[
  {n:'긴 빛줄',d:'빛줄을 25% 더 멀리 이어요',f:M=>M.range*=1.25},
  {n:'굵은 빛줄',d:'빛줄 피해 +25%',f:M=>M.line*=1.25},
  {n:'센 손가락',d:'튕기기 피해 +40%',f:M=>M.pluck*=1.4},
  {n:'빠른 손',d:'튕긴 줄이 30% 빨리 차올라요',f:M=>M.cd*=.7},
  {n:'긴 메아리',d:'공명이 이웃 줄로 더 세게, 더 멀리 번져요',f:M=>M.echo=Math.min(.9,M.echo+.12)},
  {n:'짙은 결계',d:'삼각 결계 피해 +50%',f:M=>M.zone*=1.5},
  {n:'깊은 잠',d:'꿈방울 +6',f:()=>{G.maxDream+=6;G.dream+=6}},
  {n:'별가루 비',d:'지금 바로 별가루 +200',f:()=>{G.dust+=200}},
  {n:'알뜰한 밤',d:'악몽이 별가루를 30% 더 흘려요',f:M=>M.dust*=1.3},
  {n:'별똥별',d:'8번 튕길 때마다 가장 센 악몽에게 별똥별이 떨어져요',f:M=>M.meteor=true,once:1},
  {n:'질긴 올가미',d:'올가미가 2초 더 가고 2초 빨리 돌아와요',f:M=>M.rope+=2},
  {n:'별빛 축제',d:'모든 별의 힘 +15%',f:M=>{for(const k in M.el)M.el[k]*=1.15}},
  {n:'불과 얼음',d:'타닥과 꽁꽁의 힘 +40%',f:M=>{M.el.fire*=1.4;M.el.frost*=1.4}},
  {n:'번개와 가시',d:'찌릿과 따끔의 힘 +40%',f:M=>{M.el.bolt*=1.4;M.el.thorn*=1.4}},
  {n:'하늘의 친구',d:'요람, 행성, 혜성의 힘 +60%',f:M=>{M.el.cradle*=1.6;M.el.planet*=1.6;M.el.comet*=1.6}}
];

/* ---------- 상태 ---------- */
let G,ptr=null,started=false,mapI=0,cleared={};
try{cleared=JSON.parse(localStorage.getItem('lullaby-cleared'))||{}}catch(e){}
function mkStar(t,x,y,anchor){return{t,t2:null,x,y,lv:0,sleep:0,pop:1,spent:anchor?0:T[t].cost,ph:Math.random()*TAU,anchor:!!anchor,tcd:0,orb:null}}
function reset(){
  const m=MAPS[mapI],hw=W/2/S,hh=H/2/S;
  G={map:m,hw,hh,stars:[],links:[],zones:[],foes:[],parts:[],texts:[],bolts:[],timers:[],rings:[],tethers:[],
    kids:m.kids.map(k=>({x:k[0]*hw,y:k[1]*hh})),path:m.path?m.path.map(p=>({x:p[0]*hw,y:p[1]*hh})):null,
    dust:C.dust0+(m.dust||0),dream:20,maxDream:20,wave:0,phase:'prep',restT:0,q:[],spawnT:0,gap:1,dirs:[],
    combo:0,comboT:0,speed:1,paused:false,over:false,cards:false,t:0,shake:0,plucks:0,
    sel:null,wheel:null,drag:null,fuse:null,toast:'',toastT:0,hurtT:0,taken:{},endless:false,nq:[],preview:'',
    M:{line:1,pluck:1,cd:1,echo:.6,zone:1,range:1,rope:0,el:Object.fromEntries(Object.keys(T).map(k=>[k,1])),meteor:false,dust:1}};
  for(const k of G.kids)G.stars.push(mkStar('cradle',k.x,k.y,1));
  for(const a of m.anchors){
    if(a[0]==='comet'){const s=mkStar('comet',0,0,1);s.orb={ru:a[1]*hw,rv:a[1]*hh,sp:a[2],a:a[3]};s.x=Math.cos(a[3])*s.orb.ru;s.y=Math.sin(a[3])*s.orb.rv;G.stars.push(s)}
    else G.stars.push(mkStar(a[0],a[1]*hw,a[2]*hh,1));
  }
  planWave();
}
const maxRange=()=>230*G.M.range;
const has=(s,k)=>s.t===k||s.t2===k;
const kinds=s=>s.t2&&s.t2!==s.t?[s.t,s.t2]:[s.t];
const elPow=(s,k)=>T[k].pow*LV[s.lv]*G.M.el[k]*(s.t2===s.t?1.8:1);
const starPow=s=>elPow(s,s.t)+(s.t2&&s.t2!==s.t?elPow(s,s.t2)*.7:0);
const linkDps=l=>(starPow(l.a)+starPow(l.b))*(kinds(l.a).some(k=>has(l.b,k))?1.5:1)*G.M.line;
const capOf=s=>s.anchor?T[s.t].cap:4+s.lv+(s.t2?2:0);
const reach=(a,b)=>maxRange()*(a.t==='planet'||b.t==='planet'?1.6:1);
const linkOn=l=>l.cut<=0&&l.a.sleep<=0&&l.b.sleep<=0&&(!l.dyn||l.len<=reach(l.a,l.b)*1.25);
const linkCost=len=>Math.round(8+len*.07);
const linksOf=s=>G.links.filter(l=>l.a===s||l.b===s).length;
const findLink=(a,b)=>G.links.find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
const hpMul=()=>{const w=(G.wave-1)*C.hpW;return 1+C.hpA*w+C.hpB*w*w};
const starName=s=>s.t2?(s.t2===s.t?'큰 '+T[s.t].n:T[s.t].n+T[s.t2].n):T[s.t].n;
function toast(t,d){G.toast=t;G.toastT=d||3}
function elems(a,b){const o=[];for(const s of[a,b])for(const k of kinds(s))if(!o.some(e=>e[0]===k))o.push([k,s]);return o}

/* ---------- 기하 ---------- */
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=t<0?0:t>1?1:t;return Math.hypot(px-ax-dx*t,py-ay-dy*t)}
function segX(a,b,c,d){const o=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0}
function inTri(p,a,b,c){const s=(u,v)=>(p.x-v.x)*(u.y-v.y)-(u.x-v.x)*(p.y-v.y);const d1=s(a,b),d2=s(b,c),d3=s(c,a);return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))}
function edge(a,m){const hw=W/2/S+m,hh=H/2/S+m,c=Math.cos(a),s=Math.sin(a);const t=Math.min(hw/Math.abs(c||1e-6),hh/Math.abs(s||1e-6));return[c*t,s*t]}
function hexA(h,a){const n=parseInt(h.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}

/* ---------- 이펙트 ---------- */
function burst(x,y,c,n,sp,life){for(let i=0;i<n&&G.parts.length<500;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random());G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life||.5,ml:life||.5,c,r:1.5+Math.random()*2.5})}}
function txt(x,y,s,c,sz){if(G.texts.length>70)G.texts.shift();G.texts.push({x:x+(Math.random()-.5)*14,y,s,c,sz:sz||18,t:.9})}
function shake(v){if(!calm)G.shake=Math.max(G.shake,v)}

/* ---------- 웨이브 ---------- */
function planWave(){
  const w=G.wave+1,n=1+(w>=2)+(w>=4)+(w>=7);G.dirs=[];
  if(!G.path){let a=Math.random()*TAU;for(let i=0;i<n;i++){G.dirs.push(a);a+=TAU/n+(Math.random()-.5)*.9}}
  let b=C.budA+w*C.budB;const q=[],pool=POOL.filter(p=>w>=p[2]);
  while(b>0){const p=Math.random()<.35?pool[0]:pool[Math.random()*pool.length|0];q.push(p[0]);b-=p[1]}
  if(INTRO[w])q.unshift(INTRO[w][0],INTRO[w][0]);
  if(w%5===0)q.splice(Math.min(3,q.length),0,'boss');
  G.nq=q;const cnt={};for(const k of q)cnt[k]=(cnt[k]||0)+1;
  G.preview=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x]).map(k=>F[k].n+' '+cnt[k]).join(' · ');
}
function startWave(){
  G.wave++;const w=G.wave;
  if(INTRO[w])toast('새 악몽 · '+INTRO[w][1],6);
  if(w%5===0){toast('악몽왕이 와요! 올가미로 묶고, 잠든 별은 톡 쳐서 깨워요',6);tone(70,1.2,'sawtooth',.14,40)}
  G.q=G.nq;G.spawnT=.6;G.gap=Math.max(.3,1-w*.06);G.phase='wave';
  tone(196,.5,'sine',.1);tone(147,.7,'sine',.1,0,.15);
}
function endWave(){
  const w=G.wave,gain=C.waveA+w*C.waveB;G.dust+=gain;txt(0,-90,'밤 '+w+' 무사히 · +'+gain+'✦','#ffd97a',26);
  [0,2,4,7].forEach((i,k)=>tone(SCALE[i+2],.5,'sine',.09,0,k*.09));
  G.phase='rest';G.restT=C.rest;planWave();
  if(w===NIGHTS&&!G.endless){win();return}
  if(w%2===0)showCards();
}
function spawn(k,x,y,wp){
  const d=F[k];let m=hpMul();if(k==='boss'&&G.wave>=NIGHTS)m*=1.5;
  if(x===undefined){
    if(G.path){x=G.path[0].x;y=G.path[0].y+(Math.random()-.5)*30;wp=1}
    else{const a=G.dirs[Math.random()*G.dirs.length|0]+(Math.random()-.5)*.5;[x,y]=edge(a,40)}
  }
  G.foes.push({k,x,y,hp:d.hp*m,mhp:d.hp*m,r:d.r,sp:d.sp*(.9+Math.random()*.2),burn:0,bdps:0,slowT:0,slowF:1,
    kx:0,ky:0,kb:0,snip:0,seenT:0,goldT:0,goldM:1,pullT:0,pullS:null,shock:0,tied:0,wp:wp||0,ox:(Math.random()-.5)*30,oy:(Math.random()-.5)*30,
    hx:1,hy:0,ph:Math.random()*TAU,fl:0,dacc:0,ab:4,age:0,dead:false});
}
function showCards(){
  G.cards=true;const pick=[],pool=CARDS.filter(c=>!(c.once&&G.taken[c.n]));
  while(pick.length<3){const c=pool[Math.random()*pool.length|0];if(!pick.includes(c))pick.push(c)}
  const box=$('cards');box.innerHTML='';
  pick.forEach(c=>{const b=document.createElement('button');b.className='card';b.innerHTML='<b>'+c.n+'</b><span>'+c.d+'</span>';
    b.onclick=()=>{audio();c.f(G.M);G.taken[c.n]=1;G.cards=false;$('ovCards').hidden=true;tone(660,.4,'sine',.1);tone(990,.5,'sine',.08,0,.1)};box.appendChild(b)});
  $('ovCards').hidden=false;
}
function win(){
  G.over=true;cleared[mapI]=1;try{localStorage.setItem('lullaby-cleared',JSON.stringify(cleared))}catch(e){}
  $('overTitle').textContent='아침이 왔어요!';$('bAgain').textContent='한 번 더';$('bMore').hidden=false;
  $('overTxt').textContent=G.map.n+'의 열 밤을 모두 지켜 냈어요. 꿈방울이 '+G.dream+'개 남았어요.';
  $('ovOver').hidden=false;[0,2,4,5,7,9].forEach((i,k)=>tone(SCALE[i],.7,'sine',.1,0,k*.12));
}
function gameOver(){
  G.over=true;$('overTitle').textContent='아이가 깼어요';$('bAgain').textContent='다시 재우기';$('bMore').hidden=true;
  $('overTxt').textContent=G.map.n+', 밤 '+G.wave+'에 깨고 말았어요. 별자리 모양을 바꿔 보거나 별을 합성해 봐요.';
  $('ovOver').hidden=false;tone(400,.8,'sawtooth',.12,90);
}

/* ---------- 전투 ---------- */
function push(f,v){const m=F[f.k].mass||1;f.kx-=f.hx*v/m;f.ky-=f.hy*v/m}
function hurt(f,d,c){
  if(f.dead)return;f.hp-=d;f.fl=1;f.dacc+=d;
  if(f.dacc>=14){txt(f.x,f.y-f.r-4,Math.round(f.dacc),c||'#fff',f.dacc>60?24:16);f.dacc=0}
  if(f.hp<=0)kill(f);
}
function kill(f){
  f.dead=true;const d=F[f.k];G.combo++;G.comboT=2.5;
  const gain=Math.max(1,Math.round(d.dust*C.dustK*G.M.dust*(f.goldT>0?f.goldM:1)*(1+Math.min(G.combo,30)*.03)));
  G.dust+=gain;txt(f.x,f.y-f.r,'+'+gain+'✦','#ffd97a',17);
  burst(f.x,f.y,d.c,f.k==='boss'?70:14,f.k==='boss'?260:130,.6);burst(f.x,f.y,'#ffffff',5,70,.35);
  tone(SCALE[Math.min(10,G.combo%11)]*2,.18,'sine',.07);
  if(f.k==='split')for(const s of[-1,1])spawn('mini',f.x+s*10,f.y+s*8,f.wp);
  if(f.k==='tank')shake(6);
  if(f.k==='boss'){shake(18);tone(90,1,'sawtooth',.16,30);G.rings.push({x:f.x,y:f.y,r:10,v:500,c:d.c,t:.7})}
}
function zap(f,dmg,n){
  const hit=[f];let cur=f;hurt(f,dmg*(f.slowT>0?1.8:1),'#fff06a');
  for(let i=0;i<n;i++){let b=null,bd=120;for(const o of G.foes){if(o.dead||hit.includes(o))continue;const d=Math.hypot(o.x-cur.x,o.y-cur.y);if(d<bd){bd=d;b=o}}
    if(!b)break;G.bolts.push({x1:cur.x,y1:cur.y,x2:b.x,y2:b.y,t:.16});dmg*=.7;hurt(b,dmg*(b.slowT>0?1.8:1),'#fff06a');hit.push(b);cur=b}
  burst(f.x,f.y,'#fff06a',4,90,.25);tone(1400+Math.random()*500,.07,'square',.025,500);
}
function shockChk(f){
  if(f.shock>0||f.dead)return;f.shock=3;txt(f.x,f.y-f.r-14,'쩍!','#ffffff',22);burst(f.x,f.y,'#bfe9ff',10,150,.4);
  tone(1200,.12,'square',.05,300);hurt(f,f.mhp*(f.k==='boss'?.04:.12),'#ffffff');
}
function putSleep(s,d){
  if(s.anchor||has(s,'guard'))return false;
  if(G.links.some(l=>(l.a===s&&has(l.b,'guard'))||(l.b===s&&has(l.a,'guard'))))d*=.3;
  s.sleep=d;return true;
}
function applyEl(f,s,k,dt,holder,inZone){
  if(f.dead)return;const p=elPow(s,k);
  if(k==='fire'){f.burn=3;f.bdps=Math.max(f.bdps,p*.5);if(f.slowT>0)shockChk(f)}
  else if(k==='frost'){const was=f.burn>0;f.slowT=1.2;f.slowF=Math.min(f.slowF,.6-.1*s.lv);if(was)shockChk(f)}
  else if(k==='bolt'){if(holder.zap<=0){holder.zap=.7;zap(f,p*1.5,2)}}
  else if(k==='moon'){if(inZone)hurt(f,p*.5*dt,T.moon.c);else if(f.kb<=0){f.kb=1.6;push(f,190);burst(f.x,f.y,T.moon.c,5,80,.3)}}
  else if(k==='thorn')hurt(f,f.mhp*(f.k==='boss'?.012:.04)*p/T.thorn.pow*(inZone?.6:1)*dt,T.thorn.c);
  else if(k==='gold'){f.goldT=2.5;f.goldM=Math.max(f.goldM,1.5+.3*s.lv)}
  else if(k==='eye')f.seenT=3;
  else if(k==='whirl'){f.pullT=.9;f.pullS=s}
}
function pluck(l,str,chain,direct){
  if(!linkOn(l)||l.cd>0||chain.has(l))return false;
  chain.add(l);const a=l.a,b=l.b;let bm=1,bc=1;for(const s of[a,b])if(has(s,'bell')){bm*=1.6+.3*s.lv;bc=.6}
  l.cd=l.cdM=2.5*G.M.cd*bc;l.vib=Math.max(l.vib,str);
  const dmg=linkDps(l)*C.pluck*str*G.M.pluck*bm;
  for(const f of G.foes){if(f.dead)continue;if(segDist(f.x,f.y,a.x,a.y,b.x,b.y)<f.r+46){hurt(f,dmg,'#ffffff');push(f,100*str);f.snip=0}}
  for(let i=0;i<=8;i++){const u=i/8;burst(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u,u<.5?T[a.t].c:T[b.t].c,1,90*str,.4)}
  pluckSnd(l.len,str);
  if(direct){G.plucks++;if(G.M.meteor&&G.plucks%8===0)meteor()}
  if(str>.25)G.timers.push({t:.11,f:()=>{for(const n of G.links)if(n!==l&&(n.a===a||n.a===b||n.b===a||n.b===b))pluck(n,str*G.M.echo,chain,false)}});
  return true;
}
function meteor(){
  let b=null;for(const f of G.foes)if(!f.dead&&(!b||f.hp>b.hp))b=f;if(!b)return;
  const x=b.x,y=b.y;G.bolts.push({x1:x+260,y1:y-520,x2:x,y2:y,t:.3,c:'#fff3c4',w:5});tone(1800,.3,'sine',.1,200);
  G.timers.push({t:.25,f:()=>{const d=60+40*hpMul();for(const f of G.foes)if(!f.dead&&Math.hypot(f.x-x,f.y-y)<95)hurt(f,d,'#fff3c4');
    burst(x,y,'#fff3c4',30,240,.6);G.rings.push({x,y,r:10,v:340,c:'#fff3c4',t:.4});shake(9);tone(110,.4,'triangle',.18,50)}});
}
function refresh(){
  for(const l of G.links){l.el=elems(l.a,l.b);l.dyn=l.a.t==='comet'||l.b.t==='comet'}
  G.zones=[];const s=G.stars;
  for(let i=0;i<s.length;i++)for(let j=i+1;j<s.length;j++){const l1=findLink(s[i],s[j]);if(!l1)continue;
    for(let k=j+1;k<s.length;k++){const l2=findLink(s[j],s[k]),l3=l2&&findLink(s[i],s[k]);
      if(l3){const el=elems(s[i],s[j]);for(const q of kinds(s[k]))if(!el.some(e=>e[0]===q))el.push([q,s[k]]);G.zones.push({s:[s[i],s[j],s[k]],l:[l1,l2,l3],el,zap:0})}}}
}

/* ---------- 건설 ---------- */
function canPlace(x,y){
  for(const k of G.kids)if(Math.hypot(x-k.x,y-k.y)<100)return'아이 곁은 비워 둬요';
  if(Math.abs(x)>W/2/S-22||Math.abs(y)>H/2/S-22)return'하늘 끝이에요';
  for(const s of G.stars)if(Math.hypot(s.x-x,s.y-y)<56)return'너무 가까워요';
  return'';
}
function place(k,x,y){
  const t=T[k];if(G.dust<t.cost){txt(x,y,'별가루가 모자라요','#ff5d8f',18);buzz();return null}
  G.dust-=t.cost;const s=mkStar(k,x,y);G.stars.push(s);
  burst(x,y,t.c,16,140,.5);tone(880,.25,'sine',.1);tone(1320,.3,'sine',.07,0,.06);return s;
}
function toggleLink(a,b){
  const old=findLink(a,b),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  if(old){const r=Math.round(linkCost(old.len)*.5);G.links.splice(G.links.indexOf(old),1);G.dust+=r;txt(mx,my,'끊었어요 +'+r+'✦','#aaa1d4');tone(300,.2,'triangle',.08,150);refresh();return}
  const len=Math.hypot(a.x-b.x,a.y-b.y),cost=linkCost(len);let why='';
  if(len>reach(a,b))why='너무 멀어요';
  else if(linksOf(a)>=capOf(a)||linksOf(b)>=capOf(b))why='빛줄이 꽉 찼어요 (키우거나 합성하면 늘어요)';
  else if(G.dust<cost)why='별가루가 모자라요';
  if(why){txt(mx,my,why,'#ff5d8f',18);buzz();return}
  G.dust-=cost;const z=G.zones.length;
  G.links.push({a,b,len,cd:0,cdM:1,vib:.7,cut:0,zap:0,el:[],dyn:false});refresh();pluckSnd(len,.7);
  if(G.zones.length>z){txt(mx,my-20,'결계 완성!','#ffd97a',26);[4,6,8].forEach((n,k)=>tone(SCALE[n],.5,'sine',.09,0,k*.08))}
}
function upgrade(s){
  if(s.lv>=2||s.anchor)return;const c=UPC[s.lv];if(G.dust<c){txt(s.x,s.y-30,'별가루가 모자라요','#ff5d8f',18);buzz();return}
  G.dust-=c;s.spent+=c;s.lv++;s.pop=1;burst(s.x,s.y,T[s.t].c,22,170,.6);tone(660,.3,'sine',.1);tone(990,.4,'sine',.08,0,.08);
}
function removeStar(s){
  if(s.anchor)return;const r=Math.round(s.spent*.8);G.dust+=r;txt(s.x,s.y,'+'+r+'✦','#ffd97a');
  G.links=G.links.filter(l=>l.a!==s&&l.b!==s);G.stars.splice(G.stars.indexOf(s),1);G.sel=null;refresh();burst(s.x,s.y,'#aaa1d4',12,100,.5);
}
function fuse(s,o){
  let why='';
  if(!o||o===s)why='합칠 별을 눌러요';
  else if(o.anchor)why='요람, 행성, 혜성은 합칠 수 없어요';
  else if(o.t2||s.t2)why='이미 합성한 별이에요';
  else if(Math.hypot(s.x-o.x,s.y-o.y)>maxRange())why='너무 멀어요';
  if(why){txt(s.x,s.y-34,why,'#ff5d8f',18);buzz();return false}
  s.t2=o.t;s.lv=Math.max(s.lv,o.lv);s.spent+=o.spent;s.pop=1;
  for(const l of G.links.slice()){
    if(l.a!==o&&l.b!==o)continue;const x=l.a===o?l.b:l.a;G.links.splice(G.links.indexOf(l),1);
    if(x===s||findLink(s,x))continue;const len=Math.hypot(s.x-x.x,s.y-x.y);
    if(len<=reach(s,x)&&linksOf(s)<capOf(s))G.links.push({a:s,b:x,len,cd:0,cdM:1,vib:.7,cut:0,zap:0,el:[],dyn:false});
  }
  G.stars.splice(G.stars.indexOf(o),1);refresh();
  for(let i=0;i<10;i++){const u=i/10;burst(o.x+(s.x-o.x)*u,o.y+(s.y-o.y)*u,T[o.t].c,2,60,.5)}
  burst(s.x,s.y,'#ffffff',26,200,.7);G.rings.push({x:s.x,y:s.y,r:8,v:220,c:T[s.t2].c,t:.45});
  txt(s.x,s.y-36,starName(s)+' 탄생!','#ffd97a',24);[2,5,7,9].forEach((n,k)=>tone(SCALE[n],.5,'sine',.09,0,k*.07));return true;
}
function wake(s){s.sleep=0;s.pop=1;burst(s.x,s.y,T[s.t].c,14,130,.4);tone(1046,.2,'sine',.1);tone(1568,.25,'sine',.07,0,.05)}
function tether(s,f){
  let why='';
  if(s.anchor)why='올가미는 별만 던질 수 있어요';
  else if(s.sleep>0)why='잠든 별이에요';
  else if(s.tcd>0)why='올가미가 아직 안 돌아왔어요';
  else if(Math.hypot(s.x-f.x,s.y-f.y)>maxRange()*1.3)why='너무 멀어요';
  else if(G.dust<15)why='별가루가 모자라요 (15)';
  if(why){txt(s.x,s.y-34,why,'#ff5d8f',18);buzz();return false}
  G.dust-=15;s.tcd=8-G.M.rope;G.tethers.push({s,f,t:4+G.M.rope,zap:0});
  txt(f.x,f.y-f.r-10,'묶었다!','#ffd97a',22);burst(f.x,f.y,T[s.t].c,12,120,.4);tone(520,.25,'triangle',.12,900);return true;
}

/* ---------- 갱신 ---------- */
function update(dt){
  G.t+=dt;
  for(let i=G.timers.length-1;i>=0;i--){const t=G.timers[i];t.t-=dt;if(t.t<=0){G.timers.splice(i,1);t.f()}}
  if(G.phase==='rest'){G.restT-=dt;if(G.restT<=0)startWave()}
  else if(G.phase==='wave'){
    if(G.q.length){G.spawnT-=dt;if(G.spawnT<=0){spawn(G.q.shift());G.spawnT=G.gap*(.6+Math.random()*.8)}}
    else if(!G.foes.length){endWave();if(G.over)return}
  }
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.combo=0}
  if(G.toastT>0)G.toastT-=dt;
  if(G.hurtT>0)G.hurtT-=dt;
  G.shake*=Math.exp(-9*dt);
  for(const s of G.stars){if(s.sleep>0)s.sleep-=dt;if(s.tcd>0)s.tcd-=dt;s.pop=Math.max(0,s.pop-dt*3);
    if(s.orb){s.orb.a+=s.orb.sp*dt;s.x=Math.cos(s.orb.a)*s.orb.ru;s.y=Math.sin(s.orb.a)*s.orb.rv}}
  for(const l of G.links){if(l.cd>0)l.cd-=dt;if(l.cut>0)l.cut-=dt;l.vib*=Math.exp(-4*dt);l.zap-=dt;if(l.dyn)l.len=Math.hypot(l.a.x-l.b.x,l.a.y-l.b.y)||1}
  for(const z of G.zones)z.zap-=dt;

  // 올가미
  for(const r of G.tethers){
    r.t-=dt;r.zap-=dt;const s=r.s,f=r.f;
    if(r.t<=0||f.dead||s.sleep>0||!G.stars.includes(s)){r.t=0;continue}
    f.tied=.15;hurt(f,starPow(s)*1.5*dt,T[s.t].c);for(const k of kinds(s))applyEl(f,s,k,dt,r,false);

    if(kd<48){

  }

  for(const p of G.parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94}

}

const sx=x=>W/2+x*S,sy=y=>H/2+y*S;

function linkAt(p){const rad=Math.max(12,15/S);let b=null,bd=rad;for(const l of G.links){const d=segDist(p.x,p.y,l.a.x,l.a.y,l.b.x,l.b.y);if(d<bd){bd=d;b=l}}return b}
function wheelBtns(w){return TK.map((k,i)=>{const a=-PI/2+i*TAU/TK.length;return{k,x:w.cx+Math.cos(a)*104,y:w.cy+Math.sin(a)*104,r:30}})}
function menuBtns(s){
  if(s.anchor)return[];const it=[];
  if(s.lv<2)it.push({id:'up',s:'키우기 '+UPC[s.lv]+'✦',ok:G.dust>=UPC[s.lv]});
  if(!s.t2)it.push({id:'fu',s:'합성',ok:true});

cv.addEventListener('pointerdown',e=>{
  audio();if(!started||G.over||G.paused||G.cards)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}

  if(G.wheel){const w=G.wheel,h=wheelBtns(w).find(b=>Math.hypot(b.x-p.px,b.y-p.py)<b.r+4);G.wheel=null;if(h)place(h.k,w.x,w.y);return}

cv.addEventListener('pointermove',e=>{

    cx.fillStyle='#fff';for(let i=-1;i<=1;i++){const bx=fx*r*.72+px*i*r*.24,by=fy*r*.72+py*i*r*.24;cx.beginPath();cx.moveTo(bx-px*5,by-py*5);cx.lineTo(bx+px*5,by+py*5);cx.lineTo(bx-fx*9,by-fy*9);cx.fill()}}

  for(const s of es){const ex=fx*r*(s?.3:.5)+px*s*r*.4,ey=fy*r*(s?.3:.5)+py*s*r*.4;

function drawChild(k,first){

  cx.lineWidth=5;cx.strokeStyle='rgba(255,255,255,.12)';cx.beginPath();cx.arc(0,0,48,0,TAU);cx.stroke();
  cx.strokeStyle=hurt||hp<.3?'#ff5d8f':'#bfe9ff';cx.lineCap='round';cx.beginPath();cx.arc(0,0,48,-PI/2,-PI/2+TAU*hp);cx.stroke();
  cx.fillStyle='#ffe9a8';cx.beginPath();cx.moveTo(-36,-4);cx.quadraticCurveTo(0,46,36,-4);cx.quadraticCurveTo(0,18,-36,-4);cx.fill();
  cx.fillStyle=first?'#9fb4ff':'#ffb4c8';cx.beginPath();cx.ellipse(8,8,17,8,-.1,0,TAU);cx.fill();
  cx.fillStyle='#ffe0c8';cx.beginPath();cx.arc(-10,0,11,0,TAU);cx.fill();
  cx.fillStyle=first?'#ff8fb0':'#8fd0ff';cx.beginPath();cx.moveTo(-21,-3);cx.quadraticCurveTo(-14,-22,-1,-6);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(-19,-14,3,0,TAU);cx.fill();

  cx.fillStyle='#d9d4ff';for(let i=0;i<3;i++){const u=(G.t*.35+i/3)%1;cx.globalAlpha=(1-u)*.9;cx.font='700 '+(11+u*12)+'px '+FONT;cx.fillText('z',14+u*26,-12-u*34)}
  cx.globalAlpha=1;cx.textAlign='center';cx.font='700 17px '+FONT;cx.fillStyle=hp<.3?'#ff5d8f':'#bfe9ff';cx.fillText('꿈 '+G.dream,0,74);cx.textAlign='start';

function pill(b,fill,col){cx.fillStyle=fill;cx.strokeStyle=col;cx.lineWidth=1.5;cx.beginPath();const r=b.h/2;cx.moveTo(b.x-b.w/2+r,b.y-r);cx.arc(b.x+b.w/2-r,b.y,r,-PI/2,PI/2);cx.arc(b.x-b.w/2+r,b.y,r,PI/2,PI*1.5);cx.closePath();cx.fill();cx.stroke();

  const pu=.5+.5*Math.sin(G.t*4);cx.globalCompositeOperation='lighter';glow(ex,ey,130+pu*30,'#ff3d7a',.3+pu*.2);cx.globalCompositeOperation='source-over';

function draw(){
  cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  for(const s of twk){cx.globalAlpha=.35+.45*Math.sin(G.t*1.2+s.p);cx.fillStyle='#fff';cx.fillRect(s.x*W,s.y*H,s.r,s.r)}cx.globalAlpha=1;

    const al=.14+.05*Math.sin(G.t*2.5);g.addColorStop(0,hexA(T[a.t].c,al));g.addColorStop(.5,hexA(T[b.t].c,al));g.addColorStop(1,hexA(T[c.t].c,al));
    cx.fillStyle=g;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.lineTo(c.x,c.y);cx.fill()}
  for(const l of G.links)drawLink(l);
  // 올가미
  for(const r of G.tethers){const a=r.s,b=r.f,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;cx.strokeStyle=T[a.t].c;cx.lineWidth=3;cx.lineCap='round';cx.globalAlpha=Math.min(1,r.t);
    cx.beginPath();for(let i=0;i<=12;i++){const u=i/12,o=Math.sin(u*PI*3+G.t*14)*5*Math.sin(PI*u);const x=a.x+dx*u-dy/len*o,y=a.y+dy*u+dx/len*o;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();
    cx.beginPath();cx.arc(b.x,b.y,b.r+5,0,TAU);cx.stroke();cx.globalAlpha=1}

  // 잇는 중
  if(G.drag){const f=G.drag.from,t=G.drag.to,fo=G.drag.foe,x=t?t.x:fo?fo.x:G.drag.x,y=t?t.y:fo?fo.y:G.drag.y;
    const ok=t?Math.hypot(t.x-f.x,t.y-f.y)<=reach(f,t):fo?Math.hypot(fo.x-f.x,fo.y-f.y)<=maxRange()*1.3:false;
    cx.strokeStyle='rgba(255,255,255,.14)';cx.lineWidth=1.5;cx.setLineDash([3,7]);cx.beginPath();cx.arc(f.x,f.y,maxRange()*(f.t==='planet'?1.6:1),0,TAU);cx.stroke();
    cx.setLineDash([7,7]);cx.strokeStyle=ok?'#ffd97a':t||fo?'#ff5d8f':'rgba(255,255,255,.6)';cx.lineWidth=3;cx.beginPath();cx.moveTo(f.x,f.y);cx.lineTo(x,y);cx.stroke();cx.setLineDash([])}

  for(const b of G.bolts){cx.globalAlpha=Math.min(1,b.t*8);cx.strokeStyle=b.c||'#fff06a';cx.lineWidth=b.w||2.5;cx.beginPath();cx.moveTo(b.x1,b.y1);

}

/* ---------- HUD ---------- */
let lastHud='';
function hud(){
  let hint='';
  if(G.toastT>0)hint=G.toast;
  else if(G.fuse)hint='합칠 별을 톡! 그 별이 '+starName(G.fuse)+' 속으로 들어와 두 힘을 가진 별이 돼요';

  else if(G.wheel)hint='같은 별끼리 이으면 1.5배, 다른 별끼리 이으면 두 힘이 섞여요';

    hint=n===0?'밤하늘을 톡 눌러 별을 심어요':n===1?'별을 하나 더 심어요':!G.links.length?'별에서 별로(또는 요람·행성으로) 끌어서 빛줄을 이어요':!G.zones.length?'빛줄을 톡 치면 튕겨요 · 세 곳을 삼각형으로 이으면 결계!':'붉은 기운 쪽에서 와요 · 첫 밤: '+G.preview}

  const key=[G.dust,G.wave,mapI,hint,call,G.endless].join('|');if(key===lastHud)return;lastHud=key;

  $('best').textContent=G.map.n;$('hint').textContent=hint;

let last=0;
function frame(now){
