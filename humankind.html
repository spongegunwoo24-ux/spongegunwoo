        const overflow = Math.max(0, it.progress - cost);
        c.prod = null;
        // 큐에서 다음 항목. 더는 지을 수 없는 건 건너뛴다.
        while (c.queue.length) {
            const next = c.queue.shift();
            if (next.kind === 'building' && c.buildings.includes(next.id)) continue;
            if (next.kind === 'district' && (G.dist[next.tile] || !districtAvailable(p, next.id))) continue;
            if (next.kind === 'unit' && !unitAvailable(p, next.id)) continue;
            c.prod = next; c.prod.progress = (c.prod.progress || 0) + overflow;
            break;
        }
        if (!c.prod) c.prodOverflow = overflow;
        return true;
    }

    // ---------------------------------------------------------------------
    // 연구 · 정책 · 시대
    // ---------------------------------------------------------------------
    function techCost(p, id) {
        const t = TECHS[id];
        return Math.round(TECH_ERA_COST[t.era] * speedMul() * (1 + 0.04 * Math.max(0, G.players.length - 2)));
    }
    function techAvailable(p, id) {
        const t = TECHS[id];
        return !hasTech(p, id) && t.era <= p.era && (!t.req || t.req.every(r => hasTech(p, r)));
    }
    function setResearch(p, id) {
        if (!techAvailable(p, id)) return false;
        if (p.research && p.research.id === id) return true;
        p.techProgress = p.techProgress || {};
        if (p.research) p.techProgress[p.research.id] = p.research.progress;
        p.research = { id, progress: p.techProgress[id] || 0 };
        delete p.techProgress[id];
        if (p.sciBank) { p.research.progress += p.sciBank; p.sciBank = 0; }
        return true;
    }
    function sciBankCap(p) { return Math.round(TECH_ERA_COST[Math.min(LAST_ERA, p.era + 1)] * speedMul() * 0.5); }
    function addScience(p, amount) {
        if (!p.research) { p.sciBank = Math.min(Math.max(p.sciBank, sciBankCap(p)), p.sciBank + amount); return; }
        p.research.progress += amount + p.sciBank; p.sciBank = 0;
        while (p.research) {
            const cost = techCost(p, p.research.id);
            if (p.research.progress < cost) break;
            const over = p.research.progress - cost;
            const id = p.research.id;
            p.techs.push(id);
            if (TECHS[id].era === p.era) p.eraTechs++;
            p.research = null;
            recomputeMods(p);
            logEvent(p.id, `${TECHS[id].icon} '${TECHS[id].name}' 연구를 마쳤어요!`, 'tech', { tech: id });
            if (TECHS[id].final) {
                p.fame += 200;
                logEvent(-1, `🛰️ ${p.name}이(가) 우주 계획을 완수했어요! (명성 +200)`, 'era');
                G.spaceWinner = p.id;
            }
            p.sciBank = over;
            if (p.ai) aiPickResearch(p);
            else if (p.queueResearch && p.queueResearch.length) {
                while (p.queueResearch.length && !techAvailable(p, p.queueResearch[0])) p.queueResearch.shift();
                if (p.queueResearch.length) setResearch(p, p.queueResearch.shift());
            }
            if (!p.research) break;
        }
    }

    function civicCost(p) { return Math.round((12 + 10 * p.era) * speedMul()); }
    function setCivic(p, id, opt) {
        const civ = CIVICS.find(c => c.id === id);
        if (!civ || civ.era > p.era) return false;
        if (p.civics[id] === opt) return false;
        const cost = civicCost(p);
        if (p.inf < cost) return false;
        p.inf -= cost;
        p.civics[id] = opt;
        recomputeMods(p);
        logEvent(p.id, `📜 정책 '${civ.name}': ${civ.opts[opt].name}을(를) 채택했어요.`, 'good');
        return true;
    }

    // ----- 시대 별 -----
    function starMeasure(p, cat) {
        switch (cat) {
            case 'agrarian':     return p.acc.growth;
            case 'builder':      return p.acc.built;
            case 'expansionist': return playerTerritories(p.id).length;
            case 'merchant':     return Math.floor(p.acc.money);
            case 'militarist':   return p.eraKills;
            case 'scientist':    return p.eraTechs;
            case 'aesthete':     return Math.floor(p.acc.inf);
            case 'population':   return playerUnits(p.id).filter(u => u.type === 'tribe').length;
            case 'hunting':      return p.neo.hunted;
            case 'discovery':    return p.neo.curios;
        }
        return 0;
    }
    function starThresholds(p, cat) {
        if (p.era === 0) return NEO_STARS[cat].t;
        const base = STAR_THRESHOLDS[cat][p.era];
        if (cat === 'expansionist') {
            const share = G.territories.length / G.players.length;
            return base.map(f => Math.max(1, Math.round(f * share)));
        }
        if (STAR_SCALED[cat]) {
            const f = SPEEDS[G.speed].cost / SPEEDS.fast.cost;
            return base.map(v => Math.round(v * f));
        }
        return base;
    }
    function starCategories(p) { return p.era === 0 ? Object.keys(NEO_STARS) : AFFINITY_ORDER; }
    function eraStarCount(p) {
        const s = p.stars[p.era] || {};
        return Object.keys(s).reduce((a, k) => a + s[k], 0);
    }
    function starFame(p, cat) {
        const base = p.era === 0 ? 5 : 10 * p.era;
        const cul = p.culture ? CULTURE_BY_ID[p.culture] : null;
        const match = cul && cul.aff === cat ? 2 : 1;
        return Math.round(base * match * (1 + 0.1 * p.transcends));
    }
    // 새로 달성한 별을 확정하고 명성을 준다
    function updateStars(p) {
        if (!p.alive) return;
        if (!p.stars[p.era]) p.stars[p.era] = {};
        const s = p.stars[p.era];
        starCategories(p).forEach(cat => {
            const have = s[cat] || 0;
            const th = starThresholds(p, cat);
            const v = starMeasure(p, cat);
            let n = have;
            while (n < 3 && v >= th[n]) n++;
            if (n > have) {
                const gain = starFame(p, cat) * (n - have);
                p.fame += gain;
                s[cat] = n;
                if (G.starLog) G.starLog.push({ p: p.id, era: p.era, cat, n, since: G.turn - (p.eraStart || 0) });
                const label = p.era === 0 ? NEO_STARS[cat].name : AFFINITIES[cat].star;
                logEvent(p.id, `⭐ 시대 별 획득: ${label} ${'★'.repeat(n)} (명성 +${gain})`, 'star');
            }
        });
        if (canAdvanceEra(p) && p.canAdvanceSince < 0) {
            p.canAdvanceSince = G.turn;
            if (!p.ai) logEvent(p.id, `🌅 다음 시대로 넘어갈 수 있어요! 상단의 '시대' 버튼을 눌러 문화를 고르세요. (머무르면서 별을 더 모아도 돼요)`, 'era');
        }
    }
    function starsNeeded(p) { return p.era === 0 ? NEOLITHIC_STARS_TO_ADVANCE : STARS_TO_ADVANCE; }
    function canAdvanceEra(p) { return p.alive && p.era < LAST_ERA && eraStarCount(p) >= starsNeeded(p); }
    function availableCultures(p) {
        const next = p.era + 1;
        return CULTURES.filter(c => c.era === next).map(c => ({ culture: c, takenBy: G.takenCultures[c.id] !== undefined ? G.takenCultures[c.id] : -1 }));
    }
    // cultureId === null → 초월 (지금 문화를 유지하고 명성 보너스)
    function advanceEra(p, cultureId) {
        if (!canAdvanceEra(p)) return false;
        if (cultureId) {
            const c = CULTURE_BY_ID[cultureId];
            if (!c || c.era !== p.era + 1 || G.takenCultures[cultureId] !== undefined) return false;
            G.takenCultures[cultureId] = p.id;
            p.culture = cultureId;
            p.cultures.push(cultureId);
        } else {
            if (!p.culture) return false;
            p.transcends++;
        }
        const wasNeo = p.era === 0;
        p.era++;
        p.stars[p.era] = {};
        p.eraKills = 0;
        p.eraTechs = p.techs.filter(id => TECHS[id].era === p.era).length;
        p.acc = { money: 0, inf: 0, built: 0, growth: 0 };
        p.eraStart = G.turn;
        p.canAdvanceSince = -1;
        recomputeMods(p);
        const cul = CULTURE_BY_ID[p.culture];
        if (wasNeo) {
            // 부족은 전사가 된다. 정착을 위한 첫 영향력도 준다.
            playerUnits(p.id).forEach(u => { if (u.type === 'tribe') { u.type = 'warrior'; u.mv = Math.min(u.mv, unitMaxMoves(u)); } });
            p.inf += 20;
            p.sciBank += Math.round(p.neo.food / 2);
        }
        const msg = cultureId ? `${ERAS[p.era].icon} ${ERAS[p.era].name}에 들어섰어요. 이제 우리는 '${cul.name}'이에요! (${AFFINITIES[cul.aff].icon} ${AFFINITIES[cul.aff].name})`
                              : `${ERAS[p.era].icon} ${ERAS[p.era].name}에 들어섰어요. '${cul.name}' 문화를 초월해 이어 가요. (명성 보너스 +10%)`;
        logEvent(p.id, msg, 'era');
        if (p.id !== 0) logEvent(0, `📯 ${p.name}이(가) ${ERAS[p.era].name}에 들어섰어요 → ${cul.name}`, 'rival');
        if (wasNeo && !p.ai) logEvent(p.id, '🏛️ 유닛을 골라 [수도 건설]을 누르면 첫 도시를 세울 수 있어요.', 'era');
        if (p.ai) aiPickResearch(p);
        return true;
    }

    // ---------------------------------------------------------------------
    // 외교
    // ---------------------------------------------------------------------
    function declareWar(a, b) {
        if (a === b || G.war[a][b]) return false;
        G.war[a][b] = G.war[b][a] = true;
        G.warSince[a][b] = G.warSince[b][a] = G.turn;
        G.peaceOffer[a][b] = G.peaceOffer[b][a] = false;
        G.players[a].warWeary = Math.max(G.players[a].warWeary || 0, 10);   // 먼저 선전포고하면 안정도 -10 (서서히 회복)
        logEvent(-1, `⚔️ ${G.players[a].name}이(가) ${G.players[b].name}에게 선전포고했어요!`, 'war');
        return true;
    }
    function makePeace(a, b) {
        if (!G.war[a][b]) return false;
        G.war[a][b] = G.war[b][a] = false;
        G.peaceOffer[a][b] = G.peaceOffer[b][a] = false;
        G.warSince[a][b] = G.warSince[b][a] = G.turn;
        logEvent(-1, `🕊️ ${G.players[a].name}와(과) ${G.players[b].name}이(가) 평화 조약을 맺었어요.`, 'peace');
        // 상대 영토 안에서 서로 붙어 있던 유닛은 그대로 둔다 (공격만 불가)
        return true;
    }
    function militaryPower(pid) {
        return G.units.reduce((a, u) => {
            if (u.owner !== pid) return a;
            const d = unitDef(u);
            return a + (Math.max(d.str, d.rs || 0)) * (u.hp / 100);
        }, 0) + playerCities(pid).reduce((a, c) => a + cityStrength(c) * 0.5, 0);
    }
    // AI가 평화 제안을 받아들일까
    function aiAcceptsPeace(ai, other) {
        const since = G.turn - G.warSince[ai][other];
        if (since < 6) return false;
        const mine = militaryPower(ai), theirs = militaryPower(other);
        if (mine < theirs * 0.9) return true;
        if (since > 20) return rand() < 0.6;
        return mine < theirs * 1.3 && since > 12;
    }

    // ---------------------------------------------------------------------
    // 시야
    // ---------------------------------------------------------------------
    function sightTiles(pid) {
        const vis = new Uint8Array(G.n);
        G.units.forEach(u => {
            if (u.owner !== pid) return;
            const r = (unitDef(u).sight || 2) + (G.terrain[u.tile] === 'hills' ? 1 : 0);
            tilesWithin(u.tile, r).forEach(t => { vis[t] = 1; });
        });
        G.cities.forEach(c => { if (c.owner === pid) tilesWithin(c.tile, 3).forEach(t => { vis[t] = 1; }); });
        G.territories.forEach(tr => {
            if (tr.owner !== pid) return;
            tr.tiles.forEach(t => { vis[t] = 1; });
            if (tr.outpost >= 0) tilesWithin(tr.outpost, 1).forEach(t => { vis[t] = 1; });
        });
        Object.keys(G.dist).forEach(k => { if (G.dist[k].o === pid) tilesWithin(+k, 1).forEach(t => { vis[t] = 1; }); });
        return vis;
    }
    function updateExplored(p) {
        const vis = sightTiles(p.id);
        for (let t = 0; t < G.n; t++) if (vis[t]) p.explored[t] = 1;
        if (!p.ai) G.humanSeen = vis;
        return vis;
    }

    // ---------------------------------------------------------------------
    // 턴 진행
    // ---------------------------------------------------------------------
    function processPlayerEconomy(p) {
        if (!p.alive) return;
        const cities = playerCities(p.id);
        let money = 0, sci = 0, inf = 0;
        cities.forEach(c => {
            const y = cityYields(c);
            money += y.money; sci += y.sci; inf += y.inf;
            // 성장
            c.food += y.surplus;
            const need = growthNeeded(c, y.growthBonus);
            if (c.food >= need) {
                c.food -= need; c.pop++; p.acc.growth++;
                logEvent(p.id, `👶 ${c.name}의 인구가 ${c.pop}(으)로 늘었어요.`, 'city', { city: c.id });
            } else if (c.food < 0) {
                if (c.pop > 1) { c.pop--; logEvent(p.id, `😢 ${c.name}에 식량이 모자라 인구가 줄었어요.`, 'bad', { city: c.id }); }
                c.food = Math.max(0, Math.round(growthNeeded(c, y.growthBonus) / 3));
            }
            // 생산
            if (c.prod) {
                c.prod.progress += y.ind + (c.prodOverflow || 0);
                c.prodOverflow = 0;
                completeProduction(c);
            } else {
                // 만들 게 없으면 생산력의 절반이 돈이 된다
                money += Math.floor((y.ind + (c.prodOverflow || 0)) / 2);
                c.prodOverflow = 0;
                if (!p.ai) logEvent(p.id, `🏗️ ${c.name}: 생산할 것을 골라 주세요.`, 'idle', { city: c.id });
            }
            // 방어 회복
            const maxF = cityMaxFort(c);
            if (c.attackedTurn < G.turn - 1) c.fort = Math.min(maxF, c.fort + Math.round(maxF * 0.2));
            if (c.unrest > 0) c.unrest--;
        });
        // 유닛 유지비: 도시 수 + 2개까지는 무료
        const units = playerUnits(p.id).filter(u => unitDef(u).cls !== 'tribe');
        const free = 2 + cities.length * 2;
        const upkeep = Math.max(0, units.length - free) * (1 + Math.floor(p.era / 2));
        money -= upkeep;
        p.gold += money;
        p.inf += inf;
        p.acc.money += Math.max(0, money);
        p.acc.inf += inf;
        addScience(p, sci);
        p.lastIncome = { money, sci, inf, upkeep };
        if (p.warWeary > 0) p.warWeary = Math.max(0, p.warWeary - 1);
        // 파산: 돈이 바닥나면 가장 약한 유닛을 해산
        if (p.gold < 0) {
            const victim = units.sort((a, b) => unitDef(a).str - unitDef(b).str)[0];
            if (victim) {
                G.units.splice(G.units.indexOf(victim), 1);
                logEvent(p.id, `💸 돈이 바닥나 ${unitDef(victim).name}을(를) 해산했어요.`, 'bad');
            }
            p.gold = 0;
        }
    }

    // 지금 상태 그대로 한 턴이 지나면 들어올 수입 (상단 바 표시용)
    function projectedIncome(p) {
        const cities = playerCities(p.id);
        let money = 0, sci = 0, inf = 0;
        cities.forEach(c => { const y = cityYields(c); money += y.money + (c.prod ? 0 : Math.floor(y.ind / 2)); sci += y.sci; inf += y.inf; });
        const units = playerUnits(p.id).filter(u => unitDef(u).cls !== 'tribe').length;
        money -= Math.max(0, units - (2 + cities.length * 2)) * (1 + Math.floor(p.era / 2));
        return { money, sci, inf };
    }

    function healAndReset(pid) {
        G.units.forEach(u => {
            if (u.owner !== pid) return;
            // 이번 턴에 싸우지 않았으면 회복
            if (!u.acted && u.hp < 100) {
                let h = 10;
                const tr = territoryOf(u.tile);
                if (tr && tr.owner === pid) h = 15;
                const c = cityAt(u.tile);
                if (c && c.owner === pid) h = 25;
                if (pid >= 0) h += G.players[pid].mods.heal || 0;
                u.hp = Math.min(100, u.hp + h);
            }
            // 한 턴 동안 움직이지 않으면 경계 태세
            if (u.mv === unitMaxMoves(u) && !u.acted) u.fort = Math.min(2, (u.fort || 0) + 1);
            u.mv = unitMaxMoves(u);
            u.acted = false;
        });
    }

    // 동물들 차례
    function animalsAct() {
        const animals = G.units.filter(u => u.animal);
        animals.forEach(a => {
            if (G.units.indexOf(a) < 0) return;
            const def = ANIMALS[a.type];
            a.mv = def.mv;
            if (def.aggressive && a.hp > 50) {
                const prey = neighbors(a.tile).map(unitAt).find(o => o && !o.animal && !cityAt(o.tile));
                if (prey && rand() < 0.6) {
                    attack(a, prey.tile);
                    return;
                }
            }
            // 사람 근처에서는 겁많은 동물이 도망친다
            const near = G.units.find(o => !o.animal && hexDist(o.tile, a.tile) <= 2);
            let moves = neighbors(a.tile).filter(t => isPassableLand(t) && !unitAt(t) && !cityAt(t) && tileOwner(t) < 0 && hexDist(t, a.home) <= 4);
            if (!moves.length) return;
            if (near && def.timid) moves.sort((x, y) => hexDist(y, near.tile) - hexDist(x, near.tile));
            else if (rand() < 0.5) return;
            else shuffle(moves);
            a.tile = moves[0];
        });
        // 동물 개체 수 유지 (고대까지만)
        const maxEra = Math.max.apply(null, G.players.map(p => p.era));
        if (maxEra <= 1 && G.turn % 4 === 0) {
            const count = G.units.filter(u => u.animal).length;
            const land = G.territories.filter(tr => tr.owner < 0).length;
            if (count < land / 2) {
                const tr = pick(G.territories.filter(x => x.owner < 0));
                if (tr) {
                    const t = pick(tr.tiles.filter(x => isPassableLand(x) && !unitAt(x)));
                    if (t !== undefined && !G.players.some(p => !p.ai && G.humanSeen && G.humanSeen[t])) spawnAnimal(t);
                }
            }
        }
    }

    // 사람이 '턴 종료'를 누르면 호출. AI → 동물 → 경제 → 새 턴 순서.
    function endTurn() {
        if (G.over) return;
        G.combatLog = [];
        G.players.forEach(p => { if (p.ai && p.alive) { try { aiTurn(p); } catch (e) { console.error('AI 오류', e); } } });
        animalsAct();
        // 도시 포격
        G.cities.forEach(c => { const r = cityBombard(c); if (r) G.combatLog.push(r); });
        G.players.forEach(p => { if (p.alive) processPlayerEconomy(p); });
        G.players.forEach(p => healAndReset(p.id));
        healAndReset(-1);
        G.turn++;
        G.players.forEach(p => { if (p.alive) { updateStars(p); checkElimination(p); } });
        G.players.forEach(p => { if (p.alive) updateExplored(p); });
        // 경계 중인 사람 유닛은 적(늑대 포함)이 2칸 안에 오면 깨운다
        playerUnits(0).forEach(u => {
            if (!u.sleep) return;
            const threat = G.units.find(o => o.owner !== 0 && atWar(0, o.owner) && hexDist(o.tile, u.tile) <= 2 && (!o.animal || ANIMALS[o.type].aggressive));
            if (threat) { u.sleep = false; logEvent(0, `⚠️ 적이 다가와서 ${unitDef(u).name}이(가) 경계를 풀었어요.`, 'war', { tile: u.tile }); }
        });
        // 사람 유닛의 남은 이동 명령을 이어서 수행
        playerUnits(0).forEach(u => {
            if (u.path) advanceAlongPath(u);
            else if (u.order === 'explore') autoExplore(u);
        });
        updateExplored(G.players[0]);
        checkGameOver();
    }

    function checkGameOver() {
        if (G.over) return G.over;
        const human = G.players[0];
        let reason = null;
        if (!human.alive) reason = 'defeat';
        else if (G.spaceWinner !== undefined) reason = 'space';
        else if (G.players.some(p => p.alive && p.era === LAST_ERA && eraStarCount(p) >= STARS_TO_ADVANCE)) reason = 'lastEra';
        else if (G.players.filter(p => p.alive).length === 1) reason = 'domination';
        else if (G.turn > G.maxTurns) reason = 'turns';
        if (!reason) return null;
        const ranking = G.players.slice().sort((a, b) => b.fame - a.fame).map(p => ({ id: p.id, fame: p.fame, alive: p.alive }));
        G.over = { reason, ranking, turn: G.turn };
        return G.over;
    }

    // 자동 탐험: 가장 가까운 미탐색 지역(또는 유적)으로
    function autoExplore(u) {
        const p = G.players[u.owner];
        let best = -1, bestScore = Infinity;
        for (let t = 0; t < G.n; t++) {
            if (!canEnterTerrain(u, t) || isWater(t)) continue;
            const unexplored = !p.explored[t];
            const curio = G.curio[t] && p.explored[t];
            if (!unexplored && !curio) continue;
            const d = hexDist(u.tile, t);
            const s = d - (curio ? 4 : 0);
            if (s < bestScore && d > 0) { bestScore = s; best = t; }
        }
        if (best < 0) { u.order = null; return false; }
        // 미탐색 칸은 길을 모르니 그 근처의 아는 칸으로
        const p2 = findPath(u, best, { ignoreUnits: false });
        if (!p2) { u.order = null; return false; }
        u.path = p2.slice(1);
        advanceAlongPath(u);
        u.order = 'explore';
        return true;
    }

    // ---------------------------------------------------------------------
    // 저장 / 불러오기
    // ---------------------------------------------------------------------
    function serialize() {
        const copy = Object.assign({}, G);
        copy.players = G.players.map(p => Object.assign({}, p, { explored: p.explored.join(''), mods: undefined }));
        copy.humanSeen = null;
        copy.combatLog = null;
        return JSON.stringify(copy);
    }
    function deserialize(str) {
        const o = JSON.parse(str);
        if (!o || o.v !== 1) return false;
        G = o;
        G.players.forEach(p => {
            p.explored = typeof p.explored === 'string' ? p.explored.split('').map(Number) : p.explored;
            recomputeMods(p);
        });
        buildNeighbors(G.w, G.h);
        updateExplored(G.players[0]);
        return true;
    }
    // ---------------------------------------------------------------------
    // 유닛 업그레이드 (사람/AI 공용)
    // ---------------------------------------------------------------------
    function upgradeOption(u) {
        if (u.animal || u.owner < 0) return null;
        const p = G.players[u.owner];
        const d = unitDef(u);
        if (d.cls === 'tribe' || d.emblem) return null;
        let best = null;
        Object.keys(UNITS).forEach(k => {
            const o = UNITS[k];
            if (k === u.type || o.cls !== d.cls || !unitAvailable(p, k)) return;
            if (!!o.antiCav !== !!d.antiCav && d.cls === 'melee' && o.str <= d.str * 1.3) return;
            if (o.str <= d.str) return;
            if (!best || o.str > UNITS[best].str) best = k;
        });
        if (!best) return null;
        const cost = Math.max(10, Math.round((UNITS[best].cost - d.cost) * 1.5 * speedMul()));
        return { id: best, cost };
    }
    function upgradeUnit(u) {
        const opt = upgradeOption(u);
        if (!opt) return false;
        const p = G.players[u.owner];
        if (p.gold < opt.cost) return false;
        if (tileOwner(u.tile) !== u.owner) return false;          // 내 영토 안에서만
        p.gold -= opt.cost;
        u.type = opt.id;
        u.mv = 0;
        return true;
    }
    function requestPeace(from, to) {
        if (!G.war[from][to]) return false;
        const other = G.players[to];
        if (!other.ai || G.peaceOffer[to][from] || aiAcceptsPeace(to, from)) { makePeace(from, to); return true; }
        G.warSince[from][to] = G.warSince[to][from] = Math.max(G.warSince[from][to], G.turn - 3);   // 바로 다시 조르지 못하게
        return false;
    }

    // ---------------------------------------------------------------------
    // AI
    // ---------------------------------------------------------------------
    function aiWeights(p) {
        const w = { food: 1.0, ind: 1.15, money: 0.75, sci: 0.95, inf: 0.9, stab: 0.25, def: 0 };
        const pref = p.persona ? p.persona.pref : [];
        const bump = (aff, k) => { const i = pref.indexOf(aff); if (i >= 0) w[k] += 0.45 - i * 0.12; };
        bump('agrarian', 'food'); bump('builder', 'ind'); bump('merchant', 'money'); bump('scientist', 'sci'); bump('aesthete', 'inf');
        return w;
    }
    function scoreYields(w, y) {
        return y.food * w.food + y.ind * w.ind + y.money * w.money + y.sci * w.sci + y.inf * w.inf;
    }

    function aiPickResearch(p) {
        if (p.research) return;
        const avail = Object.keys(TECHS).filter(id => techAvailable(p, id));
        if (!avail.length) return;
        const atWar = G.players.some(o => o.id !== p.id && o.alive && G.war[p.id][o.id]);
        const pref = p.persona ? p.persona.pref : [];
        let best = null, bestS = -Infinity;
        avail.forEach(id => {
            const t = TECHS[id];
            let s = -techCost(p, id) / 40 + rand() * 1.5;
            techUnlocks(id).forEach(u => {
                if (u.kind === 'unit') s += (atWar ? 3 : 1) + (pref[0] === 'militarist' ? 1.5 : 0);
                if (u.kind === 'district') s += 2.5;
                if (u.kind === 'building') s += 1.5;
            });
            if (t.mods) s += 2;
            if (t.final) s += 4;
            if (id === 'shipbuilding' && !p.ai) s -= 2;
            if (s > bestS) { bestS = s; best = id; }
        });
        setResearch(p, best);
    }

    function aiPickCulture(p) {
        const avail = availableCultures(p).filter(x => x.takenBy < 0).map(x => x.culture);
        if (!avail.length) return null;
        const pref = p.persona ? p.persona.pref : [];
        for (const aff of pref) {
            const c = avail.find(x => x.aff === aff);
            if (c && rand() < 0.85) return c.id;
        }
        return pick(avail).id;
    }

    function enemiesOf(p) {
        return G.players.filter(o => o.id !== p.id && o.alive && G.war[p.id][o.id]).map(o => o.id);
    }
    function hostileUnitsNear(p, tile, rad) {
        return G.units.filter(u => u.owner !== p.id && (u.owner < 0 ? false : G.war[p.id][u.owner]) && hexDist(u.tile, tile) <= rad);
    }

    function aiTurn(p) {
        G.players.forEach(o => { if (o.ai) updateExplored(o); });
        // 1) 시대 넘어가기
        if (canAdvanceEra(p)) {
            const waited = G.turn - p.canAdvanceSince;
            if (p.era === 0 || eraStarCount(p) >= 9 || waited >= 4) {
                const cid = aiPickCulture(p);
                if (cid) advanceEra(p, cid);
                else if (p.culture) advanceEra(p, null);
            }
        }
        aiPickResearch(p);
        aiCivics(p);
        aiDiplomacy(p);
        aiExpansion(p);
        playerCities(p.id).forEach(c => aiCity(p, c));
        aiUnits(p);
        aiSpend(p);
    }

    function aiCivics(p) {
        const cost = civicCost(p);
        if (p.inf < cost + outpostCost(p) + 10) return;
        const civ = CIVICS.find(c => c.era <= p.era && p.civics[c.id] === undefined);
        if (!civ) return;
        // 성향에 맞는 쪽을 고른다 (대충: 군사 성향이면 유닛 보너스 쪽)
        const w = aiWeights(p);
        const score = (o) => {
            const m = o.mods; let s = rand() * 0.5;
            s += (m.foodPct || 0) * w.food / 10 + (m.indPct || 0) * w.ind / 10 + (m.moneyPct || 0) * w.money / 10 + (m.sciPct || 0) * w.sci / 10 + (m.infPct || 0) * w.inf / 10;
            s += (m.unitStr || 0) / 10 * (p.persona && p.persona.aggr > 0.5 ? 1.5 : 0.5) + (m.stab || 0) / 10;
            return s;
        };
        const opt = score(civ.opts[0]) >= score(civ.opts[1]) ? 0 : 1;
        setCivic(p, civ.id, opt);
    }

    function aiDiplomacy(p) {
        if (p.era < 1) return;
        const enemies = enemiesOf(p);
        // 평화 제안/수락
        enemies.forEach(eid => {
            const e = G.players[eid];
            if (!aiAcceptsPeace(p.id, eid)) return;
            if (e.ai) { if (aiAcceptsPeace(eid, p.id)) makePeace(p.id, eid); }
            else if (!G.peaceOffer[p.id][eid]) {
                G.peaceOffer[p.id][eid] = true;
                logEvent(eid, `🕊️ ${p.name}이(가) 평화를 제안했어요. (외교 창에서 수락할 수 있어요)`, 'peace');
            }
        });
        if (enemies.length) return;
        let aggr = p.persona ? p.persona.aggr : 0.4;
        if (p.culture && CULTURE_BY_ID[p.culture].aff === 'militarist') aggr += 0.2;
        if (G.turn < Math.round(G.maxTurns * 0.15)) return;
        const myCities = playerCities(p.id);
        if (!myCities.length) return;
        const myMil = playerUnits(p.id).filter(u => unitDef(u).cls !== 'recon').length;
        if (myMil < 3 + myCities.length) return;
        const myPow = militaryPower(p.id);
        G.players.forEach(o => {
            if (o.id === p.id || !o.alive || G.war[p.id][o.id]) return;
            if (G.turn - G.warSince[p.id][o.id] < 15 && G.warSince[p.id][o.id] > 0) return;   // 막 평화를 맺은 상대
            const theirCities = playerCities(o.id);
            if (!theirCities.length) return;
            let near = Infinity;
            myCities.forEach(a => theirCities.forEach(b => { near = Math.min(near, hexDist(a.tile, b.tile)); }));
            if (near > 12) return;
            const ratio = myPow / Math.max(1, militaryPower(o.id));
            if (ratio < 1.05 + (1 - aggr) * 0.5) return;
            // 사람을 상대로는 난이도에 따라 덜/더 공격적
            const vsHuman = o.ai ? 1 : DIFFICULTIES[G.difficulty].ai;
            if (rand() < 0.06 * aggr * vsHuman) declareWar(p.id, o.id);
        });
    }

    // ----- 확장: 첫 도시, 전초기지, 도시 승격, 합병 -----
    function aiExpansion(p) {
        if (p.era < 1) return;
        const cities = playerCities(p.id);
        if (!cities.length) {
            // 수도: 지금 서 있는 곳이 괜찮으면 바로, 아니면 가장 가까운 빈 영토로
            const us = playerUnits(p.id).filter(u => u.mv > 0);
            for (const u of us) { const chk = canOutpost(u); if (chk.ok && tileFoodScore(u.tile) >= 7) { buildOutpost(u); return; } }
            for (const u of us) { if (canOutpost(u).ok && rand() < 0.35) { buildOutpost(u); return; } }
            const u = us[0];
            if (u) {
                const tr = G.territories.filter(t => t.owner < 0 && isPassableLand(t.center)).sort((a, b) => hexDist(a.center, u.tile) - hexDist(b.center, u.tile))[0];
                if (tr) { orderMove(u, tr.center); if (canOutpost(u).ok) buildOutpost(u); }
            }
            return;
        }
        // 전초기지 → 도시 또는 합병
        playerTerritories(p.id).forEach(tr => {
            if (tr.city >= 0 || tr.outpost < 0) return;
            const nCities = playerCities(p.id).length;
            const chk = canFoundCity(p, tr);
            if (nCities < cityCap(p)) {
                if (chk.ok) { foundCity(p, tr); return; }
                if (chk.cost !== undefined && !chk.reason.includes('가까워')) return;     // 영향력을 모으는 중
            }
            const targets = attachableCities(p, tr);
            if (targets.length) {
                targets.sort((a, b) => a.territories.length - b.territories.length);
                const c = targets[0];
                if (p.inf >= attachCost(p, c) + 5) attachTerritory(p, tr, c);
            }
        });
        // 개척 임무: 한 번에 한 유닛만
        const settler = playerUnits(p.id).find(u => u.goal && u.goal.k === 'settle');
        if (settler) {
            const tr = G.territories[settler.goal.terr];
            if (tr.owner >= 0) { settler.goal = null; return; }
            if (territoryOf(settler.tile) === tr && canOutpost(settler).ok) { buildOutpost(settler); settler.goal = null; return; }
            if (territoryOf(settler.tile) !== tr) orderMove(settler, tr.center);
            else if (canOutpost(settler).ok) { buildOutpost(settler); settler.goal = null; }
            return;
        }
        const cost = outpostCost(p);
        const income = Math.max(1, p.lastIncome.inf);
        if (p.inf + income * 3 < cost) return;
        if (playerTerritories(p.id).length >= cityCap(p) * 4) return;
        const w = aiWeights(p);
        let best = null, bestS = -Infinity;
        G.territories.forEach(tr => {
            if (tr.owner >= 0 || !isPassableLand(tr.center)) return;
            if (G.landComp !== undefined && !canEmbark(p.id)) {
                // 같은 대륙만
            }
            let d = Infinity;
            cities.forEach(c => { d = Math.min(d, hexDist(c.tile, tr.center)); });
            if (d > 9) return;
            if (hostileUnitsNear(p, tr.center, 3).length) return;
            let q = 0;
            tr.tiles.forEach(t => { const y = tileBaseYield(t); q += y[0] * w.food + y[1] * w.ind + y[2] * w.money + y[3] * w.sci; });
            const adjMine = tr.tiles.some(t => neighbors(t).some(nb => tileOwner(nb) === p.id));
            const s = q / 4 - d * 1.5 + (adjMine ? 3 : 0) + rand();
            if (s > bestS) { bestS = s; best = tr; }
        });
        if (!best) return;
        // 수비를 맡지 않은 유닛 중 가장 가까운 것
        const free = playerUnits(p.id).filter(u => !(u.goal && u.goal.k === 'garrison') && !isWater(u.tile) && findPath(u, best.center));
        free.sort((a, b) => (unitDef(a).cls === 'recon' ? -5 : 0) + hexDist(a.tile, best.center) - ((unitDef(b).cls === 'recon' ? -5 : 0) + hexDist(b.tile, best.center)));
        const u = free[0];
        if (!u) return;
        u.goal = { k: 'settle', terr: best.id };
        orderMove(u, best.center);
        if (territoryOf(u.tile) === best && canOutpost(u).ok) { buildOutpost(u); u.goal = null; }
    }

    // ----- 도시: 생산 선택 -----
    function aiCity(p, c) {
        const pref = p.persona ? p.persona.pref : [];
        if (c.pop >= 5) c.focus = pref[0] === 'scientist' ? 'sci' : pref[0] === 'merchant' ? 'money' : pref[0] === 'builder' ? 'ind' : 'balanced';
        if (c.prod) return;
        const item = aiChooseProduction(p, c);
        if (item) setProduction(c, item);
    }
    function bestUnitOf(p, cls, opts) {
        let best = null;
        const list = Object.keys(UNITS).concat(CULTURES.filter(cu => cu.emblem.type === 'unit').map(cu => cu.emblem.id));
        list.forEach(k => {
            if (!unitAvailable(p, k)) return;
            const d = UNITS[k] || emblemUnit(k);
            if (cls && d.cls !== cls) return;
            if (d.cls === 'recon' && cls !== 'recon') return;
            const val = Math.max(d.str, d.rs || 0) / Math.max(1, d.cost) + Math.max(d.str, d.rs || 0) / 80;
            if (!best || val > best.val) best = { id: k, val };
        });
        return best ? best.id : null;
    }
    function aiChooseProduction(p, c) {
        const units = playerUnits(p.id);
        const mil = units.filter(u => unitDef(u).cls !== 'recon' && unitDef(u).cls !== 'tribe').length;
        const cities = playerCities(p.id).length;
        const atWar = enemiesOf(p).length > 0;
        const threat = hostileUnitsNear(p, c.tile, 5).length;
        const aggr = p.persona ? p.persona.aggr : 0.4;
        let want = Math.ceil(cities * (1 + aggr)) + 1;
        if (atWar) want = cities * 2 + 3;
        if (threat) want += threat;
        if (p.era >= 1 && !units.some(u => unitDef(u).cls === 'recon') && G.turn < G.maxTurns * 0.3 && p.techs.length < 4) return { kind: 'unit', id: 'scout' };
        if (mil < want) {
            let cls = null;
            const ranged = units.filter(u => unitDef(u).cls === 'ranged').length;
            const siege = units.filter(u => unitDef(u).cls === 'siege').length;
            if (atWar && siege < 2 && bestUnitOf(p, 'siege')) cls = 'siege';
            else if (ranged < mil / 3 && bestUnitOf(p, 'ranged')) cls = 'ranged';
            else if (aggr > 0.5 && rand() < 0.4 && bestUnitOf(p, 'cav')) cls = 'cav';
            const id = bestUnitOf(p, cls) || bestUnitOf(p, null);
            if (id) return { kind: 'unit', id };
        }
        // 구역/건물: 산출 증가량 ÷ 비용이 가장 좋은 것
        const w = aiWeights(p);
        const before = cityYields(c);
        const baseScore = scoreYields(w, before);
        let best = null, bestS = 0;
        const consider = (item, score) => {
            const cost = itemCost(p, c, item);
            const s = score / cost * 100;
            if (s > bestS) { bestS = s; best = item; }
        };
        const opts = buildable(p, c);
        opts.forEach(it => {
            if (it.kind === 'building') {
                const fx = BUILDINGS[it.id].fx;
                let s = 0;
                if (fx.y) s += fx.y[0] * w.food + fx.y[1] * w.ind + fx.y[2] * w.money + fx.y[3] * w.sci;
                if (fx.pct) s += (fx.pct[1] * before.ind * w.ind + fx.pct[2] * before.money * w.money + fx.pct[3] * before.sci * w.sci) / 100;
                if (fx.inf) s += fx.inf * w.inf * 1.3;
                if (fx.stab) s += fx.stab * (before.stab < 20 ? 0.6 : 0.12);
                if (fx.spec) s += Object.keys(fx.spec).reduce((a, k) => a + fx.spec[k], 0) * c.pop * 0.35;
                if (fx.growth) s += fx.growth / 10;
                if (fx.def) s += (threat || atWar) ? fx.def / 15 : fx.def / 80;
                consider(it, s + 0.5);
            } else if (it.kind === 'district') {
                const spots = districtSpots(c, it.id);
                let bestSpot = -1, bestGain = -Infinity;
                spots.slice(0, 14).forEach(t => {
                    G.dist[t] = { t: it.id, c: c.id, o: p.id };
                    const after = cityYields(c);
                    delete G.dist[t];
                    let gain = scoreYields(w, after) - baseScore;
                    const def = districtDef(it.id);
                    if (def.stab) gain += def.stab * (before.stab < 20 ? 0.5 : 0.1);
                    if (def.def) gain += (threat || atWar) ? def.def / 15 : def.def / 60;
                    if (gain > bestGain) { bestGain = gain; bestSpot = t; }
                });
                if (bestSpot >= 0) consider({ kind: 'district', id: it.id, tile: bestSpot }, bestGain + (EMBLEM_DISTRICTS[it.id] ? 3 : 0) + 1);
            }
        });
        if (best) return best;
        const id = bestUnitOf(p, null);
        return id ? { kind: 'unit', id } : null;
    }

    // ----- 유닛 -----
    function aiUnits(p) {
        const enemies = enemiesOf(p);
        const myCities = playerCities(p.id);
        // 수비대 배정: 도시마다 하나
        myCities.forEach(c => {
            const g = G.units.find(u => u.owner === p.id && u.goal && u.goal.k === 'garrison' && u.goal.city === c.id);
            if (g) return;
            const cand = playerUnits(p.id).filter(u => !u.goal && ['melee', 'ranged'].includes(unitDef(u).cls))
                .sort((a, b) => hexDist(a.tile, c.tile) - hexDist(b.tile, c.tile))[0];
            if (cand) cand.goal = { k: 'garrison', city: c.id };
        });
        // 전쟁 목표 도시
        let targetCity = null;
        if (enemies.length && myCities.length) {
            const cap = myCities.find(c => c.capital) || myCities[0];
            G.cities.filter(c => enemies.includes(c.owner)).forEach(c => {
                const d = hexDist(c.tile, cap.tile);
                if (!targetCity || d < hexDist(targetCity.tile, cap.tile)) targetCity = c;
            });
            if (targetCity && hexDist(targetCity.tile, cap.tile) > 16) targetCity = null;
        }
        const units = playerUnits(p.id).slice();
        // 원거리 → 기병 → 보병 순서로 움직이면 원거리가 먼저 깎아 둔다
        const order = { siege: 0, ranged: 1, cav: 2, melee: 3, recon: 4, tribe: 5 };
        units.sort((a, b) => order[unitDef(a).cls] - order[unitDef(b).cls]);
        units.forEach(u => {
            if (G.units.indexOf(u) < 0 || u.mv <= 0) return;
            if (u.goal && u.goal.k === 'garrison' && !cityById(u.goal.city)) u.goal = null;
            if (u.goal && u.goal.k === 'garrison' && cityById(u.goal.city).owner !== p.id) u.goal = null;
            if (u.goal && u.goal.k === 'settle') return;     // 확장 단계에서 이미 움직였다
            aiUnitAct(p, u, targetCity);
        });
    }

    function bestAttack(u) {
        // 지금 자리에서 할 수 있는 가장 좋은 공격 → { tile, score }
        const d = unitDef(u);
        const range = isRangedUnit(u) ? (d.range || 1) : 1;
        let best = null;
        tilesWithin(u.tile, range).forEach(t => {
            if (t === u.tile || !canAttackFrom(u, t)) return;
            const target = attackTargetAt(u, t);
            if (!target) return;
            const o = combatOdds(u, target);
            let s;
            if (target.unit) {
                const kill = o.toDef >= target.unit.hp;
                s = o.toDef * (kill ? 2 : 1) - o.toAtt * 1.2;
                if (!o.ranged && o.toAtt >= u.hp - 5) s = -999;
            } else {
                s = o.toDef * 0.8 - o.toAtt * 1.1;
                if (!o.ranged && target.city.fort <= 0) s += 200;      // 점령 가능
                if (!o.ranged && o.toAtt >= u.hp - 10) s = -999;
            }
            if (!best || s > best.score) best = { tile: t, score: s };
        });
        return best;
    }

    function aiUnitAct(p, u, targetCity) {
        const d = unitDef(u);
        // 1) 공격할 수 있으면 공격
        const atk = bestAttack(u);
        if (atk && atk.score > 4) { attack(u, atk.tile); return; }
        // 2) 많이 다쳤으면 가까운 도시로 물러난다
        if (u.hp < 40 && p.era >= 1) {
            const home = playerCities(p.id).sort((a, b) => hexDist(a.tile, u.tile) - hexDist(b.tile, u.tile))[0];
            if (home && u.tile !== home.tile) { if (!unitAt(home.tile)) orderMove(u, home.tile); else orderMove(u, neighbors(home.tile).find(t => !unitAt(t) && isPassableLand(t)) || u.tile); }
            return;
        }
        // 3) 신석기: 유적 → 사냥감 → 탐험
        if (p.era === 0 || d.cls === 'recon') {
            const goal = aiForageTarget(p, u);
            if (goal >= 0) {
                if (hexDist(u.tile, goal) === 1 && unitAt(goal) && unitAt(goal).animal) { if (canAttackFrom(u, goal)) { const a = bestAttack(u); if (a && a.tile === goal && a.score > -5) attack(u, goal); } return; }
                orderMove(u, unitAt(goal) ? neighborToward(u, goal) : goal);
                const a2 = bestAttack(u); if (a2 && a2.score > 2) attack(u, a2.tile);
                return;
            }
            autoExplore(u);
            return;
        }
        // 4) 수비대: 자기 도시로
        if (u.goal && u.goal.k === 'garrison') {
            const c = cityById(u.goal.city);
            if (u.tile !== c.tile) {
                if (unitAt(c.tile) && unitAt(c.tile) !== u) { const blocker = unitAt(c.tile); if (blocker.owner === p.id && !(blocker.goal && blocker.goal.k === 'garrison')) { /* 비켜 주길 기다린다 */ } }
                orderMove(u, c.tile);
            }
            return;
        }
        // 5) 전쟁: 목표 도시로 진군
        if (targetCity) {
            const dist = hexDist(u.tile, targetCity.tile);
            const want = isRangedUnit(u) ? (d.range || 1) : 1;
            if (dist > want) {
                const spot = tilesWithin(targetCity.tile, want).filter(t => t !== targetCity.tile && !unitAt(t) && canEnterTerrain(u, t) && !isWater(t))
                    .sort((a, b) => hexDist(a, u.tile) - hexDist(b, u.tile))[0];
                orderMove(u, spot !== undefined ? spot : neighborToward(u, targetCity.tile));
            }
            const a = bestAttack(u);
            if (a && a.score > 0) attack(u, a.tile);
            return;
        }
        // 6) 평화: 근처 동물 사냥, 아니면 도시 근처에서 대기
        const prey = G.units.filter(o => o.animal && hexDist(o.tile, u.tile) <= 5).sort((a, b) => hexDist(a.tile, u.tile) - hexDist(b.tile, u.tile))[0];
        if (prey && unitStrength(u, 'attack', prey) > ANIMALS[prey.type].str * 1.3) {
            orderMove(u, neighborToward(u, prey.tile));
            const a = bestAttack(u); if (a && a.score > 0) attack(u, a.tile);
            return;
        }
        const home = playerCities(p.id).sort((a, b) => hexDist(a.tile, u.tile) - hexDist(b.tile, u.tile))[0];
        if (home && hexDist(home.tile, u.tile) > 2) {
            const spot = tilesWithin(home.tile, 2).filter(t => !unitAt(t) && isPassableLand(t) && t !== home.tile).sort((a, b) => hexDist(a, u.tile) - hexDist(b, u.tile))[0];
            if (spot !== undefined) orderMove(u, spot);
        }
    }

    // 목표 타일 옆의 (내 쪽에서 가까운) 빈 칸
    function neighborToward(u, t) {
        const free = neighbors(t).filter(x => (!unitAt(x) || x === u.tile) && canEnterTerrain(u, x) && !isWater(x));
        free.sort((a, b) => hexDist(a, u.tile) - hexDist(b, u.tile));
        return free.length ? free[0] : t;
    }

    function aiForageTarget(p, u) {
        let best = -1, bestS = Infinity;
        for (let t = 0; t < G.n; t++) {
            if (!p.explored[t]) continue;
            let bonus = 0;
            if (G.curio[t]) bonus = 5;
            else {
                const o = unitAt(t);
                if (!(o && o.animal)) continue;
                const myS = unitStrength(u, 'attack', o);
                if (myS < ANIMALS[o.type].str * 1.1 || u.hp < 60) continue;
                bonus = 3;
            }
            const d = hexDist(u.tile, t);
            if (d > 10) continue;
            // 다른 아군이 이미 노리는 곳은 피한다
            if (G.units.some(o => o !== u && o.owner === p.id && o.path && o.path[o.path.length - 1] === t)) continue;
            const s = d - bonus;
            if (s < bestS) { bestS = s; best = t; }
        }
        return best;
    }

    function aiSpend(p) {
        // 업그레이드
        playerUnits(p.id).forEach(u => {
            const opt = upgradeOption(u);
            if (opt && p.gold > opt.cost + 60) upgradeUnit(u);
        });
        // 위협받는 도시에서 유닛 구매, 돈이 남으면 아무거나
        playerCities(p.id).forEach(c => {
            if (!c.prod) return;
            const cost = buyCost(p, c);
            const threat = hostileUnitsNear(p, c.tile, 4).length;
            if ((threat && c.prod.kind === 'unit' && p.gold >= cost) || p.gold > cost + 140 + p.era * 40) buyItem(c);
        });
    }
    // ---------------------------------------------------------------------
    // 화면 (캔버스 지도 + HUD + 창들)
    // ---------------------------------------------------------------------
    const SAVE_KEY = 'hk_save_v1';
    const SETTINGS_KEY = 'hk_settings_v1';
    const $ = (id) => document.getElementById(id);
    const root = $('hk-root');
    if (!root) return;
    const stage = $('hk-stage'), cv = $('hk-canvas'), ctx = cv.getContext('2d');
    const mm = $('hk-minimap'), mctx = mm.getContext('2d');
    const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
    const signed = (n) => (n >= 0 ? '+' : '') + fmt(n);

    // 육각 기하 (월드 좌표, 반지름 R)
    const R = 30, SQ3 = Math.sqrt(3), HW = SQ3 * R;
    const CORNERS = [];
    for (let i = 0; i < 6; i++) { const a = (60 * i - 30) * Math.PI / 180; CORNERS.push([Math.cos(a), Math.sin(a)]); }
    const EDGE_OF_DIR = [[0, 1], [5, 0], [4, 5], [3, 4], [2, 3], [1, 2]];
    function tileXY(t) {
        const c = colOf(t), r = rowOf(t);
        return [HW * (c + 0.5 * (r & 1)) + HW / 2, 1.5 * R * r + R];
    }
    function worldSize() { return [HW * (G.w + 0.5), 1.5 * R * (G.h - 1) + 2 * R]; }
    function worldToTile(wx, wy) {
        const x = wx - HW / 2, y = wy - R;
        const q = (SQ3 / 3 * x - y / 3) / R, r = (2 / 3 * y) / R;
        let cx = q, cz = r, cy = -cx - cz;
        let rx = Math.round(cx), ry = Math.round(cy), rz = Math.round(cz);
        const dx = Math.abs(rx - cx), dy = Math.abs(ry - cy), dz = Math.abs(rz - cz);
        if (dx > dy && dx > dz) rx = -ry - rz; else if (dy > dz) ry = -rx - rz; else rz = -rx - ry;
        const row = rz, col = rx + ((rz - (rz & 1)) >> 1);
        if (col < 0 || col >= G.w || row < 0 || row >= G.h) return -1;
        return row * G.w + col;
    }

    // ----- 상태 -----
    const UI = {
        cam: { x: 0, y: 0, s: 1 }, dpr: 1, vw: 0, vh: 0,
        sel: null,                 // { kind: 'unit', id } | { kind: 'city', id } | { kind: 'tile', t }
        hover: -1, mode: null, reach: null, pathPreview: null, pendingAttack: -1,

    // ---------------------------------------------------------------------
    // 지형 그리기 (한 번 구워 두고 매 프레임 그대로 복사한다)
    // ---------------------------------------------------------------------
    function shade(hex, amt) {

        c.closePath();
    }
    function drawTerrain(c, t, x, y) {
        const k = G.terrain[t], def = TERRAIN[k];
        const jitter = (hash(t, 1) - 0.5) * 14;
        hexPath(c, x, y, R + 0.6);
        c.fillStyle = shade(def.color, jitter);
        c.fill();
        c.save();
        hexPath(c, x, y, R);
        c.clip();
        const h1 = hash(t, 2), h2 = hash(t, 3), h3 = hash(t, 4);

                if (hash(t, 10 + i) < 0.18) return;
                const tx = x + p[0] + (hash(t, 20 + i) - 0.5) * 4, ty = y + p[1];
                c.fillStyle = 'rgba(70,45,20,.8)'; c.fillRect(tx - 1, ty + 4, 2, 4);
                c.fillStyle = shade('#2e6b2f', (hash(t, 30 + i) - 0.5) * 30);
                c.beginPath(); c.moveTo(tx, ty - 9); c.lineTo(tx + 6, ty + 5); c.lineTo(tx - 6, ty + 5); c.closePath(); c.fill();
            });
        } else if (k === 'hills') {
            c.strokeStyle = 'rgba(90,65,30,.55)'; c.lineWidth = 2.2;
            c.beginPath(); c.arc(x - 6, y + 6, 10, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
            c.beginPath(); c.arc(x + 8, y + 2 + h1 * 4, 8, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
        } else if (k === 'mountain') {
            const peak = (px, py, s) => {
                c.fillStyle = '#6d6459'; c.beginPath(); c.moveTo(px, py - s); c.lineTo(px + s * 0.95, py + s * 0.7); c.lineTo(px - s * 0.95, py + s * 0.7); c.closePath(); c.fill();
                c.fillStyle = '#8c8276'; c.beginPath(); c.moveTo(px, py - s); c.lineTo(px + s * 0.95, py + s * 0.7); c.lineTo(px + s * 0.1, py + s * 0.7); c.closePath(); c.fill();
                c.fillStyle = '#f4f6f8'; c.beginPath(); c.moveTo(px, py - s); c.lineTo(px + s * 0.32, py - s * 0.45); c.lineTo(px - s * 0.32, py - s * 0.45); c.closePath(); c.fill();
            };
            peak(x + 7, y + 4, 11); peak(x - 6, y + 1, 15);
        } else if (k === 'desert') {
            c.strokeStyle = 'rgba(170,130,60,.45)'; c.lineWidth = 1.6;
            for (let i = 0; i < 3; i++) { const dy = -9 + i * 9 + h1 * 3; c.beginPath(); c.moveTo(x - 14 + h2 * 6, y + dy); c.quadraticCurveTo(x - 4, y + dy - 4, x + 6 + h3 * 6, y + dy); c.stroke(); }

            c.strokeStyle = 'rgba(150,180,210,.5)'; c.lineWidth = 1.2;
            for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(x - 12 + i * 8, y - 6 + h1 * 8); c.lineTo(x - 6 + i * 8, y - 4 + h1 * 8); c.stroke(); }

    function bakeTerrain() {
        const [ww, wh] = worldSize();

        const off = document.createElement('canvas');
        off.width = Math.ceil(ww * s); off.height = Math.ceil(wh * s);
        const c = off.getContext('2d');
        c.scale(s, s);
        for (let t = 0; t < G.n; t++) { const [x, y] = tileXY(t); drawTerrain(c, t, x, y); }

        c.strokeStyle = '#4c9fe0'; c.lineCap = 'round'; c.lineJoin = 'round';

            c.lineWidth = 4.5;

            path.forEach((t, i) => {
                const [x, y] = tileXY(t);

    // ---------------------------------------------------------------------

    function resize() {

    // ---------------------------------------------------------------------

                const nOwn = nb >= 0 ? tileOwner(nb) : -1;

    let loopTimer = null;

    function drawYieldPips(y, x, cy) {

            ctx.font = `800 9px Pretendard, sans-serif`; ctx.fillText(it[1], px + 5, cy + 0.5);

    }
    function drawGainLabel(gain, x, y, hl) {
        // 산출이 늘어나는 항목을 한 줄에 하나씩, 칸 안에 들어가게 세로로 쌓는다
        const parts = [];
        for (let i = 0; i < 4; i++) if (gain[i] >= 0.5) parts.push([YIELD_ICONS[i], Math.round(gain[i])]);
        if (gain[4] >= 0.5) parts.push(['🎭', Math.round(gain[4])]);
        if (!parts.length) return;
        parts.sort((a, b) => b[1] - a[1]);
        const lines = parts.slice(0, 3);
        const lh = 12, w = 38, h = lines.length * lh + 4;
        ctx.fillStyle = hl ? 'rgba(22,163,74,.95)' : 'rgba(15,23,42,.82)';
        roundRect(ctx, x - w / 2, y - h / 2, w, h, 6); ctx.fill();
        lines.forEach((ln, i) => {
            const cy = y - h / 2 + 2 + lh / 2 + i * lh;
            ctx.font = `9px ${EMOJI_FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(ln[0], x - 9, cy);
            ctx.font = `800 10px Pretendard, sans-serif`; ctx.fillText('+' + ln[1], x + 7, cy + 0.5);

    }
    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
    }
    function drawCity(c) {
        const [x, y] = tileXY(c.tile);
        const p = G.players[c.owner];
        // 집들
        hexPath(ctx, x, y, R * 0.86);
        ctx.fillStyle = hexA(p.color, 0.45); ctx.fill();
        const houses = [[-10, 2, 9, 9], [1, -4, 11, 13], [-2, 8, 9, 8], [9, 5, 8, 9], [-13, -7, 8, 8]];
        const n = Math.min(houses.length, 2 + Math.floor(c.pop / 3));

            const h = houses[i];
            ctx.fillStyle = i === 1 ? '#f5efe3' : '#ece4d4';
            ctx.fillRect(x + h[0] - h[2] / 2, y + h[1] - h[3] / 2, h[2], h[3]);
            ctx.fillStyle = shade(p.color, -30);
            ctx.beginPath(); ctx.moveTo(x + h[0] - h[2] / 2 - 1.5, y + h[1] - h[3] / 2); ctx.lineTo(x + h[0], y + h[1] - h[3] / 2 - 6); ctx.lineTo(x + h[0] + h[2] / 2 + 1.5, y + h[1] - h[3] / 2); ctx.closePath(); ctx.fill();
        }
        if (cityMaxFort(c) > 100) {
            hexPath(ctx, x, y, R * 0.9);
            ctx.strokeStyle = '#8a8172'; ctx.lineWidth = 3; ctx.stroke();
        }

        const label = (c.capital ? '★ ' : '') + c.name;

        const tw = ctx.measureText(label).width;
        const bw = tw + 34, bh = 19, bx = x - bw / 2, by = y - R - 16;
        ctx.fillStyle = p.color;
        roundRect(ctx, bx, by, bw, bh, 9); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.beginPath(); ctx.arc(bx + 10, by + bh / 2, 7.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `900 10px Pretendard, sans-serif`;
        ctx.fillText(String(c.pop), bx + 10, by + bh / 2 + 0.5);
        ctx.font = `800 12px Pretendard, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(label, bx + 21, by + bh / 2 + 0.5);
        ctx.textAlign = 'center';
        // 생산 중 (내 도시만)
        if (c.owner === 0) {
            const icon = c.prod ? itemInfo(c.prod).icon : '❗';
            ctx.font = `12px ${EMOJI_FONT}`;
            ctx.fillStyle = c.prod ? '#fff' : '#ffdf5d';
            ctx.beginPath(); ctx.arc(bx + bw + 6, by + bh / 2, 9, 0, Math.PI * 2);
            ctx.fillStyle = c.prod ? 'rgba(15,23,42,.8)' : 'rgba(220,38,38,.92)'; ctx.fill();
            ctx.fillStyle = '#000'; ctx.fillText(icon, bx + bw + 6, by + bh / 2 + 1);
        }
        // 방어도
        const maxF = cityMaxFort(c);
        if (c.fort < maxF) {
            const w = 40;
            ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x - w / 2, by + bh + 2, w, 4);
            ctx.fillStyle = c.fort / maxF > 0.5 ? '#60a5fa' : '#f87171';
            ctx.fillRect(x - w / 2, by + bh + 2, w * c.fort / maxF, 4);

    }
    function unitScreenPos(u, now) {
        const a = UI.anims.find(an => an.id === u.id);
        if (a) {
            const k = Math.min(1, (now - a.t0) / a.dur);
            if (k >= 1) { UI.anims.splice(UI.anims.indexOf(a), 1); return tileXY(u.tile); }
            const seg = a.path.length - 1;
            const f = k * seg, i = Math.min(seg - 1, Math.floor(f)), r = f - i;
            const [x0, y0] = tileXY(a.path[i]), [x1, y1] = tileXY(a.path[i + 1]);
            return [x0 + (x1 - x0) * r, y0 + (y1 - y0) * r];
        }
        return tileXY(u.tile);
    }
    function drawUnit(u, now) {
        let [x, y] = unitScreenPos(u, now);
        const d = unitDef(u);
        const c = cityAt(u.tile);
        if (c && !UI.anims.some(a => a.id === u.id)) { x += 13; y += 9; }
        const col = u.animal ? '#7a5a3a' : G.players[u.owner].color;
        const r = 14;
        const sel = UI.sel && UI.sel.kind === 'unit' && UI.sel.id === u.id;
        // 그림자
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.beginPath(); ctx.ellipse(x, y + r - 1, r * 0.9, 4, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = col; ctx.fill();
        ctx.lineWidth = sel ? 3.5 : 2; ctx.strokeStyle = sel ? '#ffd34d' : '#fff'; ctx.stroke();
        if (isWater(u.tile)) { ctx.font = `10px ${EMOJI_FONT}`; ctx.fillText('⛵', x - 12, y - 12); }
        ctx.font = `${u.animal ? 17 : 15}px ${EMOJI_FONT}`;
        ctx.fillStyle = '#000';
        ctx.fillText(d.icon, x, y + 1);
        // 체력
        if (u.hp < 100) {
            ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - 13, y + r + 2, 26, 4);
            ctx.fillStyle = u.hp > 60 ? '#22c55e' : u.hp > 30 ? '#eab308' : '#ef4444';
            ctx.fillRect(x - 13, y + r + 2, 26 * u.hp / 100, 4);
        }
        if (u.owner === 0) {
            // 아직 움직일 수 있음 / 경계 / 탐험 표시
            let badge = null, bcol = '#22c55e';
            if (u.sleep) { badge = '🛡'; bcol = '#64748b'; }
            else if (u.order === 'explore') { badge = '🧭'; bcol = '#0ea5e9'; }
            else if (u.mv > 0 && !u.path) badge = '';
            if (badge !== null) {
                ctx.beginPath(); ctx.arc(x + r - 2, y - r + 2, 5.5, 0, Math.PI * 2);
                ctx.fillStyle = bcol; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
                if (badge) { ctx.font = `8px ${EMOJI_FONT}`; ctx.fillStyle = '#000'; ctx.fillText(badge, x + r - 2, y - r + 2.5); }
            }
        } else if (!u.animal && u.fort >= 1) {
            ctx.font = `9px ${EMOJI_FONT}`; ctx.fillText('🛡', x + r - 2, y - r + 2);
        }
    }
    function drawPath(path, u, committed) {
        ctx.strokeStyle = committed ? 'rgba(255,211,77,.7)' : 'rgba(255,255,255,.9)';
        ctx.lineWidth = 3; ctx.setLineDash([2, 6]); ctx.lineCap = 'round';
        ctx.beginPath();
        path.forEach((t, i) => { const [x, y] = tileXY(t); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke(); ctx.setLineDash([]);
        // 각 턴이 끝나는 지점과 도착 지점에 '몇 번째 턴'을 표시
        if (!u) return;
        const maxMv = unitMaxMoves(u);
        let mv = u.mv, turn = 1;
        if (mv <= 0) { turn = 2; mv = maxMv; }
        for (let i = 1; i < path.length; i++) {
            if (mv <= 0) { turn++; mv = maxMv; }
            mv = Math.max(0, mv - moveCost(u, path[i - 1], path[i]));
            const last = i === path.length - 1;
            if (!last && mv > 0) continue;
            const [x, y] = tileXY(path[i]);
            ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = last ? '#ffd34d' : 'rgba(15,23,42,.85)'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = last ? '#3b2a00' : '#fff';
            ctx.font = '900 10px Pretendard, sans-serif';
            ctx.fillText(String(turn), x, y + 0.5);
        }
    }

    // ----- 미니맵 -----
    function buildMinimap() {
        const [ww, wh] = worldSize();
        const W = 176, H = Math.round(W * wh / ww);
        mm.width = W * 2; mm.height = H * 2; mm.style.width = W + 'px'; mm.style.height = H + 'px';
        const base = document.createElement('canvas');
        base.width = mm.width; base.height = mm.height;
        const c = base.getContext('2d');
        const k = mm.width / ww;
        c.fillStyle = '#0d1729'; c.fillRect(0, 0, base.width, base.height);
        const human = G.players[0];
        for (let t = 0; t < G.n; t++) {
            if (!human.explored[t]) continue;
            const [x, y] = tileXY(t);
            const own = tileOwner(t);
            c.fillStyle = own >= 0 ? G.players[own].color : TERRAIN[G.terrain[t]].color;
            c.fillRect((x - HW / 2) * k, (y - R) * k, HW * k + 1, 1.5 * R * k + 1);
        }
        G.cities.forEach(ct => {
            if (!human.explored[ct.tile]) return;
            const [x, y] = tileXY(ct.tile);
            c.fillStyle = '#fff'; c.fillRect(x * k - 3, y * k - 3, 6, 6);
            c.fillStyle = G.players[ct.owner].color; c.fillRect(x * k - 2, y * k - 2, 4, 4);
        });
        UI.mmBase = base; UI.mmK = k;
    }
    function drawMinimapView() {
        if (!UI.mmBase) return;
        mctx.clearRect(0, 0, mm.width, mm.height);
        mctx.drawImage(UI.mmBase, 0, 0);
        const k = UI.mmK;
        mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
        mctx.strokeRect(UI.cam.x * k, UI.cam.y * k, UI.vw / UI.cam.s * k, UI.vh / UI.cam.s * k);
    }

    // ---------------------------------------------------------------------
    // 선택 · 입력
    // ---------------------------------------------------------------------
    function selectedUnit() { return UI.sel && UI.sel.kind === 'unit' ? unitById(UI.sel.id) : null; }
    function selectedTile() {
        if (!UI.sel) return -1;
        if (UI.sel.kind === 'unit') { const u = unitById(UI.sel.id); return u ? u.tile : -1; }
        if (UI.sel.kind === 'city') { const c = cityById(UI.sel.id); return c ? c.tile : -1; }
        return UI.sel.t;
    }
    function select(sel) {
        UI.sel = sel; UI.pendingAttack = -1; UI.pathPreview = null;
        refreshReach();
        renderPanel();
        requestDraw();
    }
    function refreshReach() {
        UI.reach = null; UI.targets = [];
        const u = selectedUnit();
        if (!u || u.owner !== 0) return;
        UI.reach = reachable(u);
        // 공격 가능한 칸: 지금 자리에서 + (근접이면) 이동 후에
        const d = unitDef(u);
        const targets = new Set();
        const rng = isRangedUnit(u) ? (d.range || 1) : 1;
        if (u.mv > 0 && !u.acted) {
            tilesWithin(u.tile, rng).forEach(t => { if (t !== u.tile && isTileVisibleToHuman(t) && attackTargetAt(u, t) && canAttackFrom(u, t)) targets.add(t); });
            if (!isRangedUnit(u)) {
                UI.reach.forEach((left, t) => {
                    if (left <= 0) return;
                    neighbors(t).forEach(nb => {
                        if (targets.has(nb) || !isTileVisibleToHuman(nb)) return;
                        const tg = attackTargetAt(u, nb);
                        if (!tg || isWater(nb)) return;
                        if ((d.cls === 'tribe' || d.cls === 'recon') && !(tg.unit && tg.unit.animal)) return;
                        targets.add(nb);
                    });
                });
            }
        }
        UI.targets = Array.from(targets);
    }

    // 사람 유닛이 칸을 눌렀을 때: 이동 또는 공격
    function unitClickTile(u, t, pointerType) {
        if (UI.targets.includes(t)) {
            if (pointerType !== 'mouse' && UI.pendingAttack !== t) { UI.pendingAttack = t; renderPanel(); requestDraw(); return true; }
            doAttack(u, t);
            return true;
        }
        if (t === u.tile) return false;
        const o = unitAt(t);
        if (o && o.owner === 0) return false;
        if (!canEnterTerrain(u, t) || o) {
            if (o && !atWar(0, o.owner) && !o.animal) toast(`${G.players[o.owner].name}와(과)는 평화 상태라 공격할 수 없어요. (외교 창에서 선전포고)`);
            return !!o;
        }
        const ct = cityAt(t);
        if (ct && ct.owner !== 0) { toast(atWar(0, ct.owner) ? '도시를 점령하려면 먼저 방어도를 0으로 깎아야 해요.' : '평화 상태인 문명의 도시에는 들어갈 수 없어요.'); return true; }
        moveUnitTo(u, t);
        return true;
    }
    function moveUnitTo(u, t) {
        const full = findPath(u, t);
        if (!full || full.length < 2) { toast('그곳까지 가는 길이 없어요.'); return false; }
        u.path = full.slice(1);
        u.order = null; u.sleep = false; u.skip = -1;
        advanceAlongPath(u);
        // 지나간 길을 따라 미끄러지듯 움직인다
        const idx = full.indexOf(u.tile);
        if (idx > 0) UI.anims.push({ id: u.id, path: full.slice(0, idx + 1), t0: performance.now(), dur: Math.min(650, 120 * idx) });
        afterHumanAction();
        if (u.mv <= 0 && !UI.mode) autoNext(u);
        return true;
    }
    // 이 유닛이 행동을 다 쓰면 잠시 뒤 다음 유닛을 고른다
    function autoNext(u) {
        setTimeout(() => {
            if (UI.busy || $('hk-modal').classList.contains('show')) return;
            const cur = selectedUnit();
            if (cur && cur !== u) return;
            const next = unitsNeedingOrders()[0];
            if (next) {
                select({ kind: 'unit', id: next.id });
                const [sx, sy] = tileOnScreen(next.tile);
                if (sx < 60 || sy < 60 || sx > UI.vw - 60 || sy > UI.vh - 60) centerOn(next.tile, true);
            } else if (cur === u) select(null);
        }, 420);
    }
    function doAttack(u, t) {
        let atkFrom = u.tile;
        if (!canAttackFrom(u, t)) {
            // 근접 유닛: 옆 칸까지 가서 공격
            const spots = neighbors(t).filter(nb => UI.reach && UI.reach.has(nb) && UI.reach.get(nb) > 0 && !unitAt(nb));
            if (!spots.length) return;
            spots.sort((a, b) => UI.reach.get(b) - UI.reach.get(a));
            if (!moveUnitTo(u, spots[0])) return;
            if (!canAttackFrom(u, t)) { select({ kind: 'unit', id: u.id }); return; }
            atkFrom = u.tile;
        }
        const res = attack(u, t);
        UI.pendingAttack = -1;
        if (!res) return;
        showCombat(res, atkFrom);
        if (res.captured) {
            const c = cityById(res.captured);
            toast(`🏴 ${c.name}을(를) 점령했어요!`);
        }
        afterHumanAction();
        if (res.attackerDied) select(null);
        else if (u.mv <= 0) autoNext(u);
    }
    function showCombat(res, fromTile) {
        const now = performance.now();
        if (res.city !== undefined && res.dmg !== undefined) {
            UI.floats.push({ tile: res.tile, text: '-' + res.dmg, color: '#ff6b6b', t0: now, dur: 1400 });
            return;
        }
        UI.floats.push({ tile: res.tile, text: (res.killed ? '💥 ' : '') + '-' + res.toDef, color: '#ff6b6b', t0: now, dur: 1400 });
        if (res.toAtt > 0) UI.floats.push({ tile: fromTile !== undefined ? fromTile : res.from, text: (res.attackerDied ? '💀 ' : '') + '-' + res.toAtt, color: '#ffb347', t0: now + 120, dur: 1400 });
        requestDraw();
    }
    function afterHumanAction() {
        updateExplored(G.players[0]);
        G.players[0].alive && updateStars(G.players[0]);
        checkGameOver();
        refreshReach();
        buildMinimap();
        renderAll();
        scheduleSave();
        flushEvents();
        if (G.over) openGameOver();
    }

    function handleTileClick(t, pointerType) {
        if (!G) return;
        if (UI.mode && UI.mode.kind === 'district') {
            if (UI.mode.spots.includes(t)) placeDistrict(t);
            else cancelMode();
            return;
        }
        const human = G.players[0];
        const su = selectedUnit();
        if (su && su.owner === 0 && t >= 0 && !G.over) {
            if (unitClickTile(su, t, pointerType)) return;
            if (t === su.tile) {
                const c = cityAt(t);
                if (c) select({ kind: 'city', id: c.id });
                return;
            }
        }
        if (t < 0 || !human.explored[t]) { select(null); return; }
        const u = isTileVisibleToHuman(t) ? unitAt(t) : null;
        const c = cityAt(t);
        if (u && u.owner === 0 && !(UI.sel && UI.sel.kind === 'unit' && UI.sel.id === u.id)) { select({ kind: 'unit', id: u.id }); return; }
        if (c) { if (UI.sel && UI.sel.kind === 'city' && UI.sel.id === c.id && c.owner === 0) { openCity(c.id); return; } select({ kind: 'city', id: c.id }); return; }
        if (u) { select({ kind: 'unit', id: u.id }); return; }
        select({ kind: 'tile', t });
    }

    // 포인터 (마우스/터치 공용): 드래그 = 이동, 두 손가락 = 확대, 탭 = 선택
    const pointers = new Map();
    let drag = null, pinch = null;
    stage.addEventListener('pointerdown', (e) => {
        if (e.target !== cv) return;
        cv.setPointerCapture(e.pointerId);
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, cx: UI.cam.x, cy: UI.cam.y, moved: false, type: e.pointerType, button: e.button };
        else if (pointers.size === 2) {
            const [a, b] = Array.from(pointers.values());
            pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: UI.cam.s };
            drag = null;
        }
    });
    stage.addEventListener('pointermove', (e) => {
        if (!G) return;
        const rect = cv.getBoundingClientRect();
        if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pinch && pointers.size === 2) {
            const [a, b] = Array.from(pointers.values());
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            const mx = (a.x + b.x) / 2 - rect.left, my = (a.y + b.y) / 2 - rect.top;
            zoomAt((pinch.s * d / pinch.d) / UI.cam.s, mx, my);
            return;
        }
        if (drag) {
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; stage.classList.add('hk-panning'); hideTip(); }
            if (drag.moved) { UI.cam.x = drag.cx - dx / UI.cam.s; UI.cam.y = drag.cy - dy / UI.cam.s; clampCam(); requestDraw(); }
            return;
        }
        if (e.pointerType === 'mouse' && e.target === cv) {
            const t = screenToTile(e.clientX - rect.left, e.clientY - rect.top);
            if (t !== UI.hover) { UI.hover = t; onHoverChange(); }
            positionTip(e.clientX - rect.left, e.clientY - rect.top);
        }
    });
    function endPointer(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (pinch) { if (pointers.size < 2) pinch = null; drag = null; return; }
        if (drag && !drag.moved && e.type === 'pointerup') {
            const rect = cv.getBoundingClientRect();
            const t = screenToTile(e.clientX - rect.left, e.clientY - rect.top);
            if (drag.button === 2) { if (UI.mode) cancelMode(); else { const su = selectedUnit(); if (su && su.owner === 0 && t >= 0) unitClickTile(su, t, 'mouse'); } }
            else handleTileClick(t, drag.type);
        }
        drag = null; stage.classList.remove('hk-panning');
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);
    stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { UI.hover = -1; UI.pathPreview = null; hideTip(); requestDraw(); } });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
    stage.addEventListener('wheel', (e) => {
        if (!G) return;
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

                if (p) UI.pathPreview = p;
            } else if (isExplored(UI.hover) && canEnterTerrain(su, UI.hover) && !unitAt(UI.hover) && hexDist(su.tile, UI.hover) <= 25) {

    // ----- 툴팁 -----

    function positionTip(x, y) {
        if (tip.style.display === 'none') return;
        const w = tip.offsetWidth, h = tip.offsetHeight;
        let tx = x + 16, ty = y + 16;
        if (tx + w > UI.vw - 6) tx = x - w - 12;
        if (ty + h > UI.vh - 6) ty = y - h - 12;
        tip.style.left = Math.max(4, tx) + 'px'; tip.style.top = Math.max(4, ty) + 'px';
    }
    function yieldStr(y) {
        const out = [];
        for (let i = 0; i < 4; i++) if (y[i]) out.push(`${YIELD_ICONS[i]}${y[i]}`);
        return out.join(' ') || '산출 없음';
    }
    function tileInfoHTML(t) {
        const tt = T(t);

        h += `<br>${G.dist[t] ? '' : yieldStr(tileBaseYield(t))}`;
        if (tt.def) h += ` <span class="muted">· 방어 +${tt.def}%</span>`;
        if (tt.move > 1) h += ` <span class="muted">· 이동 비용 ${tt.move}</span>`;
        if (tt.impass) h += ` <span class="muted">· 지나갈 수 없음</span>`;
        if (G.dist[t]) { const d = districtDef(G.dist[t].t); h += `${d.icon} <b>${d.name}</b> ${yieldStr(districtYield(t))}`; }
        const tr = territoryOf(t);
        if (tr) h += `<br><span class="muted">${tr.owner >= 0 ? esc(G.players[tr.owner].name) + '의 영토' + (tr.city >= 0 ? ' (' + esc(cityById(tr.city).name) + ')' : ' (전초기지)') : '주인 없는 영토'}</span>`;
        if (G.curio[t]) h += '<br>🔍 <b>유적</b> — 들어가면 보상을 얻어요';

    }
    function unitInfoHTML(u) {
        const d = unitDef(u);
        const owner = u.animal ? '야생 동물' : esc(G.players[u.owner].name);
        let h = `<b>${d.icon} ${d.name}</b> <span class="muted">${owner}</span><br>⚔️ ${d.str}`;
        if (d.rs) h += ` · 🏹 ${d.rs} (사거리 ${d.range})`;
        h += ` · ❤️ ${Math.max(0, Math.round(u.hp))}`;
        if (!u.animal) h += ` · 👣 ${u.owner === 0 ? u.mv + '/' : ''}${unitMaxMoves(u)}`;

    }
    function oddsHTML(u, t) {
        const tg = attackTargetAt(u, t);
        if (!tg) return '';
        const o = combatOdds(u, tg);
        const hp = tg.unit ? tg.unit.hp : tg.city.fort;
        const win = o.toDef >= hp;
        let h = `<b>공격 예상</b> — 우리 ${o.A.toFixed(1)} vs 상대 ${o.D.toFixed(1)}<br>`;
        h += `상대 피해 약 <b class="${win ? 'win' : ''}">-${o.toDef}</b> (남은 ${tg.unit ? '체력' : '방어도'} ${Math.round(hp)})`;
        if (!o.ranged) h += ` · 우리 피해 약 <b class="${o.toAtt >= u.hp ? 'lose' : ''}">-${o.toAtt}</b>`;
        else h += ' · 원거리라 반격 없음';
        if (win) h += tg.city ? '<br>🏴 방어도가 0이 되면 근접 유닛으로 점령할 수 있어요' : '<br>💥 처치할 수 있어요';
        if (!o.ranged && o.toAtt >= u.hp) h += '<br>⚠️ 우리 유닛이 쓰러질 수 있어요';
        return h;
    }
    function renderTip() {
        const t = UI.hover;
        if (t < 0 || !G || !isExplored(t) || drag) { hideTip(); return; }
        let h = '';
        const su = selectedUnit();
        if (UI.mode && UI.mode.kind === 'district' && UI.mode.spots.includes(t)) {
            const g = UI.mode.gain.get(t) || [0, 0, 0, 0, 0];
            h = `<b>${esc(districtDef(UI.mode.item.id).name)}</b> 여기에 짓기<br>도시 산출 변화: ${[0, 1, 2, 3].map(i => YIELD_ICONS[i] + signed(g[i])).join(' ')}${g[4] ? ' 🎭' + signed(g[4]) : ''}<br><span class="muted">${tileInfoHTML(t)}</span>`;
        } else if (su && su.owner === 0 && UI.targets.includes(t)) {
            h = oddsHTML(su, t);
        } else {
            const u = isTileVisibleToHuman(t) ? unitAt(t) : null;
            const c = cityAt(t);
            if (c) h += `<b>${c.capital ? '★ ' : ''}${esc(c.name)}</b> <span class="muted">${esc(G.players[c.owner].name)} · 인구 ${c.pop} · 방어 ${Math.round(c.fort)}/${cityMaxFort(c)}</span><br>`;
            if (u) h += unitInfoHTML(u) + '<br>';
            h += tileInfoHTML(t);
            if (UI.pathPreview && su) {
                const turns = pathTurns(su, UI.pathPreview);
                h += `<br><span class="muted">👣 ${turns <= 1 ? '이번 턴에 도착' : turns + '턴 뒤 도착'}</span>`;
            }
        }
        tip.innerHTML = h;
        tip.style.display = 'block';
    }
    function pathTurns(u, path) {
        let mv = u.mv, turn = mv > 0 ? 1 : 2;
        const maxMv = unitMaxMoves(u);
        if (mv <= 0) mv = maxMv;
        for (let i = 1; i < path.length; i++) {
            if (mv <= 0) { turn++; mv = maxMv; }
            mv = Math.max(0, mv - moveCost(u, path[i - 1], path[i]));
        }
        return turn;
    }

    // ---------------------------------------------------------------------
    // 키보드

    document.addEventListener('keydown', (e) => {
        if (!UI.visible || !G) return;
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
        if ($('hk-modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
        if ($('hk-start').classList.contains('show')) return;
        const su = selectedUnit();
        const k = e.key;
        if (k === 'Escape') { if (UI.mode) cancelMode(); else select(null); }
        else if (k === 'Enter' || k === ' ') { e.preventDefault(); onTurnButton(); }
        else if (k === 'ArrowLeft') { UI.cam.x -= 60 / UI.cam.s; clampCam(); requestDraw(); }
        else if (k === 'ArrowRight') { UI.cam.x += 60 / UI.cam.s; clampCam(); requestDraw(); }
        else if (k === 'ArrowUp') { UI.cam.y -= 60 / UI.cam.s; clampCam(); requestDraw(); }
        else if (k === 'ArrowDown') { UI.cam.y += 60 / UI.cam.s; clampCam(); requestDraw(); }
        else if (k === '+' || k === '=') zoomAt(1.2, UI.vw / 2, UI.vh / 2);
        else if (k === '-') zoomAt(1 / 1.2, UI.vw / 2, UI.vh / 2);
        else if (k === 't' || k === 'T') openTech();
        else if (su && su.owner === 0) {
            if (k === 'f' || k === 'F') unitAction('sleep');
            else if (k === 'e' || k === 'E') unitAction('explore');
            else if (k === 's' || k === 'S') unitAction('skip');
            else if (k === 'b' || k === 'B') unitAction('outpost');
        }
    });

            }
            h += `<div class="hk-res" title="영향력: 전초기지·도시·합병·정책에 써요">🎭 ${fmt(p.inf)} <span class="hk-delta-pos">${signed(inc.inf)}</span></div>`;

    $('hk-topbar').addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el || !G) return;

        if (a === 'stars') openStars();
        else if (a === 'tech') openTech();
        else if (a === 'civics') openCivics();
        else if (a === 'diplo') openDiplomacy();

    function toggleFullscreen() {
        try {
            if (document.fullscreenElement) document.exitFullscreen();

    // ---------------------------------------------------------------------
    // 선택 패널
    // ---------------------------------------------------------------------
    const panel = $('hk-panel');
    function panelHead(icon, bg, title, sub) {
        return `<div class="hk-panel-head"><div class="hk-panel-icon" style="background:${bg}">${icon}</div>
            <div style="min-width:0;"><div class="hk-panel-title">${title}</div><div class="hk-panel-sub">${sub}</div></div>
            <button class="hk-panel-close" data-act="close" title="닫기 (Esc)">✕</button></div>`;
    }
    function hpBar(v, max, col) { return `<div class="hk-hp"><i style="width:${clamp(v / max * 100, 0, 100)}%;background:${col}"></i></div>`; }
    function renderPanel() {
        if (!G) return;
        const sel = UI.sel;
        let h = '';
        if (!sel) h = objectiveHTML();
        else if (sel.kind === 'unit') { const u = unitById(sel.id); h = u ? unitPanelHTML(u) : ''; if (!u) UI.sel = null; }
        else if (sel.kind === 'city') { const c = cityById(sel.id); h = c ? cityPanelHTML(c) : ''; }
        else if (sel.kind === 'tile') h = tilePanelHTML(sel.t);
        panel.innerHTML = h;
        panel.classList.toggle('show', !!h);
    }
    function objectiveHTML() {
        const p = G.players[0];
        let goal = '';
        if (p.era === 0) goal = `부족을 움직여 🔍 유적을 조사하고 🦌 동물을 사냥하세요. 시대 별 <b>${eraStarCount(p)}/${NEOLITHIC_STARS_TO_ADVANCE}</b>개를 모으면 고대로 넘어가 첫 문화를 고를 수 있어요.`;

        else if (canAdvanceEra(p)) goal = `🌅 시대 별 ${eraStarCount(p)}개! 다음 시대로 넘어갈 수 있어요. 더 머물며 별을 모으면 명성을 더 얻어요.`;
        else goal = `시대 별 <b>${eraStarCount(p)}/${STARS_TO_ADVANCE}</b> · 도시에 구역을 지어 개척 범위를 넓히고, 전초기지로 영토를 늘리세요.`;
        if (p.era === 0 && !p.techs.length && G.turn <= 2) goal += '<div class="hk-hint">💡 유닛을 누른 뒤 갈 곳을 누르면 이동해요. 지도를 끌어서 움직이고, 휠/두 손가락으로 확대해요.</div>';
        return `<div class="hk-panel-head"><div class="hk-panel-icon" style="background:#e0a100">🎯</div><div><div class="hk-panel-title">지금 할 일</div><div class="hk-panel-sub">${ERAS[p.era].name} · ${G.turn}턴</div></div></div>
            <div class="hk-hint" style="font-size:12.5px;color:var(--text-secondary);">${goal}</div>`;
    }
    function unitPanelHTML(u) {
        const d = unitDef(u);

        const col = u.animal ? '#7a5a3a' : G.players[u.owner].color;
