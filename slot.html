<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky 777</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --gold: #f5c542;
    --gold-hi: #fff3b0;
    --gold-lo: #8a5a00;
    --red: #d7263d;
    --red-deep: #6e0012;
    --text: #fff7e0;
    --muted: #d9c48c;
    --led: #ff9a1f;
    --cell: 110px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
    font-family: 'Noto Sans KR', system-ui, sans-serif; color: var(--text);
    background:
        radial-gradient(ellipse at 50% 15%, rgba(255, 60, 90, .25), transparent 55%),
        radial-gradient(ellipse at 50% 110%, #3a0a3f 0%, #1a0420 50%, #07010a 100%);
    background-color: #07010a; background-attachment: fixed;
    overflow-x: hidden; -webkit-tap-highlight-color: transparent;
}
body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,220,150,.8), transparent),
        radial-gradient(1.5px 1.5px at 85% 15%, rgba(255,150,200,.7), transparent),
        radial-gradient(1px 1px at 70% 75%, rgba(255,220,150,.6), transparent),
        radial-gradient(1.5px 1.5px at 20% 80%, rgba(150,200,255,.6), transparent),
        radial-gradient(1px 1px at 95% 55%, rgba(255,220,150,.7), transparent),
        radial-gradient(1px 1px at 45% 35%, rgba(255,220,150,.4), transparent);
    animation: twinkle 3s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

.app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 14px 16px 16px; }
.game { display: grid; grid-template-columns: minmax(0, 300px) auto; gap: 34px; justify-content: center; align-items: center; min-height: calc(100vh - 50px); }

/* ---------- 배당표 ---------- */
.side { display: flex; flex-direction: column; gap: 14px; }
.logo {
    font-family: 'Cinzel', serif; font-weight: 900; text-align: center; line-height: 1;
    font-size: 54px; letter-spacing: 4px;
    background: linear-gradient(180deg, #fff6c8 0%, #f5c542 45%, #a8740a 55%, #ffe58a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: glow 2.2s ease-in-out infinite alternate;
}
.logo small { display: block; font-size: 15px; letter-spacing: 8px; margin-top: 6px; }
@keyframes glow {
    from { filter: drop-shadow(0 0 8px rgba(255,80,120,.4)) drop-shadow(0 3px 0 rgba(0,0,0,.6)); }
    to   { filter: drop-shadow(0 0 26px rgba(255,200,60,.9)) drop-shadow(0 3px 0 rgba(0,0,0,.6)); }
}
.panel {
    background: linear-gradient(180deg, rgba(50, 10, 40, .85), rgba(15, 3, 15, .92));
    border: 2px solid rgba(245,197,66,.55); border-radius: 20px; padding: 14px 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.5), inset 0 0 30px rgba(245,197,66,.08);
}
.panel h2 { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; display: flex; align-items: center; }
.panel h2 small { font-family: 'Noto Sans KR', sans-serif; letter-spacing: 0; font-size: 11px; color: var(--muted); margin-left: auto; }
.pay-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 10px; font-weight: 900; transition: background .2s, box-shadow .2s; }
.pay-row:nth-child(odd) { background: rgba(255,255,255,.04); }
.pay-row .syms { display: flex; gap: 2px; font-size: 22px; line-height: 1; }
.pay-row .syms .sv { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
.pay-row .x { margin-left: auto; font-family: 'Orbitron', sans-serif; font-size: 15px; color: var(--gold); }
.pay-row .nm { font-size: 11px; color: var(--muted); }
.pay-row.lit { background: rgba(245,197,66,.25); box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(245,197,66,.6); animation: litBlink .35s 6 alternate; }
@keyframes litBlink { from { filter: brightness(1); } to { filter: brightness(1.6); } }
.pay-note { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 6px; line-height: 1.5; }

/* 7 심볼 (이모지 대신 직접 그림) */
.seven {
    font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.15em; line-height: 1;
    background: linear-gradient(180deg, #ff7a8a 0%, #e0102a 50%, #7a0010 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1.5px #ffd34d;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.5));
}

/* ---------- 머신 ---------- */
.machine { position: relative; display: flex; align-items: flex-start; padding-right: 64px; }
.cabinet {
    position: relative; width: min(470px, calc(100vw - 32px - 64px));
    padding: 18px 18px 16px; border-radius: 40px 40px 26px 26px;
    background:
        linear-gradient(180deg, rgba(255,255,255,.18), transparent 12%),
        linear-gradient(90deg, #5a0010 0%, #c4142e 18%, #e8283f 50%, #c4142e 82%, #5a0010 100%);
    border: 5px solid #f5c542;
    box-shadow:
        0 0 0 3px #6b4300, 0 30px 80px rgba(0,0,0,.8),
        0 0 60px rgba(255, 60, 90, .35), inset 0 0 40px rgba(0,0,0,.45);
}
.bulb-frame { position: absolute; inset: 6px; pointer-events: none; border-radius: 34px 34px 20px 20px; }
.bulb {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #5a3a08; box-shadow: inset 0 -2px 2px rgba(0,0,0,.5); transition: background .1s, box-shadow .1s;
}
.bulb.on { background: radial-gradient(circle at 35% 35%, #fffbe6, #ffd34d 45%, #ff9d00); box-shadow: 0 0 8px 3px rgba(255,200,60,.9); }
.bulb.on.alt { background: radial-gradient(circle at 35% 35%, #fff, #7cf5ff 45%, #0090ff); box-shadow: 0 0 8px 3px rgba(80,200,255,.9); }

.marquee {
    position: relative; text-align: center; margin: 4px 6px 14px; padding: 10px 6px 8px;
    border-radius: 26px 26px 12px 12px; background: radial-gradient(ellipse at 50% 0%, #3a0030, #12000e 70%);
    border: 3px solid #f5c542; box-shadow: inset 0 0 24px rgba(255, 0, 120, .45);
    overflow: hidden;
}
.marquee .neon {
    font-family: 'Cinzel', serif; font-weight: 900; font-size: clamp(30px, 7vw, 46px); letter-spacing: 6px; line-height: 1;
    color: #fff; text-shadow: 0 0 6px #fff, 0 0 14px #ff2d75, 0 0 28px #ff2d75, 0 0 48px #ff2d75;
    animation: neon 3s infinite;
}
.marquee .neon2 { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 6px; color: #9ff; text-shadow: 0 0 6px #0ff, 0 0 14px #0af; margin-top: 4px; }
@keyframes neon { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; } 20%, 62% { opacity: .55; } }
.marquee.jackpot .neon { animation: neonFast .18s infinite alternate; }
@keyframes neonFast { from { color: #fff; } to { color: #ffe066; text-shadow: 0 0 6px #fff, 0 0 14px #ffb300, 0 0 34px #ffb300, 0 0 60px #ff6a00; } }

/* 릴 창 */
.window {
    position: relative; padding: 10px; border-radius: 16px;
    background: linear-gradient(180deg, #2a1a00, #8a5a00 8%, #f5c542 50%, #8a5a00 92%, #2a1a00);
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
}
.reels { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #1a0a00; border-radius: 10px; padding: 6px; }
.reel {
    position: relative; height: calc(var(--cell) * 3); overflow: hidden; border-radius: 8px;
    background: linear-gradient(180deg, #8f8f8f 0%, #fff 22%, #fff 78%, #8f8f8f 100%);
    box-shadow: inset 0 0 12px rgba(0,0,0,.6);
}
.reel::after {
    /* 위아래가 둥글게 말려 들어가는 그림자 */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 74%, rgba(0,0,0,.55) 100%);
}
.reel.tease { box-shadow: inset 0 0 12px rgba(0,0,0,.6), 0 0 0 3px #ff2d75, 0 0 24px 6px rgba(255,45,117,.8); animation: tease .25s infinite alternate; }
@keyframes tease { from { filter: brightness(1); } to { filter: brightness(1.25); } }
.strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.sym { height: var(--cell); display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * 0.58); line-height: 1; user-select: none; }
.sym.win { animation: symWin .45s ease-in-out infinite alternate; }
@keyframes symWin { from { transform: scale(1); filter: drop-shadow(0 0 0 transparent); } to { transform: scale(1.18); filter: drop-shadow(0 0 14px #ffd34d) drop-shadow(0 0 4px #fff); } }

.payline { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: rgba(255, 40, 80, .75); box-shadow: 0 0 10px rgba(255,40,80,.9); pointer-events: none; z-index: 3; }
.payline.hot { background: #ffe066; box-shadow: 0 0 12px 4px rgba(255,220,80,1); animation: tease .2s infinite alternate; }
.arrow { position: absolute; top: 50%; width: 0; height: 0; margin-top: -10px; border-top: 10px solid transparent; border-bottom: 10px solid transparent; z-index: 4; filter: drop-shadow(0 0 4px rgba(255,40,80,.9)); }
.arrow.l { left: -2px; border-left: 14px solid #ff2850; }
.arrow.r { right: -2px; border-right: 14px solid #ff2850; }
.glass { position: absolute; inset: 10px; border-radius: 10px; pointer-events: none; z-index: 2; background: linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,.08) 100%); }

/* LED 표시창 */
.leds { display: grid; grid-template-columns: 1.2fr 1fr 1.2fr; gap: 8px; margin-top: 14px; }
.led { background: #0d0300; border: 2px solid #5a3a08; border-radius: 10px; padding: 6px 10px; box-shadow: inset 0 0 14px rgba(0,0,0,.9); min-width: 0; }
.led .k { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px; color: #b57a2a; }
.led .v {
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(16px, 3.6vw, 22px); color: var(--led);
    text-shadow: 0 0 8px rgba(255,154,31,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right;
}
.led.win .v { color: #5bff8f; text-shadow: 0 0 8px rgba(91,255,143,.8); }
.led.flash { animation: ledFlash .15s 10 alternate; }
@keyframes ledFlash { from { background: #0d0300; } to { background: #2a1a00; } }

.msg {
    margin-top: 8px; height: 30px; border-radius: 8px; background: #050008; border: 2px solid #5a3a08; overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 8px;
    font-weight: 900; font-size: 13px; color: #ff6ad5; text-shadow: 0 0 8px rgba(255,106,213,.8); letter-spacing: 1px;
    white-space: nowrap;
}

/* 버튼 */
.btns { display: grid; grid-template-columns: repeat(4, 1fr) 1.6fr; gap: 8px; margin-top: 12px; }
.pbtn {
    height: 52px; border: none; border-radius: 12px; cursor: pointer; position: relative;
    font: 900 13px 'Noto Sans KR', sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    background: linear-gradient(180deg, #4a4a5a, #1f1f2a); box-shadow: 0 5px 0 #0a0a10, inset 0 2px 0 rgba(255,255,255,.25);
    transition: transform .08s, box-shadow .08s, filter .15s;
}
.pbtn:hover:not(:disabled) { filter: brightness(1.2); }
.pbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #0a0a10, inset 0 2px 0 rgba(255,255,255,.25); }
.pbtn:disabled { opacity: .45; cursor: not-allowed; }
.pbtn.blue { background: linear-gradient(180deg, #3a8bff, #0b3ea8); box-shadow: 0 5px 0 #061f55, inset 0 2px 0 rgba(255,255,255,.35); }
.pbtn.spin {
    font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 3px; color: #3a2500; text-shadow: none;
    background: linear-gradient(180deg, #fff3b0, #f5c542 45%, #c9900f); box-shadow: 0 5px 0 #7a5200, 0 0 20px rgba(245,197,66,.5), inset 0 2px 0 rgba(255,255,255,.7);
    overflow: hidden;
}
.pbtn.spin::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); animation: shine 2.4s infinite; }
@keyframes shine { 0% { left: -60%; } 60%, 100% { left: 130%; } }

.tray {
    margin: 14px auto 0; width: 62%; height: 26px; border-radius: 0 0 22px 22px;
    background: linear-gradient(180deg, #120400, #3a2000 60%, #8a5a00); border: 3px solid #f5c542; border-top: none;
    box-shadow: inset 0 8px 14px rgba(0,0,0,.9);
}
.refill {
    display: none; width: 100%; margin-top: 10px; padding: 10px; border-radius: 12px; border: 2px dashed var(--gold);
    background: rgba(0,0,0,.35); color: var(--gold); font: 900 14px 'Noto Sans KR', sans-serif; cursor: pointer;
    animation: ledFlash .6s infinite alternate;
}
.refill.show { display: block; }

/* ---------- 레버 ---------- */
.lever { position: absolute; right: 0; top: 0; width: 64px; height: 100%; touch-action: none; }
.lever-mount {
    position: absolute; left: 0; width: 34px; height: 92px; margin-top: -46px; border-radius: 0 16px 16px 0;
    background: linear-gradient(90deg, #6b4300, #f5c542 40%, #fff3b0 55%, #b8860b);
    box-shadow: 4px 6px 14px rgba(0,0,0,.6);
}
.lever-mount::after { content: ""; position: absolute; left: 8px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #999 50%, #333); }
.lever-arm {
    position: absolute; left: 17px; width: 12px; margin-left: -6px; transform-origin: 50% 100%;
    background: linear-gradient(90deg, #555, #eee 40%, #fff 50%, #999 70%, #444); border-radius: 6px;
    box-shadow: 3px 0 6px rgba(0,0,0,.5);
}
.lever-knob {
    position: absolute; left: 17px; width: 48px; height: 48px; cursor: grab;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #ffd0d6 0%, #ff3b55 25%, #b00020 65%, #4a000c 100%);
    box-shadow: 0 8px 18px rgba(0,0,0,.6), 0 0 18px rgba(255, 40, 80, .5);
}
.lever-knob:active { cursor: grabbing; }
.lever-hint { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 900; color: var(--muted); white-space: nowrap; pointer-events: none; animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }

/* ---------- 오버레이 효과 ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }
.flash { position: fixed; inset: 0; z-index: 40; pointer-events: none; background: radial-gradient(circle, rgba(255,230,140,.6), rgba(255,120,0,0) 70%); opacity: 0; }
.flash.go { animation: flash 1.1s ease-out; }
@keyframes flash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
.shake { animation: shake .5s; }
@keyframes shake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-7px, 3px); } 40% { transform: translate(7px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(4px, -2px); } }
.banner {
    position: fixed; left: 50%; top: 20%; z-index: 50; pointer-events: none; transform: translate(-50%, -50%) scale(.3); opacity: 0;
    font-family: 'Cinzel', serif; font-weight: 900; text-align: center; white-space: nowrap; font-size: clamp(34px, 9vw, 84px); letter-spacing: 3px;
    background: linear-gradient(180deg, #fffbe0, #f5c542 50%, #ff9d00); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,200,60,.9)) drop-shadow(0 4px 0 #6b3d00);
    transition: transform .5s cubic-bezier(.2, 1.6, .4, 1), opacity .3s;
}
.banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.banner small { display: block; font-family: 'Noto Sans KR', sans-serif; font-size: max(14px, .3em); letter-spacing: 1px; margin-top: 6px; }
.banner.mega { animation: rainbow .5s linear infinite; }
@keyframes rainbow { from { filter: drop-shadow(0 0 24px #ff2d75) drop-shadow(0 4px 0 #6b3d00) hue-rotate(0deg); } to { filter: drop-shadow(0 0 24px #ff2d75) drop-shadow(0 4px 0 #6b3d00) hue-rotate(360deg); } }
.toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 60;
    background: rgba(20, 0, 15, .94); border: 1px solid var(--gold); color: var(--text);
    padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 설정 모달 */
.modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 0, 8, .75); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal.open { opacity: 1; pointer-events: auto; }
.modal-card { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; background: linear-gradient(180deg, #2a0826, #0c020c); border: 2px solid var(--gold); border-radius: 22px; padding: 18px; transform: translateY(16px) scale(.97); transition: transform .25s cubic-bezier(.2, 1.4, .4, 1); }
.modal.open .modal-card { transform: none; }
.modal-head { display: flex; align-items: center; margin-bottom: 14px; }
.modal-head h2 { font-family: 'Cinzel', serif; font-size: 18px; letter-spacing: 3px; color: var(--gold); }
.modal-x { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(245,197,66,.5); background: rgba(0,0,0,.3); color: var(--text); font-size: 16px; cursor: pointer; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tool { padding: 10px 4px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(245,197,66,.35); background: rgba(0,0,0,.32); color: var(--text); font: 800 13px 'Noto Sans KR', sans-serif; }
.tool:hover { border-color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: rgba(0,0,0,.3); border: 1px solid rgba(245,197,66,.25); border-radius: 12px; padding: 10px 6px; text-align: center; }
.stat .v { font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900; color: var(--gold); }
.stat .k { font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.log { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; max-height: 240px; overflow-y: auto; }
.log-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: rgba(0,0,0,.25); border-radius: 10px; font-size: 12px; font-weight: 700; }
.log-row .s { font-size: 18px; display: flex; gap: 2px; }
.log-row .amt { margin-left: auto; font-family: 'Orbitron', sans-serif; font-weight: 900; }
.plus { color: #5bff8f; } .minus { color: #ff7a88; }
.empty { font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; padding: 10px; }

footer { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 6px; }

@media (max-width: 900px) {
    .game { grid-template-columns: 1fr; gap: 16px; min-height: 0; justify-items: center; }
    .side { order: 2; width: 100%; max-width: 534px; }
    .side .logo { display: none; }
}
@media (max-width: 520px) {
    .app { padding: 10px 8px 14px; }
    .machine { padding-right: 56px; }
    .lever { width: 56px; }
    .cabinet { width: calc(100vw - 16px - 56px); padding: 12px 10px 12px; border-width: 4px; border-radius: 30px 30px 20px 20px; }
    .marquee { margin: 2px 2px 10px; padding: 8px 4px 6px; }
    .window { padding: 6px; }
    .reels { gap: 5px; padding: 4px; }
    .leds { gap: 5px; margin-top: 10px; }
    .led { padding: 4px 6px; }
    .btns { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .pbtn { height: 44px; font-size: 12px; }
    .pbtn.spin { grid-column: 1 / -1; height: 50px; }
    .lever-knob { width: 42px; height: 42px; }
    .msg { font-size: 12px; }
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="flash" id="flash"></div>
<div class="banner" id="banner"></div>
<div class="toast" id="toast"></div>

<div class="modal" id="settings" aria-hidden="true">
    <div class="modal-card">
        <div class="modal-head"><h2>⚙ SETTINGS</h2><button class="modal-x" id="settingsClose" aria-label="닫기">✕</button></div>
        <div class="tools">
            <button class="tool" id="soundBtn">🔊 소리 켜짐</button>
            <button class="tool" id="resetBtn">♻ 처음부터</button>
        </div>
        <div class="stats">
            <div class="stat"><div class="v" id="sSpins">0</div><div class="k">당긴 횟수</div></div>

<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const TAU = Math.PI * 2;
    const fmt = (n) => Math.round(n).toLocaleString('ko-KR');

    // ===== 심볼과 배당 =====
    // p = 그 결과가 나올 확률. 전체 기대 환급률은 약 96%.
    const SYMS = ['seven', 'diamond', 'star', 'bell', 'grape', 'lemon', 'cherry'];
    const EMOJI = { diamond: '💎', star: '⭐', bell: '🔔', grape: '🍇', lemon: '🍋', cherry: '🍒' };
    const NAMES = { seven: '세븐', diamond: '다이아', star: '스타', bell: '벨', grape: '포도', lemon: '레몬', cherry: '체리' };
    const TRIPLES = [
        { sym: 'seven',   mult: 100, p: 0.0015, title: 'JACKPOT!!!' },
        { sym: 'diamond', mult: 50,  p: 0.003,  title: 'MEGA WIN!' },
        { sym: 'star',    mult: 25,  p: 0.005,  title: 'SUPER WIN!' },
        { sym: 'bell',    mult: 12,  p: 0.01,   title: 'BIG WIN!' },
        { sym: 'grape',   mult: 8,   p: 0.015,  title: 'BIG WIN!' },
        { sym: 'lemon',   mult: 5,   p: 0.02,   title: 'WIN!' },
        { sym: 'cherry',  mult: 4,   p: 0.02,   title: 'WIN!' }
    ];
    const PAIR = { mult: 1, p: 0.12 };   // 아무거나 2개 같으면 본전
    const BETS = [10, 20, 50, 100, 200, 500];
    const START = 1000;

    function rand() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 0x100000000; }
    const randInt = (n) => Math.floor(rand() * n);
    const pick = (arr) => arr[randInt(arr.length)];

    function symHTML(s) { return s === 'seven' ? '<span class="seven">7</span>' : EMOJI[s]; }

    // 결과(가운데 줄 3개)를 먼저 정한다
    function rollOutcome() {
        let r = rand();
        for (const t of TRIPLES) {
            if (r < t.p) return [t.sym, t.sym, t.sym];
            r -= t.p;
        }
        if (r < PAIR.p) {
            const s = pick(SYMS);
            let o; do { o = pick(SYMS); } while (o === s);
            const line = [s, s, s];
            line[randInt(3)] = o;
            return line;
        }
        // 꽝: 세 개 다 다르게
        const a = pick(SYMS); let b, c;
        do { b = pick(SYMS); } while (b === a);
        do { c = pick(SYMS); } while (c === a || c === b);
        return [a, b, c];
    }

    function evaluate(line) {
        if (line[0] === line[1] && line[1] === line[2]) {
            const t = TRIPLES.find(x => x.sym === line[0]);
            return { mult: t.mult, title: t.title, kind: 'triple', sym: line[0], idx: [0, 1, 2] };
        }
        for (const [i, j] of [[0, 1], [1, 2], [0, 2]]) {
            if (line[i] === line[j]) return { mult: PAIR.mult, title: '본전!', kind: 'pair', sym: line[i], idx: [i, j] };
        }
        return { mult: 0, kind: 'none', idx: [] };
    }

    // ===== 저장 =====
    const KEY = 'lucky_slot_v1';
    const fresh = () => ({ credit: START, bet: 10, spins: 0, hits: 0, big: 0, jackpots: 0, log: [], sound: true });
    let state = fresh();
    try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') state = Object.assign(state, s); } catch (e) {}
    if (typeof state.credit !== 'number' || !isFinite(state.credit) || state.credit < 0) state.credit = START;
    if (!BETS.includes(state.bet)) state.bet = 10;
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

    // ===== 배당표 =====
    (function makePaytable() {
        const box = $('paytable');
        const rows = TRIPLES.map(t => ({ id: t.sym, syms: [t.sym, t.sym, t.sym], x: '×' + t.mult, nm: NAMES[t.sym] }));
        rows.push({ id: 'pair', syms: null, x: '×1', nm: '아무거나 2개 = 본전' });
        rows.forEach(r => {
            const d = document.createElement('div'); d.className = 'pay-row'; d.dataset.id = r.id;
            const syms = document.createElement('div'); syms.className = 'syms';
            if (r.syms) syms.innerHTML = r.syms.map(s => `<span class="sv">${symHTML(s)}</span>`).join('');
            const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.syms ? '' : r.nm;
            const x = document.createElement('span'); x.className = 'x'; x.textContent = r.x;
            d.append(syms, nm, x); box.appendChild(d);
        });
    })();

    // ===== 릴 =====
    const reelEls = [...document.querySelectorAll('.reel')];
    const strips = reelEls.map(r => r.querySelector('.strip'));
    let cell = 110;
    const reelState = [0, 1, 2].map(() => [pick(SYMS), pick(SYMS), pick(SYMS)]);

    function fillStrip(i, syms) {
        strips[i].innerHTML = syms.map(s => `<div class="sym">${symHTML(s)}</div>`).join('');
    }
    function measure() {
        const w = reelEls[0].clientWidth;
        cell = Math.round(Math.min(w * 0.92, (innerHeight - 330) / 3.2, 128));
        cell = Math.max(cell, 60);
        document.documentElement.style.setProperty('--cell', cell + 'px');
        layoutLever();
    }
    reelState.forEach((s, i) => { fillStrip(i, s); strips[i].style.transform = 'translateY(0)'; });

    // 릴 하나 돌리기: 위에 [새 결과 3칸 + 랜덤] 을 쌓고 아래로 내려오게 한다
    function spinReel(i, target, dur) {
        return new Promise(resolve => {
            const filler = Math.round(dur / 1000 * 20) + 6;
            const syms = [...target];
            for (let k = 0; k < filler; k++) syms.push(pick(SYMS));
            syms.push(...reelState[i]);
            fillStrip(i, syms);
            const total = (syms.length - 3) * cell;
            const strip = strips[i];
            const t0 = performance.now();
            let lastCell = Math.floor(total / cell), lastY = -total;
            const c1 = 0.7, c3 = c1 + 1;
            const step = (now) => {
                const t = Math.min(1, (now - t0) / dur);
                // 처음엔 살짝 위로 감겼다가(windup) 빠르게 내려오고, 끝에서 살짝 튕기며 멈춘다
                let p;
                if (t < 0.06) p = -0.012 * Math.sin(t / 0.06 * Math.PI);
                else { const u = (t - 0.06) / 0.94; p = 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
                const y = -total + total * p;
                strip.style.transform = `translateY(${y}px)`;
                const speed = Math.abs(y - lastY); lastY = y;
                strip.style.filter = speed > 18 ? `blur(${Math.min(5, speed / 14).toFixed(1)}px)` : '';
                const c = Math.floor((total + y) / cell);
                if (c !== lastCell) { lastCell = c; tick(); }
                if (t < 1) requestAnimationFrame(step);
                else {
                    strip.style.filter = '';
                    reelState[i] = target;
                    fillStrip(i, target);
                    strip.style.transform = 'translateY(0)';
                    thunk();
                    resolve();
                }
            };
            requestAnimationFrame(step);
        });
    }

    // ===== 게임 진행 =====
    let spinning = false;

    async function play() {
        if (spinning) return;
        initAudio();
        if (state.credit < state.bet) {
            if (state.credit >= BETS[0]) { state.bet = BETS.filter(b => b <= state.credit).pop(); render(); toast('크레딧에 맞게 베팅을 낮췄어요'); }
            else { toast('크레딧이 부족해요'); flashLed(); render(); return; }
        }
        spinning = true;
        clearWin();
        const bet = state.bet;
        state.credit -= bet;
        state.spins++;
        save();
        $('win').textContent = '0';
        render();
        setBulbs('spin');
        setMsg(pick(['행운을 빌어요…', '돌아간다~!', '제발 777…!', '두근두근…']));

        const line = rollOutcome();
        const targets = line.map(s => [pick(SYMS), s, pick(SYMS)]);
        const tease = line[0] === line[1];
        const durs = [1300, 1800, tease ? 3600 : 2300];

        const p0 = spinReel(0, targets[0], durs[0]);
        const p1 = spinReel(1, targets[1], durs[1]);
        const p2 = spinReel(2, targets[2], durs[2]);
        if (tease) {
            await p1;
            reelEls[2].classList.add('tease');
            setMsg(line[0] === 'seven' ? '777 가즈아!!! 🔥🔥🔥' : '두 개 같아요!! 마지막…!');
            heartbeat(durs[2] - durs[1]);
        }
        await Promise.all([p0, p1, p2]);
        reelEls[2].classList.remove('tease');

        const res = evaluate(line);
        const payout = bet * res.mult;
        state.log.unshift({ line, bet, net: payout - bet });
        state.log = state.log.slice(0, 30);
        if (res.mult > 0) state.hits++;
        state.big = Math.max(state.big, payout - bet);
        if (res.kind === 'triple' && res.sym === 'seven') state.jackpots++;
        save();

        if (res.mult > 0) {
            res.idx.forEach(k => reelEls[k].querySelectorAll('.sym')[1].classList.add('win'));
            $('payline').classList.add('hot');
            const row = document.querySelector(`.pay-row[data-id="${res.kind === 'pair' ? 'pair' : res.sym}"]`);
            if (row) row.classList.add('lit');
            await payoutAnim(payout, res, bet);
        } else {
            setMsg(pick(['아깝다! 다시 한 번?', '다음엔 꼭!', '꽝… 레버를 다시 당겨요', '흐름이 오고 있어요…']));
            setBulbs('idle');
            loseSound();
        }
        spinning = false;
        render();
    }

    async function payoutAnim(payout, res, bet) {
        const big = res.kind === 'triple';
        const jackpot = big && res.sym === 'seven';
        const mega = big && (res.sym === 'diamond' || res.sym === 'star');
        setBulbs(big ? 'win' : 'idle');
        if (big) {
            showBanner(res.title, `+${fmt(payout)} 크레딧 (×${res.mult})`, jackpot || mega);
            flash(); shake();
            coins(jackpot ? 4 : mega ? 2.5 : res.mult >= 8 ? 1.6 : 1);
            if (jackpot) { $('marquee').classList.add('jackpot'); setTimeout(() => $('marquee').classList.remove('jackpot'), 6000); }
            winSound(jackpot ? 3 : mega ? 2 : 1);
            setMsg(jackpot ? '🎰 JACKPOT!!! 777 🎰' : `${NAMES[res.sym]} 3개! ×${res.mult}`);
        } else {
            coins(0.4);
            winSound(0);
            setMsg(`${NAMES[res.sym]} 2개 — 본전!`);
        }
        // WIN 숫자가 올라가면서 크레딧으로 옮겨간다
        $('ledWin').classList.add('flash');
        const dur = Math.min(2600, 400 + payout * (jackpot ? 1.5 : 4));
        const from = state.credit, t0 = performance.now();
        state.credit += payout;
        save();
        await new Promise(resolve => {
            let lastCoin = 0;
            const step = (now) => {
                const k = Math.min(1, (now - t0) / dur);
                const v = Math.round(payout * k);
                $('win').textContent = fmt(v);
                $('credit').textContent = fmt(from + v);
                if (now - lastCoin > 70 && k < 1) { lastCoin = now; clink(); }
                if (k < 1) requestAnimationFrame(step); else resolve();
            };
            requestAnimationFrame(step);
        });
        setTimeout(() => $('ledWin').classList.remove('flash'), 1600);
    }

    function clearWin() {
        document.querySelectorAll('.sym.win').forEach(e => e.classList.remove('win'));
        document.querySelectorAll('.pay-row.lit').forEach(e => e.classList.remove('lit'));
        $('payline').classList.remove('hot');
        hideBanner();
    }

    // ===== 화면 =====
    function render() {
        $('credit').textContent = fmt(state.credit);
        $('bet').textContent = fmt(state.bet);
        $('betDown').disabled = spinning || state.bet === BETS[0];
        $('betUp').disabled = spinning || state.bet === BETS[BETS.length - 1] || BETS[BETS.indexOf(state.bet) + 1] > state.credit;
        $('betMax').disabled = spinning;
        $('spinBtn').disabled = spinning;
        $('refillBtn').classList.toggle('show', !spinning && state.credit < BETS[0]);
        $('soundBtn').textContent = state.sound ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
        $('leverHint').style.opacity = spinning ? 0 : 1;
    }
    function setMsg(t) { $('msg').textContent = t; }
    function flashLed() { const l = $('ledCredit'); l.classList.remove('flash'); void l.offsetWidth; l.classList.add('flash'); }

    function changeBet(dir) {
        if (spinning) return;
        let i = BETS.indexOf(state.bet) + dir;
        i = Math.max(0, Math.min(BETS.length - 1, i));
        if (dir > 0 && BETS[i] > state.credit) { toast('크레딧이 부족해요'); return; }
        state.bet = BETS[i]; save(); render(); beep(600 + i * 120);
    }

    // ===== 레버 =====
    const lever = $('lever'), arm = $('leverArm'), knob = $('leverKnob'), mount = $('leverMount'), hint = $('leverHint');
    let pivotY = 200, armLen = 120, theta = 0, dragging = false, dragStartY = 0, springRaf = null, lastRatchet = 1;

    function layoutLever() {
        const w = $('window');
        const mRect = $('machine').getBoundingClientRect(), wRect = w.getBoundingClientRect();
        pivotY = wRect.top + wRect.height / 2 - mRect.top;
        armLen = Math.max(80, Math.min(150, wRect.height * 0.55));
        mount.style.top = pivotY + 'px';
        hint.style.top = (pivotY - armLen - 54) + 'px';
        setLever(theta);
    }
    function setLever(th) {
        theta = th;
        const c = Math.cos(th);
        arm.style.height = armLen + 'px';
        arm.style.top = (pivotY - armLen) + 'px';
        arm.style.transform = `scaleY(${c})`;
        knob.style.top = (pivotY - armLen * c) + 'px';
        knob.style.transform = `translate(-50%, -50%) scale(${1 + 0.28 * Math.abs(Math.sin(th))})`;
    }
    const MAX_TH = Math.acos(-0.92);
    function springBack() {
        cancelAnimationFrame(springRaf);
        const th0 = theta, t0 = performance.now();
        const step = (now) => {
            const t = (now - t0) / 1000;
            const v = th0 * Math.exp(-5 * t) * Math.cos(11 * t);
            setLever(Math.abs(v) < 0.002 && t > 0.3 ? 0 : v);
            if (t < 1.4) springRaf = requestAnimationFrame(step); else setLever(0);
        };
        springRaf = requestAnimationFrame(step);
    }
    function autoPull() {
        if (spinning || dragging) return;
        initAudio();
        cancelAnimationFrame(springRaf);
        const t0 = performance.now();
        const step = (now) => {
            const k = Math.min(1, (now - t0) / 260);
            setLever(MAX_TH * k * k);
            ratchetCheck();
            if (k < 1) requestAnimationFrame(step);
            else { clunk(); play(); springBack(); }
        };
        requestAnimationFrame(step);
    }
    function ratchetCheck() {
        const c = Math.cos(theta);
        if (Math.abs(c - lastRatchet) > 0.18) { lastRatchet = c; ratchet(); }
    }

    let moved = false;
    knob.addEventListener('pointerdown', startDrag);
    arm.addEventListener('pointerdown', startDrag);
    function startDrag(e) {
        e.preventDefault();
        if (spinning) { wobble(); return; }
        initAudio();
        dragging = true; moved = false;
        cancelAnimationFrame(springRaf);
        dragStartY = e.clientY - (armLen - armLen * Math.cos(theta));
        lastRatchet = Math.cos(theta);
        knob.setPointerCapture && knob.setPointerCapture(e.pointerId);
        window.addEventListener('pointermove', onDrag);
        window.addEventListener('pointerup', endDrag, { once: true });
        window.addEventListener('pointercancel', endDrag, { once: true });
    }
    function onDrag(e) {
        if (!dragging) return;
        const dy = e.clientY - dragStartY;
        if (Math.abs(dy) > 6) moved = true;
        const c = Math.max(-0.92, Math.min(1, 1 - dy / armLen));
        setLever(Math.acos(c));
        ratchetCheck();
    }
    function endDrag() {
        window.removeEventListener('pointermove', onDrag);
        if (!dragging) return;
        dragging = false;
        const c = Math.cos(theta);
        if (!moved) { autoPull(); return; }
        if (c < -0.2) { clunk(); play(); }
        else if (c < 0.7) toast('끝까지 쭉 내려야 돌아가요!');
        springBack();
    }
    function wobble() {
        cancelAnimationFrame(springRaf);
        setLever(0.15); springBack();
    }

    // ===== 전구 =====
    const bulbs = [];
    (function makeBulbs() {
        const frame = $('bulbFrame');
        const pts = [];
        const top = 14, side = 22;
        for (let i = 0; i < top; i++) pts.push([i / (top - 1) * 100, 0]);
        for (let i = 1; i < side - 1; i++) pts.push([100, i / (side - 1) * 100]);
        for (let i = top - 1; i >= 0; i--) pts.push([i / (top - 1) * 100, 100]);
        for (let i = side - 2; i >= 1; i--) pts.push([0, i / (side - 1) * 100]);
        pts.forEach(([x, y]) => {
            // 모서리는 둥근 테두리를 따라 안쪽으로
            const b = document.createElement('div'); b.className = 'bulb';
            const inset = (x === 0 || x === 100) && (y < 6) ? 4 : 0;
            b.style.left = `calc(${x}% + ${x === 0 ? inset : x === 100 ? -inset : 0}px)`;
            b.style.top = `calc(${y}% + ${y === 0 && (x < 6 || x > 94) ? 16 : 0}px)`;
            frame.appendChild(b); bulbs.push(b);
        });
    })();
    let bulbMode = 'idle', bt = 0, bulbTimer = null, bulbUntil = 0;
    function setBulbs(m) {
        bulbMode = m;
        if (m === 'win') bulbUntil = performance.now() + 5000;
        clearInterval(bulbTimer);
        bulbTimer = setInterval(stepBulbs, m === 'spin' ? 50 : m === 'win' ? 110 : 320);
    }
    function stepBulbs() {
        bt++;
        if (bulbMode === 'win' && performance.now() > bulbUntil) { setBulbs('idle'); return; }
        const n = bulbs.length;
        bulbs.forEach((b, i) => {
            let on, alt = false;
            if (bulbMode === 'spin') { on = ((i - bt) % 8 + 8) % 8 < 3; alt = ((i + bt) % 16) < 3; }
            else if (bulbMode === 'win') { on = (i + bt) % 2 === 0; alt = bt % 4 < 2; }
            else { on = (i + bt) % 3 !== 0; alt = i % 6 === 0; }
            b.classList.toggle('on', on);
            b.classList.toggle('alt', on && alt);
        });
    }
    setBulbs('idle');

    // ===== 효과 =====
    let bannerTimer = null;
    function showBanner(text, sub, mega) {
        const b = $('banner');
        b.className = 'banner' + (mega ? ' mega' : '');
        b.innerHTML = ''; b.appendChild(document.createTextNode(text));
        const s = document.createElement('small'); s.textContent = sub; b.appendChild(s);
        requestAnimationFrame(() => b.classList.add('show'));
        clearTimeout(bannerTimer); bannerTimer = setTimeout(hideBanner, mega ? 4500 : 3000);
    }
    function hideBanner() { $('banner').classList.remove('show'); }
    function flash() { const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
    function shake() { const a = $('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); }
    let toastTimer = null;
    function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

    const fx = $('fx'), fctx = fx.getContext('2d');
    let dpr = 1, parts = [], fxDirty = false;
    function sizeFx() { dpr = Math.min(window.devicePixelRatio || 1, 2); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
    function coins(power) {
        const tray = document.querySelector('.tray').getBoundingClientRect();
        const cx = tray.left + tray.width / 2, cy = tray.top;
        const n = Math.round(60 * power);
        for (let i = 0; i < n; i++) {
            parts.push({
                x: cx + (rand() - 0.5) * tray.width * 0.6, y: cy, vx: (rand() - 0.5) * 10, vy: -8 - rand() * 14 * Math.min(1.5, 0.6 + power / 2),
                rot: rand() * TAU, vr: 0.1 + rand() * 0.3, size: 8 + rand() * 6, life: 1, decay: 0.004 + rand() * 0.006, kind: 'coin'
            });
        }
        if (power >= 1.5) {
            const colors = ['#f5c542', '#fff1a8', '#ff2d75', '#7cf5ff', '#ffffff'];
            for (let i = 0; i < 90 * power; i++) {
                parts.push({
                    x: rand() * innerWidth, y: -20 - rand() * innerHeight * 0.7, vx: (rand() - 0.5) * 2, vy: 2 + rand() * 3,
                    rot: rand() * TAU, vr: (rand() - 0.5) * 0.4, size: 4 + rand() * 6, life: 1, decay: 0.003 + rand() * 0.004,
                    kind: rand() < 0.5 ? 'coin' : 'conf', color: colors[i % colors.length]
                });
            }
        }
    }
    function drawFx() {
        if (!parts.length && !fxDirty) return;
        fctx.setTransform(1, 0, 0, 1, 0, 0);
        fctx.clearRect(0, 0, fx.width, fx.height);
        fxDirty = parts.length > 0;
        fctx.scale(dpr, dpr);
        parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
        for (const p of parts) {
            p.vy += 0.35; p.vx *= 0.99;
            p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
            fctx.save();
            fctx.globalAlpha = Math.min(1, p.life * 2);
            fctx.translate(p.x, p.y);
            if (p.kind === 'coin') {
                const sx = Math.cos(p.rot);
                fctx.scale(Math.abs(sx) < 0.08 ? 0.08 : sx, 1);
                const g = fctx.createRadialGradient(-p.size * 0.3, -p.size * 0.3, 0, 0, 0, p.size);
                g.addColorStop(0, '#fff8c8'); g.addColorStop(0.5, '#f5c542'); g.addColorStop(1, '#8a5a00');
                fctx.fillStyle = g; fctx.beginPath(); fctx.arc(0, 0, p.size, 0, TAU); fctx.fill();
                fctx.strokeStyle = 'rgba(122,82,0,.9)'; fctx.lineWidth = 1.5; fctx.beginPath(); fctx.arc(0, 0, p.size * 0.68, 0, TAU); fctx.stroke();
            } else {
                fctx.rotate(p.rot); fctx.fillStyle = p.color; fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            }
            fctx.restore();
        }
    }
    (function loop() { drawFx(); requestAnimationFrame(loop); })();

    // ===== 사운드 (Web Audio 합성) =====
    let actx = null;
    function initAudio() {
        if (!state.sound) return;
        if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
        if (actx && actx.state === 'suspended') actx.resume();
    }
    const on = () => actx && state.sound;
    function tone(f, t, len, type, vol, slideTo) {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + len);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.05);
    }
    let lastTick = 0;
    function tick() { if (!on()) return; const t = actx.currentTime; if (t - lastTick < 0.03) return; lastTick = t; tone(1500 + rand() * 500, t, 0.025, 'square', 0.04); }
    function thunk() { if (!on()) return; const t = actx.currentTime; tone(180, t, 0.12, 'square', 0.12, 60); tone(900, t, 0.04, 'triangle', 0.08); }
    function ratchet() { if (!on()) return; const t = actx.currentTime; tone(420 + rand() * 80, t, 0.03, 'square', 0.08); }
    function clunk() { if (!on()) return; const t = actx.currentTime; tone(120, t, 0.25, 'sawtooth', 0.15, 40); tone(700, t, 0.06, 'square', 0.08); }
    function beep(f) { initAudio(); if (!on()) return; tone(f, actx.currentTime, 0.08, 'square', 0.06); }
    function clink() { if (!on()) return; const t = actx.currentTime; tone(2600 + rand() * 900, t, 0.06, 'triangle', 0.06); }
    function heartbeat(ms) {
        if (!on()) return;
        const t = actx.currentTime;
        for (let k = 0; k < ms / 420; k++) { tone(70, t + k * 0.42, 0.12, 'sine', 0.35); tone(60, t + k * 0.42 + 0.14, 0.12, 'sine', 0.25); }
    }
    function loseSound() { if (!on()) return; const t = actx.currentTime; tone(330, t, 0.25, 'sawtooth', 0.05, 220); }
    function winSound(level) {
        if (!on()) return;
        const t = actx.currentTime;
        if (level === 0) { [784, 1047].forEach((f, i) => tone(f, t + i * 0.1, 0.2, 'triangle', 0.12)); return; }
        const seq = [523, 659, 784, 1047, 784, 1047, 1319];
        seq.forEach((f, i) => tone(f, t + i * 0.08, 0.3, 'triangle', 0.15));
        if (level >= 2) [1047, 1319, 1568, 2093, 1568, 2093, 2637].forEach((f, i) => tone(f, t + 0.6 + i * 0.08, 0.35, 'square', 0.06));
        if (level >= 3) for (let k = 0; k < 10; k++) { tone(1568, t + 1.3 + k * 0.18, 0.15, 'sine', 0.12); tone(2093, t + 1.39 + k * 0.18, 0.15, 'sine', 0.12); }
    }

    // ===== 설정 =====
    const modal = $('settings');
    function renderStats() {
        $('sSpins').textContent = fmt(state.spins);
        $('sHit').textContent = state.spins ? Math.round(state.hits / state.spins * 100) + '%' : '-';
        $('sBig').textContent = (state.big > 0 ? '+' : '') + fmt(state.big);
        $('sJack').textContent = fmt(state.jackpots);
        const log = $('log'); log.innerHTML = '';
        if (!state.log.length) log.innerHTML = '<div class="empty">아직 기록이 없어요</div>';
        state.log.forEach(r => {
            const row = document.createElement('div'); row.className = 'log-row';
            const s = document.createElement('span'); s.className = 's'; s.innerHTML = r.line.map(symHTML).join('');
            const b = document.createElement('span'); b.textContent = `${fmt(r.bet)} 베팅`;
            const a = document.createElement('span'); a.className = 'amt ' + (r.net >= 0 ? 'plus' : 'minus'); a.textContent = (r.net > 0 ? '+' : '') + fmt(r.net);
            row.append(s, b, a); log.appendChild(row);
        });
    }
    const openSettings = () => { renderStats(); modal.classList.add('open'); };
    const closeSettings = () => modal.classList.remove('open');
    $('settingsBtn').addEventListener('click', openSettings);
    $('settingsClose').addEventListener('click', closeSettings);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeSettings(); });
    $('soundBtn').addEventListener('click', () => { state.sound = !state.sound; save(); render(); if (state.sound) initAudio(); });
    $('resetBtn').addEventListener('click', () => {
        if (spinning || !confirm('크레딧과 기록을 지우고 1,000으로 다시 시작할까요?')) return;
        const snd = state.sound; state = fresh(); state.sound = snd; save(); render(); renderStats(); clearWin();
        $('win').textContent = '0'; setMsg('레버를 당기세요!'); toast('처음부터 다시 시작해요');
    });

    // ===== 버튼 / 키 =====
    $('spinBtn').addEventListener('click', autoPull);
    $('betDown').addEventListener('click', () => changeBet(-1));
    $('betUp').addEventListener('click', () => changeBet(1));
    $('betMax').addEventListener('click', () => {
        if (spinning) return;
        const b = BETS.filter(x => x <= state.credit).pop();
        if (!b) { toast('크레딧이 부족해요'); return; }
        state.bet = b; save(); render(); beep(1300);
    });
    $('refillBtn').addEventListener('click', () => { state.credit += START; save(); render(); flashLed(); toast('🎁 1,000 크레딧을 받았어요!'); setMsg('레버를 당기세요!'); });
    document.addEventListener('keydown', (e) => {
        if (modal.classList.contains('open')) { if (e.key === 'Escape') closeSettings(); return; }
        if (e.code === 'Space' && !e.repeat) { e.preventDefault(); autoPull(); }
        else if (e.key === 'ArrowUp') changeBet(1);
        else if (e.key === 'ArrowDown') changeBet(-1);
    });

    window.addEventListener('resize', () => { measure(); sizeFx(); });
    measure(); sizeFx(); render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
