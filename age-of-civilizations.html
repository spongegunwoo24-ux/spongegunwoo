<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Age of Civilizations</title>
<link rel="icon" href="./logo.png" type="image/png">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
:root {
  --bg: #0f1a2b;
  --sea: #1e3a5f;
  --panel: rgba(16, 24, 38, 0.94);
  --panel-solid: #121b2b;
  --line: rgba(255, 255, 255, 0.10);
  --text: #e9eef6;
  --muted: #93a1b8;
  --accent: #f2b33d;
  --accent-ink: #1b1405;
  --good: #4cc27a;
  --bad: #ef5a5a;
  --info: #5aa9ef;
  --warn: #f2c94c;
  --radius: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .4; cursor: not-allowed; }
input { font: inherit; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#map.dragging { cursor: grabbing; }
.hidden { display: none !important; }

/* 상단 바 */
#top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  background: linear-gradient(180deg, rgba(10,16,28,.95), rgba(10,16,28,.80)); border-bottom: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap; scrollbar-width: none; z-index: 5; }
#top::-webkit-scrollbar { display: none; }
.civchip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding-right: 8px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.flag { font-size: 18px; line-height: 1; }
.stat { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* 하단 바 */
#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, rgba(10,16,28,.96), rgba(10,16,28,.82)); border-top: 1px solid var(--line); z-index: 5; }
.modes { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.modes::-webkit-scrollbar { display: none; }
.chip { padding: 7px 11px; border-radius: 999px; background: rgba(255,255,255,.07); white-space: nowrap; font-size: 13px; }
.chip.on { background: var(--text); color: #111; font-weight: 700; }
.iconbtn { padding: 8px 11px; border-radius: 10px; background: rgba(255,255,255,.08); white-space: nowrap; position: relative; }
.iconbtn .badge { position: absolute; top: -4px; right: -4px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 6px; }
#endBtn { padding: 10px 18px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 800; white-space: nowrap; }
.mp { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mp small { color: var(--muted); font-weight: 500; }

/* province 패널 */
#panel { position: fixed; left: 12px; bottom: 70px; width: 340px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; z-index: 6; box-shadow: 0 10px 30px rgba(0,0,0,.4); backdrop-filter: blur(6px); }
#panel h3 { margin: 0 0 2px; font-size: 17px; display: flex; align-items: center; gap: 6px; }
#panel .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#panel .close { position: absolute; top: 8px; right: 10px; color: var(--muted); font-size: 18px; padding: 4px 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
.kv { background: rgba(255,255,255,.05); border-radius: 8px; padding: 7px 9px; }
.kv b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.kv span { color: var(--muted); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.act { flex: 1 1 auto; padding: 9px 10px; border-radius: 9px; background: rgba(255,255,255,.09); font-weight: 600; font-size: 13px; }
.act.primary { background: var(--accent); color: var(--accent-ink); }
.act.danger { background: rgba(239,90,90,.18); color: #ffb3b3; }
.act small { opacity: .7; font-weight: 500; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.1); }
.tag.war { background: rgba(239,90,90,.25); color: #ffb3b3; }
.tag.ally { background: rgba(76,194,122,.25); color: #b5f0cb; }
.tag.pact { background: rgba(242,201,76,.22); color: #f7e3a2; }
.tag.vassal { background: rgba(90,169,239,.25); color: #bfe0ff; }
.hint { margin-top: 8px; color: var(--muted); font-size: 12px; }

/* 서랍 */
#drawer { position: fixed; top: 52px; right: 12px; bottom: 70px; width: 340px; max-width: calc(100% - 24px); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); z-index: 7; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 8px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.tabs button.on { background: rgba(255,255,255,.1); color: var(--text); }
.tabs .x { flex: none; }
.dbody { overflow-y: auto; padding: 8px 10px 12px; flex: 1; }
.row { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; }
.row:hover { background: rgba(255,255,255,.05); }
.row .grow { flex: 1; min-width: 0; }
.row .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--muted); font-size: 12px; }
.log { font-size: 13px; padding: 6px 8px; border-left: 3px solid transparent; border-radius: 4px; cursor: default; }
.log.click { cursor: pointer; }
.log.click:hover { background: rgba(255,255,255,.05); }
.log .t { color: var(--muted); font-size: 11px; margin-right: 4px; }
.log.war { border-color: var(--bad); } .log.good { border-color: var(--good); } .log.bad { border-color: #ff8a3d; } .log.dip { border-color: var(--info); } .log.info { border-color: #6b778c; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }

/* 모달 */
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .box { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
#modal h2 { margin: 0 0 6px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
#modal p { color: var(--muted); margin: 6px 0 12px; line-height: 1.5; }
.slider { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; }
.slider input[type=range] { flex: 1; accent-color: var(--accent); }
.slider input[type=number] { width: 110px; padding: 7px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); text-align: right; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.quick { display: flex; gap: 6px; margin-bottom: 10px; }
.quick button { flex: 1; padding: 6px; border-radius: 7px; background: rgba(255,255,255,.07); font-size: 12px; }
.btns { display: flex; gap: 8px; margin-top: 14px; }
.btns button { flex: 1; padding: 11px; border-radius: 10px; background: rgba(255,255,255,.09); font-weight: 700; }
.btns .ok { background: var(--accent); color: var(--accent-ink); }
.diplist { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.diplist button { padding: 11px 8px; border-radius: 10px; background: rgba(255,255,255,.08); text-align: left; }
.diplist button b { display: block; font-size: 14px; }
.diplist button span { color: var(--muted); font-size: 11.5px; }
.diplist button.war { background: rgba(239,90,90,.16); }
.rules { font-size: 13px; line-height: 1.6; color: #cfd8e6; }
.rules h4 { margin: 14px 0 4px; color: var(--text); }
.rules ul { margin: 0; padding-left: 18px; }

/* 시작 화면 */
#start { position: fixed; left: 16px; top: 16px; bottom: 16px; width: 380px; max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; z-index: 15; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
#start header { padding: 18px 18px 8px; }
#start h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
#start h1 span { color: var(--accent); }
#start .lead { color: var(--muted); font-size: 13px; margin-top: 4px; }
#start .search { margin: 8px 18px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); }
#civList { flex: 1; overflow-y: auto; padding: 0 10px; min-height: 120px; }
#civList .row { cursor: pointer; }
#civList .row.on { background: rgba(242,179,61,.16); box-shadow: inset 0 0 0 1px rgba(242,179,61,.5); }
#start footer { padding: 12px 18px 18px; border-top: 1px solid var(--line); }
.seg { display: flex; background: rgba(255,255,255,.06); border-radius: 9px; padding: 3px; gap: 3px; margin: 4px 0 10px; }
.seg button { flex: 1; padding: 6px; border-radius: 7px; font-size: 13px; color: var(--muted); }
.seg button.on { background: rgba(255,255,255,.14); color: var(--text); font-weight: 700; }
.lbl { font-size: 12px; color: var(--muted); }
#startBtn { width: 100%; padding: 13px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; }
#contBtn { width: 100%; padding: 10px; border-radius: 11px; background: rgba(255,255,255,.08); margin-top: 8px; font-weight: 600; }
#pick { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; min-height: 22px; }

#toast { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); background: rgba(10,16,28,.95); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px;
  z-index: 30; font-weight: 600; pointer-events: none; transition: opacity .3s; max-width: calc(100% - 32px); text-align: center; }
#modeHint { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 999px; font-weight: 700; z-index: 6; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
#modeHint button { background: rgba(0,0,0,.15); padding: 3px 10px; border-radius: 999px; font-weight: 700; }

@media (max-width: 720px) {
  #panel { left: 8px; right: 8px; width: auto; max-width: none; bottom: 64px; padding: 12px; }
  #drawer { left: 8px; right: 8px; width: auto; top: auto; height: 60vh; bottom: 64px; }
  #start { left: 8px; right: 8px; top: auto; bottom: 8px; height: 62vh; width: auto; max-width: none; }
  #bar { gap: 6px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .iconbtn { padding: 8px 9px; }
  .iconbtn .lab { display: none; }
  #endBtn { padding: 10px 12px; }
  .stat { padding: 3px 7px; font-size: 13px; }
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="top" class="hidden"></div>
<div id="modeHint" class="hidden"><span id="modeHintText"></span><button id="modeCancel">취소</button></div>

<section id="panel" class="hidden"></section>

<aside id="drawer" class="hidden">
  <div class="tabs">
    <button data-tab="orders">명령</button>
    <button data-tab="news">소식</button>
    <button data-tab="nations">국가</button>
    <button class="x" id="drawerClose">✕</button>
  </div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<div id="bar" class="hidden">
  <div class="modes" id="modes"></div>
  <button class="iconbtn" data-open="orders">📜<span class="lab"> 명령</span><span class="badge hidden" id="ordBadge"></span></button>
  <button class="iconbtn" data-open="news">📰<span class="lab"> 소식</span><span class="badge hidden" id="newsBadge"></span></button>
  <button class="iconbtn" data-open="nations">🏛<span class="lab"> 국가</span></button>
  <button class="iconbtn" id="menuBtn">☰</button>
  <span class="mp" id="mpBox"></span>
  <button id="endBtn">턴 종료 ▶</button>
</div>

<div id="start">
  <header>
    <h1>AGE OF <span>CIVILIZATIONS</span></h1>
    <div class="lead">나라를 하나 골라 세계를 내 색으로 칠해라. 지도에서 나라를 눌러도 선택된다.</div>
  </header>
  <input class="search" id="search" placeholder="나라 검색…">
  <div id="civList"></div>
  <footer>
    <div id="pick"></div>
    <div class="lbl">전장의 안개 (Fog of War)</div>
    <div class="seg" id="fogSeg"><button data-v="0">OFF</button><button data-v="1" class="on">STANDARD</button><button data-v="2">FULL</button></div>
    <div class="lbl">AI 공격성</div>
    <div class="seg" id="aggrSeg"><button data-v="0">평화</button><button data-v="1" class="on">보통</button><button data-v="2">호전적</button></div>
    <button id="startBtn" disabled>게임 시작</button>
    <button id="contBtn" class="hidden">이어하기</button>
  </footer>
</div>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="toast" style="opacity:0"></div>

{ let i = 0; for (const t of MAP.grid.split(',')) { const [a, b] = t.split('.'); const v = parseInt(a, 36) - 1, n = parseInt(b, 36); grid.fill(v, i, i + n); i += n; } }

const TER_KO = { plains: '평원', hills: '구릉', forest: '숲', mountain: '산악', desert: '사막', tundra: '툰드라' };

const C = MAP.civs.map((r, id) => ({ id, tag: r[0], name: r[1], color: r[2], cap0: r[3], econ: r[4] }));
const NP = P.length, NC = C.length;
P.forEach(p => { p.econ = p.owner0 >= 0 ? C[p.owner0].econ : 0.7; p.coastal = p.sea.length > 0; });
const cellsOf = P.map(() => []);
for (let i = 0; i < grid.length; i++) if (grid[i] >= 0) cellsOf[grid[i]].push(i);

const BUILD = { 2: { key: 'tower', name: '감시탑', icon: '👁', cost: 150, desc: '주변 2칸 병력 보임' }, 4: { key: 'port', name: '항구', icon: '⚓', cost: 250, desc: '바다 건너 해안으로 이동' } };

const allied = (a, b) => a >= 0 && b >= 0 && S.civ[a].ally.includes(b);
const pactLeft = (a, b) => (a >= 0 && b >= 0 && S.civ[a].pact[b]) || 0;
const vassalsOf = c => S.civ.map((x, i) => i).filter(i => S.civ[i].alive && S.civ[i].vassalOf === c);
const isCapitalProv = p => S.civ.some(x => x.alive && x.cap === p);
const capitalOwnerOf = p => S.civ.findIndex(x => x.alive && x.cap === p);

function newGame(player, fog, aggr) {
  S = { v: 2, turn: 1, player, fog, aggr, orders: [], log: [], props: [], battles: [], explored: [], seenLog: 0, over: false,
    prov: P.map(p => ({ o: p.owner0, a: 0, pop: p.pop0, b: 0 })),
    civ: C.map(c => ({ alive: true, gold: 0, cap: c.cap0, capLost: 0, mp: 0, war: [], ally: [], pact: {}, vassalOf: -1, vassalSince: 0, warSince: {} })) };
  for (const p of P) {
    const sp = S.prov[p.id];
    if (p.owner0 >= 0) sp.a = Math.round(p.pop0 * 0.002 / 100) * 100 + 1000;
    else sp.a = Math.round((p.pop0 * 0.0012 + 3000) / 100) * 100;
    if (p.cap0 && p.coastal) sp.b |= 4;
  }
  // 내륙 수도인 나라: 가장 인구 많은 해안 지역에 항구
  for (const c of C) {

// ============================================================
//  계산 도우미
// ============================================================
function provsOf(c) { const r = []; for (let i = 0; i < NP; i++) if (S.prov[i].o === c) r.push(i); return r; }
function statsOf(c) {
  let provs = 0, pop = 0, armyN = 0, income = 0;
  for (let i = 0; i < NP; i++) { const sp = S.prov[i]; if (sp.o !== c) continue; provs++; pop += sp.pop; armyN += sp.a; income += sp.pop / 1e6 * P[i].econ * 4; }
  const upkeep = armyN * UPKEEP;

  for (const v of vassalsOf(c)) { let inc = 0; for (let i = 0; i < NP; i++) if (S.prov[i].o === v) inc += S.prov[i].pop / 1e6 * P[i].econ * 4; tribute -= inc * 0.25; }

// 전투는 숫자 비교만 한다: 보너스 없음
function defPower(p) { return S.prov[p].a; }

function relationOf(a, b) {

// 이동 종류 판정: from의 소유자 c가 to로 갈 수 있는가

    return null;
  }
  if ((S.prov[from].b & 4) && P[from].sea.includes(to)) {

}
const KIND_KO = { move: '이동', attack: '공격', naval: '해상 이동', navalAttack: '상륙 공격' };

// ============================================================
//  로그 / 제안
// ============================================================
// '이(가)' 같은 조사를 앞 글자 받침에 맞춰 고른다
const JOSA = { '이(가)': ['이', '가'], '을(를)': ['을', '를'], '과(와)': ['과', '와'], '은(는)': ['은', '는'] };

function addLog(kind, msg, p) { msg = josa(msg); S.log.push({ t: S.turn, k: kind, m: msg, p: p == null ? -1 : p }); if (S.log.length > 400) S.log.splice(0, S.log.length - 400); }
const involvesPlayer = (...cs) => cs.includes(S.player);

// ============================================================

function setWar(a, b) {

}

}
function declareWar(a, b) {

}

function breakAlliance(a, b) { civ(a).ally = civ(a).ally.filter(x => x !== b); civ(b).ally = civ(b).ally.filter(x => x !== a); addLog('dip', `${nm(a)}이(가) ${nm(b)}과(와)의 동맹을 파기했다.`); }

  for (let i = 0; i < NP; i++) if (S.prov[i].o === v) S.prov[i].o = over;
  civ(over).gold += Math.max(0, civ(v).gold);
  eliminate(v, -1, true);
  addLog('good', `🗺 ${nm(over)}이(가) ${nm(v)}을(를) 합병했다.`, civ(over).cap);
}
function eliminate(c, heir, quiet) {

// AI가 제안을 받아들이는가
function aiAccept(type, from, to) {
  const r = powerOf(from) / Math.max(1, powerOf(to));
  if (type === 'peace') {
    const len = S.turn - (civ(to).warSince[from] || S.turn);
    if (len < 2) return false;
    if (r > 1.2) return rand() < 0.75;      // 상대가 더 셈 → 받아들임
    if (r > 0.7) return rand() < 0.45;
    return rand() < 0.12;
  }
  if (type === 'pact') return !atWar(from, to) && rand() < (r > 0.8 ? 0.7 : 0.35);
  if (type === 'ally') {
    if (atWar(from, to) || civ(to).ally.length >= 3) return false;
    const common = civ(from).war.some(e => civ(to).war.includes(e));
    return rand() < (common ? 0.75 : r > 1 ? 0.4 : 0.2);
  }
  if (type === 'vassal') {
    if (!atWar(from, to)) return false;
    const capHeld = S.prov[civ(to).cap].o === from;
    return capHeld ? rand() < 0.8 : r > 3 ? rand() < 0.6 : false;
  }
  return false;
}

// ============================================================
//  전투
// ============================================================
// 공격이 수비보다 많으면 점령, 남는 병력 = 차이. 같거나 적으면 수비가 버틴다.
function battle(att, def) {
  if (att > def) return { win: true, a: att - def, d: 0 };
  return { win: false, a: 0, d: def - att };
}

// ============================================================
//  명령 실행
// ============================================================
function execMove(o) {
  const c = o.civ, sp = S.prov[o.from];

  if (!kind) { if (c === S.player) addLog('info', `명령 취소: ${P[o.from].name} → ${P[o.to].name} (더 이상 갈 수 없음)`, o.to); return; }
  const amt = Math.min(o.amt, sp.a);

  if (kind === 'move' || kind === 'naval') { tp.a += amt; return; }
  const defender = tp.o;
  const res = battle(amt, tp.a);
  S.battles.push({ p: o.to, att: c, def: defender, win: res.win });
  const wasCap = capitalOwnerOf(o.to);
  if (res.win) {
    tp.o = c; tp.a = res.a;
    if (involvesPlayer(c, defender)) addLog(c === S.player ? 'good' : 'bad', `${c === S.player ? '✅' : '❌'} ${nm(c)}이(가) ${P[o.to].name}을(를) 점령했다. (공격 ${fmt(amt)} → 생존 ${fmt(res.a)})`, o.to);
    if (wasCap >= 0 && wasCap !== c) addLog(involvesPlayer(c, wasCap) ? (c === S.player ? 'good' : 'bad') : 'war', `🏛 ${nm(wasCap)}의 수도 ${P[o.to].name}이(가) ${nm(c)}에 함락됐다! ${CAP_LOST_LIMIT}턴 안에 되찾지 못하면 멸망한다.`, o.to);
  } else {
    tp.a = res.d;
    if (involvesPlayer(c, defender)) addLog(c === S.player ? 'bad' : 'good', `🛡 ${P[o.to].name} 전투: ${nm(c)}의 공격 ${fmt(amt)} 격퇴됨 (수비 ${fmt(res.d)} 생존)`, o.to);
  }
}
function execEconomy(o) {
  const c = o.civ, sp = S.prov[o.p], X = civ(c);
  if (sp.o !== c) { X.gold += o.gold || 0; return; }
  if (o.type === 'recruit') { const n = Math.min(o.amt, Math.floor(sp.pop * RECRUIT_RATE * 1.5)); sp.a += n; sp.pop -= n; X.gold += Math.round((o.amt - n) * RECRUIT_COST); }

  const ai = t !== S.player;
  switch (o.act) {
    case 'war': if (!pactLeft(c, t) && !allied(c, t)) declareWar(c, t); break;
    case 'peace':
      if (!atWar(c, t)) break;
      if (ai ? aiAccept('peace', c, t) : false) makePeace(c, t);
      else if (c === S.player) addLog('dip', `${nm(t)}이(가) 평화 제안을 거절했다.`);
      break;
    case 'pact':
      if (atWar(c, t)) break;
      if (aiAccept('pact', c, t)) makePact(c, t); else if (c === S.player) addLog('dip', `${nm(t)}이(가) 불가침 조약을 거절했다.`);
      break;
    case 'ally':
      if (aiAccept('ally', c, t)) makeAlliance(c, t); else if (c === S.player) addLog('dip', `${nm(t)}이(가) 동맹 제안을 거절했다.`);
      break;
    case 'kick': if (allied(c, t)) breakAlliance(c, t); break;
    case 'support': civ(t).gold += o.gold; addLog('dip', `💰 ${nm(c)}이(가) ${nm(t)}에 ${fmt(o.gold)}금을 지원했다.`); break;
    case 'vassal':
      if (aiAccept('vassal', c, t)) makeVassal(c, t); else if (c === S.player) addLog('dip', `${nm(t)}이(가) 종속 요구를 거부했다.`);

// ============================================================
//  AI
// ============================================================
function distField(c) {
  const d = new Int16Array(NP).fill(-1), q = [];
  for (let i = 0; i < NP; i++) { const o = S.prov[i].o; if (o !== c && (o === -1 || atWar(c, o))) { d[i] = 0; q.push(i); } }
  for (let k = 0; k < q.length; k++) {
    const x = q[k];
    for (const y of P[x].adj) if (d[y] < 0 && S.prov[y].o === c) { d[y] = d[x] + 1; q.push(y); }
    for (const y of P[x].sea) if (d[y] < 0 && S.prov[y].o === c && (S.prov[y].b & 4) && P[y].sea.includes(x)) { d[y] = d[x] + 1; q.push(y); }

}

        if (civ(d).vassalOf >= 0 && civ(d).vassalOf === X.vassalOf) continue;
        const r = pw / Math.max(1, powerOf(d)) * (0.8 + rand() * 0.4) * (d === S.player ? 0.9 : 1);

    }

      if (ns.length) {
        const d = ns[Math.floor(rand() * ns.length)];
        if (d === S.player) { if (rand() < 0.4) queueProposal(rand() < 0.5 ? 'ally' : 'pact', c); }
        else if (aiAccept('ally', c, d)) makeAlliance(c, d);

    }

  }

    const n = Math.floor(S.prov[big].a * 0.2 / 100) * 100;
    if (n > 0 && mp >= 1) { orders.push({ civ: c, type: 'disband', p: big, amt: n }); mp--; }
  }
  const dist = distField(c);
  let budget = X.gold - Math.max(0, st.upkeep) * 2;
  if (budget > 100 && mp >= 1) {
    let spots = my.filter(p => dist[p] === 1).sort((a, b) => S.prov[b].pop - S.prov[a].pop).slice(0, 2);
    if (!spots.length) spots = [X.cap].filter(p => S.prov[p].o === c);
    for (const p of spots) {
      if (mp < 1) break;
      const n = maxRecruit(p, budget * 0.6 / spots.length);
      if (n >= 500) { const g = Math.ceil(n * RECRUIT_COST); X.gold -= g; budget -= g; orders.push({ civ: c, type: 'recruit', p, amt: n, gold: g }); mp--; }

    { const f = my.filter(q => dist[q] === 1 && !(S.prov[q].b & 2)); if (f.length && rand() < 0.4) { p = f[0]; b = 2; } }
    if (p < 0) { const f = my.filter(q => P[q].coastal && !(S.prov[q].b & 4)); if (f.length) { p = f[Math.floor(rand() * f.length)]; b = 4; } }
    if (p >= 0) { X.gold -= BUILD[b].cost; orders.push({ civ: c, type: 'build', p, bld: b, gold: BUILD[b].cost }); mp -= 2; }
  }

  // --- 이동 ---
  const units = my.filter(p => S.prov[p].a > 0).sort((a, b) => S.prov[b].a - S.prov[a].a);
  for (const u of units) {
    if (mp < 1) break;
    const amt = S.prov[u].a;
    let best = -1, bs = Infinity, bk = null;
    const cand = [...P[u].adj, ...((S.prov[u].b & 4) ? P[u].sea : [])];
    for (const t of cand) {
      const k = moveKind(c, u, t);
      if (k !== 'attack' && k !== 'navalAttack') continue;
      const def = defPower(t);
      const score = def / (isCapitalProv(t) ? 2.5 : 1) / (S.prov[t].o === -1 ? 1.3 : 1) + (k === 'navalAttack' ? 2000 : 0);

    }
    if (best >= 0) {
      const need = defPower(best) * 1.15 + 100;
      const cost = COST[bk];

        const threatened = P[u].adj.some(j => S.prov[j].o >= 0 && atWar(c, S.prov[j].o) && j !== best);

    }

      if (nx < 0 && (S.prov[u].b & 4) && dist[u] <= 8) for (const t of P[u].sea) if (dist[t] === dist[u] - 1 && S.prov[t].o === c) { nx = t; nk = 'naval'; break; }

// ============================================================
//  턴 진행
// ============================================================
function endTurn() {
  if (S.over) return;
  const pl = S.player;
  S.battles = [];
  const alive = S.civ.map((x, i) => i).filter(i => S.civ[i].alive);
  // 1) AI 결정
  const aiOrders = [];
  for (const c of alive) if (c !== pl) aiOrders.push(...aiTurn(c));
  const all = [...S.orders, ...aiOrders];
  // 2) 외교
  for (const o of all) if (o.type === 'dip') execDip(o);
  // 3) 모집/해산/건설
  for (const o of all) if (o.type === 'recruit' || o.type === 'disband' || o.type === 'build') execEconomy(o);
  // 4) 이동 (국가 순서는 매 턴 무작위)
  const order = alive.slice(); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const byCiv = new Map(); for (const o of all) if (o.type === 'move') { if (!byCiv.has(o.civ)) byCiv.set(o.civ, []); byCiv.get(o.civ).push(o); }
  for (const c of order) for (const o of byCiv.get(c) || []) if (civ(c).alive) execMove(o);
  S.orders = [];
  // 5) 수도 / 멸망
  for (const c of alive) {
    const X = civ(c); if (!X.alive) continue;
    const holder = S.prov[X.cap].o;
    const n = provsOf(c).length;
    if (holder !== c) {
      X.capLost++;
      if (X.capLost >= CAP_LOST_LIMIT || n === 0) eliminate(c, holder >= 0 && civ(holder).alive ? holder : -1);
      else if (c === pl) addLog('bad', `⚠ 수도를 잃은 지 ${X.capLost}턴. ${CAP_LOST_LIMIT - X.capLost}턴 안에 되찾아야 한다!`, X.cap);
    } else X.capLost = 0;
  }
  // 6) 경제, 인구, 조약
  for (let c = 0; c < NC; c++) {
    const X = civ(c); if (!X.alive) continue;
    const st = statsOf(c);
    X.gold += st.net;
    if (X.gold < 0) {
      for (const p of provsOf(c)) S.prov[p].a = Math.floor(S.prov[p].a * 0.9);
      if (c === pl) addLog('bad', '💸 국고가 바닥나 병력의 10%가 탈영했다.');
      X.gold = 0;
    }
    for (const k of Object.keys(X.pact)) { X.pact[k]--; if (X.pact[k] <= 0) delete X.pact[k]; }
  }
  for (const sp of S.prov) sp.pop = Math.round(sp.pop * 1.002);
  S.turn++;
  for (let c = 0; c < NC; c++) if (civ(c).alive) civ(c).mp = maxMp(c);
  updateExplored();
  // 7) 승패
  if (!civ(pl).alive) { S.over = true; save(); gameOverModal(false); return; }
  const rivals = S.civ.map((x, i) => i).filter(i => S.civ[i].alive && i !== pl && S.civ[i].vassalOf !== pl);
  if (!rivals.length && !S.wonShown) { S.wonShown = true; save(); gameOverModal(true); }
  save();
}

function provColor(p) {

function rebuildBase() {

}

function arrow(from, to, amt, kind) {

const pointers = new Map();

// ============================================================
const $ = id => document.getElementById(id);
let uiMode = null; // {type:'move', from}
function toast(msg) { const t = $('toast'); t.textContent = josa(msg); t.style.opacity = 1; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.opacity = 0, 2600); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function civBadge(c) { return c < 0 ? `<span class="sw" style="background:#9ea3a8"></span>중립 지역` : `<span class="sw" style="background:${C[c].color}"></span><span class="flag">${flagOf(C[c].tag)}</span>${esc(C[c].name)}`; }

function tapAt(x, y) {
  const p = provAt(x, y);
  if (!S) { if (p >= 0 && P[p].owner0 >= 0) pickStart(P[p].owner0); return; }
  if (uiMode && uiMode.type === 'move') {
    if (p >= 0 && targets.has(p)) {
      const from = uiMode.from, kind = targets.get(p), foe = needWar.get(p);
      cancelMode();
      if (foe != null) askWarThenAttack(from, p, kind, foe); else askMove(from, p, kind);
      return;
    }
    if (p >= 0 && S.prov[p].o >= 0 && S.prov[p].o !== S.player) {
      const why = warBlock(S.player, S.prov[p].o);
      if (why) { toast(why); return; }
      const from = uiMode.from;
      if (!P[from].adj.includes(p)) { toast(P[from].coastal && P[from].sea.includes(p) ? '바다를 건너려면 출발 지역에 항구(⚓)가 있어야 한다.' : '붙어 있는 지역으로만 갈 수 있다.'); return; }
    }
    cancelMode();
  }
  select(p);
  if (p >= 0 && !uiMode) {
    const o = S.prov[p].o;
    if (o !== S.player && (o === -1 || atWar(S.player, o) || pendingWarTargets().includes(o))) {
      const srcs = attackSources(p);
      if (srcs.length) askMove(srcs[0].p, p, srcs[0].k, srcs);
      else toast('이 지역과 붙어 있는 내 병력이 없다. (바다 건너면 항구가 필요)');
    }
  }
}
// 내 지역 중 to를 공격할 수 있는 곳 (병력 많은 순)
function attackSources(to, extra) {
  const ew = [...pendingWarTargets(), ...(extra || [])], r = [];
  for (let p = 0; p < NP; p++) {
    if (S.prov[p].o !== S.player || availableArmy(p) <= 0) continue;
    const k = moveKind(S.player, p, to, ew);
    if (k === 'attack' || k === 'navalAttack') r.push({ p, k });
  }
  return r.sort((a, b) => (a.k === b.k ? 0 : a.k === 'attack' ? -1 : 1) || availableArmy(b.p) - availableArmy(a.p));
}
function select(p) {
  selected = p; targets = new Map(); rebuildHighlight(); dirty = true;
  renderPanel();
}
function cancelMode() { uiMode = null; targets = new Map(); $('modeHint').classList.add('hidden'); rebuildHighlight(); dirty = true; }

// 대기 명령 계산
const pendingWarTargets = () => S.orders.filter(o => o.type === 'dip' && o.act === 'war').map(o => o.target);
function reserved(p) { let s = 0; for (const o of S.orders) if ((o.type === 'move' && o.from === p) || (o.type === 'disband' && o.p === p)) s += o.amt; return s; }
function availableArmy(p) { return Math.max(0, S.prov[p].a - reserved(p)); }
function mpLeft() { return civ(S.player).mp - S.orders.reduce((s, o) => s + o.mp, 0); }
function pendingBuild(p, b) { return S.orders.some(o => o.type === 'build' && o.p === p && o.bld === b); }
function pendingDip(t, act) { return S.orders.some(o => o.type === 'dip' && o.target === t && (!act || o.act === act)); }

function renderPanel() {
  const el = $('panel');
  const p = selected;
  if (p < 0 || !S) { el.classList.add('hidden'); return; }
  const sp = S.prov[p], o = sp.o, pl = S.player, vis = visible(p);
  const rel = relationOf(pl, o);
  const relTag = o === pl ? '' : `<span class="tag ${rel === 'war' ? 'war' : rel === 'ally' ? 'ally' : rel === 'pact' ? 'pact' : (rel === 'vassal' || rel === 'overlord') ? 'vassal' : ''}">${REL_KO[rel]}${rel === 'pact' ? ' ' + pactLeft(pl, o) + '턴' : ''}</span>`;
  const capOf = capitalOwnerOf(p);
  const bld = [2, 4].filter(b => sp.b & b).map(b => BUILD[b].icon + ' ' + BUILD[b].name).join(' · ') || '없음';
  let html = `<button class="close" id="pClose">✕</button>
    <h3>${capOf >= 0 ? '<span title="수도">★</span>' : ''}${esc(P[p].name)}</h3>
    <div class="sub">${civBadge(o)} ${relTag}${capOf >= 0 ? `<span class="tag">${esc(C[capOf].name)} 수도</span>` : ''}</div>
    <div class="grid2">
      <div class="kv"><span>병력</span><b>${vis ? fmtN(sp.a) : '?'}</b></div>
      <div class="kv"><span>인구</span><b>${fmt(sp.pop)}</b></div>
      <div class="kv"><span>지형</span><b>${TER_KO[P[p].ter]}</b></div>
      <div class="kv"><span>건물</span><b style="font-size:13px">${bld}</b></div>
    </div>`;
  if (o === pl) {
    const av = availableArmy(p), mp = mpLeft();
    html += `<div class="actions">
      <button class="act primary" id="aMove" ${av <= 0 || mp < 1 ? 'disabled' : ''}>➜ 이동/공격 <small>${fmt(av)}</small></button>
      <button class="act" id="aRecruit" ${mp < 1 ? 'disabled' : ''}>＋ 모집 <small>MP1</small></button>
      <button class="act" id="aDisband" ${av <= 0 || mp < 1 ? 'disabled' : ''}>－ 해산 <small>MP1</small></button>
      <button class="act" id="aBuild" ${mp < 2 ? 'disabled' : ''}>🏗 건설 <small>MP2</small></button>
    </div>`;
    if (reserved(p) > 0) html += `<div class="hint">이번 턴 명령에 ${fmtN(reserved(p))}명이 배정됨</div>`;
  } else {
    const warNow = o === -1 || atWar(pl, o) || pendingWarTargets().includes(o);
    const block = o >= 0 && !warNow ? warBlock(pl, o) : '';
    const srcs = block ? [] : attackSources(p, o >= 0 ? [o] : []);
    html += `<div class="actions">
      <button class="act danger" id="aAtk" ${srcs.length ? '' : 'disabled'}>⚔ ${warNow ? '공격' : '선전포고 후 공격'}</button>
      ${o >= 0 ? `<button class="act" id="aDip">🏛 외교</button>` : ''}
    </div>`;
    if (block) html += `<div class="hint">${esc(block)}</div>`;
    else if (!srcs.length) html += `<div class="hint">이 지역과 붙어 있는 내 병력이 없다. 바다 건너 공격하려면 해안 지역에 항구가 필요하다.</div>`;
    else if (o === -1) html += `<div class="hint">중립 지역은 선전포고 없이 바로 공격할 수 있다.</div>`;
  }
  el.innerHTML = html; el.classList.remove('hidden');
  $('pClose').onclick = () => select(-1);
  if ($('aMove')) $('aMove').onclick = () => startMove(p);
  if ($('aRecruit')) $('aRecruit').onclick = () => askRecruit(p);
  if ($('aDisband')) $('aDisband').onclick = () => askDisband(p);
  if ($('aBuild')) $('aBuild').onclick = () => askBuild(p);
  if ($('aDip')) $('aDip').onclick = () => openDiplomacy(o);
  if ($('aAtk')) $('aAtk').onclick = () => {
    const warNow = o === -1 || atWar(pl, o) || pendingWarTargets().includes(o);
    const srcs = attackSources(p, o >= 0 ? [o] : []);
    if (!srcs.length) return;
    if (warNow) askMove(srcs[0].p, p, srcs[0].k, srcs); else askWarThenAttack(srcs[0].p, p, srcs[0].k, o);
  };
}

// 선전포고가 가능한 상대인가 (안 되면 이유 문자열)
function warBlock(a, b) {
  if (b < 0 || a === b || atWar(a, b)) return '';
  if (allied(a, b)) return `${C[b].name}과(와)는 동맹이라 공격할 수 없다. 외교에서 동맹을 먼저 파기하자.`;
  if (pactLeft(a, b)) return `${C[b].name}과(와)는 불가침 조약 중이다. (${pactLeft(a, b)}턴 남음)`;
  if (civ(b).vassalOf === a || civ(a).vassalOf === b) return '종속 관계인 나라는 공격할 수 없다.';
  return '';
}
let needWar = new Map();
function startMove(p) {
  const pl = S.player, ew = pendingWarTargets();
  targets = new Map(); needWar = new Map();
  for (const t of [...P[p].adj, ...((S.prov[p].b & 4) ? P[p].sea : [])]) {
    const k = moveKind(pl, p, t, ew);
    if (k) { targets.set(t, k); continue; }
    const o = S.prov[t].o;
    if (o >= 0 && o !== pl && !warBlock(pl, o)) { const k2 = moveKind(pl, p, t, [...ew, o]); if (k2) { targets.set(t, k2); needWar.set(t, o); } }
  }
  if (!targets.size) { toast('갈 수 있는 곳이 없다.'); targets = new Map(); return; }
  uiMode = { type: 'move', from: p };
  $('modeHintText').textContent = `${P[p].name}: 목적지를 고르세요 (노랑=이동, 빨강=공격)`;
  $('modeHint').classList.remove('hidden');
  $('panel').classList.add('hidden');
  rebuildHighlight(); dirty = true;
}
$('modeCancel').onclick = () => { cancelMode(); renderPanel(); };

// ----- 모달 -----
function openModal(html) { $('modalBox').innerHTML = josa(html); $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
$('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal' && !$('modal').dataset.lock) closeModal(); });

function amountModal({ title, sub, max, init, step, info, ok, extra, bind }, cb) {
  step = step || 100;
  openModal(`<h2>${title}</h2><p>${sub || ''}</p>${extra || ''}
    <div class="slider"><input type="range" id="amR" min="0" max="${max}" step="${step}" value="${init}"><input type="number" id="amN" min="0" max="${max}" step="${step}" value="${init}"></div>
    <div class="quick"><button data-f=".25">25%</button><button data-f=".5">50%</button><button data-f=".75">75%</button><button data-f="1">전부</button></div>
    <div id="amInfo" class="hint"></div>
    <div class="btns"><button id="amCancel">취소</button><button class="ok" id="amOk">${ok}</button></div>`);
  const r = $('amR'), n = $('amN');
  const upd = v => { v = Math.max(0, Math.min(max, Math.round(+v || 0))); r.value = v; n.value = v; $('amInfo').innerHTML = info ? info(v) : ''; $('amOk').disabled = v <= 0; };
  r.oninput = () => upd(r.value); n.oninput = () => upd(n.value);
  n.onkeydown = e => { if (e.key === 'Enter') $('amOk').click(); };
  document.querySelectorAll('.quick button').forEach(b => b.onclick = () => upd(Math.floor(max * +b.dataset.f / step) * step || max));
  $('amCancel').onclick = closeModal;
  if (bind) bind();
  setTimeout(() => { try { n.focus(); n.select(); } catch (e) {} }, 30);
  $('amOk').onclick = () => { const v = +n.value; closeModal(); if (v > 0) cb(v); };
  upd(init);
}
function addOrder(o) { S.orders.push(o); afterChange(); }
function afterChange() { renderTop(); renderPanel(); renderDrawer(); dirty = true; save(); }

function askWarThenAttack(from, to, kind, foe) {
  const need = COST.dip + COST[kind];
  if (mpLeft() < need) { toast(`MP가 부족하다 (선전포고 ${COST.dip} + 공격 ${COST[kind]})`); return; }
  openModal(`<h2>⚔ 선전포고</h2><div class="sub" style="margin-bottom:6px">${civBadge(foe)}</div>
    <p>${esc(C[foe].name)}과(와)는 아직 전쟁 중이 아니다. 선전포고하고 ${esc(P[to].name)}을(를) 공격할까?<br>상대의 동맹국도 함께 참전할 수 있다. (MP ${need})</p>
    <div class="btns"><button id="wNo">취소</button><button class="ok" id="wYes">선전포고 후 공격</button></div>`);
  $('wNo').onclick = closeModal;
  $('wYes').onclick = () => { closeModal(); addOrder({ civ: S.player, type: 'dip', act: 'war', target: foe, gold: 0, mp: COST.dip }); const srcs = attackSources(to); askMove(from, to, kind, srcs.length ? srcs : null); };
}
function askMove(from, to, kind, alts) {
  const av = availableArmy(from), cost = COST[kind];
  if (mpLeft() < cost) { toast(`MP가 부족하다 (필요 ${cost})`); return; }
  const tgt = S.prov[to], vis = visible(to);
  const isAtk = kind === 'attack' || kind === 'navalAttack';
  amountModal({
    title: `${KIND_KO[kind]}: ${esc(P[from].name)} → ${esc(P[to].name)}`,
    sub: isAtk ? `상대 ${civBadge(tgt.o)} · 수비 병력 <b>${vis ? fmtN(tgt.a) : '?'}</b><br>공격 병력이 수비보다 많으면 바로 점령하고, 차이만큼 남는다.` : `보낼 병력 수를 정하세요. (MP ${cost})`,
    max: av, init: av, step: 1,
    info: v => isAtk && vis ? (v > tgt.a ? `<b class="pos">점령!</b> ${fmtN(v)} − ${fmtN(tgt.a)} = <b>${fmtN(v - tgt.a)}</b> 남음 · MP ${cost}` : `<b class="neg">실패</b> 수비 ${fmtN(tgt.a - v)} 남음 · ${fmtN(tgt.a + 1)} 이상 보내야 점령 · MP ${cost}`) : `MP ${cost} 사용`,
    ok: isAtk ? '공격 명령' : '이동 명령',
    extra: alts && alts.length > 1 ? `<div class="lbl" style="margin-top:4px">출발 지역</div><div class="srcs">${alts.map((a, i) => `<button class="chip ${a.p === from ? 'on' : ''}" data-src="${i}">${esc(P[a.p].name)} · ${fmt(availableArmy(a.p))}${a.k === 'navalAttack' ? ' ⚓' : ''}</button>`).join('')}</div>` : '',
    bind: () => document.querySelectorAll('[data-src]').forEach(b => b.onclick = () => { const a = alts[+b.dataset.src]; askMove(a.p, to, a.k, alts); }),
  }, v => addOrder({ civ: S.player, type: 'move', from, to, amt: v, mp: cost, kind }));
}
function askRecruit(p) {
  const X = civ(S.player), max = maxRecruit(p, X.gold);
  if (max <= 0) { toast(X.gold < 4 ? '돈이 부족하다' : '이 지역에서 더 모집할 인구가 없다'); return; }
  amountModal({ title: `병력 모집 · ${esc(P[p].name)}`, sub: `인구 ${fmtN(S.prov[p].pop)}명 중 이번 턴 최대 ${fmtN(max)}명 모집 가능. 병사 1000명당 ${RECRUIT_COST * 1000}금, 유지비 1000명당 턴당 1금. 다음 턴에 합류한다.`,
    max, init: Math.floor(max / 2 / 100) * 100 || max, info: v => `비용 <b>${fmtN(Math.ceil(v * RECRUIT_COST))}금</b> · 인구 -${fmtN(v)} · MP 1`, ok: '모집' },
    v => { const g = Math.ceil(v * RECRUIT_COST); X.gold -= g; addOrder({ civ: S.player, type: 'recruit', p, amt: v, gold: g, mp: COST.recruit }); });
}
function askDisband(p) {
  const av = availableArmy(p);
  amountModal({ title: `병력 해산 · ${esc(P[p].name)}`, sub: '해산한 병력의 절반은 인구로 돌아가고 유지비가 줄어든다.', max: av, init: Math.floor(av / 4 / 100) * 100 || av, step: 1,
    info: v => `유지비 턴당 -${fmt(v * UPKEEP)}금 · MP 1`, ok: '해산' },
    v => addOrder({ civ: S.player, type: 'disband', p, amt: v, mp: COST.disband }));
}
function askBuild(p) {
  const X = civ(S.player), sp = S.prov[p];
  const rows = [2, 4].map(b => {
    const B = BUILD[b], has = sp.b & b, pend = pendingBuild(p, b), noCoast = b === 4 && !P[p].coastal;
    const dis = has || pend || noCoast || X.gold < B.cost || mpLeft() < COST.build;
    return `<button data-b="${b}" ${dis ? 'disabled' : ''}><b>${B.icon} ${B.name}</b><span>${has ? '이미 있음' : pend ? '건설 예약됨' : noCoast ? '해안 지역만 가능' : `${B.cost}금 · ${B.desc}`}</span></button>`;
  }).join('');
  openModal(`<h2>🏗 건설 · ${esc(P[p].name)}</h2><p>국고 ${fmtN(X.gold)}금 · MP ${COST.build}</p><div class="diplist">${rows}</div><div class="btns"><button id="bClose">닫기</button></div>`);
  $('bClose').onclick = closeModal;
  document.querySelectorAll('.diplist button[data-b]').forEach(btn => btn.onclick = () => {
    const b = +btn.dataset.b; X.gold -= BUILD[b].cost; closeModal();
    addOrder({ civ: S.player, type: 'build', p, bld: b, gold: BUILD[b].cost, mp: COST.build });
  });
}

function openDiplomacy(t) {
  const pl = S.player, X = civ(pl), T = civ(t);
  if (!T.alive) return;
  const st = statsOf(t), rel = relationOf(pl, t);
  const mp = mpLeft();
  const ew = pendingDip(t, 'war');
  const opts = [
    ['war', '⚔ 선전포고', '전쟁 상태로 돌입한다. 상대의 동맹국도 참전한다.', COST.dip, rel === 'war' || ew ? '이미 전쟁 중/예약됨' : allied(pl, t) ? '동맹을 먼저 파기해야 함' : pactLeft(pl, t) ? `불가침 조약 ${pactLeft(pl, t)}턴 남음` : (rel === 'vassal' || rel === 'overlord') ? '종속 관계' : ''],
    ['peace', '🕊 평화 제안', '전쟁을 끝내자고 제안한다. 상대가 거절할 수 있다.', COST.dip, rel !== 'war' ? '전쟁 중이 아님' : ''],
    ['pact', '🤝 불가침 조약', `${PACT_TURNS}턴 동안 서로 공격할 수 없다.`, COST.dip, rel === 'war' ? '전쟁 중' : rel === 'pact' ? '이미 조약 중' : (rel === 'vassal' || rel === 'overlord') ? '종속 관계' : ''],
    ['ally', '🛡 동맹 제안', '공격받으면 서로 돕는다.', COST.dip, rel === 'war' ? '전쟁 중' : rel === 'ally' ? '이미 동맹' : (rel === 'vassal' || rel === 'overlord') ? '종속 관계' : ''],
    ['kick', '✂ 동맹 파기', '동맹 관계를 끊는다.', COST.dip, rel !== 'ally' ? '동맹이 아님' : ''],
    ['support', '💰 자금 지원', '상대에게 금을 보낸다.', COST.dip, X.gold < 50 ? '돈이 부족함' : ''],
    ['vassal', '👑 종속 요구', '전쟁 중인 약한 나라를 종속국으로 만든다.', COST.dipBig, rel !== 'war' ? '전쟁 중일 때만' : ''],
    ['annex', '🗺 합병', `종속국을 흡수한다. (5턴 이상 종속, 비용 ${annexCost(t)}금)`, COST.dipBig, rel !== 'vassal' ? '종속국이 아님' : S.turn - T.vassalSince < 5 ? `${5 - (S.turn - T.vassalSince)}턴 후 가능` : X.gold < annexCost(t) ? '돈이 부족함' : ''],
  ];
  const rows = opts.map(([act, title, desc, cost, block]) => {
    const pend = pendingDip(t, act) && act !== 'support';
    const dis = !!block || pend || mp < cost;
    return `<button data-act="${act}" class="${act === 'war' ? 'war' : ''}" ${dis ? 'disabled' : ''}><b>${title} <small style="opacity:.6">MP${cost}</small></b><span>${pend ? '이번 턴 예약됨' : block || desc}</span></button>`;
  }).join('');
  const ally = T.ally.map(nm).join(', ') || '없음', wars = T.war.map(nm).join(', ') || '없음';
  openModal(`<h2>${civBadge(t)}</h2>
    <div class="sub" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="tag ${rel === 'war' ? 'war' : rel === 'ally' ? 'ally' : rel === 'pact' ? 'pact' : (rel === 'vassal' || rel === 'overlord') ? 'vassal' : ''}">${REL_KO[rel]}</span>${T.vassalOf >= 0 ? `<span class="tag vassal">${esc(nm(T.vassalOf))}의 종속국</span>` : ''}</div>
    <div class="grid2">
      <div class="kv"><span>지역</span><b>${st.provs}</b></div><div class="kv"><span>인구</span><b>${fmt(st.pop)}</b></div>
      <div class="kv"><span>총 병력</span><b>${S.fog === 2 ? '?' : fmt(st.army)}</b></div><div class="kv"><span>수도</span><b style="font-size:13px">${esc(P[T.cap].name)}</b></div>
    </div>
    <p style="margin:4px 0">동맹: ${esc(ally)}<br>전쟁: ${esc(wars)}</p>
    <div class="diplist">${rows}</div>
    <div class="btns"><button id="dClose">닫기</button></div>`);
  $('dClose').onclick = closeModal;
  document.querySelectorAll('.diplist button[data-act]').forEach(btn => btn.onclick = () => {
    const act = btn.dataset.act, cost = act === 'vassal' || act === 'annex' ? COST.dipBig : COST.dip;
    if (act === 'support') {
      closeModal();
      amountModal({ title: `💰 ${esc(C[t].name)}에 자금 지원`, sub: `국고 ${fmtN(X.gold)}금`, max: Math.floor(X.gold), init: Math.floor(X.gold / 4), step: 10, info: () => 'MP 1', ok: '지원' },
        v => { X.gold -= v; addOrder({ civ: pl, type: 'dip', act, target: t, gold: v, mp: cost }); });
      return;
    }
    let gold = 0;
    if (act === 'annex') { gold = annexCost(t); X.gold -= gold; }
    addOrder({ civ: pl, type: 'dip', act, target: t, gold, mp: cost });
    if (act === 'war') { closeModal(); toast(`⚔ ${C[t].name}에 선전포고! 공격할 지역을 누르면 병력을 보낼 수 있다.`); return; }
    openDiplomacy(t);
  });
}
function annexCost(t) { return Math.round(statsOf(t).pop / 1e6 * 15 + 200); }

function orderText(o) {
  if (o.type === 'move') { const k = o.kind || 'move'; return `${k === 'attack' || k === 'navalAttack' ? '⚔' : k === 'naval' ? '⛵' : '➜'} ${esc(P[o.from].name)} → ${esc(P[o.to].name)} · ${fmt(o.amt)} <span class="meta">${KIND_KO[k]}</span>`; }
  if (o.type === 'recruit') return `＋ ${esc(P[o.p].name)} 모집 ${fmt(o.amt)} <span class="meta">${fmtN(o.gold)}금</span>`;
  if (o.type === 'disband') return `－ ${esc(P[o.p].name)} 해산 ${fmt(o.amt)}`;
  if (o.type === 'build') return `${BUILD[o.bld].icon} ${esc(P[o.p].name)} ${BUILD[o.bld].name} 건설`;
  if (o.type === 'dip') return `🏛 ${esc(C[o.target].name)}: ${{ war: '선전포고', peace: '평화 제안', pact: '불가침 조약', ally: '동맹 제안', kick: '동맹 파기', support: `자금 지원 ${fmtN(o.gold)}금`, vassal: '종속 요구', annex: '합병' }[o.act]}`;
  return '';
}
function cancelOrder(i) {
  const o = S.orders[i]; if (!o) return;
  if (o.gold) civ(S.player).gold += o.gold;
  S.orders.splice(i, 1); afterChange();
}

// ----- 상단 바 -----
function renderTop() {
  const pl = S.player, X = civ(pl), st = statsOf(pl);
  $('top').innerHTML = `<span class="civchip">${civBadge(pl)}</span>
    <span class="stat">💰 ${fmtN(X.gold)} <small class="${st.net >= 0 ? 'pos' : 'neg'}">${st.net >= 0 ? '+' : ''}${fmtN(st.net)}</small></span>
    <span class="stat">👥 ${fmt(st.pop)}</span>
    <span class="stat">⚔ ${fmt(st.army)}</span>
    <span class="stat">🗺 ${st.provs}</span>
    <span class="stat"><small>턴</small> ${S.turn}</span>
    ${X.capLost ? `<span class="stat neg">⚠ 수도 상실 ${X.capLost}/${CAP_LOST_LIMIT}</span>` : ''}
    ${X.war.length ? `<span class="stat neg">⚔ 전쟁 ${X.war.length}</span>` : ''}`;
  const left = mpLeft(), mx = X.mp;
  $('mpBox').innerHTML = `MP ${left}<small>/${mx}</small>`;
  const n = S.orders.length; $('ordBadge').textContent = n; $('ordBadge').classList.toggle('hidden', !n);
  const unseen = S.log.length - S.seenLog; $('newsBadge').textContent = unseen > 99 ? '99+' : unseen; $('newsBadge').classList.toggle('hidden', unseen <= 0 || drawerTab === 'news' && !$('drawer').classList.contains('hidden'));
}
// ----- 서랍 -----
let drawerTab = 'orders';
function openDrawer(tab) {
  const d = $('drawer');
  if (!d.classList.contains('hidden') && drawerTab === tab) { d.classList.add('hidden'); return; }
  drawerTab = tab; d.classList.remove('hidden'); renderDrawer();
}
function renderDrawer() {
  const d = $('drawer'); if (d.classList.contains('hidden') || !S) return;
  document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === drawerTab));
  const body = $('drawerBody');
  if (drawerTab === 'orders') {
    body.innerHTML = S.orders.length ? S.orders.map((o, i) => `<div class="row"><div class="grow"><div>${orderText(o)}</div></div><span class="meta">MP${o.mp}</span><button class="act" data-cancel="${i}" style="flex:none;padding:5px 9px">✕</button></div>`).join('')
      + `<div class="hint" style="padding:8px">남은 MP ${mpLeft()} / ${civ(S.player).mp}. 명령은 [턴 종료]를 눌러야 실행된다.</div>`
      : `<div class="empty">이번 턴 명령이 없다.<br>내 지역을 눌러 이동·모집·건설을 하거나<br>다른 나라를 눌러 외교를 해보자.</div>`;
    body.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelOrder(+b.dataset.cancel));
  } else if (drawerTab === 'news') {
    S.seenLog = S.log.length;
    const items = S.log.slice().reverse().slice(0, 200);
    body.innerHTML = items.length ? items.map(l => `<div class="log ${l.k} ${l.p >= 0 ? 'click' : ''}" data-p="${l.p}"><span class="t">T${l.t}</span>${esc(l.m)}</div>`).join('') : '<div class="empty">아직 소식이 없다.</div>';
    body.querySelectorAll('.log.click').forEach(el => el.onclick = () => { const p = +el.dataset.p; centerOn(p, Math.max(cam.z, 2.5)); select(p); });
    renderTop();
  } else {
    const rows = S.civ.map((x, i) => ({ i, x })).filter(r => r.x.alive).map(r => ({ ...r, st: statsOf(r.i) })).sort((a, b) => b.st.provs - a.st.provs || b.st.pop - a.st.pop);
    body.innerHTML = `<div class="hint" style="padding:4px 8px 8px">살아남은 나라 ${rows.length} / ${NC}</div>` + rows.map((r, k) => {
      const rel = relationOf(S.player, r.i);
      return `<div class="row" style="cursor:pointer" data-civ="${r.i}"><span class="meta" style="width:20px">${k + 1}</span>${civBadge(r.i).replace(esc(C[r.i].name), '')}<div class="grow"><div>${esc(C[r.i].name)} ${r.i === S.player ? '<span class="tag">나</span>' : rel !== 'peace' ? `<span class="tag ${rel === 'war' ? 'war' : rel === 'ally' ? 'ally' : rel === 'pact' ? 'pact' : 'vassal'}">${REL_KO[rel]}</span>` : ''}</div><div class="meta">지역 ${r.st.provs} · 인구 ${fmt(r.st.pop)} · 병력 ${S.fog === 2 && r.i !== S.player ? '?' : fmt(r.st.army)}</div></div></div>`;
    }).join('');
    body.querySelectorAll('[data-civ]').forEach(el => el.onclick = () => { const c = +el.dataset.civ; centerOn(civ(c).cap, Math.max(cam.z, 2)); if (c !== S.player) openDiplomacy(c); else select(civ(c).cap); });
  }
}
document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.onclick = () => { drawerTab = b.dataset.tab; renderDrawer(); });
document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDrawer(b.dataset.open));
$('drawerClose').onclick = () => $('drawer').classList.add('hidden');

// ----- 지도 모드 -----
function renderModes() {
  $('modes').innerHTML = MODES.map(([k, l]) => `<button class="chip ${k === mapMode ? 'on' : ''}" data-mode="${k}">${l}</button>`).join('');
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mapMode = b.dataset.mode; renderModes(); rebuildBase(); dirty = true; });
}

// ----- 턴 종료 -----
$('endBtn').onclick = () => {
  if (!S || S.over) return;
  cancelMode();
  const before = provsOf(S.player).length;
  $('endBtn').disabled = true;
  setTimeout(() => {
    endTurn();
    $('endBtn').disabled = false;
    rebuildBase(); select(selected); renderTop(); renderDrawer(); dirty = true;
    if (!S.over) {
      const after = provsOf(S.player).length;
      toast(`턴 ${S.turn} 시작 · 영토 ${before}→${after}${S.battles.length ? ` · 전투 ${S.battles.filter(b => b.att === S.player || b.def === S.player).length}건` : ''}`);
      showProposals();
    }
  }, 30);
};
function showProposals() {
  const pr = S.props.shift();
  if (!pr) { save(); return; }
  const c = pr.from;
  if (!civ(c).alive) return showProposals();
  const txt = { peace: ['🕊 평화 제안', `${C[c].name}이(가) 전쟁을 끝내자고 제안했다.`], ally: ['🛡 동맹 제안', `${C[c].name}이(가) 동맹을 제안했다.`], pact: ['🤝 불가침 조약 제안', `${C[c].name}이(가) ${PACT_TURNS}턴 불가침 조약을 제안했다.`], vassal: ['👑 종속 요구', `${C[c].name}이(가) 우리에게 종속국이 되라고 요구한다. 받아들이면 전쟁은 끝나지만 수입의 25%를 바쳐야 하고 독자적인 외교를 못 한다.`] }[pr.type];
  const valid = pr.type === 'peace' || pr.type === 'vassal' ? atWar(c, S.player) : !atWar(c, S.player);
  if (!valid) return showProposals();
  $('modal').dataset.lock = '1';
  openModal(`<h2>${txt[0]}</h2><div class="sub" style="margin-bottom:6px">${civBadge(c)}</div><p>${txt[1]}</p><div class="btns"><button id="pNo">거절</button><button class="ok" id="pYes">수락</button></div>`);
  $('pNo').onclick = () => { delete $('modal').dataset.lock; closeModal(); addLog('dip', `${C[c].name}의 제안을 거절했다.`); showProposals(); };
  $('pYes').onclick = () => {
    delete $('modal').dataset.lock; closeModal();
    if (pr.type === 'peace') makePeace(c, S.player);
    else if (pr.type === 'ally') makeAlliance(c, S.player);
    else if (pr.type === 'pact') makePact(c, S.player);
    else if (pr.type === 'vassal') makeVassal(c, S.player);
    updateExplored(); rebuildBase(); renderTop(); renderPanel(); renderDrawer(); dirty = true;
    showProposals();
  };
}
function gameOverModal(win) {
  $('modal').dataset.lock = '1';
  openModal(win
    ? `<h2>🏆 세계 정복!</h2><p>${S.turn}턴 만에 모든 나라를 무너뜨리거나 종속시켰다. 세계가 ${C[S.player].name}의 색으로 칠해졌다.</p><div class="btns"><button id="goNew">새 게임</button><button class="ok" id="goCont">계속 보기</button></div>`
    : `<h2>☠ 멸망</h2><p>${C[S.player].name}은(는) ${S.turn}턴에 역사 속으로 사라졌다.</p><div class="btns"><button class="ok" id="goNew">새 게임</button></div>`);
  $('goNew').onclick = () => { delete $('modal').dataset.lock; closeModal(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} showStart(); };
  if ($('goCont')) $('goCont').onclick = () => { delete $('modal').dataset.lock; closeModal(); };
}

// ----- 메뉴 -----
$('menuBtn').onclick = () => {
  openModal(`<h2>☰ 메뉴</h2><div class="diplist" style="grid-template-columns:1fr">
    <button id="mRules"><b>📖 게임 규칙</b><span>이 게임의 모든 규칙</span></button>
    <button id="mHome"><b>🎯 내 수도로 이동</b><span>${esc(P[civ(S.player).cap].name)}</span></button>
    <button id="mNew"><b>🆕 새 게임</b><span>현재 게임은 사라진다</span></button>
  </div><div class="btns"><button id="mClose">닫기</button></div>`);
  $('mClose').onclick = closeModal;
  $('mRules').onclick = rulesModal;
  $('mHome').onclick = () => { closeModal(); centerOn(civ(S.player).cap, Math.max(cam.z, 2.5)); };
  $('mNew').onclick = () => { if (confirm('정말 새 게임을 시작할까? 현재 게임은 삭제된다.')) { closeModal(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} showStart(); } };
};
function rulesModal() {
  openModal(`<h2>📖 규칙</h2><div class="rules">
    <h4>기본</h4><ul><li>세계는 150개 지역(province)으로 나뉜다. 지도 위 숫자가 곧 군대다.</li><li>명령을 예약하고 [턴 종료]를 누르면 모든 나라가 한꺼번에 움직인다.</li><li>매 턴 MP(행동 포인트) 안에서만 명령할 수 있다. 영토가 넓을수록 MP가 많다.</li></ul>
    <h4>명령</h4><ul><li>이동 MP1 / 공격 MP2 / 해상 이동 MP2 / 상륙 공격 MP3</li><li>모집 MP1: 인구를 병력으로 바꾼다. 1000명당 40금. 다음 턴에 합류.</li><li>해산 MP1 / 건설 MP2 / 외교 MP1~2</li></ul>
    <h4>전투</h4><ul><li>숫자 비교 하나뿐: 공격 병력이 수비 병력보다 많으면 바로 점령하고, 차이만큼 남는다. (60k로 50k 공격 → 점령, 10k 남음)</li><li>같거나 적으면 실패하고 수비가 차이만큼 남는다.</li><li>중립 지역은 선전포고 없이 공격할 수 있다.</li></ul>
    <h4>수도</h4><ul><li>수도를 빼앗기고 ${CAP_LOST_LIMIT}턴 안에 되찾지 못하면 그 나라는 멸망하고, 남은 영토는 전부 수도를 가진 나라에 넘어간다.</li></ul>
    <h4>건물</h4><ul><li>👁 감시탑: 주변 2칸의 병력이 보인다</li><li>⚓ 항구: 바다 건너 가까운 해안 지역으로 이동·상륙할 수 있다</li></ul>
    <h4>경제</h4><ul><li>수입 = 인구 × 경제력. 병력 1000명당 매 턴 1금 유지비.</li><li>국고가 바닥나면 병력 10%가 탈영한다.</li></ul>
    <h4>외교</h4><ul><li>선전포고 · 평화 · 불가침(${PACT_TURNS}턴) · 동맹 · 동맹 파기 · 자금 지원 · 종속 요구 · 합병</li><li>공격받은 나라의 동맹국과 종속국은 자동으로 참전한다.</li><li>종속국은 수입의 25%를 종주국에 바치고, 5턴 뒤 합병할 수 있다.</li></ul>
    <h4>승리</h4><ul><li>다른 모든 나라를 멸망시키거나 종속국으로 만들면 승리.</li></ul>
  </div><div class="btns"><button class="ok" id="rClose">닫기</button></div>`);
  $('rClose').onclick = closeModal;
}

// ============================================================
//  시작 화면
// ============================================================
let startFog = 1, startAggr = 1;
function civRow(c) {
  const n = P.filter(p => p.owner0 === c).length, pop = P.reduce((s, p) => s + (p.owner0 === c ? p.pop0 : 0), 0);
  return `<div class="row ${c === startPick ? 'on' : ''}" data-c="${c}"><span class="sw" style="background:${C[c].color}"></span><span class="flag">${flagOf(C[c].tag)}</span><div class="grow"><div><b>${esc(C[c].name)}</b></div><div class="meta">지역 ${n} · 인구 ${fmt(pop)}</div></div></div>`;
}
function renderCivList() {
  const q = $('search').value.trim();
  const list = C.map(c => c.id).filter(i => !q || C[i].name.includes(q)).sort((a, b) => C[a].name.localeCompare(C[b].name, 'ko'));
  $('civList').innerHTML = list.map(civRow).join('') || '<div class="empty">검색 결과 없음</div>';
  $('civList').querySelectorAll('[data-c]').forEach(el => el.onclick = () => pickStart(+el.dataset.c, true));
}
function pickStart(c, fly) {
  startPick = c;
  $('pick').innerHTML = civBadge(c);
  $('startBtn').disabled = false;
  renderCivList();
  const el = $('civList').querySelector('.row.on'); if (el && !fly) el.scrollIntoView({ block: 'nearest' });
  rebuildHighlight();
  if (fly) centerOn(C[c].cap0, Math.max(cam.z, 1.6));
  dirty = true;
}
function bindSeg(id, set) { $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); set(+b.dataset.v); }); }
bindSeg('fogSeg', v => startFog = v);
bindSeg('aggrSeg', v => startAggr = v);
$('search').oninput = renderCivList;
function showStart() {
  S = null; selected = -1; targets = new Map(); uiMode = null; mapMode = 'political';
  ['top', 'bar', 'panel', 'drawer', 'modeHint'].forEach(id => $(id).classList.add('hidden'));
  $('start').classList.remove('hidden');
  $('contBtn').classList.toggle('hidden', !loadSave());
  renderCivList(); rebuildBase(); rebuildHighlight();
  cam.z = minZoom(); cam.x = WW * 0.02; clampCam(); dirty = true;
}
function enterGame() {
  $('start').classList.add('hidden');
  ['top', 'bar'].forEach(id => $(id).classList.remove('hidden'));
  startPick = -1; selected = -1; mapMode = 'political';
  renderModes(); rebuildBase(); rebuildHighlight(); renderTop();
  centerOn(civ(S.player).cap, 2.2);
  showProposals();
}
$('startBtn').onclick = () => { if (startPick < 0) return; newGame(startPick, startFog, startAggr); save(); enterGame(); setTimeout(rulesModal, 300); };
$('contBtn').onclick = () => { const s = loadSave(); if (!s) return; S = s; updateExplored(); enterGame(); };

window.addEventListener('resize', resize);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('modal').classList.contains('hidden') && !$('modal').dataset.lock) closeModal(); else if (uiMode) { cancelMode(); renderPanel(); } else select(-1); }
  if (e.key === 'Enter' && S && $('modal').classList.contains('hidden') && document.activeElement.tagName !== 'INPUT') $('endBtn').click();
});
resize();
showStart();
loop();

// 디버그/테스트용
window.__aoc = { get S() { return S; }, P, C, endTurn, aiTurn, newGame: (c, f, a) => { newGame(c, f, a); enterGame(); }, statsOf, moveKind };
})();
</script>
</body>
