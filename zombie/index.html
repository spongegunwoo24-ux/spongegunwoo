<title>3분 생존</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>

:root{
  color-scheme:dark;
  --bg:#0c0f12; --panel:#151a1fee; --line:#2b343c; --fg:#e9e6dc; --dim:#98a1a6;
  --warn:#f2b632; --blood:#d2402f; --safe:#6fbf73;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(#0c0f12cc,#0c0f12ee)}
.box{width:min(720px,100%);margin:auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,13vw,104px);line-height:.95;margin:0;letter-spacing:-.01em;color:var(--warn)}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:600;color:var(--fg);letter-spacing:0;margin-top:10px;line-height:1.5}
h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,72px);margin:0;line-height:1}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.diffs{grid-template-columns:repeat(2,1fr)}}
button{font-family:var(--body);color:var(--fg);cursor:pointer}
button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.diff:hover{border-color:var(--warn)}
.diff b{font-family:var(--display);font-weight:400;font-size:26px}
.diff span{font-size:12px;color:var(--dim);line-height:1.45}
.diff i{font-style:normal;font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums}
.diff[data-d=hell] b{color:var(--blood)}
.help{font-size:13px;color:var(--dim);line-height:1.7;border-top:1px solid var(--line);padding-top:12px}
.help b{color:var(--fg);font-weight:600}
#roulName{font-family:var(--display);font-size:clamp(40px,11vw,80px);color:var(--warn);text-align:center;min-height:1.2em}
#roul p{text-align:center;color:var(--dim);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.stats span{display:block;font-size:12px;color:var(--dim)}
.stats b{font-size:22px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--warn);color:#17130a;border:0;border-radius:4px;padding:12px 20px;font-weight:700;font-size:15px}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
#touch button{position:absolute;right:max(16px,env(safe-area-inset-right,0px));width:64px;height:48px;border-radius:6px;background:#151a1fbb;border:1px solid var(--line);font-size:13px;font-weight:700}
#bDash{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#bThrow{bottom:calc(206px + env(safe-area-inset-bottom,0px))}
#bSwap{bottom:calc(262px + env(safe-area-inset-bottom,0px))}
#bReload{bottom:calc(318px + env(safe-area-inset-bottom,0px))}
#bPick{bottom:calc(374px + env(safe-area-inset-bottom,0px));border-color:var(--warn)!important;color:var(--warn)}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="menu" class="screen">
    <div class="box">
      <h1>3분 생존<small>시작 아이템은 운. 3분 동안 버티면서 가장 높은 점수를 내면 이긴다.</small></h1>
      <div class="diffs">
        <button class="diff" data-d="easy" id="dEasy"><b>쉬움</b><span>대낮. 좀비가 느리고 물자가 많다.</span><i id="bestEasy"></i></button>
        <button class="diff" data-d="normal" id="dNormal"><b>중간</b><span>해 질 녘. 시야가 조금 좁다. 점수 1.5배.</span><i id="bestNormal"></i></button>
        <button class="diff" data-d="hard" id="dHard"><b>어려움</b><span>한밤중. 손전등을 찾아야 앞이 보인다. 점수 2.5배.</span><i id="bestHard"></i></button>
        <button class="diff" data-d="hell" id="dHell"><b>헬</b><span>칠흑. 달리는 좀비가 나보다 빠르다. 지도 없음. 점수 5배.</span><i id="bestHell"></i></button>
      </div>
      <div class="help">
        <b>이동</b> WASD · <b>조준/공격</b> 마우스 · <b>구르기</b> Space · <b>무기 전환</b> Q 또는 1~4 · <b>투척</b> G 또는 우클릭 · <b>투척물 바꾸기</b> F · <b>장전</b> R · <b>무기·장비 줍기/교체</b> E · <b>일시정지</b> P<br>
        모바일은 화면 왼쪽을 끌어 이동, 오른쪽을 끌어 조준·사격.<br>
        총은 귀하지만 탄창은 넉넉하다. 총소리는 굳어 있던 좀비를 깨운다. 점수는 처치로만 크게 오른다.
      </div>
    </div>
  </div>

  <div id="roul" class="screen" hidden>
    <div class="box"><p>시작 아이템 추첨</p><div id="roulName"></div><p id="roulSub"></p></div>
  </div>

  <div id="end" class="screen" hidden>
    <div class="box">
      <h2 id="endTitle"></h2>
      <div id="endSub" style="color:var(--dim)"></div>
      <div class="stats">
        <div><span>점수</span><b id="sScore"></b></div>
        <div><span>처치</span><b id="sKills"></b></div>
        <div><span>최고 콤보</span><b id="sCombo"></b></div>
        <div><span>버틴 시간</span><b id="sTime"></b></div>
      </div>
      <div class="row">
        <button class="btn" id="again">다시 도전</button>
        <button class="btn alt" id="toMenu">난이도 선택</button>
      </div>
    </div>
  </div>

  <div id="touch" hidden>
    <button id="bPick" hidden>줍기</button>
    <button id="bReload">장전</button>
    <button id="bSwap">무기</button>
    <button id="bThrow">투척</button>
    <button id="bDash">구르기</button>
  </div>
</div>

/* ---------- 소리 ---------- */
let AC=null,nbuf=null;
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function tone(f,d,v=.06,type='square',f2){
  if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}
function hiss(d,v=.1,fq=1200){
  if(!AC)return;const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;
  s.buffer=nbuf;f.type='lowpass';f.frequency.value=fq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+d);
}

    for(let y=0;y<12;y++)for(let x=0;x<12;x++)tiles[(oy+y)*MW+ox+x]=3;
    const k=kinds[pi];
    if(k==='park'){for(let i=ri(9,16);i--;)tiles[(oy+ri(1,10))*MW+ox+ri(1,10)]=4;return}

      for(let row=2;row<11;row+=4)for(let x=1;x<10;x+=3)if(Math.random()<.6){tiles[(oy+row)*MW+ox+x]=5;tiles[(oy+row)*MW+ox+x+1]=5}

    const b={x:bx,y:by,w,h,type,a:1,doors:[]};blds.push(b);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const e=x===0||y===0||x===w-1||y===h-1,c=(by+y)*MW+bx+x;tiles[c]=e?1:2;bldAt[c]=bi;
    }

    const sides=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,w*h>70?3:2);

}

    if(x>0&&dist[c-1]>d&&!SOL[tiles[c-1]]){dist[c-1]=d;queue[t++]=c-1}

}

      cx.moveTo(x+Math.cos(z.ang-.5)*z.r,y+Math.sin(z.ang-.5)*z.r);cx.lineTo(x+Math.cos(z.ang-.3)*(z.r+9),y+Math.sin(z.ang-.3)*(z.r+9));cx.lineWidth=4;cx.strokeStyle=cx.fillStyle;cx.stroke();cx.lineWidth=2;cx.strokeStyle='#0b0d0f'}
    cx.beginPath();cx.arc(x,y,z.r,0,7);cx.fill();cx.stroke();
    if(z.dorm){cx.strokeStyle='#8a929c';cx.lineWidth=1;cx.beginPath();cx.moveTo(x-z.r*.6,y-2);cx.lineTo(x-1,y+3);cx.lineTo(x+z.r*.5,y-4);cx.stroke()}
    else{cx.fillStyle=z.t==='screamer'?'#200':'#d2402f';const ex=Math.cos(z.ang)*z.r*.5,ey=Math.sin(z.ang)*z.r*.5;
      if(z.t==='screamer'){cx.beginPath();cx.arc(x+ex,y+ey,z.scrT>0?6:3.5,0,7);cx.fill()}
      else{cx.beginPath();cx.arc(x+ex-ey*.5,y+ey+ex*.5,2,0,7);cx.arc(x+ex+ey*.5,y+ey-ex*.5,2,0,7);cx.fill()}}
    if(z.t==='brute'&&z.hp<z.mhp){cx.fillStyle='#000a';cx.fillRect(x-18,y-z.r-9,36,4);cx.fillStyle='#d2402f';cx.fillRect(x-18,y-z.r-9,36*z.hp/z.mhp,4)}
  }
  // 플레이어
  if(P&&(state!=='over'||won)){
    const g=P.cur>=0?P.guns[P.cur]:null,len=g?WP[g.id].len:P.melee==='fist'?8:WP[P.melee].rng*.5,a=P.ang+(P.swing>0?(P.swing/.12-.5)*WP[P.melee].arc:0);
    if(P.swing>0){const w=WP[P.melee];cx.fillStyle='rgba(255,255,255,.16)';cx.beginPath();cx.moveTo(P.x,P.y);cx.arc(P.x,P.y,w.rng,P.ang-w.arc/2,P.ang+w.arc/2);cx.fill()}
    cx.strokeStyle=g?'#22262a':P.melee==='katana'?'#dfe6ea':'#9b7a4f';cx.lineWidth=g?5:4;cx.beginPath();cx.moveTo(P.x+Math.cos(a)*8,P.y+Math.sin(a)*8);cx.lineTo(P.x+Math.cos(a)*(len+8),P.y+Math.sin(a)*(len+8));cx.stroke();
    if(muzzle>0&&g){cx.fillStyle='#ffd27a';cx.beginPath();cx.arc(P.x+Math.cos(a)*(len+12),P.y+Math.sin(a)*(len+12),7,0,7);cx.fill()}
    cx.globalAlpha=P.inv>0&&now%120<60?.5:1;
    cx.fillStyle=P.eq.body?'#3f6f9a':'#4d8fc9';cx.strokeStyle='#0b0d0f';cx.lineWidth=2;cx.beginPath();cx.arc(P.x,P.y,P.r,0,7);cx.fill();cx.stroke();
    cx.fillStyle=P.eq.head?'#2b3238':'#e8c9a0';cx.beginPath();cx.arc(P.x+Math.cos(P.ang)*3,P.y+Math.sin(P.ang)*3,7,0,7);cx.fill();cx.globalAlpha=1;
  }
  // 탄·효과
  for(const b of bul){
    if(b.k==='fl'){cx.fillStyle=`rgba(255,${120+b.life*250|0},40,.7)`;cx.beginPath();cx.arc(b.x,b.y,6+(.42-b.life)*26,0,7);cx.fill()}
    else if(b.k==='b'){cx.strokeStyle=b.bolt?'#cfd6d8':'#ffe08a';cx.lineWidth=2;cx.beginPath();cx.moveTo(b.x,b.y);cx.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);cx.stroke()}
    else{cx.fillStyle=b.k==='fr'?'#ff5a4a':'#3d4a33';cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill()}

  for(const th of throws){const p=th.t/th.T,h=Math.sin(p*3.14)*40;cx.fillStyle='#0006';cx.beginPath();cx.arc(th.x,th.y,4,0,7);cx.fill();cx.fillStyle=th.k==='molo'?'#ff8a2a':th.k==='alarm'?'#f2b632':'#4b5a3c';cx.beginPath();cx.arc(th.x,th.y-h,5,0,7);cx.fill()}
  for(const f of fx){
    if(f.k==='p'){cx.fillStyle=f.c;cx.fillRect(f.x-f.r/2,f.y-f.r/2,f.r,f.r)}

    else if(f.k==='bolt'){cx.strokeStyle='#9fe8ff';cx.lineWidth=3;cx.beginPath();f.pts.forEach((p,i)=>{if(!i)cx.moveTo(p[0],p[1]);else{const q=f.pts[i-1];cx.lineTo((p[0]+q[0])/2+rnd(-12,12),(p[1]+q[1])/2+rnd(-12,12));cx.lineTo(p[0],p[1])}});cx.stroke()}

  for(const b of blds){
    if(b.a<.02||b.x>x1+1||b.x+b.w<x0||b.y>y1+1||b.y+b.h<y0)continue;

    cx.fillStyle='#f2e9c8';for(const d of b.doors)cx.fillRect(d[0]*TS+4,d[1]*TS+4,TS-8,TS-8);
    cx.font='400 '+(b.type.length>2?30:38)+'px '+DF;cx.fillStyle='#000a';cx.fillText(b.type,X+W/2+2,Y+H/2+2);cx.fillStyle=b.type==='병원'?'#b3261e':'#f4efe0';cx.fillText(b.type,X+W/2,Y+H/2);
    cx.globalAlpha=1;
  }
  for(const f of fx)if(f.k==='txt'){cx.font='700 14px '+HF;cx.lineWidth=3;cx.strokeStyle='#000b';cx.strokeText(f.s,f.x,f.y);cx.fillStyle=f.c;cx.fillText(f.s,f.x,f.y)}
  // 어둠
  if(P&&df.dark>0&&state!=='menu'){
    const s=lc.width/VW;lx.setTransform(1,0,0,1,0,0);lx.globalCompositeOperation='source-over';lx.clearRect(0,0,lc.width,lc.height);
    lx.fillStyle=`rgba(3,5,12,${df.dark})`;lx.fillRect(0,0,lc.width,lc.height);lx.globalCompositeOperation='destination-out';

    const hole=(x,y,r,a)=>{const g=lx.createRadialGradient(x,y,r*.2,x,y,r);g.addColorStop(0,`rgba(0,0,0,${a||1})`);g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.beginPath();lx.arc(x,y,r,0,7);lx.fill()};
    hole(P.x,P.y,P.light==='nv'?430:P.light==='round'||P.eq.tool==='lantern'?Math.max(df.amb,250):df.amb);
    if(P.light==='cone'||P.eq.tool==='flash'){
      const flick=dkey==='hell'&&Math.random()<.04?.35:1,L=(P.eq.tool==='flash'?460:320)*flick,g=lx.createRadialGradient(P.x,P.y,20,P.x,P.y,L);
      g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.7,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');lx.fillStyle=g;lx.beginPath();lx.moveTo(P.x,P.y);lx.arc(P.x,P.y,L,P.ang-.42,P.ang+.42);lx.closePath();lx.fill();
    }
    for(const l of lures)if(l.flare)hole(l.x,l.y,270+Math.sin(now/50)*12);
    for(const zn of zones)hole(zn.x,zn.y,zn.r*2.2,.9);
    for(const f of fx)if(f.k==='light')hole(f.x,f.y,f.r,.9);
    for(const z of zs)if(z.burn>0)hole(z.x,z.y,60,.7);
    cx.setTransform(DPR,0,0,DPR,0,0);cx.drawImage(lc,0,0,VW,VH);
    if(P.light==='nv'){cx.fillStyle='rgba(40,255,90,.08)';cx.fillRect(0,0,VW,VH)}
  }
  cx.setTransform(DPR,0,0,DPR,0,0);
  if(flashR>0){cx.fillStyle=`rgba(210,40,30,${flashR*.8})`;cx.fillRect(0,0,VW,VH)}
  if(P&&state!=='menu'&&state!=='end')hud(now);
}
function hud(now){
  const sm=VW<620,left=GAME-time,pad=sm?10:16;
  cx.textBaseline='middle';
  // 타이머
  cx.textAlign='center';cx.font='400 '+(sm?40:54)+'px '+DF;const ts=Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
  cx.lineWidth=5;cx.strokeStyle='#000a';cx.strokeText(ts,VW/2,sm?30:38);cx.fillStyle=left<=30?(now%500<250?'#d2402f':'#f2b632'):'#e9e6dc';cx.fillText(ts,VW/2,sm?30:38);
  const bw=sm?120:200;cx.fillStyle='#0008';cx.fillRect(VW/2-bw/2,sm?54:70,bw,4);cx.fillStyle='#f2b632';cx.fillRect(VW/2-bw/2,sm?54:70,bw*time/GAME,4);
  // 체력
  const hw=sm?110:200;cx.fillStyle='#000a';rr(cx,pad,pad,hw,16,3);cx.fill();cx.fillStyle=P.hp<P.mhp*.3?'#d2402f':'#6fbf73';rr(cx,pad,pad,Math.max(4,hw*Math.min(1,P.hp/P.mhp)),16,3);cx.fill();
  cx.textAlign='left';cx.font='700 11px '+HF;cx.fillStyle='#0c0f12';cx.fillText('HP '+Math.ceil(P.hp),pad+6,pad+9);
  // 장비
  cx.font='600 11px '+HF;let y=pad+30;
  for(const [s,l] of SLOTS){const e=EQ[P.eq[s]];cx.fillStyle='#000a';rr(cx,pad,y-9,sm?96:124,18,3);cx.fill();cx.fillStyle='#98a1a6';cx.fillText(l,pad+6,y);cx.fillStyle=e?'#6fb7e6':'#4b555c';cx.fillText(e?e.n:'비어 있음',pad+(sm?34:40),y);y+=21}
  if(P.boost>0){cx.fillStyle='#6fbf73';cx.fillText('가속 '+P.boost.toFixed(1)+'초',pad+6,y);y+=18}
  if(P.arm>0){cx.fillStyle='#98a1a6';cx.fillText('방어 '+Math.round(P.arm*100)+'%',pad+6,y);y+=18}
  // 점수
  cx.textAlign='right';cx.font='400 '+(sm?20:26)+'px '+DF;cx.fillStyle='#e9e6dc';cx.fillText(Math.round(score).toLocaleString(),VW-pad,pad+10);
  cx.font='600 11px '+HF;cx.fillStyle='#98a1a6';cx.fillText('처치 '+kills+' · '+df.n,VW-pad,pad+32);
  if(combo>1){cx.font='400 '+(16+Math.min(combo,20)*.5)+'px '+DF;cx.fillStyle='#f2b632';cx.fillText(combo+' 콤보 ×'+(1+Math.min(combo,20)*.1).toFixed(1),VW-pad,pad+54)}
  // 지도
  if(df.map){const ms=sm?76:112,mx=VW-pad-ms,my=pad+72,k=ms/MW;cx.fillStyle='#000a';cx.fillRect(mx-2,my-2,ms+4,ms+4);
    for(const b of blds){cx.fillStyle=BT[b.type].c;cx.fillRect(mx+b.x*k,my+b.y*k,b.w*k,b.h*k)}
    cx.fillStyle='#fff';cx.fillRect(mx+P.x/TS*k-2,my+P.y/TS*k-2,4,4)}
  // 무기
  const boxes=[{n:WP[P.melee].n,s:'근접',on:P.cur<0}];P.guns.forEach((g,i)=>boxes.push({n:WP[g.id].n,s:g.mag+' / '+g.res,on:P.cur===i}));
  for(let i=P.guns.length;i<P.slots;i++)boxes.push({n:'빈 슬롯',s:'',empty:1});
  const tn=P.th[P.thCur];boxes.push({n:tn?TH[P.thCur].n:'투척물 없음',s:tn?'×'+tn:'',th:1,empty:!tn});
  const w=sm?72:104,h=sm?36:42,gap=6,tot=boxes.length*(w+gap)-gap;let bx=VW/2-tot/2;const by=VH-h-(sm?10:16);
  cx.textAlign='center';
  for(const b of boxes){cx.fillStyle=b.on?'#f2b632':'#000b';rr(cx,bx,by,w,h,4);cx.fill();if(b.th&&!b.empty){cx.strokeStyle='#b58be6';cx.lineWidth=1.5;cx.stroke()}
    cx.fillStyle=b.on?'#17130a':b.empty?'#4b555c':'#e9e6dc';cx.font='700 '+(sm?10:12)+'px '+HF;cx.fillText(b.n,bx+w/2,by+h*.36);
    cx.font='600 '+(sm?9:11)+'px '+HF;cx.fillStyle=b.on?'#17130a':'#98a1a6';cx.fillText(b.s,bx+w/2,by+h*.74);bx+=w+gap}

  // 알림
  cx.textAlign='left';cx.font='600 12px '+HF;let ty=by-30;
  for(let i=toasts.length-1;i>=0;i--){const t=toasts[i];cx.globalAlpha=Math.min(1,t.t);cx.lineWidth=3;cx.strokeStyle='#000b';cx.strokeText(t.s,pad,ty);cx.fillStyle=t.c;cx.fillText(t.s,pad,ty);ty-=18}

  if(tch.on)for(const j of [tch.mv,tch.aim])if(j){cx.strokeStyle='#ffffff40';cx.lineWidth=2;cx.beginPath();cx.arc(j.ox,j.oy,44,0,7);cx.stroke();cx.fillStyle='#ffffff30';cx.beginPath();cx.arc(j.x,j.y,18,0,7);cx.fill()}
}

/* ---------- 루프 ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==='play'&&!paused){if(hs>0)hs-=dt;else update(dt);updFx(dt)}
  else if(state==='over'){updFx(dt);endT-=dt;if(endT<=0)showEnd()}
  draw(now);requestAnimationFrame(frame);
}

/* ---------- 입력 ---------- */
addEventListener('keydown',e=>{
  if(e.repeat){if(e.code==='Space')e.preventDefault();return}
  keys[e.code]=true;if(state!=='play')return;
  if(e.code==='Space'){e.preventDefault();dash()}
  else if(e.code==='KeyQ')cycleWeapon();
  else if(e.code==='KeyG')throwIt();
  else if(e.code==='KeyE')doPick();
  else if(e.code==='KeyR')reload();
  else if(e.code==='KeyF'){const ks=Object.keys(TH).filter(t=>P.th[t]);if(ks.length)P.thCur=ks[(ks.indexOf(P.thCur)+1)%ks.length]}
  else if(e.code==='KeyP'||e.code==='Escape')paused=!paused;
  else if(e.code==='Digit1')P.cur=-1;
  else if(/^Digit[2-4]$/.test(e.code)){const i=+e.code[5]-2;if(P.guns[i])P.cur=i}
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false});
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
cv.addEventListener('mousemove',e=>{const p=pos(e);mouse.x=p.x;mouse.y=p.y;tch.on=false});
cv.addEventListener('mousedown',e=>{audio();const p=pos(e);mouse.x=p.x;mouse.y=p.y;if(e.button===0)mouse.down=true;else if(e.button===2&&state==='play')throwIt()});
addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(state==='play')cycleWeapon();e.preventDefault()},{passive:false});
function joy(j,p){j.x=p.x;j.y=p.y;const dx=p.x-j.ox,dy=p.y-j.oy,d=hyp(dx,dy);j.d=d;j.a=Math.atan2(dy,dx);const m=Math.min(1,d/46);j.vx=d?dx/d*m:0;j.vy=d?dy/d*m:0}
cv.addEventListener('touchstart',e=>{e.preventDefault();audio();tch.on=true;$('touch').hidden=false;
  for(const t of e.changedTouches){const p=pos(t),j={id:t.identifier,ox:p.x,oy:p.y,x:p.x,y:p.y,d:0,a:0,vx:0,vy:0};if(p.x<VW/2&&!tch.mv)tch.mv=j;else if(!tch.aim)tch.aim=j}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const p=pos(t);if(tch.mv&&tch.mv.id===t.identifier)joy(tch.mv,p);if(tch.aim&&tch.aim.id===t.identifier)joy(tch.aim,p)}},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(tch.mv&&tch.mv.id===t.identifier)tch.mv=null;if(tch.aim&&tch.aim.id===t.identifier)tch.aim=null}};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);
const tap=(id,fn)=>$(id).addEventListener('click',e=>{e.preventDefault();if(state==='play')fn()});
tap('bDash',dash);tap('bThrow',throwIt);tap('bSwap',cycleWeapon);tap('bPick',doPick);tap('bReload',reload);
for(const b of document.querySelectorAll('.diff'))b.addEventListener('click',()=>start(b.dataset.d));
$('again').addEventListener('click',()=>start(dkey));
$('toMenu').addEventListener('click',showMenu);

showMenu();requestAnimationFrame(frame);
window.__z3={get s(){return{state,time,score,kills,hp:P&&P.hp,zs:zs.length,items:items.length,blds:blds.length}},skip(t){time=t},P:()=>P};
})();
