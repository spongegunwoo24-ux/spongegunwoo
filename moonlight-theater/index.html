<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>월광 인형극장</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         touch-action:none; -webkit-user-select:none; user-select:none;
         -webkit-tap-highlight-color:transparent; }
  #c { display:block; background:#000; image-rendering:auto; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
(function(){
/* ═════════ 0. 기본 상수 / 캔버스 ═════════ */
const W = 1280, H = 720;              // 내부 고정 해상도
const SCENE_W = 1760;                 // 사무실 씬 폭
const PAN_MAX = SCENE_W - W;          // 0 ~ 480
const HOUR_SEC = 50;                  // 1시간 = 50초
const NIGHT_SEC = HOUR_SEC * 6;       // 한 밤 = 300초
const K_POWER = [0.10, 0.115, 0.13, 0.145, 0.16];
const ORGAN_DRAIN = [0, 0, 1.6, 2.0, 2.4];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function fitCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

/* ═════════ 유틸 ═════════ */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));      // 양끝 포함
const roll20 = lvl => randi(1,20) <= lvl;            // random(1,20) <= AI레벨
const pick = arr => arr[(Math.random()*arr.length)|0];
function hit(r, x, y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

/* ═════════ 1. 입력 (마우스 + 터치 + 키보드) ═════════ */
const ptr = { x: W/2, y: H/2, down:false, moved:false };
const clicks = [];        // 이번 프레임에 처리할 탭/클릭
const keys = {};

function toCanvas(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x:(clientX - r.left) * (W / r.width), y:(clientY - r.top) * (H / r.height) };
}
function pDown(cx, cy){
  SFX.ensure();
  const p = toCanvas(cx, cy);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.moved = true;
  clicks.push({ x:p.x, y:p.y });
}
function pMove(cx, cy){
  const p = toCanvas(cx, cy);
  ptr.x = p.x; ptr.y = p.y; ptr.moved = true;
}
if (window.PointerEvent){
  canvas.addEventListener('pointerdown', e => { pDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('pointermove', e => pMove(e.clientX, e.clientY));
  window.addEventListener('pointerup',     () => { ptr.down = false; });
  window.addEventListener('pointercancel', () => { ptr.down = false; });
} else {
  canvas.addEventListener('mousedown', e => { pDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => pMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   () => { ptr.down = false; });
  canvas.addEventListener('touchstart', e => { const t=e.changedTouches[0]; pDown(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { const t=e.changedTouches[0]; pMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
  window.addEventListener('touchend',   () => { ptr.down = false; });
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'spacebar') e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  SFX.ensure();
  onKey(k);
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ═════════ 9. WebAudio 합성 사운드 (외부 음원 없음) ═════════ */
const SFX = {
  ac:null, master:null, muted:false, noiseBuf:null, fanGain:null,

  ensure(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch(e){ return; }
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ac.destination);
    this.noiseBuf = this._noise(2);
    this._ambient();
  },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.9; },
  get t(){ return this.ac ? this.ac.currentTime : 0; },

  _noise(sec){
    const ac = this.ac, n = Math.floor(ac.sampleRate*sec);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return buf;
  },
  _src(loop){ const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; s.loop = !!loop; return s; },
  _env(g, t, peak, dur, atk){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },

  /* 환경음: 노이즈 → lowpass 300Hz (gain 0.04) + 60Hz 험 + 환풍기 */
  _ambient(){
    const ac = this.ac;
    const n = this._src(true), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    const g = ac.createGain(); g.gain.value = 0.04;
    n.connect(lp); lp.connect(g); g.connect(this.master); n.start();

    const hum = ac.createOscillator(); hum.type = 'sine'; hum.frequency.value = 60;
    const hg = ac.createGain(); hg.gain.value = 0.018;
    hum.connect(hg); hg.connect(this.master); hum.start();

    // 환풍기: 노이즈 → bandpass 800Hz + 느린 LFO
    const fn = this._src(true), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 1.1;
    const fg = ac.createGain(); fg.gain.value = 0.022;
    fn.connect(bp); bp.connect(fg); fg.connect(this.master); fn.start();
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.9;
    const lg = ac.createGain(); lg.gain.value = 0.013;
    lfo.connect(lg); lg.connect(fg.gain); lfo.start();
    this.fanGain = fg;
  },

  /* 문 여닫힘: 60Hz 사인 감쇠 + lowpass 노이즈 버스트 */
  door(closing){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(closing ? 78 : 58, t);
    o.frequency.exponentialRampToValueAtTime(36, t+0.34);
    const g = ac.createGain(); this._env(g, t, 0.55, 0.42, 0.005);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.5);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 430;
    const ng = ac.createGain(); this._env(ng, t, 0.32, 0.26, 0.004);
    n.connect(lp); lp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.3);
  },
  /* 카메라 전환: 0.15초 highpass 노이즈 */
  camSwitch(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const n = this._src(), hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2400;
    const g = ac.createGain(); this._env(g, t, 0.3, 0.15, 0.003);
    n.connect(hp); hp.connect(g); g.connect(this.master); n.start(t); n.stop(t+0.18);
  },
  /* 복도 발소리: 저역 임팩트 */
  step(vol){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(rand(90,130), t);
    o.frequency.exponentialRampToValueAtTime(42, t+0.18);
    const g = ac.createGain(); this._env(g, t, 0.24*(vol||1), 0.22, 0.004);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.26);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    const ng = ac.createGain(); this._env(ng, t, 0.12*(vol||1), 0.14, 0.003);
    n.connect(lp); lp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.16);
  },
  /* 문에 막혀 후퇴할 때의 쾅 */
  bang(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(34, t+0.5);
    const g = ac.createGain(); this._env(g, t, 0.6, 0.6, 0.003);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.66);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    const ng = ac.createGain(); this._env(ng, t, 0.45, 0.35, 0.002);
    n.connect(lp); lp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.4);
  },
  /* 장승 돌진: 빠른 연속 타격음 + 상승 노이즈 */
  charge(){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    for (let i=0;i<9;i++){
      const t = t0 + i*0.085;
      const o = ac.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(160 + i*14, t);
      o.frequency.exponentialRampToValueAtTime(60, t+0.07);
      const g = ac.createGain(); this._env(g, t, 0.22, 0.09, 0.002);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.1);
    }
    const n = this._src(), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(3600, t0+0.8);
    const g = ac.createGain(); this._env(g, t0, 0.35, 0.9, 0.2);
    n.connect(bp); bp.connect(g); g.connect(this.master); n.start(t0); n.stop(t0+1.0);
  },
  /* 오르골: triangle 단조 8마디, 점점 느려짐 */
  musicBox(){
    if (!this.ac) return 0; const ac = this.ac; let t = this.t + 0.05;
    const seq = [69,72,76,81, 79,76,72,71, 69,72,76,79, 77,76,74,72,
                 69,71,72,74, 76,74,72,71, 69,64,67,69, 72,69,68,69];
    let step = 0.30;
    for (let i=0;i<seq.length;i++){
      const f = 440*Math.pow(2,(seq[i]-69)/12);
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = ac.createGain(); this._env(g, t, 0.17, step*1.7, 0.008);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+step*1.9);
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f*2;
      const g2 = ac.createGain(); this._env(g2, t, 0.05, step*1.2, 0.008);
      o2.connect(g2); g2.connect(this.master); o2.start(t); o2.stop(t+step*1.4);
      t += step; step *= 1.035;              // 점점 느려짐
    }
    return t - this.t;
  },
  /* 태엽 감는 소리 */
  wind(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = rand(700,980);
    const g = ac.createGain(); this._env(g, t, 0.05, 0.05, 0.002);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.06);
  },
  /* 점프스케어: 디튠 saw 3개 하강 + 노이즈 + waveshaper 디스토션, 1.2초 */
  scare(){
    if (!this.ac) return; const ac = this.ac, t = this.t, D = 1.2;
    const ws = ac.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i=0;i<1024;i++){ const x = i/512 - 1; curve[i] = Math.tanh(x*6); }
    ws.curve = curve; ws.oversample = '2x';
    const g = ac.createGain();
    g.gain.setValueAtTime(0.55, t);
    g.gain.setValueAtTime(0.55, t+D*0.75);
    g.gain.exponentialRampToValueAtTime(0.0005, t+D);
    ws.connect(g); g.connect(this.master);
    [0, 14, -19].forEach(det => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = det;
      o.frequency.setValueAtTime(760, t);
      o.frequency.exponentialRampToValueAtTime(42, t+D);
      o.connect(ws); o.start(t); o.stop(t+D);
    });
    const n = this._src(), hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 180;
    const ng = ac.createGain(); this._env(ng, t, 0.5, D, 0.004);
    n.connect(hp); hp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+D);
  },
  /* 정전 */
  powerDown(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(18, t+1.6);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = ac.createGain(); this._env(g, t, 0.3, 1.8, 0.02);
    o.connect(lp); lp.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.9);
  },
  /* 6 AM: 벨 사인 + 노이즈 환호 */
  sixAM(){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    for (let i=0;i<4;i++){
      const t = t0 + i*0.62;
      [1, 2.01, 3.02, 4.4].forEach((h, j) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 523.25*h;
        const g = ac.createGain(); this._env(g, t, 0.22/(j+1), 1.5, 0.004);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.6);
      });
    }
    const n = this._src(true), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.1, t0+0.7);
    g.gain.linearRampToValueAtTime(0.0001, t0+3.4);
    n.connect(bp); bp.connect(g); g.connect(this.master); n.start(t0); n.stop(t0+3.6);
  },
  /* 문 앞 위협 경고(직전 단서) */
  growl(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = rand(58,74);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
    const g = ac.createGain(); this._env(g, t, 0.2, 0.8, 0.12);
    o.connect(lp); lp.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.9);
  }
};

/* ═════════ 화면 효과 헬퍼 ═════════ */
const noiseTiles = [];
for (let i=0;i<5;i++){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c2 = cv.getContext('2d'); const img = c2.createImageData(256,256);
  for (let p=0;p<256*256;p++){
    const v = (Math.random()*255)|0;
    img.data[p*4] = img.data[p*4+1] = img.data[p*4+2] = v; img.data[p*4+3] = 255;
  }
  c2.putImageData(img,0,0); noiseTiles.push(cv);
}
function grain(alpha){
  const t = noiseTiles[(Math.random()*noiseTiles.length)|0];
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
  for (let y=-8;y<H;y+=256) for (let x=-8;x<W;x+=256)
    ctx.drawImage(t, x + ((Math.random()*8)|0), y + ((Math.random()*8)|0));
  ctx.restore();
}
function vignette(strength){
  const g = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.92);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,' + strength + ')');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function txt(s, x, y, size, color, align, weight){
  ctx.fillStyle = color || '#d8dff0';
  ctx.font = (weight || 600) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function panel(r, fill, stroke){
  ctx.fillStyle = fill; ctx.fillRect(r.x, r.y, r.w, r.h);
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2); }
}

/* ═════════ 5. 캐릭터 실루엣 (전부 도형 조합) ═════════ */
// mode: 'sil' 역광 검은 실루엣 + 얇은 림라이트 / 'cam' 회녹색 저대비 / 'scare' 점프스케어
function skin(mode){
  if (mode === 'cam')   return { fill:'#26332c', rim:'rgba(150,196,170,0.42)', hot:'#8fe6b8', dim:'#384a3f' };
  if (mode === 'scare') return { fill:'#0b0b10', rim:'rgba(255,255,255,0.85)', hot:'#fff4d8', dim:'#1b1b22' };
  return { fill:'#04050a', rim:'rgba(198,220,255,0.34)', hot:'#ffcf8e', dim:'#0b0d15' };
}
function rimPath(sk, w){ ctx.fillStyle = sk.fill; ctx.fill(); ctx.strokeStyle = sk.rim; ctx.lineWidth = w||2; ctx.stroke(); }

/** 비단 — 실에 매달린 마리오네트, 금 간 도자기 가면, 꿰맨 입 */
function drawBidan(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const sway = Math.sin((t||0)*1.2) * 3*u;
  ctx.save();
  // 매달린 실
  ctx.strokeStyle = mode==='cam' ? 'rgba(160,200,180,0.35)' : 'rgba(210,225,255,0.22)';
  ctx.lineWidth = Math.max(1, u*0.5);
  [[-26,32],[26,32],[0,16]].forEach(p => {
    ctx.beginPath(); ctx.moveTo(x + p[0]*u*0.6, top - h*1.3);
    ctx.lineTo(x + p[0]*u + sway, top + p[1]*u); ctx.stroke();
  });
  // 몸통
  ctx.beginPath();
  ctx.moveTo(x-20*u+sway, top+34*u); ctx.lineTo(x+20*u+sway, top+34*u);
  ctx.lineTo(x+13*u+sway, top+68*u); ctx.lineTo(x-13*u+sway, top+68*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 어깨 가로대
  ctx.beginPath(); ctx.rect(x-28*u+sway, top+31*u, 56*u, 4.5*u); rimPath(sk, u*0.6);
  // 늘어진 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(x + s*26*u + sway, top+34*u);
    ctx.lineTo(x + s*31*u + sway*1.4, top+54*u);
    ctx.lineTo(x + s*25*u + sway*1.8, top+74*u); ctx.stroke();
  });
  // 다리
  ctx.lineWidth = 6*u;
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x + s*9*u + sway, top+66*u);
    ctx.lineTo(x + s*11*u, base); ctx.stroke();
  });
  // 가면 머리
  const hx = x + sway*1.2, hy = top + 17*u;
  ctx.beginPath(); ctx.ellipse(hx, hy, 14*u, 16*u, 0, 0, Math.PI*2); rimPath(sk, u*0.9);
  // 금 간 자국
  ctx.strokeStyle = sk.rim; ctx.lineWidth = Math.max(1, u*0.7);
  ctx.beginPath(); ctx.moveTo(hx-5*u, hy-14*u); ctx.lineTo(hx-2*u, hy-4*u);
  ctx.lineTo(hx-6*u, hy+2*u); ctx.lineTo(hx-3*u, hy+9*u); ctx.stroke();
  // 눈
  ctx.fillStyle = mode==='cam' ? sk.dim : '#000';
  [-5,5].forEach(s => { ctx.beginPath(); ctx.ellipse(hx+s*u, hy-3*u, 2.6*u, 3.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  if (mode === 'scare'){
    ctx.fillStyle = '#e8e2d0';
    [-5,5].forEach(s => { ctx.beginPath(); ctx.ellipse(hx+s*u, hy-3*u, 2.6*u, 3.4*u, 0, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = '#000';
    [-5,5].forEach(s => { ctx.beginPath(); ctx.arc(hx+s*u, hy-3*u, 1.2*u, 0, Math.PI*2); ctx.fill(); });
  }
  // 꿰맨 입
  ctx.strokeStyle = sk.rim; ctx.lineWidth = Math.max(1, u*0.8);
  ctx.beginPath(); ctx.moveTo(hx-7*u, hy+8*u); ctx.lineTo(hx+7*u, hy+8*u); ctx.stroke();
  for (let i=-3;i<=3;i++){
    ctx.beginPath(); ctx.moveTo(hx+i*2.2*u, hy+6*u); ctx.lineTo(hx+i*2.2*u, hy+10*u); ctx.stroke();
  }
  ctx.restore();
}

/** 초롱 — 등불 머리, 머리 안에서 주황 불빛이 흔들림 */
function drawChorong(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const fl = 0.72 + Math.sin((t||0)*9.1)*0.12 + Math.sin((t||0)*3.3)*0.1;
  ctx.save();
  // 장삼 같은 몸통
  ctx.beginPath();
  ctx.moveTo(x-15*u, top+34*u); ctx.lineTo(x+15*u, top+34*u);
  ctx.lineTo(x+26*u, base); ctx.lineTo(x-26*u, base);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 소매
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*14*u, top+38*u);
    ctx.lineTo(x+s*27*u, top+58*u); ctx.lineTo(x+s*21*u, top+72*u); ctx.stroke();
  });
  // 등불 머리(육각 등롱)
  const hy = top + 18*u;
  ctx.beginPath();
  ctx.moveTo(x-9*u, hy-18*u); ctx.lineTo(x+9*u, hy-18*u); ctx.lineTo(x+15*u, hy-4*u);
  ctx.lineTo(x+15*u, hy+10*u); ctx.lineTo(x+9*u, hy+18*u); ctx.lineTo(x-9*u, hy+18*u);
  ctx.lineTo(x-15*u, hy+10*u); ctx.lineTo(x-15*u, hy-4*u);
  ctx.closePath();
  // 내부 불빛
  const g = ctx.createRadialGradient(x, hy, 1, x, hy, 20*u);
  if (mode === 'cam'){ g.addColorStop(0,'rgba(190,240,210,'+(0.5*fl)+')'); g.addColorStop(1,'rgba(40,60,50,0.1)'); }
  else { g.addColorStop(0,'rgba(255,176,72,'+(0.92*fl)+')'); g.addColorStop(0.6,'rgba(214,104,24,'+(0.45*fl)+')'); g.addColorStop(1,'rgba(40,16,6,0.15)'); }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.9; ctx.stroke();
  // 등롱 살
  ctx.strokeStyle = mode==='cam' ? 'rgba(20,30,25,0.7)' : 'rgba(20,10,4,0.75)';
  ctx.lineWidth = u*0.8;
  for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(x+i*6*u, hy-18*u); ctx.lineTo(x+i*6*u, hy+18*u); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x-15*u, hy); ctx.lineTo(x+15*u, hy); ctx.stroke();
  // 고리
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.8;
  ctx.beginPath(); ctx.arc(x, hy-21*u, 3.4*u, Math.PI, Math.PI*2); ctx.stroke();
  ctx.restore();
}

/** 장승 — 장대 다리, 나무 탈, 벌어진 이빨 */
function drawJangseung(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const sway = Math.sin((t||0)*2.4)*2*u;
  ctx.save();
  // 장대 다리
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u; ctx.lineCap = 'butt';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*8*u+sway, top+52*u); ctx.lineTo(x+s*13*u, base); ctx.stroke();
    ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.7;
    ctx.beginPath(); ctx.moveTo(x+s*8*u+sway, top+52*u); ctx.lineTo(x+s*13*u, base); ctx.stroke();
    ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u;
  });
  // 좁은 몸통
  ctx.beginPath();
  ctx.moveTo(x-13*u+sway, top+26*u); ctx.lineTo(x+13*u+sway, top+26*u);
  ctx.lineTo(x+10*u+sway, top+54*u); ctx.lineTo(x-10*u+sway, top+54*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 긴 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5.5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*13*u+sway, top+29*u);
    ctx.lineTo(x+s*22*u+sway, top+50*u); ctx.lineTo(x+s*19*u+sway, top+72*u); ctx.stroke();
  });
  // 나무 탈
  const hy = top + 14*u;
  ctx.beginPath();
  ctx.moveTo(x-13*u+sway, hy-14*u); ctx.lineTo(x+13*u+sway, hy-14*u);
  ctx.lineTo(x+11*u+sway, hy+15*u); ctx.lineTo(x-11*u+sway, hy+15*u);
  ctx.closePath(); rimPath(sk, u*0.9);
  // 뿔 같은 상투
  ctx.beginPath(); ctx.moveTo(x-6*u+sway, hy-14*u); ctx.lineTo(x+sway, hy-24*u);
  ctx.lineTo(x+6*u+sway, hy-14*u); ctx.closePath(); rimPath(sk, u*0.7);
  // 눈
  ctx.fillStyle = mode==='sil' ? '#000' : sk.dim;
  [-5.5,5.5].forEach(s => { ctx.beginPath(); ctx.ellipse(x+s*u+sway, hy-4*u, 3.2*u, 2.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  if (mode === 'scare'){
    ctx.fillStyle = '#f4e9cf';
    [-5.5,5.5].forEach(s => { ctx.beginPath(); ctx.ellipse(x+s*u+sway, hy-4*u, 3.2*u, 2.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  }
  // 벌어진 이빨
  ctx.fillStyle = mode==='cam' ? '#cfe6d6' : '#e9e0c8';
  for (let i=-3;i<=3;i++){
    const tw = 2.3*u, th = (i%2===0 ? 7*u : 5*u);
    ctx.fillRect(x + i*3.1*u - tw/2 + sway, hy+6*u, tw, th);
  }
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.6;
  ctx.strokeRect(x-11*u+sway, hy+6*u, 22*u, 8*u);
  ctx.restore();
}

/** 월광 — 극단장, 실크햇, 초승달 얼굴, 빛나는 두 눈 */
function drawWolgwang(x, base, h, mode, t, eyesOnly){
  const sk = skin(mode), u = h/100, top = base - h;
  const hy = top + 20*u;
  if (eyesOnly){
    // 복도등: 두 눈만 보인다
    const p = 0.7 + Math.sin((t||0)*7)*0.3;
    [-7,7].forEach(s => {
      const g = ctx.createRadialGradient(x+s*u, hy-3*u, 0, x+s*u, hy-3*u, 13*u);
      g.addColorStop(0,'rgba(255,250,214,'+(0.95*p)+')');
      g.addColorStop(0.25,'rgba(246,226,140,'+(0.5*p)+')');
      g.addColorStop(1,'rgba(120,100,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+s*u, hy-3*u, 13*u, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,253,235,'+p+')';
      ctx.beginPath(); ctx.ellipse(x+s*u, hy-3*u, 3*u, 2.2*u, 0, 0, Math.PI*2); ctx.fill();
    });
    return;
  }
  ctx.save();
  // 연미복 몸통
  ctx.beginPath();
  ctx.moveTo(x-17*u, top+36*u); ctx.lineTo(x+17*u, top+36*u);
  ctx.lineTo(x+21*u, top+78*u); ctx.lineTo(x+8*u, base);
  ctx.lineTo(x, top+82*u); ctx.lineTo(x-8*u, base); ctx.lineTo(x-21*u, top+78*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 6*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*17*u, top+38*u);
    ctx.lineTo(x+s*26*u, top+58*u); ctx.lineTo(x+s*20*u, top+74*u); ctx.stroke();
  });
  // 초승달 얼굴
  ctx.beginPath(); ctx.arc(x, hy, 14*u, 0, Math.PI*2); rimPath(sk, u*0.9);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = mode==='cam' ? 'rgba(190,230,205,0.5)' : 'rgba(236,240,255,0.55)';
  ctx.beginPath(); ctx.arc(x-2*u, hy, 13*u, Math.PI*0.35, Math.PI*1.65); ctx.fill();
  ctx.fillStyle = sk.fill;
  ctx.beginPath(); ctx.arc(x-8*u, hy, 13*u, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // 빛나는 두 눈
  const p = 0.75 + Math.sin((t||0)*6.4)*0.25;
  [-6,6].forEach(s => {
    const g = ctx.createRadialGradient(x+s*u, hy-3*u, 0, x+s*u, hy-3*u, 9*u);
    g.addColorStop(0,'rgba(255,251,220,'+p+')'); g.addColorStop(1,'rgba(180,150,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+s*u, hy-3*u, 9*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,'+p+')';
    ctx.beginPath(); ctx.ellipse(x+s*u, hy-3*u, 2.6*u, 2*u, 0, 0, Math.PI*2); ctx.fill();
  });
  // 실크햇
  ctx.beginPath(); ctx.rect(x-22*u, hy-17*u, 44*u, 4*u); rimPath(sk, u*0.7);
  ctx.beginPath(); ctx.rect(x-12*u, hy-40*u, 24*u, 23*u); rimPath(sk, u*0.8);
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.7;
  ctx.beginPath(); ctx.moveTo(x-12*u, hy-21*u); ctx.lineTo(x+12*u, hy-21*u); ctx.stroke();
  ctx.restore();
}

/** 태엽인형 — 작은 인형, 등에 태엽 열쇠 */
function drawTaeyeop(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const tilt = Math.sin((t||0)*4.5)*0.06;
  ctx.save();
  ctx.translate(x, base); ctx.rotate(tilt); ctx.translate(-x, -base);
  // 태엽 열쇠
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*1.4;
  ctx.beginPath(); ctx.arc(x+20*u, top+46*u, 9*u, 0, Math.PI*2); ctx.stroke();
  for (let i=0;i<4;i++){
    const a = (t||0)*1.6 + i*Math.PI/2;
    ctx.beginPath(); ctx.moveTo(x+20*u, top+46*u);
    ctx.lineTo(x+20*u + Math.cos(a)*9*u, top+46*u + Math.sin(a)*9*u); ctx.stroke();
  }
  // 몸통
  ctx.beginPath(); ctx.ellipse(x, top+52*u, 17*u, 24*u, 0, 0, Math.PI*2); rimPath(sk, u*0.9);
  // 팔다리
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*15*u, top+46*u); ctx.lineTo(x+s*25*u, top+62*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+s*8*u, top+74*u); ctx.lineTo(x+s*10*u, base); ctx.stroke();
  });
  // 머리
  const hy = top + 18*u;
  ctx.beginPath(); ctx.arc(x, hy, 17*u, 0, Math.PI*2); rimPath(sk, u*0.9);
  ctx.fillStyle = mode==='scare' ? '#f2ead2' : (mode==='cam' ? sk.dim : '#000');
  [-6,6].forEach(s => { ctx.beginPath(); ctx.arc(x+s*u, hy-2*u, 3.4*u, 0, Math.PI*2); ctx.fill(); });
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.8;
  ctx.beginPath(); ctx.arc(x, hy+7*u, 5*u, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  ctx.restore();
}

/* ═════════ 게임 상태 ═════════ */
const G = {
  state:'title', stateT:0, night:1, cleared:0,
  P:null, dead:null, fanA:0, titleT:0, drag:-1, endingKind:'night5'
};

function startNight(night, cfg){
  const lv = cfg || NIGHT_LV[night-1];
  const P = {
    night, custom:!!cfg,
    k: cfg ? 0.16 : K_POWER[night-1],
    organOn:lv.organ, organRate: cfg ? 2.4 : ORGAN_DRAIN[night-1],
    time:0, hour:0, power:100, usage:1,
    doorL:false, doorR:false, lightL:false, lightR:false,
    cam:false, camRoom:1,
    panX:PAN_MAX/2,
    organ:100, organGrace:-1,
    blackout:false, boT:0, boKill:0, boMusic:false,
    jang:{ stage:0, timer:5.1, charge:-1, lv:lv.jangseung },
    chars:{}, flick:0, flickT:rand(1.5,4), shakeT:0, toast:'', toastT:0,
    slamFlash:0, camFlash:0, windHold:false
  };
  for (const k in CHAR_DEF){
    const d = CHAR_DEF[k];
    P.chars[k] = { key:k, name:d.name, path:d.path, side:d.side, interval:d.interval,
                   timer:d.interval, pos:0, atDoor:false, patience:0, blockT:-1,
                   lv:lv[k], warned:false, active:true };
  }
  G.P = P; G.state = 'play'; G.stateT = 0;
}

function toast(s){ const P=G.P; if(!P) return; P.toast=s; P.toastT=1.6; }
function kill(key){
  G.dead = { key:(key==='blackout' ? 'wolgwang' : key), cause:CAUSE[key] || CAUSE.bidan,
             night:G.P.night, custom:G.P.custom,
             label:(G.P.custom ? '커스텀 나이트 실패' : G.P.night + ' 박 실패') };
  G.state = 'dead'; G.stateT = 0;
  SFX.scare();
}
function win(){
  G.state='win'; G.stateT=0;
  if (!G.P.custom) G.cleared = Math.max(G.cleared, G.P.night);
  SFX.sixAM();
}
function startCustom(){
  startNight(6, { bidan:CUSTOM.bidan, chorong:CUSTOM.chorong, jangseung:CUSTOM.jangseung,
                  wolgwang:CUSTOM.wolgwang, organ:CUSTOM.organ });
}
function gotoIntro(night){ G.night=night; G.state='intro'; G.stateT=0; }

/* ═════════ 4·5·6. 시뮬레이션 ═════════ */
function updatePlay(dt){
  const P = G.P;

  // 시간
  P.time += dt;
  const h = Math.min(6, Math.floor(P.time / HOUR_SEC));
  if (h !== P.hour){ P.hour = h; if (h < 6) hourBonus(h); }
  if (P.time >= NIGHT_SEC){ win(); return; }

  // 팬 이동: 마우스 X → panX 0~480 보간(계수 6/초)
  if (ptr.moved) P.panTarget = clamp(ptr.x / W, 0, 1) * PAN_MAX;
  P.panX = lerp(P.panX, (P.panTarget === undefined ? PAN_MAX/2 : P.panTarget), clamp(dt*6, 0, 1));

  // 조명 플리커
  P.flickT -= dt;
  if (P.flickT <= 0){ P.flick = rand(0.05, 0.2); P.flickT = rand(1.6, 6.5); }
  if (P.flick > 0) P.flick -= dt;
  if (P.shakeT > 0) P.shakeT -= dt;
  if (P.slamFlash > 0) P.slamFlash -= dt;
  if (P.toastT > 0) P.toastT -= dt;

  // 전력
  if (!P.blackout){
    P.usage = 1 + (P.doorL?1:0) + (P.doorR?1:0) + (P.lightL?1:0) + (P.lightR?1:0) + (P.cam?1:0);
    P.power -= P.k * P.usage * dt;
    if (P.power <= 0){ P.power = 0; startBlackout(); }
  }

  // 정전 시퀀스
  if (P.blackout){
    P.boT += dt;
    if (P.boT >= 3 && !P.boMusic){ P.boMusic = true; SFX.musicBox(); }
    if (P.boT >= P.boKill) kill('blackout');
    return;                                   // 정전 중에는 다른 AI가 멈춘다
  }

  // 카메라 전환 플래시
  if (P.camFlash > 0) P.camFlash -= dt;

  // 감기 버튼 홀드 판정
  P.windHold = !!(P.cam && P.camRoom === 8 && ptr.down && hit(R_WIND, ptr.x, ptr.y));

  // 태엽 오르골
  if (P.organOn){
    const winding = P.cam && P.camRoom === 8 && P.windHold;
    if (winding){
      P.organ = Math.min(100, P.organ + 40*dt);
      if (Math.random() < dt*16) SFX.wind();
    } else {
      P.organ -= P.organRate * dt;
    }
    if (P.organ <= 0){
      P.organ = 0;
      if (P.organGrace < 0){ P.organGrace = 10; SFX.growl(); }
      P.organGrace -= dt;
      if (P.organGrace <= 0){ kill('taeyeop'); return; }
    } else if (P.organGrace >= 0){
      P.organGrace = -1;
    }
  }

  // 애니매트로닉스
  for (const k in P.chars){ const c = P.chars[k]; if (c.active) tickChar(c, dt); }
  tickJang(dt);
}

/* 장승: 커튼 뒤에서 단계 진행 → 서쪽 복도 돌진 */
function tickJang(dt){
  const P = G.P, j = P.jang;
  if (j.charge >= 0){
    j.charge -= dt;
    if (j.charge <= 0){
      j.charge = -1;
      SFX.charge();
      if (P.doorL){                                   // 막았다 — 전력을 대신 가져간다
        j.stage = 0; j.timer = 5.1;
        P.power = Math.max(0, P.power - (5 + P.night));
        P.slamFlash = 0.5; P.shakeT = 0.5;
        SFX.bang();
        toast('장승이 좌측 문을 들이받았다 — 전력 ' + (5 + P.night) + '% 손실');
        if (P.power <= 0) startBlackout();
      } else {
        kill('jangseung');
      }
    }
    return;
  }
  if (P.cam && P.camRoom === 2){ j.timer = 5.1; return; }   // 보는 동안 진행 정지 + 타이머 리셋
  j.timer -= dt;
  if (j.timer > 0) return;
  j.timer = 5.1;
  if (!roll20(j.lv)) return;
  j.stage++;
  if (j.stage >= 3){ j.stage = 3; j.charge = rand(2,6); SFX.growl(); }
  else SFX.step(0.75);
}

/* 카메라 */
function toggleCam(){
  const P = G.P; if (!P || G.state !== 'play' || P.blackout) return;
  P.cam = !P.cam; P.camFlash = 0.3; P.windHold = false;
  SFX.camSwitch();
}
function setCamRoom(n){
  const P = G.P; if (!P.cam || P.camRoom === n) return;
  P.camRoom = n; P.camFlash = 0.3; P.windHold = false;
  SFX.camSwitch();
}

function hourBonus(h){
  const P = G.P;
  if (h>=2 && h<=5){
    ['bidan','chorong'].forEach(k => { P.chars[k].lv = Math.min(20, P.chars[k].lv + 1); });
    P.jang.lv = Math.min(20, P.jang.lv + 1);
  }
  if (h===3 || h===5) P.chars.wolgwang.lv = Math.min(20, P.chars.wolgwang.lv + 1);
}

function tickChar(c, dt){
  const P = G.P;
  // 문에 막혀 후퇴 대기
  if (c.blockT >= 0){
    c.blockT -= dt;
    if (c.blockT <= 0){
      SFX.bang(); c.blockT = -1; c.atDoor = false; c.warned = false;
      c.pos = 0; c.timer = c.interval; P.shakeT = 0.35;
    }
    return;
  }
  // 문 앞 교전
  if (c.atDoor){
    const closed = (c.side === 'L') ? P.doorL : P.doorR;
    if (closed){ c.blockT = 1.5; return; }
    c.patience -= dt;
    if (c.patience < 1.8 && !c.warned){ c.warned = true; SFX.growl(); }   // 직전 단서
    if (c.patience <= 0) kill(c.key);
    return;
  }
  // 전진 판정
  c.timer -= dt;
  if (c.timer > 0) return;
  c.timer = c.interval;
  if (c.key === 'wolgwang' && P.cam && P.camRoom === c.path[c.pos]) return;  // 안 볼 때만 다가온다
  if (!roll20(c.lv)) return;
  c.pos++;
  if (c.pos >= c.path.length - 1){ arriveDoor(c); }
  else { const room = c.path[c.pos]; SFX.step((room===5||room===7) ? 1 : 0.6); }
}
function arriveDoor(c){
  c.pos = c.path.length - 1; c.atDoor = true; c.warned = false;
  c.patience = (c.key === 'wolgwang') ? rand(4,9) : rand(5,13);
  SFX.step(1.15);
}
function atDoorChar(side){
  const P = G.P;
  for (const k in P.chars){
    const c = P.chars[k];
    if (c.active && c.atDoor && c.side === side && c.blockT < 0) return c;
  }
  return null;
}
function startBlackout(){
  const P = G.P;
  P.blackout = true; P.boT = 0; P.boKill = 3 + rand(10,20); P.boMusic = false;
  P.doorL = P.doorR = false; P.lightL = P.lightR = false; P.cam = false;
  SFX.powerDown();
}

/* 조작 */
function toggleDoor(side){
  const P = G.P; if (!P || G.state!=='play' || P.blackout || P.cam) return;
  if (side === 'L') P.doorL = !P.doorL; else P.doorR = !P.doorR;
  SFX.door(side === 'L' ? P.doorL : P.doorR);
}
function toggleLight(side){
  const P = G.P; if (!P || G.state!=='play' || P.blackout) return;
  if (side === 'L') P.lightL = !P.lightL; else P.lightR = !P.lightR;   // 둘 다 켤 수 있다(전력 사용량 +2)
  SFX.camSwitch();
}

function drawOffice(){
  const P = G.P;
  const px = Math.round(P.panX);
  const dim = P.flick > 0 ? 0.45 : 0;

  ctx.save();
  ctx.translate(-px, 0);

  // 뒷벽
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0c13'); g.addColorStop(0.5,'#131620'); g.addColorStop(1,'#06070b');
  ctx.fillStyle = g; ctx.fillRect(0,0,SCENE_W,H);
  // 벽 패널
  ctx.strokeStyle = 'rgba(120,140,180,0.07)'; ctx.lineWidth = 2;
  for (let x=60;x<SCENE_W;x+=150){ ctx.beginPath(); ctx.moveTo(x,110); ctx.lineTo(x,640); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(120,140,180,0.10)';
  ctx.beginPath(); ctx.moveTo(0,118); ctx.lineTo(SCENE_W,118); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,636); ctx.lineTo(SCENE_W,636); ctx.stroke();

  drawPoster(520, 205, '월광 인형극장');
  drawPoster(1040, 215, '금일 공연 없음');
  drawExitSign(1352, 146);
  drawFan(760, 74);
  drawDoorway('L'); drawDoorway('R');
  drawSideButtons('L'); drawSideButtons('R');
  drawLamp(660, 566);
  drawDesk();

  ctx.restore();

  // 조명 플리커 / 장승 충돌 섬광
  if (dim > 0){ ctx.fillStyle = 'rgba(0,0,0,'+dim+')'; ctx.fillRect(0,0,W,H); }
  if (P.slamFlash > 0){ ctx.fillStyle = 'rgba(255,220,180,'+(P.slamFlash*0.5)+')'; ctx.fillRect(0,0,W,H); }

  // 문 앞 위협 경고(인내심이 얼마 남지 않았을 때 화면 가장자리)
  ['L','R'].forEach(side => {
    const c = atDoorChar(side);
    if (!c || c.patience > 1.8) return;
    const a = 0.25 * (1 - c.patience/1.8) * (0.6 + 0.4*Math.sin(G.stateT*22));
    const gr = ctx.createLinearGradient(side==='L'?0:W, 0, side==='L'?220:W-220, 0);
    gr.addColorStop(0,'rgba(120,10,14,'+a+')'); gr.addColorStop(1,'rgba(120,10,14,0)');
    ctx.fillStyle = gr; ctx.fillRect(side==='L'?0:W-220, 0, 220, H);
  });
}

function drawDoorway(side){
  const P = G.P, d = DOOR[side];
  const lightOn = side==='L' ? P.lightL : P.lightR;
  const closed  = side==='L' ? P.doorL  : P.doorR;
  ctx.save();
  // 복도 어둠
  ctx.fillStyle = '#020306'; ctx.fillRect(d.x, d.y, d.w, d.h);
  if (lightOn){
    const inner = (side === 'L') ? -1 : 1;          // 복도가 뻗어 나가는 방향
    const vx = d.cx - inner*72, vy = d.y + d.h*0.42;  // 소실점
    // 복도 바닥
    const fg = ctx.createLinearGradient(d.x, d.y+d.h, d.x, vy);
    fg.addColorStop(0,'rgba(255,226,168,0.20)'); fg.addColorStop(1,'rgba(180,140,80,0.05)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y+d.h); ctx.lineTo(d.x+d.w, d.y+d.h);
    ctx.lineTo(vx+58, vy+40); ctx.lineTo(vx-58, vy+40); ctx.closePath(); ctx.fill();
    // 복도 벽/천장
    const wg = ctx.createLinearGradient(d.x, d.y, d.x, d.y+d.h);
    wg.addColorStop(0,'rgba(255,232,180,0.13)'); wg.addColorStop(0.5,'rgba(255,220,160,0.07)');
    wg.addColorStop(1,'rgba(120,90,50,0.02)');
    ctx.fillStyle = wg; ctx.fillRect(d.x, d.y, d.w, d.h);
    // 먼 벽
    ctx.fillStyle = 'rgba(46,38,28,0.85)';
    ctx.fillRect(vx-58, vy-96, 116, 136);
    ctx.strokeStyle = 'rgba(255,226,170,0.13)'; ctx.lineWidth = 2;
    ctx.strokeRect(vx-58, vy-96, 116, 136);
    // 원근선
    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(vx-58, vy-96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x+d.w, d.y); ctx.lineTo(vx+58, vy-96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x, d.y+d.h); ctx.lineTo(vx-58, vy+40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x+d.w, d.y+d.h); ctx.lineTo(vx+58, vy+40); ctx.stroke();
    // 바닥 빛 번짐
    const fl = ctx.createRadialGradient(d.cx, d.y+d.h, 6, d.cx, d.y+d.h, 260);
    fl.addColorStop(0,'rgba(255,222,164,0.20)'); fl.addColorStop(1,'rgba(255,210,150,0)');
    ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(d.cx, d.y+d.h, 260, 0, Math.PI*2); ctx.fill();
    // 문 앞 개체
    const c = atDoorChar(side);
    if (c){
      if (c.key === 'wolgwang') drawWolgwang(d.cx, d.y+d.h-6, 430, 'sil', G.stateT, true);
      else DRAW[c.key](d.cx, d.y+d.h-6, 430, 'sil', G.stateT);
    }
  }
  // 셔터(문)
  if (closed){
    ctx.fillStyle = '#0a0c13'; ctx.fillRect(d.x-8, d.y-8, d.w+16, d.h+16);
    ctx.strokeStyle = 'rgba(150,170,210,0.2)'; ctx.lineWidth = 2;
    for (let y=d.y; y<d.y+d.h; y+=22){
      ctx.beginPath(); ctx.moveTo(d.x-6, y); ctx.lineTo(d.x+d.w+6, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(60,70,92,0.9)';
    ctx.fillRect(d.cx-34, d.y+d.h-46, 68, 14);
  }
  // 문틀
  ctx.strokeStyle = 'rgba(150,170,210,0.26)'; ctx.lineWidth = 8;
  ctx.strokeRect(d.x-10, d.y-10, d.w+20, d.h+20);
  ctx.restore();
}

function drawSideButtons(side){
  const P = G.P;
  const db = SBTN[side+'door'], lb = SBTN[side+'light'];
  const dOn = side==='L' ? P.doorL : P.doorR;
  const lOn = side==='L' ? P.lightL : P.lightR;
  [[db,'문',dOn,'#e2604a'],[lb,'등',lOn,'#ffd27d']].forEach(([r,label,on,col]) => {
    ctx.save();
    ctx.fillStyle = '#0b0d14'; ctx.fillRect(r.x-6, r.y-6, r.w+12, r.h+12);
    ctx.strokeStyle = 'rgba(150,170,210,0.2)'; ctx.lineWidth = 2;
    ctx.strokeRect(r.x-6, r.y-6, r.w+12, r.h+12);
    if (on){
      const gl = ctx.createRadialGradient(r.x+r.w/2, r.y+r.h/2, 2, r.x+r.w/2, r.y+r.h/2, 130);
      gl.addColorStop(0,'rgba(255,220,160,0.28)');
      gl.addColorStop(1,'rgba(255,220,160,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(r.x+r.w/2, r.y+r.h/2, 130, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = on ? col : '#1a1f2b';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = on ? 'rgba(255,255,255,0.55)' : 'rgba(150,170,210,0.26)';
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    txt(label, r.x+r.w/2, r.y+r.h/2+9, 26, on ? '#1a1208' : '#8e9bb8', 'center', 800);
    ctx.restore();
  });
}

/* ═════════ 정전 ═════════ */
function drawBlackout(){
  const P = G.P;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  if (P.boT >= 3){
    // 좌측 문가에서 월광의 얼굴이 깜빡인다
    const on = (Math.sin(P.boT*9.3) > 0.25) || (Math.random() < 0.05);
    if (on){
      const x = DOOR.L.cx - Math.round(P.panX);
      ctx.save(); ctx.globalAlpha = 0.75 + Math.random()*0.25;
      drawWolgwang(x, 618, 470, 'sil', P.boT);
      ctx.restore();
    }
  }
  grain(0.05);
}

function drawCam(){
  const P = G.P, t = G.stateT;
  drawRoomBG(P.camRoom, t);

  // 방 안의 등장체
  let slot = 0;
  for (const k in P.chars){
    const c = P.chars[k];
    if (!c.active || roomOf(c) !== P.camRoom) continue;
    const x = 300 + slot*280 + ((P.camRoom*83) % 160);

  if (P.camRoom === 2 && P.jang.charge < 0){        // 장승: 단계가 오를수록 다가온다

  if (P.camRoom === 8 && P.organOn){

function drawHUD(){
  const P = G.P;

    ctx.fillRect(r.x, r.y, r.w, r.h);

        camReady ? 'rgba(150,190,170,0.35)' : 'rgba(120,60,60,0.35)');

      camReady ? 'rgba(216,240,228,0.9)' : 'rgba(180,90,90,0.7)', 'center', 700);

  if (P.organOn){
    const org = Math.max(0, Math.ceil(P.organ));

    ctx.fillStyle = 'rgba(120,135,165,0.2)'; ctx.fillRect(78, 46, 190, 12);
    ctx.fillStyle = P.organGrace >= 0 ? '#ff6b52' : (warn ? '#ffb46b' : '#8fe6b8');
    ctx.fillRect(78, 46, 190*(P.organ/100), 12);
    if (P.organGrace >= 0){
      txt('태엽이 멈췄다 — ' + P.organGrace.toFixed(1) + '초', 78, 82, 18,
          'rgba(255,107,82,' + (0.55 + 0.45*Math.sin(G.stateT*12)) + ')', 'left', 800);
    }
  }
  // 음소거
  panel(R_MUTE, 'rgba(12,14,20,0.8)', 'rgba(150,170,210,0.2)');
  txt(SFX.muted ? '🔇' : '🔊', R_MUTE.x+R_MUTE.w/2, R_MUTE.y+21, 17, '#c8d2e6', 'center', 700);
  // 보조 버튼
  for (const k in AUX){
    const r = AUX[k], P2 = G.P;
    const on = (k==='Ldoor'&&P2.doorL)||(k==='Rdoor'&&P2.doorR)||(k==='Llight'&&P2.lightL)||(k==='Rlight'&&P2.lightR);
    panel(r, on ? 'rgba(226,126,74,0.85)' : 'rgba(12,14,20,0.72)', 'rgba(150,170,210,0.22)');
    txt(r.label, r.x+r.w/2, r.y+34, 16, on ? '#1a1208' : 'rgba(190,202,226,0.75)', 'center', 700);
  }
  // 토스트
  if (P.toastT > 0){
    txt(P.toast, W/2, H-80, 18, 'rgba(226,234,250,' + clamp(P.toastT,0,1) + ')', 'center', 700);
  }
}

  });
  panel(R_ORGAN_TOG, CUSTOM.organ ? 'rgba(110,231,168,0.22)' : 'rgba(22,26,36,0.9)', 'rgba(150,170,210,0.4)');
  txt('오르골 ' + (CUSTOM.organ ? 'ON' : 'OFF'), R_ORGAN_TOG.x+R_ORGAN_TOG.w/2, R_ORGAN_TOG.y+36, 21,
      CUSTOM.organ ? '#bff5da' : 'rgba(190,202,226,0.7)', 'center', 800);
  panel(R_CUSTOM_GO, 'rgba(22,26,36,0.9)', 'rgba(150,170,210,0.5)');
  txt('근무 시작', R_CUSTOM_GO.x+R_CUSTOM_GO.w/2, R_CUSTOM_GO.y+36, 22, '#e8eefa', 'center', 800);
  txt('슬라이더를 끌어 0~20 사이로 맞춘다', W/2, 610, 16, 'rgba(160,175,205,0.5)', 'center', 600);
  grain(0.03); vignette(0.5);
}

const ENDING = [
  '6 AM. 다섯 번째 밤이 끝났다.',
  '',
  '극단장의 사무실에는 아무도 없었고,',
  '책상 위에는 다섯 개의 실이 가지런히 놓여 있었다.',
  '실 끝에는 이름표가 하나씩 붙어 있었다.',
  '비단, 초롱, 장승, 월광 — 그리고 마지막 하나는 비어 있었다.',
  '',
  '월광 인형극장은 오늘 밤에도 폐업 상태다.',
  '무대는 언제나 한 자리를 비워 둔다.'
];
const ENDING_20 = [
  '20/20/20/20.',
  '',
  '무대 조명이 전부 켜졌다. 객석에는 다섯이 나란히 앉아 있었다.',
  '누구도 움직이지 않았다. 오늘은 당신이 무대에 섰기 때문이다.',
  '',
  '— 마지막 실은 결국 채워졌다.'
];
function drawEnding(){
  const lines = G.endingKind === 'custom20' ? ENDING_20 : ENDING;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const budget = Math.max(0, G.stateT - 0.4) * 30;
  let used = 0;
  ctx.textAlign = 'left';
  for (let i=0;i<lines.length;i++){
    const line = lines[i];
    if (used > budget) break;
    txt(line.slice(0, Math.max(0, Math.floor(budget - used))), 300, 190 + i*40, 21,
        'rgba(216,226,246,0.92)', 'left', 500);
    used += line.length + 5;
  }
  if (G.stateT > 3){
    txt('화면을 누르면 커스텀 나이트', W/2, H-70, 19,
        'rgba(226,234,250,' + (0.45 + 0.35*Math.sin(G.stateT*3)) + ')', 'center', 700);
  }
  grain(0.03);
}

/* ═════════ 입력 라우팅 ═════════ */
function onKey(k){
  if (G.state === 'play'){
    if (k === 'a') toggleDoor('L');
    else if (k === 'l') toggleDoor('R');
    else if (k === 's') toggleLight('L');
    else if (k === 'k') toggleLight('R');
    else if (k === ' ') toggleCam();
    else if (k === 'm') SFX.setMuted(!SFX.muted);
  } else if (k === 'm') SFX.setMuted(!SFX.muted);
  else if (k === ' ' || k === 'enter') advanceScreen();
}
function advanceScreen(){
  if (G.state === 'title') gotoIntro(1);
  else if (G.state === 'intro') startNight(G.night);
  else if (G.state === 'win'){
    if (G.stateT <= 1.6) return;
    if (G.P.custom){
      const all20 = SLIDERS.every(sl => CUSTOM[sl.k] === 20);
      if (all20){ G.endingKind = 'custom20'; G.state = 'ending'; G.stateT = 0; }
      else { G.state = 'custom'; G.stateT = 0; }
    }
    else if (G.P.night >= 5){ G.endingKind = 'night5'; G.state = 'ending'; G.stateT = 0; }
    else gotoIntro(G.P.night + 1);
  } else if (G.state === 'ending'){
    if (G.stateT <= 3) return;
    G.state = 'custom'; G.stateT = 0;
  } else if (G.state === 'dead'){
    if (G.stateT <= 1.1) return;
    if (G.dead.custom){ G.state = 'custom'; G.stateT = 0; }
    else gotoIntro(G.dead.night);
  }
}
function routeClicks(){
  for (let i=0;i<clicks.length;i++){
    const c = clicks[i];
    if (G.state === 'play'){
      if (hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      if (hit(R_CAMBAR, c.x, c.y)){ toggleCam(); continue; }
      if (G.P.cam){
        let picked = false;
        for (let n=1;n<=9;n++){ if (hit(miniRect(n), c.x, c.y)){ setCamRoom(n); picked = true; break; } }
        if (picked || hit(MINI, c.x, c.y) || hit(R_WIND, c.x, c.y)) continue;
        // 카메라를 보는 동안 복도등은 조작 가능, 문은 불가
        if (hit(AUX.Llight, c.x, c.y)) toggleLight('L');
        else if (hit(AUX.Rlight, c.x, c.y)) toggleLight('R');
        else if (hit(AUX.Ldoor, c.x, c.y) || hit(AUX.Rdoor, c.x, c.y)) toast('카메라를 보는 중에는 문을 조작할 수 없다');
        continue;
      }
      let used = false;
      for (const k in AUX){
        if (hit(AUX[k], c.x, c.y)){
          if (k === 'Ldoor') toggleDoor('L');
          else if (k === 'Rdoor') toggleDoor('R');
          else if (k === 'Llight') toggleLight('L');
          else toggleLight('R');
          used = true; break;
        }
      }
      if (used) continue;
      // 씬 좌표 버튼(화면 좌표 + panX)
      const sx = c.x + G.P.panX, sy = c.y;
      if (hit(SBTN.Ldoor, sx, sy)) toggleDoor('L');
      else if (hit(SBTN.Llight, sx, sy)) toggleLight('L');
      else if (hit(SBTN.Rdoor, sx, sy)) toggleDoor('R');
      else if (hit(SBTN.Rlight, sx, sy)) toggleLight('R');
    } else if (G.state === 'custom'){
      if (hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      let si = -1;
      for (let i=0;i<SLIDERS.length;i++){ if (hit(sliderHit(i), c.x, c.y)){ si = i; break; } }
      if (si >= 0){
        const tr = sliderTrack(si);
        G.drag = si;
        CUSTOM[SLIDERS[si].k] = clamp(Math.round((c.x - tr.x) / tr.w * 20), 0, 20);
        continue;
      }
      if (hit(R_ORGAN_TOG, c.x, c.y)){ CUSTOM.organ = !CUSTOM.organ; continue; }
      if (hit(R_CUSTOM_GO, c.x, c.y)){ startCustom(); continue; }
    } else {
      if (hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      if (G.state === 'title' && G.cleared >= 5 && hit(R_TITLE_CUS, c.x, c.y)){
        G.state = 'custom'; G.stateT = 0; continue;
      }
      advanceScreen();
    }
  }
  clicks.length = 0;
}

/* ═════════ 메인 루프 ═════════ */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);              // 탭 전환 시 시간 폭주 방지

  G.stateT += dt; G.titleT += dt; G.fanA += dt * 3.1;
  routeClicks();

  // 커스텀 나이트 슬라이더 드래그
  if (G.state === 'custom'){
    if (!ptr.down) G.drag = -1;
    if (G.drag >= 0){
      const tr = sliderTrack(G.drag);
      CUSTOM[SLIDERS[G.drag].k] = clamp(Math.round((ptr.x - tr.x) / tr.w * 20), 0, 20);
    }
  } else G.drag = -1;

  if (G.state === 'play') updatePlay(dt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  if (G.state === 'title') drawTitle();
  else if (G.state === 'intro') drawIntro();
  else if (G.state === 'play'){
    const P = G.P;
    ctx.save();
    if (P.shakeT > 0){ const s = P.shakeT * 14; ctx.translate(rand(-s,s), rand(-s,s)); }
    if (P.blackout) drawBlackout();
    else if (P.cam) drawCam();
    else drawOffice();
    ctx.restore();
    drawHUD();
    grain(0.035 + Math.random()*0.015);
    vignette(0.6);
  }
  else if (G.state === 'win') drawWin();
  else if (G.state === 'dead') drawDead();
  else if (G.state === 'ending') drawEnding();
  else if (G.state === 'custom') drawCustom();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
