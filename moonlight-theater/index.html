<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>월광 인형극장</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center;
         touch-action:none; -webkit-user-select:none; user-select:none;
         -webkit-tap-highlight-color:transparent; }
  #c { display:block; background:#000; image-rendering:auto; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
(function(){
/* ═════════ 0. 기본 상수 / 캔버스 ═════════ */
const W = 1280, H = 720;              // 내부 고정 해상도
const SCENE_W = 1760;                 // 사무실 씬 폭
const PAN_MAX = SCENE_W - W;          // 0 ~ 480
const HOUR_SEC = 35;                  // 1시간 = 35초 (짧고 빡세게)
const NIGHT_SEC = HOUR_SEC * 6;       // 한 밤 = 210초
const RATE_SCALE = 300 / NIGHT_SEC;   // 밤이 짧아진 만큼 전력·태엽 소모를 비례해 올린다
const K_POWER = [0.10, 0.115, 0.13, 0.145, 0.16];
const ORGAN_DRAIN = [0, 0, 1.6, 2.0, 2.4];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function fitCanvas(){
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

/* ═════════ 유틸 ═════════ */
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));      // 양끝 포함
const roll20 = lvl => randi(1,20) <= lvl;            // random(1,20) <= AI레벨
const pick = arr => arr[(Math.random()*arr.length)|0];
function hit(r, x, y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }



/* ═════════ 1. 입력 (마우스 + 터치 + 키보드) ═════════ */
const ptr = { x: W/2, y: H/2, down:false, moved:false };
const clicks = [];        // 이번 프레임에 처리할 탭/클릭
const keys = {};

function toCanvas(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x:(clientX - r.left) * (W / r.width), y:(clientY - r.top) * (H / r.height) };
}
function pDown(cx, cy){
  SFX.ensure();
  const p = toCanvas(cx, cy);
  ptr.x = p.x; ptr.y = p.y; ptr.down = true; ptr.moved = true;
  clicks.push({ x:p.x, y:p.y });
}
function pMove(cx, cy){
  const p = toCanvas(cx, cy);
  ptr.x = p.x; ptr.y = p.y; ptr.moved = true;
}
if (window.PointerEvent){
  canvas.addEventListener('pointerdown', e => { pDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('pointermove', e => pMove(e.clientX, e.clientY));
  window.addEventListener('pointerup',     () => { ptr.down = false; });
  window.addEventListener('pointercancel', () => { ptr.down = false; });
} else {
  canvas.addEventListener('mousedown', e => { pDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => pMove(e.clientX, e.clientY));
  window.addEventListener('mouseup',   () => { ptr.down = false; });
  canvas.addEventListener('touchstart', e => { const t=e.changedTouches[0]; pDown(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchmove',  e => { const t=e.changedTouches[0]; pMove(t.clientX,t.clientY); e.preventDefault(); }, {passive:false});
  window.addEventListener('touchend',   () => { ptr.down = false; });
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'spacebar') e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  SFX.ensure();
  onKey(k);
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ═════════ 9. WebAudio 합성 사운드 (외부 음원 없음) ═════════ */
const SFX = {
  ac:null, master:null, muted:false, noiseBuf:null, fanGain:null,

  ensure(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ac = new AC(); } catch(e){ return; }
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ac.destination);
    this.noiseBuf = this._noise(2);
    this._ambient();
  },
  setMuted(m){ this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.9; },
  get t(){ return this.ac ? this.ac.currentTime : 0; },

  _noise(sec){
    const ac = this.ac, n = Math.floor(ac.sampleRate*sec);
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
    return buf;
  },
  _src(loop){ const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf; s.loop = !!loop; return s; },
  /* 좌우 정위 출력 — 소리가 어느 쪽에서 나는지 몸으로 알게 한다 */
  _out(pan){
    const ac = this.ac, g = ac.createGain();
    if (pan && ac.createStereoPanner){
      const p = ac.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, pan));
      g.connect(p); p.connect(this.master);
    } else g.connect(this.master);
    return g;
  },
  _env(g, t, peak, dur, atk){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (atk||0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },

  /* 환경음: 노이즈 → lowpass 300Hz (gain 0.04) + 60Hz 험 + 환풍기 */
  _ambient(){
    const ac = this.ac;
    const n = this._src(true), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 300;
    const g = ac.createGain(); g.gain.value = 0.04;
    n.connect(lp); lp.connect(g); g.connect(this.master); n.start();

    const hum = ac.createOscillator(); hum.type = 'sine'; hum.frequency.value = 60;
    const hg = ac.createGain(); hg.gain.value = 0.018;
    hum.connect(hg); hg.connect(this.master); hum.start();

    // 환풍기: 노이즈 → bandpass 800Hz + 느린 LFO
    const fn = this._src(true), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 1.1;
    const fg = ac.createGain(); fg.gain.value = 0.022;
    fn.connect(bp); bp.connect(fg); fg.connect(this.master); fn.start();
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.9;
    const lg = ac.createGain(); lg.gain.value = 0.013;
    lfo.connect(lg); lg.connect(fg.gain); lfo.start();
    this.fanGain = fg;
    this._layers();
  },

  /* 공포 지속 레이어: 저역 드론 + 문 너머 숨소리 */
  _layers(){
    const ac = this.ac;
    // 40Hz 부근 두 개를 살짝 어긋나게 — 맥놀이가 불안을 만든다
    const d1 = ac.createOscillator(); d1.type = 'sawtooth'; d1.frequency.value = 40.5;
    const d2 = ac.createOscillator(); d2.type = 'sawtooth'; d2.frequency.value = 41.3;
    const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 150;
    const dg = ac.createGain(); dg.gain.value = 0;
    d1.connect(dlp); d2.connect(dlp); dlp.connect(dg); dg.connect(this.master);
    d1.start(); d2.start(); this.droneGain = dg;

    // 숨소리: 대역 노이즈를 아주 느린 LFO로 들숨/날숨처럼
    const bn = this._src(true);
    const bbp = ac.createBiquadFilter(); bbp.type = 'bandpass'; bbp.frequency.value = 480; bbp.Q.value = 1.7;
    const bg = ac.createGain(); bg.gain.value = 0;
    const bamp = ac.createGain(); bamp.gain.value = 0;
    bn.connect(bbp); bbp.connect(bamp); bamp.connect(bg);
    if (ac.createStereoPanner){
      const bp = ac.createStereoPanner(); bp.pan.value = 0;
      bg.connect(bp); bp.connect(this.master); this.breathPan = bp;
    } else bg.connect(this.master);
    const blfo = ac.createOscillator(); blfo.type = 'sine'; blfo.frequency.value = 0.42;
    const blg = ac.createGain(); blg.gain.value = 0.55;
    const boff = ac.createConstantSource ? ac.createConstantSource() : null;
    if (boff){ boff.offset.value = 0.5; boff.connect(bamp.gain); boff.start(); }
    else bamp.gain.value = 0.5;
    blfo.connect(blg); blg.connect(bamp.gain); blfo.start();
    bn.start(); this.breathGain = bg;
  },

  /* 드레드(공포 수위) 연동 */
  setDread(v){
    if (!this.droneGain) return;
    this.droneGain.gain.setTargetAtTime(0.075 * v * v, this.t, 0.6);
  },
  setBreath(v, pan){
    if (!this.breathGain) return;
    this.breathGain.gain.setTargetAtTime(0.11 * v, this.t, 0.35);
    if (this.breathPan) this.breathPan.pan.setTargetAtTime(pan || 0, this.t, 0.4);
  },
  /* 심장박동 — 두 번 친다. 가까울수록 세고 빠르게 */
  heart(strength){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    [0, 0.17].forEach((off, i) => {
      const t = t0 + off;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(64, t); o.frequency.exponentialRampToValueAtTime(30, t+0.16);
      const g = ac.createGain();
      this._env(g, t, (i ? 0.24 : 0.34) * strength, 0.2, 0.008);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.24);
    });
  },
  /* 속삭임 — 말은 아닌데 사람 같은 것 */
  whisper(pan){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    const out = this._out(pan);
    const n = this._src();
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
    const g = ac.createGain(); g.gain.value = 0;
    n.connect(bp); bp.connect(g); g.connect(out);
    const syll = 2 + ((Math.random()*3)|0);
    let t = t0;
    for (let i=0;i<syll;i++){
      const f = 420 + Math.random()*900;
      bp.frequency.setValueAtTime(f, t);
      bp.frequency.linearRampToValueAtTime(f*(0.7+Math.random()*0.5), t+0.16);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.10, t+0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.2);
      t += 0.19 + Math.random()*0.12;
    }
    n.start(t0); n.stop(t + 0.3);
  },
  /* 문을 긁는 소리 — 닫아 둬도 안전하지 않다 */
  scrape(pan){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const out = this._out(pan);
    const n = this._src();
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 14;
    bp.frequency.setValueAtTime(1400, t);
    bp.frequency.linearRampToValueAtTime(600 + Math.random()*900, t+0.6);
    const g = ac.createGain(); this._env(g, t, 0.16, 0.7, 0.05);
    n.connect(bp); bp.connect(g); g.connect(out); n.start(t); n.stop(t+0.75);
  },
  /* 환경음을 잠시 끊는다 — 정적이 가장 무섭다 */
  duck(sec){
    if (!this.ambGain) return; const t = this.t;
    [this.ambGain, this.fanGain, this.droneGain, this.breathGain, this.music.padGain].forEach(g => {
      if (!g) return;
      const v = g.gain.value;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(v, t);
      g.gain.linearRampToValueAtTime(0.0001, t+0.06);
      g.gain.setValueAtTime(0.0001, t+sec);
      g.gain.linearRampToValueAtTime(v, t+sec+0.5);
    });
  },
  /* 점프스케어 후 이명 */
  tinnitus(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 5200;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.05, t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t+4.5);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+4.6);
  },

  /* 문 여닫힘: 60Hz 사인 감쇠 + lowpass 노이즈 버스트 */
  door(closing){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(closing ? 78 : 58, t);
    o.frequency.exponentialRampToValueAtTime(36, t+0.34);
    const g = ac.createGain(); this._env(g, t, 0.55, 0.42, 0.005);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.5);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 430;
    const ng = ac.createGain(); this._env(ng, t, 0.32, 0.26, 0.004);
    n.connect(lp); lp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.3);
  },
  /* 카메라 전환: 0.15초 highpass 노이즈 */
  camSwitch(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const n = this._src(), hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2400;
    const g = ac.createGain(); this._env(g, t, 0.3, 0.15, 0.003);
    n.connect(hp); hp.connect(g); g.connect(this.master); n.start(t); n.stop(t+0.18);
  },
  /* 복도 발소리: 저역 임팩트 */
  step(vol, pan){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const out = this._out(pan);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(rand(90,130), t);
    o.frequency.exponentialRampToValueAtTime(42, t+0.18);
    const g = ac.createGain(); this._env(g, t, 0.24*(vol||1), 0.22, 0.004);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+0.26);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    const ng = ac.createGain(); this._env(ng, t, 0.12*(vol||1), 0.14, 0.003);
    n.connect(lp); lp.connect(ng); ng.connect(out); n.start(t); n.stop(t+0.16);
  },
  /* 문에 막혀 후퇴할 때의 쾅 */
  bang(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(34, t+0.5);
    const g = ac.createGain(); this._env(g, t, 0.6, 0.6, 0.003);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.66);
    const n = this._src(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1600;
    const ng = ac.createGain(); this._env(ng, t, 0.45, 0.35, 0.002);
    n.connect(lp); lp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+0.4);
  },
  /* 장승 돌진: 빠른 연속 타격음 + 상승 노이즈 */
  charge(){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    for (let i=0;i<9;i++){
      const t = t0 + i*0.085;
      const o = ac.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(160 + i*14, t);
      o.frequency.exponentialRampToValueAtTime(60, t+0.07);
      const g = ac.createGain(); this._env(g, t, 0.22, 0.09, 0.002);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.1);
    }
    const n = this._src(), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(3600, t0+0.8);
    const g = ac.createGain(); this._env(g, t0, 0.35, 0.9, 0.2);
    n.connect(bp); bp.connect(g); g.connect(this.master); n.start(t0); n.stop(t0+1.0);
  },
  /* 오르골: triangle 단조 8마디, 점점 느려짐 */
  musicBox(){
    if (!this.ac) return 0; const ac = this.ac; let t = this.t + 0.05;
    const seq = [69,72,76,81, 79,76,72,71, 69,72,76,79, 77,76,74,72,
                 69,71,72,74, 76,74,72,71, 69,64,67,69, 72,69,68,69];
    let step = 0.30;
    for (let i=0;i<seq.length;i++){
      const f = 440*Math.pow(2,(seq[i]-69)/12);
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      o.detune.value = -i*7 - (Math.random()<0.18 ? 90 : 0);   // 갈수록 음이 틀어진다
      const g = ac.createGain(); this._env(g, t, 0.17, step*1.7, 0.008);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+step*1.9);
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f*2;
      const g2 = ac.createGain(); this._env(g2, t, 0.05, step*1.2, 0.008);
      o2.connect(g2); g2.connect(this.master); o2.start(t); o2.stop(t+step*1.4);
      t += step; step *= 1.055;              // 점점 느려짐(감기지 않은 태엽처럼)
    }
    return t - this.t;
  },
  /* 태엽 감는 소리 */
  wind(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = rand(700,980);
    const g = ac.createGain(); this._env(g, t, 0.05, 0.05, 0.002);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.06);
  },
  /* 점프스케어: 비명(포먼트) + 디튠 saw 하강 + 링모듈 + 서브베이스 낙하, 1.2초 */
  scare(intensity){
    if (!this.ac) return; const ac = this.ac, t = this.t, D = 1.2;
    const IV = (intensity === undefined) ? 1 : intensity;
    const ws = ac.createWaveShaper();
    const curve = new Float32Array(1024);
    for (let i=0;i<1024;i++){ const x = i/512 - 1; curve[i] = Math.tanh(x*9); }
    ws.curve = curve; ws.oversample = '4x';
    const g = ac.createGain();
    g.gain.setValueAtTime(0.62*IV, t);
    g.gain.setValueAtTime(0.62*IV, t+D*0.72);
    g.gain.exponentialRampToValueAtTime(0.0005, t+D);
    ws.connect(g); g.connect(this.master);

    // 하강하는 디튠 톱니 3개
    [0, 17, -23].forEach(det => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = det;
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(38, t+D);
      o.connect(ws); o.start(t); o.stop(t+D);
    });
    // 사람 목소리 비슷한 포먼트 — 비명처럼 들리게
    [720, 1240, 2600].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(300, t);
      o.frequency.linearRampToValueAtTime(180, t+D*0.8);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 9;
      bp.frequency.setValueAtTime(f, t);
      bp.frequency.linearRampToValueAtTime(f*0.55, t+D*0.9);
      const fg = ac.createGain(); fg.gain.value = 0.5/(i+1);
      o.connect(bp); bp.connect(fg); fg.connect(ws);
      o.start(t); o.stop(t+D);
    });
    // 링모듈레이션 — 금속성 왜곡
    const ring = ac.createOscillator(); ring.type = 'sine'; ring.frequency.value = 61;
    const rg = ac.createGain(); rg.gain.value = 0.5;
    ring.connect(rg); rg.connect(ws); ring.start(t); ring.stop(t+D);
    // 서브베이스 낙하
    const sub = ac.createOscillator(); sub.type = 'sine';
    sub.frequency.setValueAtTime(120, t); sub.frequency.exponentialRampToValueAtTime(24, t+0.9);
    const sg = ac.createGain(); this._env(sg, t, 0.75*IV, 1.0, 0.002);
    sub.connect(sg); sg.connect(this.master); sub.start(t); sub.stop(t+1.05);
    // 노이즈 파열
    const n = this._src(), hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 150;
    const ng = ac.createGain(); this._env(ng, t, 0.55*IV, D, 0.003);
    n.connect(hp); hp.connect(ng); ng.connect(this.master); n.start(t); n.stop(t+D);
    if (IV > 0.75) this.tinnitus();
  },


  /* ═════════ 배경 음악 — 전부 합성. 외부 음원을 쓰지 않으니 저작권 문제가 없다 ═════════
     구성: (1) 지속되는 패드 화음  (2) 느린 베이스 진행  (3) 드문드문 떨어지는 단음
           (4) 시간이 갈수록 빨라지는 맥박  (5) 5 AM의 초침
     밤이 깊을수록 층이 하나씩 늘어난다. */
  music:{ mode:0, next:0, step:0, root:0, pad:null, padGain:null, padFilter:null },
  MUSIC_MODES: ['켬', '끔'],

  MUSIC_SCALE: [0, 3, 5, 7, 10, 12, 15],          // 단조 펜타 계열
  MUSIC_BASS:  [-24, -22, -19, -17],

  musicInit(){
    if (!this.ac || this.music.pad) return;
    const ac = this.ac;
    const g = ac.createGain(); g.gain.value = 0;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.8;
    f.connect(g); g.connect(this.master);
    const oscs = [];
    [-12, -5, 0, 7].forEach((semi, i) => {
      const o = ac.createOscillator();
      o.type = i % 2 ? 'triangle' : 'sine';
      o.frequency.value = 110 * Math.pow(2, semi/12);
      o.detune.value = (i - 1.5) * 6;
      const og = ac.createGain(); og.gain.value = 0.25 / (i + 1);
      o.connect(og); og.connect(f); o.start();
      oscs.push(o);
    });
    // 아주 느린 필터 흔들림 — 숨 쉬는 것처럼
    const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06;
    const lg = ac.createGain(); lg.gain.value = 160;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    this.music.pad = oscs; this.music.padGain = g; this.music.padFilter = f;
  },
  musicToggle(){
    this.music.mode = (this.music.mode + 1) % 2;
    return this.MUSIC_MODES[this.music.mode];
  },
  musicNote(t, semi, dur, vol, type){
    const ac = this.ac;
    const o = ac.createOscillator(); o.type = type || 'triangle';
    o.frequency.value = 220 * Math.pow(2, semi/12);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  /* 매 프레임 호출. 0.7초 앞까지 미리 예약한다 */
  musicUpdate(hour, dread, blackout){
    if (!this.ac) return;
    this.musicInit();
    const M = this.music;
    const layer = clamp(hour, 0, 5);                       // 시간이 갈수록 두꺼워진다
    const synthMode = (M.mode === 0);
    if (M.padGain){
      M.padGain.gain.setTargetAtTime(
        (synthMode && !blackout) ? 0.05 + layer*0.012 + dread*0.03 : 0, this.t, 1.2);
    }
    // 5 AM 초침
    if (synthMode && hour >= 5 && !blackout){
      if (M.tick === undefined || M.tick < this.t){
        M.tick = (M.tick === undefined ? this.t : M.tick) + 1.0;
        const o = this.ac.createOscillator(); o.type = 'square'; o.frequency.value = 1750;
        const g = this.ac.createGain(); this._env(g, this.t, 0.035, 0.05, 0.001);
        o.connect(g); g.connect(this.master); o.start(this.t); o.stop(this.t + 0.06);
      }
    }
    if (!synthMode || blackout) return;
    const stepDur = 1.05 - layer*0.075 - dread*0.12;       // 갈수록 빨라진다
    if (M.next < this.t) M.next = this.t + 0.1;
    while (M.next < this.t + 0.7){
      const t = M.next, s = M.step;
      // 베이스: 네 스텝마다 한 번
      if (s % 4 === 0){
        M.root = (M.root + 1 + ((Math.random()*2)|0)) % this.MUSIC_BASS.length;
        this.musicNote(t, this.MUSIC_BASS[M.root], stepDur*3.4, 0.075, 'sine');
      }
      // 맥박: 2 AM 이후
      if (layer >= 2 && s % 2 === 0){
        this.musicNote(t, -31, 0.28, 0.05 + layer*0.008, 'sine');
      }
      // 단음: 드물게, 밤이 깊을수록 자주
      if (Math.random() < 0.2 + layer*0.07 + dread*0.15){
        const sc = this.MUSIC_SCALE[(Math.random()*this.MUSIC_SCALE.length)|0];
        this.musicNote(t + stepDur*0.5*Math.random(), sc, stepDur*(1.6 + Math.random()), 0.055, 'triangle');
      }
      M.next += stepDur;
      M.step = (s + 1) % 16;
    }
  },

  /* 장승의 돌진 예고 — 서쪽에서 울리는 발구름 세 번 */
  stomp(pan){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    const out = this._out(pan);
    for (let i=0;i<3;i++){
      const t = t0 + i*0.34;
      const o = ac.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(52, t); o.frequency.exponentialRampToValueAtTime(26, t+0.3);
      const g = ac.createGain(); this._env(g, t, 0.5, 0.36, 0.004);
      o.connect(g); g.connect(out); o.start(t); o.stop(t+0.4);
      const n = this._src(), lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 300;
      const ng = ac.createGain(); this._env(ng, t, 0.22, 0.3, 0.003);
      n.connect(lp); lp.connect(ng); ng.connect(out); n.start(t); n.stop(t+0.34);
    }
  },

  /* 순함 모드의 사망음 — 놀라게 하지 않고 끝을 알린다 */
  softEnd(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    [220, 165, 110].forEach((f, i) => {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ac.createGain(); this._env(g, t + i*0.18, 0.22/(i+1), 1.6, 0.03);
      o.connect(g); g.connect(this.master); o.start(t + i*0.18); o.stop(t + i*0.18 + 1.7);
    });
  },

  /* 정전 */
  powerDown(){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(18, t+1.6);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const g = ac.createGain(); this._env(g, t, 0.3, 1.8, 0.02);
    o.connect(lp); lp.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.9);
  },
  /* 6 AM: 벨 사인 + 노이즈 환호 */
  sixAM(){
    if (!this.ac) return; const ac = this.ac, t0 = this.t;
    for (let i=0;i<4;i++){
      const t = t0 + i*0.62;
      [1, 2.01, 3.02, 4.4].forEach((h, j) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 523.25*h;
        const g = ac.createGain(); this._env(g, t, 0.22/(j+1), 1.5, 0.004);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t+1.6);
      });
    }
    const n = this._src(true), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.1, t0+0.7);
    g.gain.linearRampToValueAtTime(0.0001, t0+3.4);
    n.connect(bp); bp.connect(g); g.connect(this.master); n.start(t0); n.stop(t0+3.6);
  },
  /* 문 앞 위협 경고(직전 단서) */
  growl(pan){
    if (!this.ac) return; const ac = this.ac, t = this.t;
    const out = this._out(pan);
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = rand(52,70);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    const g = ac.createGain(); this._env(g, t, 0.24, 1.0, 0.15);
    o.connect(lp); lp.connect(g); g.connect(out); o.start(t); o.stop(t+1.1);
    // 위에 얹는 숨 섞인 쇳소리
    const n = this._src(), bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 3;
    const ng = ac.createGain(); this._env(ng, t, 0.09, 0.9, 0.2);
    n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t); n.stop(t+1.0);
  }
};

/* ═════════ 화면 효과 헬퍼 ═════════ */
const noiseTiles = [];
for (let i=0;i<5;i++){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const c2 = cv.getContext('2d'); const img = c2.createImageData(256,256);
  for (let p=0;p<256*256;p++){
    const v = (Math.random()*255)|0;
    img.data[p*4] = img.data[p*4+1] = img.data[p*4+2] = v; img.data[p*4+3] = 255;
  }
  c2.putImageData(img,0,0); noiseTiles.push(cv);
}
function grain(alpha){
  const t = noiseTiles[(Math.random()*noiseTiles.length)|0];
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'lighter';
  for (let y=-8;y<H;y+=256) for (let x=-8;x<W;x+=256)
    ctx.drawImage(t, x + ((Math.random()*8)|0), y + ((Math.random()*8)|0));
  ctx.restore();
}
function vignette(strength){
  const g = ctx.createRadialGradient(W/2, H/2, H*0.28, W/2, H/2, H*0.92);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,' + strength + ')');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function txt(s, x, y, size, color, align, weight){
  ctx.fillStyle = color || '#d8dff0';
  ctx.font = (weight || 600) + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function panel(r, fill, stroke){
  ctx.fillStyle = fill; ctx.fillRect(r.x, r.y, r.w, r.h);
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2); }
}

/* ═════════ 5. 캐릭터 실루엣 (전부 도형 조합) ═════════ */
// mode: 'sil' 역광 검은 실루엣 + 얇은 림라이트 / 'cam' 회녹색 저대비 / 'scare' 점프스케어
function skin(mode){
  if (mode === 'cam')   return { fill:'#0e1611', rim:'rgba(140,186,160,0.26)', hot:'#7fd6a8', dim:'#1b2620' };
  if (mode === 'scare') return { fill:'#0b0b10', rim:'rgba(255,255,255,0.85)', hot:'#fff4d8', dim:'#1b1b22' };
  return { fill:'#020306', rim:'rgba(190,214,255,0.2)', hot:'#e8b878', dim:'#06070c' };
}
function rimPath(sk, w){ ctx.fillStyle = sk.fill; ctx.fill(); ctx.strokeStyle = sk.rim; ctx.lineWidth = w||2; ctx.stroke(); }

/** 비단 — 실에 매달린 마리오네트, 금 간 도자기 가면, 꿰맨 입 */
function drawBidan(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const sway = Math.sin((t||0)*1.2) * 3*u;
  ctx.save();
  // 매달린 실
  ctx.strokeStyle = mode==='cam' ? 'rgba(160,200,180,0.35)' : 'rgba(210,225,255,0.22)';
  ctx.lineWidth = Math.max(1, u*0.5);
  [[-26,32],[26,32],[0,16]].forEach(p => {
    ctx.beginPath(); ctx.moveTo(x + p[0]*u*0.6, top - h*1.3);
    ctx.lineTo(x + p[0]*u + sway, top + p[1]*u); ctx.stroke();
  });
  // 몸통
  ctx.beginPath();
  ctx.moveTo(x-20*u+sway, top+34*u); ctx.lineTo(x+20*u+sway, top+34*u);
  ctx.lineTo(x+13*u+sway, top+68*u); ctx.lineTo(x-13*u+sway, top+68*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 어깨 가로대
  ctx.beginPath(); ctx.rect(x-28*u+sway, top+31*u, 56*u, 4.5*u); rimPath(sk, u*0.6);
  // 늘어진 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(x + s*26*u + sway, top+34*u);
    ctx.lineTo(x + s*31*u + sway*1.4, top+54*u);
    ctx.lineTo(x + s*25*u + sway*1.8, top+74*u); ctx.stroke();
  });
  // 다리
  ctx.lineWidth = 6*u;
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x + s*9*u + sway, top+66*u);
    ctx.lineTo(x + s*11*u, base); ctx.stroke();
  });
  // 가면 머리
  const hx = x + sway*1.2, hy = top + 17*u;
  ctx.beginPath(); ctx.ellipse(hx, hy, 14*u, 16*u, 0, 0, Math.PI*2); rimPath(sk, u*0.9);
  // 금 간 자국
  ctx.strokeStyle = sk.rim; ctx.lineWidth = Math.max(1, u*0.7);
  ctx.beginPath(); ctx.moveTo(hx-5*u, hy-14*u); ctx.lineTo(hx-2*u, hy-4*u);
  ctx.lineTo(hx-6*u, hy+2*u); ctx.lineTo(hx-3*u, hy+9*u); ctx.stroke();
  // 눈
  ctx.fillStyle = mode==='cam' ? sk.dim : '#000';
  [-5,5].forEach(s => { ctx.beginPath(); ctx.ellipse(hx+s*u, hy-3*u, 2.6*u, 3.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  if (mode === 'scare'){
    ctx.fillStyle = '#e8e2d0';
    [-5,5].forEach(s => { ctx.beginPath(); ctx.ellipse(hx+s*u, hy-3*u, 2.6*u, 3.4*u, 0, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = '#000';
    [-5,5].forEach(s => { ctx.beginPath(); ctx.arc(hx+s*u, hy-3*u, 1.2*u, 0, Math.PI*2); ctx.fill(); });
  }
  // 꿰맨 입
  ctx.strokeStyle = sk.rim; ctx.lineWidth = Math.max(1, u*0.8);
  ctx.beginPath(); ctx.moveTo(hx-7*u, hy+8*u); ctx.lineTo(hx+7*u, hy+8*u); ctx.stroke();
  for (let i=-3;i<=3;i++){
    ctx.beginPath(); ctx.moveTo(hx+i*2.2*u, hy+6*u); ctx.lineTo(hx+i*2.2*u, hy+10*u); ctx.stroke();
  }
  ctx.restore();
}

/** 초롱 — 등불 머리, 머리 안에서 주황 불빛이 흔들림 */
function drawChorong(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const fl = 0.72 + Math.sin((t||0)*9.1)*0.12 + Math.sin((t||0)*3.3)*0.1;
  ctx.save();
  // 장삼 같은 몸통
  ctx.beginPath();
  ctx.moveTo(x-15*u, top+34*u); ctx.lineTo(x+15*u, top+34*u);
  ctx.lineTo(x+26*u, base); ctx.lineTo(x-26*u, base);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 소매
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*14*u, top+38*u);
    ctx.lineTo(x+s*27*u, top+58*u); ctx.lineTo(x+s*21*u, top+72*u); ctx.stroke();
  });
  // 등불 머리(육각 등롱)
  const hy = top + 18*u;
  ctx.beginPath();
  ctx.moveTo(x-9*u, hy-18*u); ctx.lineTo(x+9*u, hy-18*u); ctx.lineTo(x+15*u, hy-4*u);
  ctx.lineTo(x+15*u, hy+10*u); ctx.lineTo(x+9*u, hy+18*u); ctx.lineTo(x-9*u, hy+18*u);
  ctx.lineTo(x-15*u, hy+10*u); ctx.lineTo(x-15*u, hy-4*u);
  ctx.closePath();
  // 내부 불빛
  const g = ctx.createRadialGradient(x, hy, 1, x, hy, 20*u);
  if (mode === 'cam'){ g.addColorStop(0,'rgba(190,240,210,'+(0.5*fl)+')'); g.addColorStop(1,'rgba(40,60,50,0.1)'); }
  else { g.addColorStop(0,'rgba(255,176,72,'+(0.92*fl)+')'); g.addColorStop(0.6,'rgba(214,104,24,'+(0.45*fl)+')'); g.addColorStop(1,'rgba(40,16,6,0.15)'); }
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.9; ctx.stroke();
  // 등롱 살
  ctx.strokeStyle = mode==='cam' ? 'rgba(20,30,25,0.7)' : 'rgba(20,10,4,0.75)';
  ctx.lineWidth = u*0.8;
  for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(x+i*6*u, hy-18*u); ctx.lineTo(x+i*6*u, hy+18*u); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x-15*u, hy); ctx.lineTo(x+15*u, hy); ctx.stroke();
  // 고리
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.8;
  ctx.beginPath(); ctx.arc(x, hy-21*u, 3.4*u, Math.PI, Math.PI*2); ctx.stroke();
  ctx.restore();
}

/** 장승 — 장대 다리, 나무 탈, 벌어진 이빨 */
function drawJangseung(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const sway = Math.sin((t||0)*2.4)*2*u;
  ctx.save();
  // 장대 다리
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u; ctx.lineCap = 'butt';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*8*u+sway, top+52*u); ctx.lineTo(x+s*13*u, base); ctx.stroke();
    ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.7;
    ctx.beginPath(); ctx.moveTo(x+s*8*u+sway, top+52*u); ctx.lineTo(x+s*13*u, base); ctx.stroke();
    ctx.strokeStyle = sk.fill; ctx.lineWidth = 7*u;
  });
  // 좁은 몸통
  ctx.beginPath();
  ctx.moveTo(x-13*u+sway, top+26*u); ctx.lineTo(x+13*u+sway, top+26*u);
  ctx.lineTo(x+10*u+sway, top+54*u); ctx.lineTo(x-10*u+sway, top+54*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 긴 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5.5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*13*u+sway, top+29*u);
    ctx.lineTo(x+s*22*u+sway, top+50*u); ctx.lineTo(x+s*19*u+sway, top+72*u); ctx.stroke();
  });
  // 나무 탈
  const hy = top + 14*u;
  ctx.beginPath();
  ctx.moveTo(x-13*u+sway, hy-14*u); ctx.lineTo(x+13*u+sway, hy-14*u);
  ctx.lineTo(x+11*u+sway, hy+15*u); ctx.lineTo(x-11*u+sway, hy+15*u);
  ctx.closePath(); rimPath(sk, u*0.9);
  // 뿔 같은 상투
  ctx.beginPath(); ctx.moveTo(x-6*u+sway, hy-14*u); ctx.lineTo(x+sway, hy-24*u);
  ctx.lineTo(x+6*u+sway, hy-14*u); ctx.closePath(); rimPath(sk, u*0.7);
  // 눈
  ctx.fillStyle = mode==='sil' ? '#000' : sk.dim;
  [-5.5,5.5].forEach(s => { ctx.beginPath(); ctx.ellipse(x+s*u+sway, hy-4*u, 3.2*u, 2.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  if (mode === 'scare'){
    ctx.fillStyle = '#f4e9cf';
    [-5.5,5.5].forEach(s => { ctx.beginPath(); ctx.ellipse(x+s*u+sway, hy-4*u, 3.2*u, 2.4*u, 0, 0, Math.PI*2); ctx.fill(); });
  }
  // 벌어진 이빨
  ctx.fillStyle = mode==='cam' ? '#cfe6d6' : '#e9e0c8';
  for (let i=-3;i<=3;i++){
    const tw = 2.3*u, th = (i%2===0 ? 7*u : 5*u);
    ctx.fillRect(x + i*3.1*u - tw/2 + sway, hy+6*u, tw, th);
  }
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.6;
  ctx.strokeRect(x-11*u+sway, hy+6*u, 22*u, 8*u);
  ctx.restore();
}

/** 월광 — 극단장, 실크햇, 초승달 얼굴, 빛나는 두 눈 */
function drawWolgwang(x, base, h, mode, t, eyesOnly){
  const sk = skin(mode), u = h/100, top = base - h;
  const hy = top + 20*u;
  if (eyesOnly){
    // 복도등: 두 눈만 보인다
    const p = 0.7 + Math.sin((t||0)*7)*0.3;
    [-7,7].forEach(s => {
      const g = ctx.createRadialGradient(x+s*u, hy-3*u, 0, x+s*u, hy-3*u, 13*u);
      g.addColorStop(0,'rgba(255,250,214,'+(0.95*p)+')');
      g.addColorStop(0.25,'rgba(246,226,140,'+(0.5*p)+')');
      g.addColorStop(1,'rgba(120,100,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+s*u, hy-3*u, 13*u, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,253,235,'+p+')';
      ctx.beginPath(); ctx.ellipse(x+s*u, hy-3*u, 3*u, 2.2*u, 0, 0, Math.PI*2); ctx.fill();
    });
    return;
  }
  ctx.save();
  // 연미복 몸통
  ctx.beginPath();
  ctx.moveTo(x-17*u, top+36*u); ctx.lineTo(x+17*u, top+36*u);
  ctx.lineTo(x+21*u, top+78*u); ctx.lineTo(x+8*u, base);
  ctx.lineTo(x, top+82*u); ctx.lineTo(x-8*u, base); ctx.lineTo(x-21*u, top+78*u);
  ctx.closePath(); rimPath(sk, u*0.8);
  // 팔
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 6*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*17*u, top+38*u);
    ctx.lineTo(x+s*26*u, top+58*u); ctx.lineTo(x+s*20*u, top+74*u); ctx.stroke();
  });
  // 초승달 얼굴
  ctx.beginPath(); ctx.arc(x, hy, 14*u, 0, Math.PI*2); rimPath(sk, u*0.9);
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = mode==='cam' ? 'rgba(190,230,205,0.5)' : 'rgba(236,240,255,0.55)';
  ctx.beginPath(); ctx.arc(x-2*u, hy, 13*u, Math.PI*0.35, Math.PI*1.65); ctx.fill();
  ctx.fillStyle = sk.fill;
  ctx.beginPath(); ctx.arc(x-8*u, hy, 13*u, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // 빛나는 두 눈
  const p = 0.75 + Math.sin((t||0)*6.4)*0.25;
  [-6,6].forEach(s => {
    const g = ctx.createRadialGradient(x+s*u, hy-3*u, 0, x+s*u, hy-3*u, 9*u);
    g.addColorStop(0,'rgba(255,251,220,'+p+')'); g.addColorStop(1,'rgba(180,150,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+s*u, hy-3*u, 9*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,'+p+')';
    ctx.beginPath(); ctx.ellipse(x+s*u, hy-3*u, 2.6*u, 2*u, 0, 0, Math.PI*2); ctx.fill();
  });
  // 실크햇
  ctx.beginPath(); ctx.rect(x-22*u, hy-17*u, 44*u, 4*u); rimPath(sk, u*0.7);
  ctx.beginPath(); ctx.rect(x-12*u, hy-40*u, 24*u, 23*u); rimPath(sk, u*0.8);
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.7;
  ctx.beginPath(); ctx.moveTo(x-12*u, hy-21*u); ctx.lineTo(x+12*u, hy-21*u); ctx.stroke();
  ctx.restore();
}

/** 태엽인형 — 작은 인형, 등에 태엽 열쇠 */
function drawTaeyeop(x, base, h, mode, t){
  const sk = skin(mode), u = h/100, top = base - h;
  const tilt = Math.sin((t||0)*4.5)*0.06;
  ctx.save();
  ctx.translate(x, base); ctx.rotate(tilt); ctx.translate(-x, -base);
  // 태엽 열쇠
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*1.4;
  ctx.beginPath(); ctx.arc(x+20*u, top+46*u, 9*u, 0, Math.PI*2); ctx.stroke();
  for (let i=0;i<4;i++){
    const a = (t||0)*1.6 + i*Math.PI/2;
    ctx.beginPath(); ctx.moveTo(x+20*u, top+46*u);
    ctx.lineTo(x+20*u + Math.cos(a)*9*u, top+46*u + Math.sin(a)*9*u); ctx.stroke();
  }
  // 몸통
  ctx.beginPath(); ctx.ellipse(x, top+52*u, 17*u, 24*u, 0, 0, Math.PI*2); rimPath(sk, u*0.9);
  // 팔다리
  ctx.strokeStyle = sk.fill; ctx.lineWidth = 5*u; ctx.lineCap = 'round';
  [-1,1].forEach(s => {
    ctx.beginPath(); ctx.moveTo(x+s*15*u, top+46*u); ctx.lineTo(x+s*25*u, top+62*u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+s*8*u, top+74*u); ctx.lineTo(x+s*10*u, base); ctx.stroke();
  });
  // 머리
  const hy = top + 18*u;
  ctx.beginPath(); ctx.arc(x, hy, 17*u, 0, Math.PI*2); rimPath(sk, u*0.9);
  ctx.fillStyle = mode==='scare' ? '#f2ead2' : (mode==='cam' ? sk.dim : '#000');
  [-6,6].forEach(s => { ctx.beginPath(); ctx.arc(x+s*u, hy-2*u, 3.4*u, 0, Math.PI*2); ctx.fill(); });
  ctx.strokeStyle = sk.rim; ctx.lineWidth = u*0.8;
  ctx.beginPath(); ctx.arc(x, hy+7*u, 5*u, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  ctx.restore();
}

const DRAW = { bidan:drawBidan, chorong:drawChorong, jangseung:drawJangseung, wolgwang:drawWolgwang, taeyeop:drawTaeyeop };
/* 얼굴을 화면 중앙에 오도록 크게 그린다(머리는 전신 높이의 약 0.18 지점에 있다) */
function drawFace(key, headY, h, mode, t, x){
  DRAW[key]((x === undefined ? W/2 : x), headY + 0.82*h, h, mode, t);
}


/* ═════════ 점프스케어 전용 클로즈업 얼굴 ═════════
   전신 실루엣을 확대하면 도식적으로 보인다. 급습 순간은 따로 그린다.
   원칙: 배경은 완전한 검정, 얼굴은 아래에서 조명, 눈은 빈 구멍 + 작은 광점. */
function faceBase(cx, cy, r, tone){
  const g = ctx.createRadialGradient(cx, cy + r*0.55, r*0.1, cx, cy, r*1.35);
  g.addColorStop(0, tone[0]); g.addColorStop(0.55, tone[1]); g.addColorStop(1, tone[2]);
  return g;
}
function socket(cx, cy, rw, rh, t, glow){
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI*2); ctx.fill();
  const jx = Math.sin(t*13.1)*rw*0.16, jy = Math.cos(t*9.7)*rh*0.14;
  const gg = ctx.createRadialGradient(cx+jx, cy+jy, 0, cx+jx, cy+jy, rw*0.9);
  gg.addColorStop(0, glow || 'rgba(255,246,214,0.95)');
  gg.addColorStop(0.35, 'rgba(226,190,120,0.35)');
  gg.addColorStop(1, 'rgba(180,140,60,0)');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(cx+jx, cy+jy, rw*0.9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,252,238,0.95)';
  ctx.beginPath(); ctx.ellipse(cx+jx, cy+jy, rw*0.17, rh*0.15, 0, 0, Math.PI*2); ctx.fill();
}
function crack(x, y, pts, w, bright){
  ctx.strokeStyle = '#000'; ctx.lineWidth = w*2.2;
  ctx.beginPath(); ctx.moveTo(x, y);
  pts.forEach(p => ctx.lineTo(x+p[0], y+p[1]));
  ctx.stroke();
  ctx.strokeStyle = bright || 'rgba(226,224,208,0.55)'; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x, y);
  pts.forEach(p => ctx.lineTo(x+p[0], y+p[1]));
  ctx.stroke();
}

function drawScareFace(key, t, k){
  const cx = W/2 + Math.sin(t*37)*8*k, cy = H*0.46 + Math.cos(t*31)*6*k;
  const r = 330 + 78*k + 16*Math.sin(t*23);
  ctx.save();

  if (key === 'bidan'){                       // 금 간 도자기 가면, 꿰맨 입이 터진다
    ctx.fillStyle = faceBase(cx, cy, r, ['#3b3a34','#1b1a18','#050506']);
    ctx.beginPath(); ctx.ellipse(cx, cy, r*0.88, r*1.06, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(236,232,214,0.5)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx, cy, r*0.88, r*1.06, 0, 0, Math.PI*2); ctx.stroke();
    crack(cx - r*0.42, cy - r*0.95, [[26,58],[-16,110],[30,150],[6,230]], 4);
    crack(cx + r*0.6, cy + r*0.18, [[-26,60],[14,104]], 3);
    socket(cx - r*0.34, cy - r*0.16, r*0.2, r*0.24, t);
    socket(cx + r*0.34, cy - r*0.16, r*0.2, r*0.24, t);
    // 벌어진 입 — 실이 끊어져 있다
    const open = r*0.1 + r*0.16*k*(0.5 + 0.5*Math.sin(t*17));
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(cx, cy + r*0.52, r*0.36, open, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(216,206,180,0.85)';
    for (let i=-3;i<=3;i++){
      if (i === 1) continue;                                   // 하나는 빠져 있다
      const tw = r*0.05 + (i%2 ? r*0.018 : 0), th = open*(0.55 + (i%3)*0.16);
      ctx.save();
      ctx.translate(cx + i*r*0.095, cy + r*0.52 - open);
      ctx.rotate((i%2 ? 1 : -1) * 0.06);
      ctx.fillRect(-tw/2, 0, tw, th);
      ctx.restore();
    }
    // 끊어진 실
    ctx.strokeStyle = 'rgba(226,222,204,0.7)'; ctx.lineWidth = 4;
    for (let i=-3;i<=3;i++){
      const sx = cx + i*r*0.105, sy = cy + r*0.52;
      ctx.beginPath();
      ctx.moveTo(sx - 9, sy - open - 6);
      ctx.lineTo(sx + 9, sy - open + 10);
      ctx.stroke();
      if (i%2 === 0){
        ctx.beginPath();
        ctx.moveTo(sx - 8, sy + open + 4);
        ctx.lineTo(sx + 6, sy + open + 20);
        ctx.stroke();
      }
    }
  } else if (key === 'chorong'){               // 등불 속에서 얼굴이 종이를 밀고 나온다
    const fl = 0.75 + Math.sin(t*21)*0.25;
    const g = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r*1.2);
    g.addColorStop(0, 'rgba(255,196,96,'+(0.95*fl)+')');
    g.addColorStop(0.45, 'rgba(212,96,20,'+(0.7*fl)+')');
    g.addColorStop(1, 'rgba(20,8,2,0.95)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, r*0.95, r*1.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(cx, cy, r*0.95, r*1.1, 0, 0, Math.PI*2); ctx.clip();
    ctx.strokeStyle = 'rgba(30,14,4,0.9)'; ctx.lineWidth = 10;
    for (let i=-3;i<=3;i++){
      ctx.beginPath(); ctx.moveTo(cx + i*r*0.28, cy - r*1.15); ctx.lineTo(cx + i*r*0.31, cy + r*1.15); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(30,14,4,0.75)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.ellipse(cx, cy, r*0.95, r*1.1, 0, 0, Math.PI*2); ctx.stroke();
    // 종이 안쪽에서 밀려나온 얼굴
    ctx.fillStyle = 'rgba(40,16,4,0.72)';
    ctx.beginPath(); ctx.ellipse(cx, cy + r*0.05, r*0.5, r*0.62, 0, 0, Math.PI*2); ctx.fill();
    socket(cx - r*0.2, cy - r*0.1, r*0.13, r*0.17, t, 'rgba(255,232,180,0.95)');
    socket(cx + r*0.2, cy - r*0.1, r*0.13, r*0.17, t, 'rgba(255,232,180,0.95)');
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(cx, cy + r*0.42, r*0.22, r*0.16*(0.6+0.4*Math.sin(t*15)), 0, 0, Math.PI*2); ctx.fill();
  } else if (key === 'jangseung'){              // 쪼개진 나무 탈, 벌어진 이빨
    ctx.fillStyle = faceBase(cx, cy, r, ['#4a3b28','#241b12','#070604']);
    ctx.beginPath();
    ctx.moveTo(cx - r*0.9, cy - r*1.0); ctx.lineTo(cx + r*0.9, cy - r*1.0);
    ctx.lineTo(cx + r*0.72, cy + r*1.1); ctx.lineTo(cx - r*0.72, cy + r*1.1);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(210,180,130,0.35)'; ctx.lineWidth = 3;
    for (let i=-4;i<=4;i++){                    // 나뭇결
      ctx.beginPath();
      ctx.moveTo(cx + i*r*0.19, cy - r*1.0);
      ctx.quadraticCurveTo(cx + i*r*0.22, cy, cx + i*r*0.17, cy + r*1.1);
      ctx.stroke();
    }
    crack(cx + r*0.1, cy - r*1.0, [[-24,120],[22,200],[-10,280]], 5, 'rgba(240,214,160,0.5)');
    socket(cx - r*0.38, cy - r*0.28, r*0.24, r*0.16, t, 'rgba(255,214,150,0.9)');
    socket(cx + r*0.38, cy - r*0.28, r*0.24, r*0.16, t, 'rgba(255,214,150,0.9)');
    ctx.fillStyle = '#000';
    ctx.fillRect(cx - r*0.62, cy + r*0.3, r*1.24, r*0.5);
    ctx.fillStyle = 'rgba(228,214,178,0.92)';
    const gap = [0.42, 0.26, 0.38, 0, 0.44, 0.3, 0.2, 0.4, 0.34];   // 하나는 뽑혀 있다
    for (let i=-4;i<=4;i++){
      const th = r*gap[i+4];
      if (th <= 0) continue;
      ctx.save();
      ctx.translate(cx + i*r*0.132, cy + r*0.3);
      ctx.rotate(((i*37)%7 - 3) * 0.02);
      ctx.fillRect(-r*0.05, 0, r*0.095 + (i%2 ? r*0.012 : 0), th);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.55)';                             // 잇몸 그늘
    ctx.fillRect(cx - r*0.62, cy + r*0.3, r*1.24, r*0.06);
  } else if (key === 'wolgwang'){               // 초승달 얼굴과 타오르는 두 눈
    // 달빛을 받은 얼굴: 원판을 그린 뒤 어긋난 원으로 초승달을 파낸다
    ctx.fillStyle = 'rgba(214,222,240,0.42)';
    ctx.beginPath(); ctx.arc(cx, cy, r*1.02, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#05060b';
    ctx.beginPath(); ctx.arc(cx - r*0.3, cy - r*0.06, r*0.99, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(226,232,248,0.22)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r*1.02, 0, Math.PI*2); ctx.stroke();
    // 두 눈
    [-1,1].forEach(sgn => {
      const ex = cx + sgn*r*0.42, ey = cy - r*0.06;
      const gg = ctx.createRadialGradient(ex, ey, 0, ex, ey, r*0.46);
      gg.addColorStop(0, 'rgba(255,252,226,1)');
      gg.addColorStop(0.22, 'rgba(255,206,96,0.8)');
      gg.addColorStop(1, 'rgba(150,90,10,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(ex, ey, r*0.46, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';                        // 세로로 찢어진 동공
      ctx.beginPath();
      ctx.ellipse(ex, ey, r*0.045, r*0.2 * (0.55 + 0.45*Math.abs(Math.sin(t*9))), 0, 0, Math.PI*2);
      ctx.fill();
    });
    // 웃는 입 — 빛나는 실선 하나
    ctx.strokeStyle = 'rgba(255,236,180,0.5)'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(cx, cy + r*0.18, r*0.5, Math.PI*0.18, Math.PI*0.82);
    ctx.stroke();
    // 실크햇이 화면 위를 덮는다
    ctx.fillStyle = '#04050a';
    ctx.beginPath(); ctx.ellipse(cx, cy - r*0.94, r*1.5, r*0.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(cx - r*0.78, 0, r*1.56, cy - r*0.94);
    ctx.fillRect(0, 0, W, Math.max(0, cy - r*1.1));
    ctx.strokeStyle = 'rgba(200,214,240,0.3)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(cx, cy - r*0.94, r*1.5, r*0.2, 0, 0, Math.PI*2); ctx.stroke();
  } else {                                      // 태엽인형: 깨진 도자기 인형 머리
    ctx.fillStyle = faceBase(cx, cy, r, ['#43413a','#1e1c19','#060607']);
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(230,226,208,0.45)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    crack(cx - r*0.1, cy - r*1.0, [[30,70],[-14,130],[34,210]], 4);
    socket(cx - r*0.36, cy - r*0.1, r*0.22, r*0.22, t);
    ctx.fillStyle = '#000';                     // 한쪽 눈은 비어 있다
    ctx.beginPath(); ctx.arc(cx + r*0.36, cy - r*0.1, r*0.22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(cx, cy + r*0.5, r*0.26, r*0.14*(0.6+0.4*Math.sin(t*19)), 0, 0, Math.PI*2); ctx.fill();
    // 돌아가는 태엽 열쇠
    ctx.save(); ctx.translate(cx + r*1.05, cy - r*0.5); ctx.rotate(t*5.5);
    ctx.strokeStyle = 'rgba(220,214,190,0.5)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.arc(0, 0, r*0.22, 0, Math.PI*2); ctx.stroke();
    for (let i=0;i<4;i++){
      const a = i*Math.PI/2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r*0.22, Math.sin(a)*r*0.22); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ═════════ 게임 상태 ═════════ */
const G = {
  state:'title', stateT:0, night:1, cleared:0,
  P:null, dead:null, fanA:0, titleT:0, drag:-1, endingKind:'night5',
  fear:2,                   // 공포 강도 0 순함 / 1 보통 / 2 강함
  dim:0                     // 암도 0 칠흑 / 1 어두움 / 2 보통
};
const DIM_NAMES = ['칠흑', '어두움', '보통'];
const DIM_ALPHA = [0.52, 0.34, 0.12];

function startNight(night, cfg){
  const lv = cfg || NIGHT_LV[night-1];
  const P = {
    night, custom:!!cfg,
    k: cfg ? 0.16 : K_POWER[night-1],
    organOn:lv.organ, organRate: cfg ? 2.4 : ORGAN_DRAIN[night-1],
    time:0, hour:0, power:100, usage:1,
    doorL:false, doorR:false, lightL:false, lightR:false,
    cam:false, camRoom:1,
    panX:PAN_MAX/2,
    organ:100, organGrace:-1,
    blackout:false, boT:0, boKill:0, boMusic:false,
    jang:{ stage:0, timer:3.8, charge:-1, lv:lv.jangseung },
    chars:{}, flick:0, flickT:rand(1.5,4), shakeT:0, toast:'', toastT:0,
    slamFlash:0, camFlash:0, windHold:false, warnFlash:0,
    // 공포 레이어
    dread:0, hbT:0, hbPulse:0, whisT:rand(8,18), scrapeT:rand(5,12),
    subT:rand(20,40), sub:0, subKey:'bidan',
    ghost:0, ghostT:rand(30,70), ghostX:0, ghostKey:'bidan', dash:0, dashDir:1,
    camGhost:'bidan', camGhostT:0,
    fanSpeed:1, fanStutT:rand(20,50), lostT:0, camStare:0, bob:0
  };
  for (const k in CHAR_DEF){
    const d = CHAR_DEF[k];
    P.chars[k] = { key:k, name:d.name, path:d.path, side:d.side, interval:d.interval,

function toast(s){ const P=G.P; if(!P) return; P.toast=s; P.toastT=1.6; }
const snapCv = document.createElement('canvas'); snapCv.width = W; snapCv.height = H;
const snapCtx = snapCv.getContext('2d');
function snapshot(){ snapCtx.clearRect(0,0,W,H); snapCtx.drawImage(canvas, 0, 0); }
const DEAD_HOLD = 0.45;                    // 급습 직전의 완전한 정적

function kill(key){

}
function win(){

  if (!G.P.custom) G.cleared = Math.max(G.cleared, G.P.night);

}
function startCustom(){

/* ═════════ 4·5·6. 시뮬레이션 ═════════ */
function updatePlay(dt){
  const P = G.P;

  // 시간
  P.time += dt;
  const h = Math.min(6, Math.floor(P.time / HOUR_SEC));
  if (h !== P.hour){ P.hour = h; if (h < 6) hourBonus(h); }
  if (P.time >= NIGHT_SEC){ win(); return; }

  // 팬 이동: 마우스 X → panX 0~480 보간(계수 6/초)
  if (ptr.moved) P.panTarget = clamp(ptr.x / W, 0, 1) * PAN_MAX;
  P.panX = lerp(P.panX, (P.panTarget === undefined ? PAN_MAX/2 : P.panTarget), clamp(dt*6, 0, 1));

  // 조명 플리커
  P.flickT -= dt;
  if (P.flickT <= 0){ P.flick = rand(0.05, 0.2); P.flickT = rand(1.6, 6.5); }
  if (P.flick > 0) P.flick -= dt;
  if (P.shakeT > 0) P.shakeT -= dt;
  if (P.slamFlash > 0) P.slamFlash -= dt;
  if (P.toastT > 0) P.toastT -= dt;

  // 전력
  if (!P.blackout){
    P.usage = 1 + (P.doorL?1:0) + (P.doorR?1:0) + (P.lightL?1:0) + (P.lightR?1:0) + (P.cam?1:0);
    const before = P.power;
    P.power -= P.k * P.usage * dt * RATE_SCALE;
    [25, 15, 8, 3].forEach(mark => {                 // 정전은 예고 없이 오지 않는다
      if (before > mark && P.power <= mark){
        toast('전력 ' + mark + '% — 문과 등을 줄여라');
        P.warnFlash = 1.2;
        SFX.growl(0);
      }
    });
    if (P.warnFlash > 0) P.warnFlash -= dt;
    if (P.power <= 0){ P.power = 0; startBlackout(); }
  }

  // 정전 시퀀스
  if (P.blackout){
    P.boT += dt;
    if (P.boT >= 3 && !P.boMusic){ P.boMusic = true; SFX.musicBox(); }
    if (P.boT >= P.boKill) kill('blackout');
    return;                                   // 정전 중에는 다른 AI가 멈춘다
  }

  // 카메라 전환 플래시 / 노이즈 속 얼굴
  if (P.camFlash > 0) P.camFlash -= dt;
  if (P.camGhostT > 0) P.camGhostT -= dt;

  // 배경 음악
  SFX.musicUpdate(P.hour, P.dread, P.blackout);

  // 감기 버튼 홀드 판정
  P.windHold = !!(P.cam && P.camRoom === 8 && ptr.down && hit(R_WIND, ptr.x, ptr.y));

  // 태엽 오르골
  if (P.organOn){
    const winding = P.cam && P.camRoom === 8 && P.windHold;
    if (winding){
      P.organ = Math.min(100, P.organ + 40*dt*RATE_SCALE);
      if (Math.random() < dt*16) SFX.wind();
    } else {
      P.organ -= P.organRate * dt * RATE_SCALE;
    }
    if (P.organ <= 0){
      P.organ = 0;
      if (P.organGrace < 0){ P.organGrace = 10; SFX.growl(); }
      P.organGrace -= dt;
      if (P.organGrace <= 0){ kill('taeyeop'); return; }
    } else if (P.organGrace >= 0){
      P.organGrace = -1;
    }
  }

  // 애니매트로닉스
  for (const k in P.chars){ const c = P.chars[k]; if (c.active) tickChar(c, dt); }
  tickJang(dt);
  updateDread(dt);
}

/* ═════════ 공포 레이어: 드레드(공포 수위) ═════════
   플레이어에게 숫자로 보여 주지 않는다. 심장박동·드론·비네트·손떨림으로만 전달한다. */
function updateDread(dt){
  const P = G.P;
  let d = 0, breath = 0, breathPan = 0;

  for (const k in P.chars){
    const c = P.chars[k];
    if (!c.active) continue;
    d = Math.max(d, (c.pos / (c.path.length - 1)) * 0.72);
    if (c.atDoor){
      const closed = (c.side === 'L') ? P.doorL : P.doorR;
      d = Math.max(d, closed ? 0.66 : 0.92);
      breath = Math.max(breath, 0.5 + 0.5*(1 - clamp(c.patience/9, 0, 1)));
      breathPan = (c.side === 'L') ? -0.85 : 0.85;
    }
  }
  if (P.jang.stage >= 2) d = Math.max(d, 0.55 + P.jang.stage*0.12);
  if (P.jang.charge >= 0) d = 1;
  if (P.power < 15) d = Math.max(d, 0.72);
  if (P.organOn && P.organ < 25) d = Math.max(d, 0.68);
  if (P.blackout) d = 1;
  if (P.hour >= 4) d = Math.min(1, d + 0.07);

  if (G.fear === 0){ d = 0; breath = 0; }
  else if (G.fear === 1){ d *= 0.7; breath *= 0.7; }
  P.dread = lerp(P.dread, d, clamp(dt*1.3, 0, 1));
  SFX.setDread(P.dread);
  SFX.setBreath(P.blackout ? (G.fear ? 0.35 : 0) : breath, breathPan);

  if (G.fear === 0){                       // 순함: 여기서 끝. 나머지 연출은 돌지 않는다
    P.sub = 0; P.ghost = 0; P.dash = 0; P.lostT = 0; P.camGhostT = 0; P.camStare = 0;
    return;
  }

  // 심장박동 — 가까울수록 빠르고 세다
  P.hbT -= dt;
  if (P.hbT <= 0){
    P.hbT = 60 / (50 + P.dread*90);
    SFX.heart(0.3 + P.dread*0.8);
    P.hbPulse = 1;
  }
  if (P.hbPulse > 0) P.hbPulse -= dt*3.4;
  P.bob += dt * (1.1 + P.dread*1.6);

  // 속삭임 — 말은 아닌데 사람 같은 것
  P.whisT -= dt;
  if (P.whisT <= 0){
    P.whisT = rand(9, 24) - P.dread*5;
    if (P.dread > 0.22 && Math.random() < 0.6) SFX.whisper(rand(-1, 1));
  }

  // 닫힌 문을 긁는다 — 막았다고 안전한 게 아니다
  P.scrapeT -= dt;
  if (P.scrapeT <= 0){
    P.scrapeT = rand(4, 10);
    ['L','R'].forEach(side => {
      const c = atDoorChar(side);
      const closed = (side === 'L') ? P.doorL : P.doorR;
      if (c && closed && Math.random() < 0.75) SFX.scrape(side === 'L' ? -0.9 : 0.9);
    });
  }

  // 아래는 '강함'에서만 — 환영과 신호 유실
  if (G.fear < 2){ P.sub = 0; P.ghost = 0; P.dash = 0; P.lostT = 0; P.camGhostT = 0; return; }

  // 서브리미널 프레임 — 봤는지도 확신할 수 없게
  P.subT -= dt;
  if (P.subT <= 0){
    P.subT = rand(20, 50) - P.dread*8;
    if (P.dread > 0.28){ P.sub = 0.1; P.subKey = pick(['bidan','chorong','wolgwang','jangseung','taeyeop']); }
  }
  if (P.sub > 0) P.sub -= dt;

  // 사무실 안에 잠깐 서 있다 사라지는 손님 (게임 규칙에는 영향이 없다)
  P.ghostT -= dt;
  if (P.ghostT <= 0){
    P.ghostT = rand(32, 75);
    if (!P.cam && !P.blackout && Math.random() < 0.55){
      P.ghostKey = pick(['bidan','chorong','taeyeop']);
      if (Math.random() < 0.4){
        P.dash = 0.42; P.dashDir = Math.random() < 0.5 ? 1 : -1;    // 눈앞을 스쳐 지나간다
        SFX.step(1.2, P.dashDir * 0.8);
      } else {
        P.ghost = 1.0; P.ghostX = rand(520, 1240);
        SFX.whisper(0);
      }
    }
  }
  if (P.ghost > 0) P.ghost -= dt;
  if (P.dash > 0) P.dash -= dt;

  // 환풍기가 잠깐 멈춘다 — 익숙한 소리가 사라지는 순간이 무섭다
  P.fanStutT -= dt;
  if (P.fanStutT <= 0){ P.fanStutT = rand(22, 55); P.fanSpeed = 0; }
  P.fanSpeed = lerp(P.fanSpeed, 1, clamp(dt*0.9, 0, 1));

  P.lostT = 0;      // 무작위 신호 유실은 쓰지 않는다(플레이어를 속이는 노이즈)
}

/* 장승: 커튼 뒤에서 단계 진행 → 서쪽 복도 돌진 */
function tickJang(dt){
  const P = G.P, j = P.jang;
  if (j.charge >= 0){
    j.charge -= dt;
    if (j.charge <= 0){
      j.charge = -1;
      SFX.charge();
      if (P.doorL){                                   // 막았다 — 전력을 대신 가져간다
        j.stage = 0; j.timer = 3.8;
        P.power = Math.max(0, P.power - (5 + P.night));
        P.slamFlash = 0.5; P.shakeT = 0.5;
        SFX.bang();
        toast('장승이 좌측 문을 들이받았다 — 전력 ' + (5 + P.night) + '% 손실');
        if (P.power <= 0) startBlackout();
      } else {
        kill('jangseung');
      }
    }
    return;
  }
  if (P.cam && P.camRoom === 2){ j.timer = 3.8; return; }   // 보는 동안 진행 정지 + 타이머 리셋
  j.timer -= dt;
  if (j.timer > 0) return;
  j.timer = 3.8;
  if (!roll20(j.lv)) return;
  j.stage++;
  if (j.stage >= 3){
    j.stage = 3; j.charge = rand(2, 6);
    SFX.stomp(-0.9);                      // 서쪽에서 육중한 발구름 — 좌측 문을 닫으라는 신호
    P.shakeT = 0.4;
  }
  else SFX.step(0.75);
}

/* 카메라 */
function toggleCam(){
  const P = G.P; if (!P || G.state !== 'play' || P.blackout) return;
  P.cam = !P.cam; P.camFlash = 0.3; P.windHold = false;
  if (P.cam && Math.random() < 0.2){ P.camGhost = pick(['bidan','chorong','wolgwang','taeyeop']); P.camGhostT = 0.15; }
  SFX.camSwitch();
}
function setCamRoom(n){
  const P = G.P; if (!P.cam || P.camRoom === n) return;
  P.camRoom = n; P.camFlash = 0.3; P.windHold = false;
  if (Math.random() < 0.16){ P.camGhost = pick(['bidan','chorong','wolgwang','jangseung','taeyeop']); P.camGhostT = 0.14; }
  SFX.camSwitch();
}

function hourBonus(h){
  const P = G.P;
  if (h>=2 && h<=5){
    ['bidan','chorong'].forEach(k => { P.chars[k].lv = Math.min(20, P.chars[k].lv + 1); });
    P.jang.lv = Math.min(20, P.jang.lv + 1);
  }
  if (h===3 || h===5) P.chars.wolgwang.lv = Math.min(20, P.chars.wolgwang.lv + 1);
}

function tickChar(c, dt){
  const P = G.P;
  // 문에 막혀 후퇴 대기
  if (c.blockT >= 0){
    c.blockT -= dt;
    if (c.blockT <= 0){
      SFX.bang(); c.blockT = -1; c.atDoor = false; c.warned = false;
      c.pos = 0; c.timer = c.interval; P.shakeT = 0.35;
    }
    return;
  }
  // 문 앞 교전
  if (c.atDoor){
    const closed = (c.side === 'L') ? P.doorL : P.doorR;
    if (closed){ c.blockT = 1.5; return; }
    c.patience -= dt;
    if (c.patience < 1.8 && !c.warned){ c.warned = true; SFX.growl(); }   // 직전 단서
    if (c.patience <= 0) kill(c.key);
    return;
  }
  // 전진 판정
  c.timer -= dt;
  if (c.timer > 0) return;
  c.timer = c.interval;
  if (c.key === 'wolgwang' && P.cam && P.camRoom === c.path[c.pos]) return;  // 안 볼 때만 다가온다
  if (!roll20(c.lv)) return;
  c.pos++;
  if (c.pos >= c.path.length - 1){ arriveDoor(c); }
  else { const room = c.path[c.pos]; SFX.step((room===5||room===7) ? 1 : 0.6); }
}
function arriveDoor(c){
  c.pos = c.path.length - 1; c.atDoor = true; c.warned = false;
  c.patience = (c.key === 'wolgwang') ? rand(4,9) : rand(5,13);
  SFX.step(1.15);
}
function atDoorChar(side){
  const P = G.P;
  for (const k in P.chars){
    const c = P.chars[k];
    if (c.active && c.atDoor && c.side === side && c.blockT < 0) return c;
  }
  return null;
}
function startBlackout(){
  const P = G.P;
  P.blackout = true; P.boT = 0; P.boKill = 3 + rand(10,20); P.boMusic = false;
  P.doorL = P.doorR = false; P.lightL = P.lightR = false; P.cam = false;
  SFX.powerDown();
}

/* 조작 */
function toggleDoor(side){
  const P = G.P; if (!P || G.state !== 'play' || P.blackout) return;
  if (P.cam){
    // 카메라를 보는 동안에는 문을 조작할 수 없다. 조용히 씹지 말고 분명히 알린다.
    toast('카메라를 보는 중에는 문을 조작할 수 없다 — Space로 사무실 복귀');
    SFX.scrape(side === 'L' ? -0.6 : 0.6);
    return;
  }
  if (side === 'L') P.doorL = !P.doorL; else P.doorR = !P.doorR;
  SFX.door(side === 'L' ? P.doorL : P.doorR);
}
function toggleLight(side){
  const P = G.P; if (!P || G.state!=='play' || P.blackout) return;
  if (side === 'L') P.lightL = !P.lightL; else P.lightR = !P.lightR;   // 둘 다 켤 수 있다(전력 사용량 +2)
  SFX.camSwitch();
}

/* ═════════ 2·3. 사무실 뷰 렌더 ═════════ */
function drawOffice(){
  const P = G.P;
  const px = Math.round(P.panX);
  const dim = P.flick > 0 ? 0.45 : 0;

  ctx.save();
  ctx.translate(-px, 0);

  // 뒷벽
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04050a'); g.addColorStop(0.5,'#07090f'); g.addColorStop(1,'#020304');
  ctx.fillStyle = g; ctx.fillRect(0,0,SCENE_W,H);
  // 벽 패널
  ctx.strokeStyle = 'rgba(120,140,180,0.03)'; ctx.lineWidth = 2;
  for (let x=60;x<SCENE_W;x+=150){ ctx.beginPath(); ctx.moveTo(x,110); ctx.lineTo(x,640); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(120,140,180,0.05)';
  ctx.beginPath(); ctx.moveTo(0,118); ctx.lineTo(SCENE_W,118); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,636); ctx.lineTo(SCENE_W,636); ctx.stroke();

  drawPoster(520, 205, '월광 인형극장');
  drawPoster(1040, 215, '금일 공연 없음');
  drawExitSign(1352, 146);
  drawFan(760, 74);
  drawDoorway('L'); drawDoorway('R');
  drawSideButtons('L'); drawSideButtons('R');
  drawLamp(660, 566);
  // 잠깐 서 있다 사라지는 것 — 규칙에는 영향이 없다. 그래서 더 나쁘다.
  if (P.ghost > 0){
    ctx.save();
    ctx.globalAlpha = clamp(P.ghost, 0, 1) * 0.5;
    DRAW[P.ghostKey](P.ghostX, 604, 300, 'sil', G.stateT);
    ctx.restore();
  }
  if (P.dash > 0){                       // 눈앞을 스쳐 지나가는 것
    const k = 1 - P.dash/0.42;
    const x = P.dashDir > 0 ? lerp(200, SCENE_W-200, k) : lerp(SCENE_W-200, 200, k);
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.filter = 'none';
    DRAW[P.ghostKey](x, 660, 520, 'sil', G.stateT);
    ctx.restore();
  }
  drawDesk();

  ctx.restore();

  // 조명 플리커 / 장승 충돌 섬광
  if (dim > 0){ ctx.fillStyle = 'rgba(0,0,0,'+dim+')'; ctx.fillRect(0,0,W,H); }
  if (P.slamFlash > 0){ ctx.fillStyle = 'rgba(255,220,180,'+(P.slamFlash*0.5)+')'; ctx.fillRect(0,0,W,H); }
  if (P.warnFlash > 0){
    ctx.fillStyle = 'rgba(226,80,60,' + (0.16*P.warnFlash*(0.5+0.5*Math.sin(G.stateT*18))) + ')';
    ctx.fillRect(0,0,W,H);
  }

  // 문 앞 위협 경고(인내심이 얼마 남지 않았을 때 화면 가장자리)
  ['L','R'].forEach(side => {
    const c = atDoorChar(side);
    if (!c || c.patience > 1.8) return;
    const a = 0.25 * (1 - c.patience/1.8) * (0.6 + 0.4*Math.sin(G.stateT*22));
    const gr = ctx.createLinearGradient(side==='L'?0:W, 0, side==='L'?220:W-220, 0);
    gr.addColorStop(0,'rgba(120,10,14,'+a+')'); gr.addColorStop(1,'rgba(120,10,14,0)');
    ctx.fillStyle = gr; ctx.fillRect(side==='L'?0:W-220, 0, 220, H);
  });
}

function drawDoorway(side){
  const P = G.P, d = DOOR[side];
  const lightOn = side==='L' ? P.lightL : P.lightR;
  const closed  = side==='L' ? P.doorL  : P.doorR;
  ctx.save();
  // 복도 어둠
  ctx.fillStyle = '#020306'; ctx.fillRect(d.x, d.y, d.w, d.h);
  if (lightOn){
    const inner = (side === 'L') ? -1 : 1;          // 복도가 뻗어 나가는 방향
    const vx = d.cx - inner*72, vy = d.y + d.h*0.42;  // 소실점
    // 복도 바닥
    const fg = ctx.createLinearGradient(d.x, d.y+d.h, d.x, vy);
    fg.addColorStop(0,'rgba(255,222,160,0.12)'); fg.addColorStop(1,'rgba(180,140,80,0.02)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y+d.h); ctx.lineTo(d.x+d.w, d.y+d.h);
    ctx.lineTo(vx+58, vy+40); ctx.lineTo(vx-58, vy+40); ctx.closePath(); ctx.fill();
    // 복도 벽/천장
    const wg = ctx.createLinearGradient(d.x, d.y, d.x, d.y+d.h);
    wg.addColorStop(0,'rgba(255,232,180,0.07)'); wg.addColorStop(0.5,'rgba(255,220,160,0.035)');
    wg.addColorStop(1,'rgba(120,90,50,0.01)');
    ctx.fillStyle = wg; ctx.fillRect(d.x, d.y, d.w, d.h);
    // 먼 벽
    ctx.fillStyle = 'rgba(46,38,28,0.85)';
    ctx.fillRect(vx-58, vy-96, 116, 136);
    ctx.strokeStyle = 'rgba(255,226,170,0.13)'; ctx.lineWidth = 2;
    ctx.strokeRect(vx-58, vy-96, 116, 136);
    // 원근선
    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(vx-58, vy-96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x+d.w, d.y); ctx.lineTo(vx+58, vy-96); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x, d.y+d.h); ctx.lineTo(vx-58, vy+40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.x+d.w, d.y+d.h); ctx.lineTo(vx+58, vy+40); ctx.stroke();
    // 바닥 빛 번짐
    const fl = ctx.createRadialGradient(d.cx, d.y+d.h, 6, d.cx, d.y+d.h, 260);
    fl.addColorStop(0,'rgba(255,222,164,0.11)'); fl.addColorStop(1,'rgba(255,210,150,0)');
    ctx.fillStyle = fl; ctx.beginPath(); ctx.arc(d.cx, d.y+d.h, 260, 0, Math.PI*2); ctx.fill();
    // 문 앞 개체
    const c = atDoorChar(side);
    if (c){
      if (c.key === 'wolgwang') drawWolgwang(d.cx, d.y+d.h-6, 430, 'sil', G.stateT, true);
      else DRAW[c.key](d.cx, d.y+d.h-6, 430, 'sil', G.stateT);
    }
  }
  else {
    // 등이 꺼져 있어도, 문 앞에 선 것이 있으면 어둠 속에서 눈만 아주 희미하게
    const c = atDoorChar(side);
    if (c && !closed){
      const a = 0.05 + 0.09*(0.5 + 0.5*Math.sin(G.stateT*2.3)) + G.P.dread*0.05;
      ctx.save();
      [-16, 16].forEach(off => {
        const gg = ctx.createRadialGradient(d.cx+off, d.y+150, 0, d.cx+off, d.y+150, 26);
        gg.addColorStop(0, 'rgba(236,230,190,'+a+')');
        gg.addColorStop(1, 'rgba(236,230,190,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(d.cx+off, d.y+150, 26, 0, Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }
  }
  // 셔터(문)
  if (closed){
    ctx.fillStyle = '#0a0c13'; ctx.fillRect(d.x-8, d.y-8, d.w+16, d.h+16);
    ctx.strokeStyle = 'rgba(150,170,210,0.2)'; ctx.lineWidth = 2;
    for (let y=d.y; y<d.y+d.h; y+=22){
      ctx.beginPath(); ctx.moveTo(d.x-6, y); ctx.lineTo(d.x+d.w+6, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(60,70,92,0.9)';
    ctx.fillRect(d.cx-34, d.y+d.h-46, 68, 14);
  }
  // 문틀
  ctx.strokeStyle = 'rgba(150,170,210,0.26)'; ctx.lineWidth = 8;
  ctx.strokeRect(d.x-10, d.y-10, d.w+20, d.h+20);
  ctx.restore();
}

function drawBlackout(){
  const P = G.P;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const x = DOOR.L.cx - Math.round(P.panX);

  if (P.boT < 3){
    // 아무것도 없다. 그게 문제다.
    if (Math.random() < 0.02) grain(0.05);
    return;
  }
  // 오르골이 울리기 시작하면, 어둠 속에서 눈이 조금씩 가까워진다
  const prog = clamp((P.boT - 3) / Math.max(0.001, P.boKill - 3), 0, 1);
  const sc = 0.5 + prog*1.6;
  const flick = (Math.sin(P.boT*8.7) > -0.1) || (Math.random() < 0.08);
  if (flick && G.fear > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + prog*0.6;
    drawWolgwang(x, 560 + prog*90, 240*sc, 'sil', P.boT, true);
    ctx.restore();
  }
  // 마지막 1.5초, 얼굴이 통째로 드러난다
  if (G.fear === 2 && P.boKill - P.boT < 1.5 && Math.random() < 0.45){
    ctx.save();
    ctx.globalAlpha = 0.45 + Math.random()*0.4;
    drawScareFace('wolgwang', P.boT, 0.7);
    ctx.restore();
  }
  grain(0.04 + prog*0.06);
  vignette(0.85);
}


/* ═════════ 4. 카메라 시스템 ═════════ */
const ROOMS = { 1:'무대', 2:'커튼 뒤', 3:'객석', 4:'분장실', 5:'서쪽 복도',
                6:'서쪽 모서리', 7:'동쪽 복도', 8:'오르골실', 9:'동쪽 모서리' };
const MINI = { x:W-536, y:H-392, w:520, h:376 };
const R_WIND = { x:70, y:H-210, w:260, h:104 };

const MINI_AREA = { x:MINI.x+16, y:MINI.y+42, w:MINI.w-32, h:MINI.h-58 };
function miniRect(n){ return planRect(PLAN[n], MINI_AREA); }
function roomOf(c){ return c.path[c.pos]; }

/* ═════════ 극장 도면 ═════════
   방 번호만으로는 "얘들이 어디로 오는지"를 알 수 없다.
   실제 배치대로 놓고, 각자의 경로를 도면 위에 그린다. */
const PLAN = {                                   // 중심 좌표(0~1) + 크기(0~1)
  2:{ x:0.50, y:0.09, w:0.24, h:0.10 },          // 커튼 뒤
  1:{ x:0.50, y:0.25, w:0.32, h:0.11 },          // 무대
  3:{ x:0.50, y:0.45, w:0.32, h:0.12 },          // 객석
  4:{ x:0.15, y:0.30, w:0.22, h:0.11 },          // 분장실
  5:{ x:0.13, y:0.55, w:0.20, h:0.11 },          // 서쪽 복도
  6:{ x:0.15, y:0.80, w:0.22, h:0.11 },          // 서쪽 모서리
  7:{ x:0.86, y:0.45, w:0.20, h:0.11 },          // 동쪽 복도
  8:{ x:0.87, y:0.64, w:0.22, h:0.11 },          // 오르골실
  9:{ x:0.85, y:0.80, w:0.22, h:0.11 }           // 동쪽 모서리
};
const PLAN_OFFICE = { x:0.50, y:0.86, w:0.26, h:0.12 };
const PLAN_EDGES = [[2,1],[1,3],[3,4],[4,5],[5,6],[3,7],[7,8],[8,9]];
const ROUTES = [
  { key:'bidan',     name:'비단',  color:'#7fc4ff', path:[1,3,4,5,6], door:'L' },
  { key:'chorong',   name:'초롱',  color:'#ffb46b', path:[1,3,7,8,9], door:'R' },
  { key:'wolgwang',  name:'월광',  color:'#f2df8a', path:[1,3,7,9],   door:'R' },
  { key:'jangseung', name:'장승',  color:'#c99a63', path:[2,5],       door:'L', rush:true }
];

function planRect(box, area){
  return { x: area.x + (box.x - box.w/2)*area.w, y: area.y + (box.y - box.h/2)*area.h,
           w: box.w*area.w, h: box.h*area.h };
}
function planCenter(n, area){
  const b = PLAN[n];
  return { x: area.x + b.x*area.w, y: area.y + b.y*area.h };
}
function officeRect(area){ return planRect(PLAN_OFFICE, area); }
function doorPoint(side, area){
  const r = officeRect(area);
  return { x: side === 'L' ? r.x + r.w*0.18 : r.x + r.w*0.82, y: r.y };
}

/* 도면 한 장을 그린다. area = {x,y,w,h}. small이면 카메라 패널용 축소판 */
function drawPlan(area, opt){
  const small = !!(opt && opt.small);
  const showRoutes = !!(opt && opt.routes);      // 경로는 타이틀 브리핑에서만
  const P = G.P;
  const fs = small ? 12 : 17;

  // 건물 외곽
  ctx.save();
  ctx.strokeStyle = 'rgba(150,190,170,0.22)'; ctx.lineWidth = small ? 2 : 3;
  ctx.strokeRect(area.x + area.w*0.02, area.y + area.h*0.02, area.w*0.96, area.h*0.96);

  // 통로
  ctx.strokeStyle = 'rgba(150,190,170,0.30)';
  ctx.lineWidth = small ? 5 : 9;
  ctx.lineCap = 'round';
  PLAN_EDGES.forEach(([a, b]) => {
    const p1 = planCenter(a, area), p2 = planCenter(b, area);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  });
  ['L','R'].forEach(side => {
    const corner = planCenter(side === 'L' ? 6 : 9, area), dp = doorPoint(side, area);
    ctx.beginPath(); ctx.moveTo(corner.x, corner.y); ctx.lineTo(dp.x, dp.y); ctx.stroke();
  });

  // 경로선 — 겹치지 않게 조금씩 어긋나게 그린다 (인게임에서는 그리지 않는다)
  if (showRoutes) ROUTES.forEach((rt, i) => {
    const off = (i - 1.5) * (small ? 3.4 : 6);
    ctx.strokeStyle = rt.color;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = small ? 2 : 3;
    ctx.setLineDash(rt.rush ? [small?7:12, small?5:8] : []);
    ctx.beginPath();
    const pts = rt.path.map(n => planCenter(n, area));
    pts.push(doorPoint(rt.door, area));
    pts.forEach((p, j) => {
      const x = p.x + off, y = p.y + off*0.35;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    // 진행 방향 화살촉
    for (let j=1;j<pts.length;j++){
      const a = pts[j-1], b = pts[j];
      const mx = (a.x+b.x)/2 + off, my = (a.y+b.y)/2 + off*0.35;
      const ang = Math.atan2(b.y-a.y, b.x-a.x), L = small ? 5 : 9;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.lineTo(mx - Math.cos(ang-0.45)*L, my - Math.sin(ang-0.45)*L);
      ctx.moveTo(mx, my);
      ctx.lineTo(mx - Math.cos(ang+0.45)*L, my - Math.sin(ang+0.45)*L);
      ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  });

  // 방
  for (let n=1;n<=9;n++){
    const r = planRect(PLAN[n], area);
    const on = P && P.cam && P.camRoom === n;
    panel(r, on ? 'rgba(120,200,160,0.26)' : 'rgba(14,20,17,0.92)',
             on ? 'rgba(170,236,200,0.85)' : 'rgba(150,190,170,0.3)');
    txt('CAM ' + n, r.x + r.w/2, r.y + (small ? 17 : 24), small ? 11 : 15,
        on ? '#d8f6e6' : 'rgba(190,226,206,0.62)', 'center', 800);
    txt(ROOMS[n], r.x + r.w/2, r.y + (small ? 31 : 46), fs,
        on ? 'rgba(226,250,238,0.95)' : 'rgba(176,208,190,0.72)', 'center', 600);

  }

  // 경비실
  const orc = officeRect(area);
  panel(orc, 'rgba(40,30,18,0.92)', 'rgba(226,180,90,0.55)');
  txt('경비실', orc.x + orc.w/2, orc.y + orc.h/2 + (small ? 5 : 7), small ? 13 : 19,
      '#f0d9a8', 'center', 800);
  ['L','R'].forEach(side => {
    const dp = doorPoint(side, area);
    const closed = P ? (side === 'L' ? P.doorL : P.doorR) : false;
    ctx.fillStyle = closed ? '#e2604a' : 'rgba(150,190,170,0.45)';
    ctx.fillRect(dp.x - (small?9:14), dp.y - (small?3:4), small?18:28, small?6:8);
  });
  ctx.restore();
}


/* 방 배경 — 전부 도형으로 그린다 */
function drawRoomBG(n, t){
  ctx.fillStyle = '#070910'; ctx.fillRect(0,0,W,H);
  const floorY = 470;
  const fg = ctx.createLinearGradient(0, floorY, 0, H);
  fg.addColorStop(0,'#080c0a'); fg.addColorStop(1,'#030404');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H-floorY);
  ctx.strokeStyle = 'rgba(150,190,170,0.06)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();

  const wall = (a) => { ctx.fillStyle = 'rgba(30,42,35,'+(a*0.45)+')'; ctx.fillRect(0,0,W,floorY); };

  if (n === 1){                                   // 무대
    wall(0.5);
    ctx.fillStyle = 'rgba(18,26,22,0.95)';
    for (let x=0;x<W;x+=46){
      ctx.beginPath(); ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x+14, 220, x+6, 430); ctx.lineTo(x+34, 430);
      ctx.quadraticCurveTo(x+40, 220, x+34, 0); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(120,170,145,0.14)';
    for (let x=60;x<W;x+=110){ ctx.beginPath(); ctx.ellipse(x, floorY+26, 24, 9, 0, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = 'rgba(150,190,170,0.06)'; ctx.fillRect(0, floorY-8, W, 10);
  } else if (n === 2){                            // 커튼 뒤
    wall(0.35);
    ctx.fillStyle = 'rgba(14,20,17,0.95)';
    for (let x=-40;x<W;x+=120){
      ctx.beginPath(); ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x+58, 260, x+20, 520); ctx.lineTo(x+96, 520);
      ctx.quadraticCurveTo(x+124, 260, x+96, 0); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(150,190,170,0.16)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(W, 30); ctx.stroke();
    ctx.fillStyle = 'rgba(26,36,30,0.9)';
    ctx.fillRect(90, floorY-70, 150, 70); ctx.fillRect(1010, floorY-52, 190, 52);
    ctx.strokeStyle = 'rgba(150,190,170,0.14)'; ctx.lineWidth = 2;
    ctx.strokeRect(90, floorY-70, 150, 70); ctx.strokeRect(1010, floorY-52, 190, 52);
  } else if (n === 3){                            // 객석
    wall(0.28);
    for (let r=0;r<5;r++){
      const y = 330 + r*74, sc = 1 + r*0.16;
      ctx.fillStyle = 'rgba(20,30,25,'+(0.6+r*0.08)+')';
      for (let x=-40;x<W+40;x+=104*sc){
        ctx.beginPath(); ctx.ellipse(x, y, 40*sc, 26*sc, 0, Math.PI, 0); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(150,190,170,0.07)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, y+18*sc); ctx.lineTo(W, y+18*sc); ctx.stroke();
    }
  } else if (n === 4){                            // 분장실
    wall(0.4);
    ctx.fillStyle = 'rgba(24,34,30,0.95)'; ctx.fillRect(120, 120, 380, 330);
    ctx.strokeStyle = 'rgba(160,200,180,0.25)'; ctx.lineWidth = 4; ctx.strokeRect(120, 120, 380, 330);
    ctx.fillStyle = 'rgba(190,230,205,0.22)';
    for (let i=0;i<7;i++){ ctx.beginPath(); ctx.arc(140+i*56, 106, 9, 0, Math.PI*2); ctx.fill(); }
    ctx.strokeStyle = 'rgba(150,190,170,0.3)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(720, 150); ctx.lineTo(1180, 150); ctx.stroke();
    ctx.fillStyle = 'rgba(16,24,20,0.9)';
    for (let i=0;i<5;i++){ ctx.fillRect(752+i*86, 150, 62, 240); }
    ctx.fillStyle = 'rgba(26,36,30,0.9)'; ctx.fillRect(150, 430, 320, 40);
  } else if (n === 5 || n === 7){                 // 서쪽/동쪽 복도
    const dir = (n === 5) ? -1 : 1;
    wall(0.32);
    const vx = W/2 + dir*150, vy = 330;
    ctx.fillStyle = 'rgba(12,18,15,0.95)';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(vx-90, vy-120); ctx.lineTo(vx-90, vy+150); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(vx+90, vy-120); ctx.lineTo(vx+90, vy+150); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(30,42,36,0.9)'; ctx.fillRect(vx-90, vy-120, 180, 270);
    ctx.strokeStyle = 'rgba(150,190,170,0.18)'; ctx.lineWidth = 2;
    ctx.strokeRect(vx-90, vy-120, 180, 270);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(vx-90, vy-120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(vx+90, vy-120); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(vx-90, vy+150); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W,H); ctx.lineTo(vx+90, vy+150); ctx.stroke();
    ctx.fillStyle = 'rgba(190,230,205,0.10)';
    for (let i=1;i<=3;i++){ const w0=200/i; ctx.fillRect(vx-w0/2, 40+i*26, w0, 8); }
  } else if (n === 6 || n === 9){                 // 서쪽/동쪽 모서리
    const dir = (n === 6) ? 1 : -1;
    wall(0.42);
    const dx = (dir > 0) ? W-360 : 60;
    ctx.fillStyle = 'rgba(10,14,12,0.95)'; ctx.fillRect(dx, 110, 300, 400);
    ctx.strokeStyle = 'rgba(160,200,180,0.28)'; ctx.lineWidth = 6; ctx.strokeRect(dx, 110, 300, 400);
    txt('경비실', dx+150, 92, 20, 'rgba(150,190,170,0.5)', 'center', 700);
    ctx.strokeStyle = 'rgba(150,190,170,0.14)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, 90); ctx.lineTo(W, 130); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 140); ctx.lineTo(W, 178); ctx.stroke();
  } else if (n === 8){                            // 오르골실
    wall(0.38);
    ctx.strokeStyle = 'rgba(150,190,170,0.2)'; ctx.lineWidth = 3;
    for (let r=0;r<3;r++){
      const y = 170 + r*100;
      ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(560, y); ctx.stroke();
      ctx.fillStyle = 'rgba(20,30,25,0.9)';
      for (let i=0;i<6;i++){ ctx.fillRect(76+i*80, y-52, 34, 52); ctx.beginPath(); ctx.arc(93+i*80, y-62, 15, 0, Math.PI*2); ctx.fill(); }
    }
    const cx = 900, cy = 380;
    ctx.fillStyle = 'rgba(26,36,30,0.95)'; ctx.fillRect(cx-150, cy-60, 300, 150);
    ctx.strokeStyle = 'rgba(160,200,180,0.3)'; ctx.lineWidth = 3; ctx.strokeRect(cx-150, cy-60, 300, 150);
    ctx.save(); ctx.translate(cx, cy);
    ctx.rotate((G.P && G.P.organ > 0) ? t*1.6 : 0);
    ctx.strokeStyle = 'rgba(190,230,205,0.35)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 44, 0, Math.PI*2); ctx.stroke();
    for (let i=0;i<6;i++){
      const a = i*Math.PI/3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*44, Math.sin(a)*44); ctx.stroke();
    }
    ctx.restore();
  }
}

function drawCam(){
  const P = G.P, t = G.stateT;
  drawRoomBG(P.camRoom, t);

  // 방 안의 등장체
  let slot = 0;
  for (const k in P.chars){
    const c = P.chars[k];
    if (!c.active || roomOf(c) !== P.camRoom) continue;
    const x = 300 + slot*280 + ((P.camRoom*83) % 160);
    DRAW[k](x, 610, 380, 'cam', t);
    slot++;
  }
  if (P.camRoom === 2 && P.jang.charge < 0){        // 장승: 단계가 오를수록 다가온다
    const st = P.jang.stage;
    drawJangseung(280 + st*250, 620, 320 + st*80, 'cam', t);
  }
  if (P.camRoom === 8 && P.organOn){                // 태엽인형
    const agit = (100 - P.organ) / 100;
    drawTaeyeop(430 + agit*180, 640, 210 + agit*70, 'cam', t*(1 + agit*3));
  }

  // 카메라 화면 처리
  grain(0.12);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let y=0;y<H;y+=3) ctx.fillRect(0, y, W, 1);
  for (let i=0;i<2;i++){
    const y = (Math.random()*H)|0, h = 4 + ((Math.random()*20)|0), dx = ((Math.random()*16)-8)|0;
    ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
  }
  vignette(0.72);

  txt('CAM ' + P.camRoom + ' · ' + ROOMS[P.camRoom], 30, 54, 26, 'rgba(200,236,216,0.85)', 'left', 800);
  // 카메라를 보는 동안 문은 잠긴다 — 항상 보이게 적어 둔다
  const lockMsg = '문 조작 불가 · Space로 사무실 복귀   |   좌문 ' + (P.doorL ? '닫힘' : '열림') +
                  ' · 우문 ' + (P.doorR ? '닫힘' : '열림');
  txt(lockMsg, W/2, 34, 16,
      (P.doorL || P.doorR) ? 'rgba(226,180,120,0.85)' : 'rgba(226,120,100,0.85)', 'center', 700);
  if (Math.sin(t*3.4) > 0){
    ctx.fillStyle = '#e2604a'; ctx.beginPath(); ctx.arc(38, 82, 9, 0, Math.PI*2); ctx.fill();
    txt('REC', 56, 90, 18, 'rgba(226,96,74,0.9)', 'left', 700);
  }

  // 극장 도면
  panel(MINI, 'rgba(8,12,10,0.86)', 'rgba(150,190,170,0.3)');
  txt('극장 배치도', MINI.x+18, MINI.y+28, 16, 'rgba(190,226,206,0.72)', 'left', 700);
  txt('누가 어디 있는지는 직접 봐야 안다', MINI.x+MINI.w-18, MINI.y+28, 13,
      'rgba(150,180,166,0.5)', 'right', 600);
  drawPlan(MINI_AREA, { small:true });        // 경로선·목격 표시 없음

  // 오르골실: 감기 버튼
  if (P.camRoom === 8 && P.organOn){
    const held = P.windHold;
    panel(R_WIND, held ? 'rgba(226,180,90,0.85)' : 'rgba(18,26,22,0.9)', 'rgba(190,226,206,0.4)');
    txt(held ? '감는 중…' : '태엽 감기 (누르고 있기)', R_WIND.x+R_WIND.w/2, R_WIND.y+46,
        19, held ? '#20180a' : 'rgba(216,246,230,0.9)', 'center', 800);
    const bx = R_WIND.x+22, by = R_WIND.y+62, bw = R_WIND.w-44;
    ctx.fillStyle = 'rgba(150,190,170,0.2)'; ctx.fillRect(bx, by, bw, 16);
    ctx.fillStyle = P.organ < 25 ? '#e2604a' : '#8fe6b8';
    ctx.fillRect(bx, by, bw*(P.organ/100), 16);
  }

  // 노이즈 속에 한 프레임 섞이는 얼굴
  if (P.camGhostT > 0){
    ctx.save(); ctx.globalAlpha = 0.6;
    drawFace(P.camGhost, H*0.44, 880, 'cam', t);
    ctx.restore();
    grain(0.35);
  }
  if (P.camFlash > 0){                              // 전환 순간 화이트노이즈 플래시
    grain(0.55 * (P.camFlash/0.3));
    ctx.fillStyle = 'rgba(220,235,228,' + (0.22*(P.camFlash/0.3)) + ')';
    ctx.fillRect(0,0,W,H);
  }
}

/* ═════════ HUD ═════════ */
function drawHUD(){
  const P = G.P;
  // 시계
  const hr = P.hour === 0 ? 12 : P.hour;
  const glitch = (P.dread > 0.7 && Math.random() < 0.05);
  txt(glitch ? (randi(1,12) + ' AM') : (hr + ' AM'), W-24, 58, 40,
      P.blackout ? '#5a6274' : (glitch ? '#b0483c' : '#e7ecf8'), 'right', 800);
  txt(P.custom ? '커스텀' : P.night + ' 박', W-24, 82, 17, 'rgba(190,202,226,0.6)', 'right', 600);
  // 전력
  const pw = Math.ceil(P.power);
  const low = pw <= 20;
  txt('전력 ' + pw + '%', 26, H-62, 26, P.blackout ? '#8a3c3c' : (low ? '#ff8f6a' : '#e7ecf8'), 'left', 800);
  txt('사용량', 26, H-16, 14, 'rgba(190,202,226,0.55)', 'left', 600);

  for (let i=0;i<5;i++){

  // 문·등 상태 표시 — 어느 화면에서도 지금 무엇이 닫혀 있는지 알 수 있게
  const chips = [
    { label:'좌문', on:P.doorL, x:26 },

  chips.forEach(ch => {

          ch.on ? 'rgba(255,214,170,0.6)' : 'rgba(150,170,210,0.22)');
