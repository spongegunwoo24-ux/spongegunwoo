  });

  // 카메라 바
  const camReady = !P.blackout;
  panel(R_CAMBAR, P.cam ? 'rgba(60,120,95,0.55)' : 'rgba(12,14,20,0.8)',
        camReady ? 'rgba(150,190,170,0.35)' : 'rgba(120,60,60,0.35)');
  txt(P.cam ? '닫기 (Space)' : (camReady ? '카메라 (Space)' : '카메라 사망'),
      R_CAMBAR.x+R_CAMBAR.w/2, R_CAMBAR.y+27, 18,
      camReady ? 'rgba(216,240,228,0.9)' : 'rgba(180,90,90,0.7)', 'center', 700);
  // 태엽 게이지
  if (P.organOn){
    const org = Math.max(0, Math.ceil(P.organ));
    const warn = org < 25;
    txt('태엽 ' + org + '%', 78, 36, 22, P.organGrace >= 0 ? '#ff6b52' : (warn ? '#ffb46b' : '#cfe3f5'), 'left', 800);
    ctx.fillStyle = 'rgba(120,135,165,0.2)'; ctx.fillRect(78, 46, 190, 12);
    ctx.fillStyle = P.organGrace >= 0 ? '#ff6b52' : (warn ? '#ffb46b' : '#8fe6b8');
    ctx.fillRect(78, 46, 190*(P.organ/100), 12);
    if (P.organGrace >= 0){
      txt('태엽이 멈췄다 — ' + P.organGrace.toFixed(1) + '초', 78, 82, 18,
          'rgba(255,107,82,' + (0.55 + 0.45*Math.sin(G.stateT*12)) + ')', 'left', 800);
    }
  }
  // 음소거
  panel(R_MUTE, 'rgba(12,14,20,0.8)', 'rgba(150,170,210,0.2)');
  txt(SFX.muted ? '🔇' : '🔊', R_MUTE.x+R_MUTE.w/2, R_MUTE.y+21, 17, '#c8d2e6', 'center', 700);
  // 보조 버튼
  for (const k in AUX){
    const r = AUX[k], P2 = G.P;
    const on = (k==='Ldoor'&&P2.doorL)||(k==='Rdoor'&&P2.doorR)||(k==='Llight'&&P2.lightL)||(k==='Rlight'&&P2.lightR);
    panel(r, on ? 'rgba(226,126,74,0.85)' : 'rgba(12,14,20,0.72)', 'rgba(150,170,210,0.22)');
    txt(r.label, r.x+r.w/2, r.y+34, 16, on ? '#1a1208' : 'rgba(190,202,226,0.75)', 'center', 700);
  }
  // 토스트
  if (P.toastT > 0){
    txt(P.toast, W/2, H-80, 18, 'rgba(226,234,250,' + clamp(P.toastT,0,1) + ')', 'center', 700);
  }
}

/* ═════════ 8. 사망 연출 ═════════ */
function drawDead(){
  const t = G.stateT, d = G.dead;

  // 1) 정적. 마지막 화면이 얼어붙고 천천히 조여든다. 여기가 제일 무섭다.
  if (t < DEAD_HOLD){
    const z = 1 + t*0.09;
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2);
    ctx.drawImage(snapCv, 0, 0);
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,' + (0.15 + (t/DEAD_HOLD)*0.5) + ')';
    ctx.fillRect(0,0,W,H);
    vignette(0.6 + (t/DEAD_HOLD)*0.35);
    return;
  }

  if (!G.scarePlayed){
    G.scarePlayed = true;
    if (G.fear === 0) SFX.softEnd(); else SFX.scare(G.fear === 1 ? 0.55 : 1);
  }
  const st = t - DEAD_HOLD;

  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const scareLen = G.fear === 0 ? 0 : (G.fear === 1 ? 0.55 : 1.0);
  if (st < scareLen){
    const k = (1 - st/scareLen) * (G.fear === 1 ? 0.5 : 1);
    // 발작적인 흔들림 + 확대 + 스트로브
    const sh = 40*k;
    ctx.save();
    ctx.translate(rand(-sh, sh), rand(-sh, sh));
    const z = 1.04 + 0.16*Math.sin(st*46) * k;
    ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2);
    drawScareFace(d.key, st*6, k);
    ctx.restore();
    vignette(0.75);
    // 색 어긋남
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.2*k;
    ctx.drawImage(canvas, -9*k, 0); ctx.drawImage(canvas, 9*k, 0);
    ctx.restore();
    if (G.fear === 2 && Math.random() < 0.45){
      ctx.fillStyle = 'rgba(255,255,255,' + (0.2*k) + ')'; ctx.fillRect(0,0,W,H);
    }
    grain(0.1*k + 0.04);          // 노이즈로 얼굴을 씻어내지 않는다
    return;
  }

  // 2) 암전. 귀만 울린다.
  const a = clamp((st-scareLen)/1.2, 0, 1);
  if (G.fear === 2 && st < scareLen+0.6 && Math.random() < 0.07){    // 잔상
    ctx.save(); ctx.globalAlpha = 0.1;
    drawScareFace(d.key, st, 0.4);
    ctx.restore();
  }
  txt(d.label, W/2, 232, 48, 'rgba(232,238,250,'+a+')', 'center', 800);
  txt('폐업한 극장에는 관객이 없다', W/2, 300, 26, 'rgba(190,200,222,'+(a*0.75)+')', 'center', 600);
  txt(d.cause, W/2, 352, 21, 'rgba(226,110,90,'+a+')', 'center', 700);
  const r = { x:W/2-130, y:430, w:260, h:62 };
  panel(r, 'rgba(22,26,36,'+a+')', 'rgba(150,170,210,'+(a*0.4)+')');
  txt('다시 시도', W/2, 470, 24, 'rgba(232,238,250,'+a+')', 'center', 800);
  grain(0.03);
}

/* 플레이 화면 위에 얹는 공포 레이어 */
function drawFear(){
  const P = G.P, d = P.dread;
  // 색 어긋남 — 긴장이 높을 때만 슬쩍
  if (d > 0.42){
    const off = 1 + d*2;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.035 + d*0.035;
    ctx.drawImage(canvas, -off, 0);
    ctx.drawImage(canvas, off, 0);
    ctx.restore();
  }
  // 서브리미널 — 봤는지도 확신할 수 없는 한두 프레임
  if (P.sub > 0){
    ctx.save(); ctx.globalAlpha = 0.42;
    drawScareFace(P.subKey, G.stateT, 0.6);
    ctx.restore();
    grain(0.18);
  }
  // 심장박동에 맞춰 조여드는 시야
  vignette(0.56 + d*0.26 + Math.max(0, P.hbPulse)*0.1);
}

/* ═════════ 승리 / 인트로 / 타이틀 ═════════ */

/* ═════════ 입력 라우팅 ═════════ */
function onKey(k){
  if (G.state === 'play'){
    if (k === 'a') toggleDoor('L');
    else if (k === 'l') toggleDoor('R');
    else if (k === 's') toggleLight('L');
    else if (k === 'k') toggleLight('R');
    else if (k === ' ') toggleCam();
    else if (k === 'm') SFX.setMuted(!SFX.muted);
    else if (k === 'f'){ cycleFear(); toast('공포 강도: ' + FEAR_NAMES[G.fear]); }
    else if (k === 'b') toast('배경 음악: ' + SFX.musicToggle());
    else if (k === 'v'){ cycleDim(); toast('화면 밝기: ' + DIM_NAMES[G.dim]); }
  } else if (k === 'm') SFX.setMuted(!SFX.muted);
  else if (k === 'f') cycleFear();
  else if (k === 'b') SFX.musicToggle();
  else if (k === 'v') cycleDim();
  else if (k === ' ' || k === 'enter') advanceScreen();
}
function advanceScreen(){
  if (G.state === 'map'){ G.state = 'title'; G.stateT = 0; return; }
  if (G.state === 'title') gotoIntro(1);
  else if (G.state === 'intro') startNight(G.night);
  else if (G.state === 'win'){
    if (G.stateT <= 1.6) return;
    if (G.P.custom){
      const all20 = SLIDERS.every(sl => CUSTOM[sl.k] === 20);
      if (all20){ G.endingKind = 'custom20'; G.state = 'ending'; G.stateT = 0; }
      else { G.state = 'custom'; G.stateT = 0; }
    }
    else if (G.P.night >= 5){ G.endingKind = 'night5'; G.state = 'ending'; G.stateT = 0; }
    else gotoIntro(G.P.night + 1);
  } else if (G.state === 'ending'){
    if (G.stateT <= 3) return;
    G.state = 'custom'; G.stateT = 0;
  } else if (G.state === 'dead'){
    if (G.stateT <= DEAD_HOLD + (G.fear === 0 ? 0.6 : 1.6)) return;
    if (G.dead.custom){ G.state = 'custom'; G.stateT = 0; }
    else gotoIntro(G.dead.night);
  }
}
function routeClicks(){
  for (let i=0;i<clicks.length;i++){
    const c = clicks[i];
    if (G.state === 'play'){
      if (hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      if (hit(R_CAMBAR, c.x, c.y)){ toggleCam(); continue; }
      if (G.P.cam){
        let picked = false;
        for (let n=1;n<=9;n++){ if (hit(miniRect(n), c.x, c.y)){ setCamRoom(n); picked = true; break; } }
        if (picked || hit(MINI, c.x, c.y) || hit(R_WIND, c.x, c.y)) continue;
        // 카메라를 보는 동안 복도등은 조작 가능, 문은 불가
        if (hit(AUX.Llight, c.x, c.y)) toggleLight('L');
        else if (hit(AUX.Rlight, c.x, c.y)) toggleLight('R');
        else if (hit(AUX.Ldoor, c.x, c.y) || hit(AUX.Rdoor, c.x, c.y)) toast('카메라를 보는 중에는 문을 조작할 수 없다');
        continue;
      }
      let used = false;
      for (const k in AUX){
        if (hit(AUX[k], c.x, c.y)){
          if (k === 'Ldoor') toggleDoor('L');
          else if (k === 'Rdoor') toggleDoor('R');
          else if (k === 'Llight') toggleLight('L');
          else toggleLight('R');
          used = true; break;
        }
      }
      if (used) continue;
      // 씬 좌표 버튼(화면 좌표 + panX)
      const sx = c.x + G.P.panX, sy = c.y;
      if (hit(SBTN.Ldoor, sx, sy)) toggleDoor('L');
      else if (hit(SBTN.Llight, sx, sy)) toggleLight('L');
      else if (hit(SBTN.Rdoor, sx, sy)) toggleDoor('R');
      else if (hit(SBTN.Rlight, sx, sy)) toggleLight('R');
    } else if (G.state === 'custom'){
      if (hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      let si = -1;
      for (let i=0;i<SLIDERS.length;i++){ if (hit(sliderHit(i), c.x, c.y)){ si = i; break; } }
      if (si >= 0){
        const tr = sliderTrack(si);
        G.drag = si;
        CUSTOM[SLIDERS[si].k] = clamp(Math.round((c.x - tr.x) / tr.w * 20), 0, 20);
        continue;
      }
      if (hit(R_CUSTOM_FEAR, c.x, c.y)){ cycleFear(); continue; }
      if (hit(R_ORGAN_TOG, c.x, c.y)){ CUSTOM.organ = !CUSTOM.organ; continue; }
      if (hit(R_CUSTOM_GO, c.x, c.y)){ startCustom(); continue; }
    } else {
      if (G.state !== 'dead' && hit(R_MUTE, c.x, c.y)){ SFX.setMuted(!SFX.muted); continue; }
      if (G.state === 'title'){
        if (hit(R_TITLE_DIM, c.x, c.y)){ cycleDim(); continue; }
        if (hit(R_TITLE_MUSIC, c.x, c.y)){ SFX.musicToggle(); continue; }
        if (hit(R_TITLE_FEAR, c.x, c.y)){ cycleFear(); continue; }
        if (hit(R_TITLE_MAP, c.x, c.y)){ G.state = 'map'; G.stateT = 0; continue; }
        if (G.cleared >= 5 && hit(R_TITLE_CUS, c.x, c.y)){ G.state = 'custom'; G.stateT = 0; continue; }
      }
      advanceScreen();
    }
  }
  clicks.length = 0;
}

/* ═════════ 메인 루프 ═════════ */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);              // 탭 전환 시 시간 폭주 방지

  G.stateT += dt; G.titleT += dt;
  G.fanA += dt * 3.1 * ((G.state === 'play' && G.P) ? G.P.fanSpeed : 1);
  routeClicks();

  // 커스텀 나이트 슬라이더 드래그
  if (G.state === 'custom'){
    if (!ptr.down) G.drag = -1;
    if (G.drag >= 0){
      const tr = sliderTrack(G.drag);
      CUSTOM[SLIDERS[G.drag].k] = clamp(Math.round((ptr.x - tr.x) / tr.w * 20), 0, 20);
    }
  } else G.drag = -1;

  if (G.state === 'play') updatePlay(dt);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  if (G.state === 'title') drawTitle();
  else if (G.state === 'intro') drawIntro();
  else if (G.state === 'play'){
    const P = G.P;
    ctx.save();
    let sx = 0, sy = 0;
    if (P.shakeT > 0){ const sk = P.shakeT * 14; sx += rand(-sk, sk); sy += rand(-sk, sk); }
    const jit = P.dread * 1.9;                       // 손이 떨린다
    sx += rand(-jit, jit);
    sy += rand(-jit, jit) + Math.sin(P.bob) * (1.1 + P.dread*2.4);   // 숨쉬기
    ctx.translate(sx, sy);
    if (P.blackout) drawBlackout();
    else if (P.cam) drawCam();
    else drawOffice();
    ctx.restore();
    if (!P.blackout){                       // 전역 암막 — 극장은 폐업했고 전기는 아깝다
      ctx.fillStyle = 'rgba(0,0,0,' + DIM_ALPHA[G.dim] + ')';
      ctx.fillRect(0, 0, W, H);
    }
    drawHUD();
    grain(0.035 + Math.random()*0.015 + P.dread*0.02);
    drawFear();
  }
  else if (G.state === 'win') drawWin();
  else if (G.state === 'dead') drawDead();
  else if (G.state === 'ending') drawEnding();
  else if (G.state === 'custom') drawCustom();
  else if (G.state === 'map') drawMapScreen();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
