<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe9a8">
<title>이모지 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #fff6dc;
  --paper: #fffdf6;
  --ink: #3b2a4a;
  --ink-soft: #7a6a86;
  --yellow: #ffcc4d;
  --yellow-d: #e2a400;
  --key-edge: #d9cdb2;
  --grass: #b7e39a;
  --grass-d: #93cf73;
  --path: #f3ddb0;
  --pink: #ff7aa8;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #f3e6c4; color: var(--ink); font-family: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
h2, h3, p { margin: 0; }
#app { position: relative; height: 100dvh; max-width: 960px; margin: 0 auto; background: var(--cream); overflow: hidden; box-shadow: 0 0 60px rgba(90, 60, 20, .18); }
.screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); gap: 10px; overflow-y: auto; }
.screen.active { display: flex; animation: pop .22s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } }

/* 키캡 버튼: 이 세계의 모든 버튼은 키보드 키 */
.key { position: relative; background: var(--paper); border-radius: 16px; padding: 10px 14px; box-shadow: 0 5px 0 var(--key-edge), 0 9px 16px rgba(80, 50, 10, .14); transition: transform .06s, box-shadow .06s, filter .15s; user-select: none; }
.key:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--key-edge), 0 3px 6px rgba(80, 50, 10, .14); }
.key:disabled { filter: grayscale(.8) opacity(.55); cursor: default; }
.key.back, .key.mini { padding: 6px 12px; border-radius: 12px; font-size: 16px; min-width: 40px; }
.pill { background: rgba(255, 255, 255, .78); border-radius: 999px; padding: 6px 12px; font-size: 15px; white-space: nowrap; box-shadow: inset 0 0 0 2px rgba(59, 42, 74, .08); backdrop-filter: blur(4px); }
.pill b { font-weight: 400; }
.pill.gem { background: #e9f4ff; }
.grow { flex: 1; }
.bar { display: flex; align-items: center; gap: 10px; }
.bar h2 { flex: 1; font-size: 22px; font-weight: 400; }
.hint { color: var(--ink-soft); font-size: 14px; }

/* ---------- 홈 ---------- */
#home { padding: 0; overflow: hidden; }
#field { position: absolute; inset: 0; background: linear-gradient(#aee0ff 0%, #d9f1ff 30%, #fff3cf 46%); overflow: hidden; }
.sun { position: absolute; right: 9%; top: 9%; width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(#fff7c2, #ffd84d 60%); box-shadow: 0 0 0 14px rgba(255, 216, 77, .25), 0 0 0 30px rgba(255, 216, 77, .12); }
.cloud { position: absolute; width: 120px; height: 38px; background: #fff; border-radius: 40px; opacity: .9; animation: drift 60s linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 54px; height: 54px; left: 16px; top: -24px; }
.cloud::after { width: 40px; height: 40px; left: 60px; top: -16px; }
.c1 { top: 14%; left: -20%; }
.c2 { top: 24%; left: -40%; animation-duration: 85s; animation-delay: -30s; transform: scale(.7); }
.c3 { top: 8%; left: -30%; animation-duration: 110s; animation-delay: -70s; transform: scale(.55); }
@keyframes drift { to { left: 110%; } }
.hills { position: absolute; left: -10%; right: -10%; top: 30%; height: 22%; background: radial-gradient(60% 100% at 22% 100%, #c9ecae 99%, transparent 100%), radial-gradient(50% 90% at 72% 100%, #d6f1bd 99%, transparent 100%); }
.ground { position: absolute; left: 0; right: 0; top: 42%; bottom: 0; background-color: var(--grass); background-image: linear-gradient(rgba(255, 255, 255, .0), rgba(120, 180, 90, .35)), radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .28) 0 34%, transparent 36%); background-size: 100% 100%, 64px 64px; border-top: 6px solid #a5d987; }
.w { position: absolute; left: 0; top: 0; width: 0; height: 0; cursor: pointer; will-change: transform; }
.w .body { position: absolute; left: -32px; bottom: 0; width: 64px; text-align: center; font: 52px/1 var(--emoji); transform-origin: 50% 100%; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .08)); }
.w .shadow { position: absolute; left: -22px; bottom: -6px; width: 44px; height: 12px; border-radius: 50%; background: rgba(40, 80, 20, .22); }
.w.moving .body { animation: waddle .46s ease-in-out infinite; }
.w.hop .body { animation: hop .5s ease-out; }
@keyframes waddle { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-5px); } }
@keyframes hop { 40% { transform: translateY(-26px) scale(1.06, .96); } 100% { transform: none; } }
.w .aura { position: absolute; left: -36px; bottom: -8px; width: 72px; height: 72px; border-radius: 50%; opacity: .55; animation: glow 2s ease-in-out infinite; }
@keyframes glow { 50% { transform: scale(1.12); opacity: .3; } }
.w .say { position: absolute; left: 0; bottom: 64px; transform: translateX(-50%); background: #fff; border-radius: 14px; padding: 5px 10px; font-size: 15px; white-space: nowrap; box-shadow: 0 3px 0 var(--key-edge); animation: pop .2s ease-out; }
.w .say::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); }
.w .say small { display: block; font-size: 11px; }
.topbar { position: relative; display: flex; align-items: center; gap: 8px; padding: 14px 14px 0; }
.logo { flex: 1; display: flex; align-items: center; gap: 10px; }
.logo-face { font: 40px/1 var(--emoji); animation: waddle 2.4s ease-in-out infinite; }
.logo b { display: block; font-size: 26px; font-weight: 400; letter-spacing: -.5px; text-shadow: 0 2px 0 #fff; }
.logo small { color: var(--ink-soft); font-size: 13px; }
.dock { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 0 14px; }
.key.side { width: 78px; height: 78px; display: grid; place-content: center; gap: 2px; font-size: 15px; }
.key.side i { font: 30px/1 var(--emoji); font-style: normal; }
.key.play { flex: 0 1 260px; height: 96px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 36px; background: linear-gradient(#ffdb6e, var(--yellow)); box-shadow: 0 7px 0 var(--yellow-d), 0 14px 24px rgba(160, 100, 0, .3); border-radius: 26px; }
.key.play:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--yellow-d), 0 4px 8px rgba(160, 100, 0, .3); }
.key.play i { font-style: normal; font-size: 26px; animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(5px); } }

/* ---------- 스테이지 ---------- */
.stage-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 4px 2px 10px; }
.stage { display: grid; gap: 4px; text-align: left; padding: 12px; min-height: 108px; }
.stage .no { font-size: 13px; color: var(--ink-soft); }
.stage .nm { font-size: 18px; }
.stage .en { font: 18px/1.2 var(--emoji); letter-spacing: 2px; }
.stage .st { font-size: 15px; letter-spacing: 1px; color: #f5a300; }
.stage .st i { font-style: normal; color: #d8cfbb; }
.stage.locked { background: #efe6cf; }
.stage.boss { background: linear-gradient(#fff, #ffe6ee); }

/* ---------- 덱 ---------- */
.deck-slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.slot { aspect-ratio: 1; display: grid; place-content: center; text-align: center; border-radius: 16px; background: var(--paper); box-shadow: 0 5px 0 var(--key-edge); font-size: 12px; position: relative; border: 3px solid transparent; }
.slot.empty { background: transparent; box-shadow: none; border: 3px dashed #d9cdb2; color: #b9ad94; font-size: 24px; }
.slot .em, .card .em { font: 34px/1.1 var(--emoji); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
.chips.small { min-height: 0; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px currentColor; }
.chip.off { color: var(--ink-soft); box-shadow: inset 0 0 0 2px #e3d9c2; }
.own-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 10px; padding: 2px 2px 8px; }
.card { display: grid; justify-items: center; gap: 1px; padding: 8px 4px 6px; border-radius: 14px; font-size: 12px; border: 3px solid transparent; }
.card .cost { color: #c98a00; }
.card.in { background: #fff3c4; }
.card.sel, .slot.sel { border-color: var(--ink); }
.card.lock { filter: grayscale(1) opacity(.45); }
.card .cnt { position: absolute; right: 4px; top: 2px; font-size: 11px; color: var(--ink-soft); }
.rar-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; }
.char-info { position: sticky; bottom: 0; background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 -2px 0 var(--key-edge), 0 8px 20px rgba(80, 50, 10, .18); display: none; gap: 10px; align-items: center; }
.char-info.on { display: flex; }
.char-info .em { font: 46px/1 var(--emoji); }
.char-info .tx { flex: 1; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
.char-info .tx b { color: var(--ink); font-weight: 400; font-size: 17px; }

/* ---------- 뽑기 ---------- */
.banner { border-radius: 22px; padding: 22px 16px; text-align: center; background: linear-gradient(135deg, #ffe08a, #ffc2d6 60%, #cdb8ff); box-shadow: 0 6px 0 #e3b27a; }
.banner-faces { font: 44px/1 var(--emoji); letter-spacing: 6px; }
.banner h3 { font-size: 22px; font-weight: 400; margin-top: 8px; }
.banner p { font-size: 14px; opacity: .75; }
.pity { display: grid; gap: 8px; background: #fff; border-radius: 16px; padding: 12px; box-shadow: 0 4px 0 var(--key-edge); font-size: 13px; }
.pity .row { display: grid; grid-template-columns: 84px 1fr 62px; align-items: center; gap: 8px; }
.pity .track { height: 10px; border-radius: 9px; background: #f0e8d4; overflow: hidden; }
.pity .fill { height: 100%; border-radius: 9px; }
.pull-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.key.pull { display: grid; gap: 2px; padding: 14px; font-size: 22px; }
.key.pull small { font-size: 14px; color: var(--ink-soft); }
.key.pull.gold { background: linear-gradient(#ffdb6e, var(--yellow)); box-shadow: 0 5px 0 var(--yellow-d), 0 9px 16px rgba(160, 100, 0, .25); }
.rates { font-size: 12px; color: var(--ink-soft); line-height: 1.6; text-align: center; }
.results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
.results.one { grid-template-columns: 1fr; justify-items: center; }
.rcard { position: relative; aspect-ratio: .82; min-width: 54px; border-radius: 14px; background: #fff; border: 3px solid; display: grid; place-content: center; justify-items: center; font-size: 11px; animation: flip .45s both cubic-bezier(.3, 1.5, .5, 1); }
.results.one .rcard { width: 150px; font-size: 16px; }
.rcard .em { font: 32px/1.1 var(--emoji); }
.results.one .rcard .em { font-size: 76px; }
.rcard .new { position: absolute; top: -8px; right: -6px; background: var(--pink); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 8px; }
@keyframes flip { from { transform: scale(.2) rotate(-25deg); opacity: 0; } }

/* ---------- 전투 ---------- */
#battle { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px; overflow: hidden; background: #e9f5d8; }
.hud { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.hud .pill { font-size: 14px; padding: 5px 9px; }
.hud .energy { background: #fff3c4; }
.hud .next { font-family: var(--emoji); padding: 5px 8px; }
#btnAuto.on { background: #c9f0ff; }
#boardWrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; padding-bottom: 8px; }
#board { border-radius: 18px; touch-action: none; box-shadow: 0 6px 0 #a9cf8c, 0 12px 22px rgba(60, 90, 30, .2); }
.tower-panel { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: none; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 8px 10px; box-shadow: 0 4px 0 var(--key-edge), 0 8px 18px rgba(0, 0, 0, .18); font-size: 14px; white-space: nowrap; }
.tower-panel.on { display: flex; }
.tower-panel .key { padding: 6px 10px; font-size: 14px; border-radius: 10px; box-shadow: 0 3px 0 var(--key-edge); }
.tower-panel .up { background: #fff3c4; }
.wave-banner { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); background: rgba(59, 42, 74, .88); color: #fff; padding: 8px 20px; border-radius: 999px; font-size: 20px; opacity: 0; pointer-events: none; white-space: nowrap; }
.wave-banner.show { animation: banner 1.8s ease-out; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.hand { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.hcard { display: grid; justify-items: center; padding: 6px 2px 5px; border-radius: 14px; font-size: 12px; border: 3px solid transparent; }
.hcard .em { font: 30px/1.1 var(--emoji); }
.hcard .cost { color: #c98a00; font-size: 14px; }
.hcard .n { position: absolute; top: 2px; right: 6px; font-size: 11px; color: var(--ink-soft); }
.hcard.sel { border-color: var(--ink); background: #fff3c4; transform: translateY(-4px); }
.hcard.poor { filter: grayscale(.9) opacity(.6); }

/* ---------- 모달과 토스트 ---------- */
.modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(59, 42, 74, .5); padding: 18px; z-index: 20; }
.modal.on { display: grid; }
.sheet { width: min(440px, 100%); max-height: 90dvh; overflow-y: auto; background: var(--cream); border-radius: 26px; padding: 20px; text-align: center; box-shadow: 0 8px 0 var(--key-edge); animation: pop .2s ease-out; }
.sheet h3 { font-size: 26px; font-weight: 400; }
.sheet .big { font: 64px/1.2 var(--emoji); }
.sheet .stars { font-size: 34px; color: #f5a300; letter-spacing: 4px; }
.sheet .stars i { font-style: normal; color: #d8cfbb; }
.sheet p { color: var(--ink-soft); margin: 6px 0; font-size: 15px; }
.sheet .btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.sheet .btns .key { min-width: 96px; font-size: 17px; }
.key.primary { background: linear-gradient(#ffdb6e, var(--yellow)); box-shadow: 0 5px 0 var(--yellow-d), 0 9px 16px rgba(160, 100, 0, .25); }
.enemy-list { display: grid; gap: 6px; text-align: left; margin: 10px 0; }
.enemy-list div { background: #fff; border-radius: 12px; padding: 6px 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.enemy-list span { font: 24px/1 var(--emoji); }
.enemy-list small { color: var(--ink-soft); }
#toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: rgba(59, 42, 74, .92); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; white-space: nowrap; }
#toast.on { opacity: 1; }
@media (max-width: 420px) {
  .hud .next { display: none; }
  .key.play { height: 84px; font-size: 30px; }
  .key.side { width: 68px; height: 68px; }
}

/* ---------- 전투 시작 안내 ---------- */
.start-box { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; background: rgba(255, 253, 246, .94); border-radius: 18px; padding: 8px 10px 12px 14px; box-shadow: 0 4px 0 var(--key-edge), 0 8px 18px rgba(0, 0, 0, .15); width: max-content; max-width: 96%; }
.start-box.on { display: flex; }
.start-box p { font-size: 13px; color: var(--ink-soft); text-align: left; margin: 0; }
.start-box .key { font-size: 17px; white-space: nowrap; animation: nudgeY 1s ease-in-out infinite; }
@keyframes nudgeY { 50% { transform: translateY(-3px); } }

/* ---------- 뽑기 연출 ---------- */
.gbox-wrap { padding: 26px 0 8px; }
.gbox { --lv: 0; display: inline-block; font: 120px/1 var(--emoji); cursor: pointer; user-select: none; filter: drop-shadow(0 0 calc(6px + var(--lv) * 12px) var(--glow)); animation: idle 1.4s ease-in-out infinite; }
.gbox.shake { animation: boxshake .26s linear; }
@keyframes idle { 50% { transform: translateY(-8px) rotate(3deg); } }
@keyframes boxshake { 0% { transform: scale(1.18) rotate(-12deg); } 35% { transform: scale(.94) rotate(11deg); } 70% { transform: scale(1.08) rotate(-6deg); } 100% { transform: none; } }
button.rcard { font: inherit; color: inherit; cursor: pointer; padding: 0; }
.rcard.back { border-color: var(--key-edge); background: var(--paper); box-shadow: 0 5px 0 var(--key-edge); }
.rcard.back .q { font-size: 30px; color: #c9bda2; }
.results.one .rcard.back .q { font-size: 70px; }
.rcard.back:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--key-edge); }
.rcard.open { animation: reveal .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes reveal { 0% { transform: rotateY(90deg) scale(.8); } 60% { transform: rotateY(0) scale(1.15); } 100% { transform: none; } }
.sheet.flash { animation: sheetflash .5s ease-out; }
@keyframes sheetflash { 0% { box-shadow: 0 0 0 0 var(--glow), 0 8px 0 var(--key-edge); background: #fff; } 100% { box-shadow: 0 0 0 40px transparent, 0 8px 0 var(--key-edge); } }

/* ---------- 모드 탭, 설정 ---------- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs .key { font-size: 18px; padding: 10px; }
.tabs .key.on { background: linear-gradient(#ffdb6e, var(--yellow)); box-shadow: 0 5px 0 var(--yellow-d), 0 9px 16px rgba(160, 100, 0, .25); }
.key.danger { background: #ffe1e1; color: #c0262b; box-shadow: 0 5px 0 #e9b3b3, 0 9px 16px rgba(160, 30, 30, .18); }
.topbar .key.mini { font-size: 18px; }

/* ---------- 난투 ---------- */
#brawl { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px; overflow: hidden; background: #e9f5d8; }
#arenaWrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; padding-bottom: 8px; }
#arena { border-radius: 18px; touch-action: none; box-shadow: 0 6px 0 #a9cf8c, 0 12px 22px rgba(60, 90, 30, .2); }
.ebar { position: relative; height: 22px; border-radius: 11px; background: #fff; box-shadow: inset 0 0 0 2px rgba(59, 42, 74, .1); overflow: hidden; }
.efill { height: 100%; background: linear-gradient(#ffe08a, #ffcc4d); border-radius: 11px; width: 0; }
.ebar span { position: absolute; inset: 0; display: grid; place-content: center; font-size: 13px; }

/* ---------- 전투 행동 줄: 기술, 다음 웨이브 ---------- */
.actions { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 6px; }
.key.act { display: grid; padding: 6px 4px 5px; border-radius: 14px; font-size: 15px; line-height: 1.15; overflow: hidden; }
.key.act b { font-weight: 400; position: relative; }
.key.act small { font-size: 11px; color: var(--ink-soft); position: relative; }
.key.skill::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: #ffe9a8; border-radius: 14px 0 0 14px; transition: width .2s; }
.key.skill.ready::before { background: linear-gradient(#ffdb6e, var(--yellow)); border-radius: 14px; }
.key.skill.ready { animation: ready .8s ease-in-out infinite; }
.key.skill.active::before { background: #ffb3c8; width: 100%; border-radius: 14px; }
@keyframes ready { 50% { box-shadow: 0 5px 0 var(--yellow-d), 0 0 16px 4px rgba(255, 190, 40, .8); } }
.chip.perks { font: inherit; font-size: 13px; cursor: pointer; border: 0; color: #a855f7; }

/* ---------- 캐릭터 정보 패널 ---------- */
.tpanel { display: none; flex-direction: column; gap: 6px; background: #fff; border-radius: 18px; padding: 8px 10px 10px; box-shadow: 0 -2px 0 var(--key-edge), 0 6px 16px rgba(80, 50, 10, .16); }
.tpanel.on { display: flex; animation: pop .16s ease-out; }
.tp-head { display: flex; align-items: center; gap: 8px; }
.tp-head .em { font: 34px/1 var(--emoji); }
.tp-head .nm { flex: 1; font-size: 16px; line-height: 1.25; }
.tp-head .nm b { font-weight: 400; }
.tp-head small { font-size: 12px; color: var(--ink-soft); }
.tp-stats { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.tp-stats b { color: var(--ink); font-weight: 400; }
.tp-stats .buff { color: #f5a300; margin-left: 4px; }
.tp-ups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.tp-ups.n1 { grid-template-columns: 1fr; }
.key.upb { display: grid; gap: 1px; text-align: left; padding: 6px 8px; border-radius: 12px; font-size: 12px; box-shadow: 0 3px 0 var(--key-edge); border-left: 5px solid var(--tc); }
.key.upb .t { font-size: 13px; }
.key.upb .t i { font-style: normal; color: var(--tc); letter-spacing: 1px; font-size: 10px; }
.key.upb .v { color: var(--ink-soft); }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);

}

function buildPath(pts) {
  const segs = [];
  let len = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i];
    const [x2, y2] = pts[i + 1];
    const l = Math.hypot(x2 - x1, y2 - y1);
    segs.push({ x1, y1, x2, y2, l, start: len });
    len += l;
  }
  return { pts, segs, len };
}
function posAt(path, d, out) {
  const segs = path.segs;
  let s = segs[0];
  for (let i = 0; i < segs.length; i++) {
    s = segs[i];
    if (d <= s.start + s.l) break;
  }
  const t = Math.max(0, Math.min(1, (d - s.start) / s.l));
  out.x = s.x1 + (s.x2 - s.x1) * t;
  out.y = s.y1 + (s.y2 - s.y1) * t;
  return out;
}

// 웨이브 w가 시작될 때까지 벌 수 있는 누적 에너지
function energyBy(w) {
  let e = RULES.startEnergy;
  for (let i = 1; i < w; i++) e += waveReward(i);
  return e;
}
// 적 총체력은 그 시점의 누적 에너지에 비례 (에너지 1당 체력 2.4)
function waveBudget(w) {
  return 2.4 * energyBy(w);
}

function makeWaves(stage) {
  const st = STAGES[stage - 1];
  const rng = mulberry32(7777 + stage * 131);
  const mult = STAGE_MULT[stage - 1];
  const waves = [];
  for (let w = 1; w <= RULES.wavesPerStage; w++) {
    const budget = waveBudget(w) * mult;
    const reward = waveReward(w);
    const boss = st.boss && st.boss[w];
    const pick = () => st.pool[Math.floor(rng() * st.pool.length)];
    let main = st.fresh && (w === 1 || w % 3 === 2) ? st.fresh : pick();
    let sub = null;
    if (w >= 3 && st.pool.length > 1) {
      for (let k = 0; k < 6 && (!sub || sub === main); k++) sub = pick();
      if (sub === main) sub = null;
    }
    const elite = !boss && w >= 4 && rng() < 0.25; // 정예 웨이브: 수는 절반, 체력은 두 배
    const groups = boss
      ? [{ type: boss, share: 0.55 }, { type: main, share: 0.45 }]
      : sub
        ? [{ type: main, share: 0.65 }, { type: sub, share: 0.35 }]
        : [{ type: main, share: 1 }];
    const spawns = [];
    groups.forEach((g, gi) => {
      const def = ENEMIES[g.type];
      let n = Math.max(1, Math.round(def.count(w) * g.share * (elite ? 0.5 : 1)));
      if (def.boss) n = 1;
      const hp = (budget * g.share * def.hpf) / n;
      const bounty = (reward * g.share) / n;
      for (let i = 0; i < n; i++) {
        spawns.push({ t: gi * 1.5 + i * def.gap * (elite ? 1.6 : 1), type: g.type, hp, bounty, elite });
      }
    });
    spawns.sort((a, b) => a.t - b.t);
    waves.push({ spawns, types: groups.map((g) => g.type), elite, boss: !!boss });
  }
  return waves;
}

// ---------- 뽑기 ----------
function gachaPull(pity, rng) {
  pity.hero++;
  pity.legend++;
  pity.myth++;
  const R = RARITY.map((r) => r.rate);
  let rar;
  const rollFrom = (min) => {
    let tot = 0;
    for (let i = min; i < R.length; i++) tot += R[i];
    let x = rng() * tot;
    for (let i = min; i < R.length; i++) {
      x -= R[i];
      if (x < 0) return i;
    }
    return R.length - 1;
  };
  // 천장은 해당 등급을 정확히 지급 (상위 등급으로 튀지 않음 → 공개 확률과 실측이 일치)
  if (pity.myth >= PITY.myth) rar = 4;
  else if (pity.legend >= PITY.legend) rar = 3;
  else if (pity.hero >= PITY.hero) rar = 2;
  else rar = rollFrom(0);
  if (rar >= 4) pity.myth = 0;
  if (rar >= 3) pity.legend = 0;
  if (rar >= 2) pity.hero = 0;
  const pool = CHARS.filter((c) => c.rar === rar);
  return pool[Math.floor(rng() * pool.length)];
}

// 캐릭터마다 강화 갈래가 있고, 갈래당 3단계 · 캐릭터당 합계 6단계까지 → 어디에 투자할지 골라야 함
const UP = { max: 3, total: 6, costK: [0.5, 0.75, 1.0], dmg: 0.35, spd: 0.25, rng: 0.5 };
const TRACKS = {

function tracksOf(def) {
  if (def.income) return ['sp'];
  if (def.aura) return ['rng', 'sp'];
  if (def.pulse && !def.dmg) return ['spd', 'rng', 'sp'];

}
// 캐릭터의 고유 능력이 무엇이냐에 따라 '특수' 갈래가 올려 주는 것이 달라짐
function spKey(def) {
  if (def.slow) return 'slow';
  if (def.poison) return 'poison';
  if (def.vuln) return 'vuln';
  if (def.knock) return 'knock';
  if (def.pull) return 'pull';
  if (def.zone) return 'zone';
  if (def.aura) return 'aura';
  if (def.income) return 'income';
  if (def.pulse) return def.pulse.sleep ? 'sleep' : 'confuse';
  if (def.seal) return 'seal';
  if (def.crit) return 'crit';
  if (def.splash) return 'splash';
  if (def.target === 'strong') return 'hunter';
  return def.range >= 3 ? 'opener' : 'double';
}

const SKILL = { blastKills: 22, blastPct: 0.14, blastBoss: 0.05, blastStun: 1.2, cheerCd: 40, cheerDur: 5, cheerMul: 1.8, earlyBonus: 0.25, comboWindow: 1.5, comboEvery: 10, comboBonus: 10 };

// ===== engine.js =====
// 이모지 디펜스 — 디펜스 전투 엔진 (DOM 의존 없음, 고정 시간 간격으로 step 호출)

let nextId = 1;

class Game {
  constructor({ deck, stage, seed = 1, fx = false, waitStart = false }) {
    this.started = !waitStart; // 화면에서는 플레이어가 시작을 누를 때까지 첫 웨이브를 기다림
    this.rng = mulberry32(seed);
    this.prng = mulberry32(seed ^ 0x9e3779b9); // 특성 카드 추첨용 (전투 난수와 분리)
    this.deckIds = deck.slice();
    this.deck = deck.map((id) => CHAR_BY_ID[id]);
    this.syn = synergyOf(deck);
    this.stage = stage;
    this.waves = makeWaves(stage);
    this.energy = RULES.startEnergy;
    this.maxHearts = RULES.hearts;
    this.hearts = RULES.hearts;
    this.t = 0;
    this.waveIdx = -1;
    this.spawnQ = [];
    this.spawnClock = 0;
    this.gap = RULES.firstWaveDelay;
    this.enemies = [];
    this.towers = [];
    this.zones = [];
    this.grid = new Map();
    this.result = null;
    this.fxOn = fx;
    this.fx = [];
    this.stats = {};
    this.leaks = 0;
    this.kills = 0;
    this.critNow = false;
    // 특성 카드로 쌓이는 보정치
    this.pk = { dmg: 0, spd: 0, range: 0, crit: 0, bounty: 0, aoeR: 0, cc: 0, upCost: 0, enemySlow: 0, boss: 0, dot: 0, charge: 0, refund: 0, attr: {} };
    this.perks = [];
    this.perkOffer = null;
    this.perksGiven = 0;
    // 기술과 콤보
    this.blast = 0;
    this.cheerCd = 0;
    this.cheerT = 0;
    this.combo = 0;
    this.comboT = 0;
    this.offerPerk();
  }

  emit(ev) {
    if (this.fxOn) this.fx.push(ev);
  }

  // ---------- 능력치 계산: 강화·시너지·특성을 모두 반영한 실제 값 ----------
  calc(def, up) {
    const pk = this.pk;
    const sp = up.sp;
    const key = spKey(def);
    const dmgK = (1 + UP.dmg * up.dmg) * (1 + pk.dmg + (pk.attr[def.attr] || 0));
    const o = { key, sp };
    o.dmg = def.dmg * dmgK;
    o.itv = def.itv > 0 ? def.itv / (1 + UP.spd * up.spd) : 0;
    o.range = def.range > 0 ? def.range + this.syn.range + pk.range + UP.rng * up.rng : 0;
    o.splash = def.splash ? (def.splash + (key === 'splash' ? 0.2 * sp : 0)) * (1 + pk.aoeR) : 0;
    o.crit = (def.crit || 0) + this.syn.crit + pk.crit + (key === 'crit' ? 0.08 * sp : 0);
    o.critMul = def.critMul || 2;
    o.zoneDps = def.zone ? def.zone.dps * dmgK * (1 + this.syn.aoe) * (1 + pk.dot) : 0;
    o.zoneR = def.zone ? (def.zone.r + 0.2 * sp) * (1 + pk.aoeR) : 0;
    o.slow = def.slow ? Math.min(RULES.slowCap, def.slow.pct + this.syn.slow + (key === 'slow' ? 0.07 * sp : 0)) : 0;
    o.poison = def.poison ? def.poison.dps * (1 + UP.dmg * up.dmg) * (1 + 0.4 * sp) * (1 + pk.dot) : 0;
    o.vuln = def.vuln ? def.vuln.pct + 0.05 * sp : 0;
    o.knock = def.knock ? def.knock + 0.25 * sp : 0;
    o.pull = def.pull ? def.pull + 0.4 * sp : 0;
    o.seal = def.seal ? def.seal + sp : 0;
    o.auraSpd = def.aura && def.aura.spd ? def.aura.spd * (1 + 0.4 * sp) : 0;
    o.auraDmg = def.aura && def.aura.dmg ? def.aura.dmg * (1 + 0.4 * sp) : 0;
    o.income = def.income ? def.income.amt + 4 * sp : 0;
    o.pulseEvery = def.pulse ? def.pulse.every / (def.dmg ? 1 : 1 + UP.spd * up.spd) : 0;
    o.sleep = def.pulse && def.pulse.sleep ? def.pulse.sleep + 0.4 * sp : 0;
    o.confN = def.pulse && def.pulse.confuse ? def.pulse.n + sp : 0;
    o.dps = o.itv > 0 ? (def.zone ? o.zoneDps : (o.dmg * (1 + o.crit * (o.critMul - 1)) * (key === 'double' ? 1 + 0.15 * sp : 1)) / o.itv) : 0;
    return o;
  }
  levelOf(t) {
    return t.up.dmg + t.up.spd + t.up.rng + t.up.sp;
  }

  // ---------- 배치 ----------
  rangeOf(def) {
    return def.range > 0 ? def.range + this.syn.range + this.pk.range : 0;
  }
  countOf(id) {
    let n = 0;
    for (const t of this.towers) if (t.def.id === id) n++;
    return n;
  }
  canBuild(c, r) {
    return MAP.inBounds(c, r) && !MAP.isPath(c, r) && !this.grid.has(c + ',' + r);
  }
  whyNot(id, c, r) {
    const def = CHAR_BY_ID[id];
    if (!this.canBuild(c, r)) return '여기에는 놓을 수 없어요';
    if (this.towers.length >= RULES.maxUnits) return `최대 ${RULES.maxUnits}칸까지 배치할 수 있어요`;
    if (this.countOf(id) >= (def.max || RULES.maxCopies)) return `${def.name}은(는) 최대 ${def.max || RULES.maxCopies}기까지예요`;
    if (this.energy < def.cost) return '에너지가 부족해요';
    return null;
  }
  place(id, c, r) {
    if (this.result || this.whyNot(id, c, r)) return null;
    const def = CHAR_BY_ID[id];
    this.energy -= def.cost;
    const t = {
      id: nextId++, def, up: { dmg: 0, spd: 0, rng: 0, sp: 0 }, mode: def.target || 'first', spent: def.cost, kills: 0, dealt: 0,
      col: c, row: r, x: c, y: r, cd: 0, abilT: 0, healT: 0, incT: 0, disT: 0, spdMul: 1, dmgMul: 1, s: null, range: 0,
    };
    this.towers.push(t);
    this.grid.set(c + ',' + r, t);
    this.recalc();
    if (def.pulse) t.abilT = t.s.pulseEvery * 0.5;
    this.emit({ k: 'place', x: c, y: r });
    return t;
  }
  // 강화: 갈래(dmg/spd/rng/sp)를 골라 올림
  upCost(t, track) {
    return Math.round(t.def.cost * UP.costK[Math.min(UP.max - 1, t.up[track])] * (1 - this.pk.upCost));
  }
  whyNoUp(t, track) {
    if (!tracksOf(t.def).includes(track)) return '이 캐릭터에게는 없는 강화예요';
    if (t.up[track] >= UP.max) return '이 갈래는 최대예요';
    if (this.levelOf(t) >= UP.total) return `캐릭터당 강화는 합계 ${UP.total}단계까지예요`;
    if (this.energy < this.upCost(t, track)) return '에너지가 부족해요';
    return null;
  }
  upgrade(t, track) {
    if (this.result || this.whyNoUp(t, track)) return false;
    const cost = this.upCost(t, track);
    this.energy -= cost;
    t.spent += cost;
    t.up[track]++;
    this.recalc();
    this.emit({ k: 'up', x: t.x, y: t.y, track });
    return true;
  }
  refundOf(t) {
    return Math.floor(t.spent * (this.pk.refund ? 1 : RULES.refund));
  }
  sell(t) {
    const i = this.towers.indexOf(t);
    if (i < 0) return;
    this.towers.splice(i, 1);
    this.grid.delete(t.col + ',' + t.row);
    this.energy += this.refundOf(t);
    this.recalc();
  }
  recalc() {
    for (const t of this.towers) {
      t.s = this.calc(t.def, t.up);
      t.range = t.s.range;
    }
    for (const t of this.towers) {
      let spd = 0;
      let dmg = 0;
      for (const o of this.towers) {
        if (!o.def.aura || o === t) continue;
        const dx = o.x - t.x;
        const dy = o.y - t.y;
        if (dx * dx + dy * dy > o.range * o.range) continue;
        // 같은 종류의 버프는 중첩되지 않음
        spd = Math.max(spd, o.s.auraSpd);
        dmg = Math.max(dmg, o.s.auraDmg);
      }
      t.spdMul = (1 + spd) * (1 + this.syn.spd + this.pk.spd);
      t.dmgMul = 1 + dmg;
    }
  }

  // ---------- 특성 카드 ----------
  offerPerk() {
    const have = new Set(this.perks.map((p) => p.id));
    const attrs = new Set(this.deck.map((d) => d.attr));
    const pool = PERKS.filter((p) => !(p.once && have.has(p.id)) && (!p.attr || attrs.has(p.attr)));
    const pick = [];
    while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.floor(this.prng() * pool.length), 1)[0]);
    this.perkOffer = pick;
  }
  pickPerk(i) {
    const p = this.perkOffer && this.perkOffer[i];
    if (!p) return;
    this.perkOffer = null;
    this.perksGiven++;
    this.perks.push(p);
    if (p.add) for (const k in p.add) this.pk[k] += p.add[k];
    if (p.attr) this.pk.attr[p.attr] = (this.pk.attr[p.attr] || 0) + 0.25;
    if (p.now) {
      if (p.now.energy) this.energy += p.now.energy;
      if (p.now.hearts) { this.maxHearts += p.now.hearts; this.hearts += p.now.hearts; }
    }
    this.recalc();
  }

  // ---------- 기술 ----------
  // 폭발: 처치로 충전. 화면의 모든 적에게 최대 체력 비례 피해 + 잠깐 기절
  useBlast() {
    if (this.blast < 1 || this.result || !this.enemies.length) return false;
    this.blast = 0;
    for (const e of this.enemies) {
      this.damage(e, Math.max(25, e.maxHp * (e.boss ? SKILL.blastBoss : SKILL.blastPct)), null, true);
      if (!e.dead) e.sleepT = Math.max(e.sleepT, e.boss ? 0.4 : SKILL.blastStun);
      this.emit({ k: 'hit', id: e.id, x: e.x, y: e.y, n: 0, crit: true });
    }
    this.emit({ k: 'blast' });
    return true;
  }
  // 응원: 잠시 동안 모든 캐릭터 공속 증가 (재사용 대기)
  useCheer() {
    if (this.cheerCd > 0 || this.result) return false;
    this.cheerT = SKILL.cheerDur;
    this.cheerCd = SKILL.cheerCd / (1 + this.pk.charge);
    this.emit({ k: 'cheer' });
    return true;
  }
  // 다음 웨이브를 미리 부름: 적이 남아 있을 때 부르면 보너스 에너지
  earlyBonus() {
    return this.enemies.length ? Math.round(waveReward(this.waveIdx + 2) * SKILL.earlyBonus) : 0;
  }
  canCallNext() {
    return this.started && !this.result && !this.perkOffer && this.waveIdx >= 0 && this.waveIdx < this.waves.length - 1 && !this.spawnQ.length;
  }
  callNext() {
    if (!this.canCallNext()) return false;
    const b = this.earlyBonus();
    this.energy += b;
    this.gap = RULES.waveDelay;
    this.startWave();
    if (b) this.emit({ k: 'bonus', n: b });
    return true;
  }

  // ---------- 웨이브 ----------
  startWave() {
    this.waveIdx++;
    this.spawnQ = this.waves[this.waveIdx].spawns.slice();
    this.spawnClock = 0;
    this.emit({ k: 'wave', n: this.waveIdx + 1 });
  }
  spawn(s) {
    const def = ENEMIES[s.type];
    const path = def.air ? MAP.air : MAP.ground;
    const e = {
      id: nextId++, def, type: s.type, path, hp: s.hp, maxHp: s.hp, bounty: s.bounty, d: 0, x: 0, y: 0,
      boss: !!def.boss, elite: !!s.elite,
      slowPct: 0, slowT: 0, poisonDps: 0, poisonT: 0, poisonBy: null, vulnT: 0, vulnPct: 0, sleepT: 0, confT: 0, sealT: 0,
      ccN: 0, ccReset: 0, st: 0, hidden: false, inkT: 6, dead: false,
    };
    posAt(path, 0, e);
    this.enemies.push(e);
  }

  // ---------- 피해와 상태이상 ----------
  damage(e, amt, by, dot) {
    if (e.dead) return;
    if (!dot && e.def.armor && e.sealT <= 0) amt = Math.max(1, amt - e.def.armor);
    if (e.vulnT > 0) amt *= 1 + e.vulnPct;
    const real = Math.min(e.hp, amt);
    e.hp -= amt;
    if (by) {
      by.dealt += real;
      this.stats[by.def.id] = (this.stats[by.def.id] || 0) + real;
    }
    if (!dot) this.emit({ k: 'hit', id: e.id, x: e.x, y: e.y, n: real, crit: this.critNow });
    if (e.hp <= 0) {
      e.dead = true;
      if (by) by.kills++;
      this.kills++;
      const gain = e.bounty * (1 + this.pk.bounty);
      this.energy += gain;
      this.blast = Math.min(1, this.blast + (e.boss ? 1 : (1 + this.pk.charge) / SKILL.blastKills));
      this.combo++;
      this.comboT = SKILL.comboWindow;
      if (this.combo % SKILL.comboEvery === 0) {
        this.energy += SKILL.comboBonus;
        this.emit({ k: 'combo', n: this.combo });
      }
      this.emit({ k: 'die', id: e.id, x: e.x, y: e.y, e: e.def.e, boss: e.boss, elite: e.elite, b: gain });
    }
  }
  // 강한 군중 제어는 연속으로 걸릴수록 절반씩 약해짐. 보스는 이동 방해 면역.
  cc(e, kind, amount) {
    if (e.boss) {
      if (kind === 'knock' || kind === 'pull') return 0;
      amount *= RULES.bossCcFactor;
    }
    const m = Math.pow(0.5, e.ccN);
    e.ccN++;
    e.ccReset = RULES.ccResetTime;
    return amount * m;
  }
  hit(e, dmg, t) {
    const def = t.def;
    const s = t.s;
    if (dmg > 0) {
      let m = 1;
      if (e.boss || e.elite) m += this.pk.boss + (s.key === 'hunter' ? 0.25 * s.sp : 0);
      if (s.key === 'opener' && e.hp >= e.maxHp * 0.5) m += 0.2 * s.sp;
      this.damage(e, dmg * m, t, false);
    }
    if (e.dead) return;
    const dur = 1 + this.syn.cc + this.pk.cc;
    if (def.slow && (s.slow >= e.slowPct || e.slowT <= 0)) {
      e.slowPct = s.slow;
      e.slowT = def.slow.dur * dur;
    }
    if (def.poison && (s.poison >= e.poisonDps || e.poisonT <= 0)) {
      e.poisonDps = s.poison;
      e.poisonT = def.poison.dur * dur;
      e.poisonBy = t;
    }
    if (def.vuln) { e.vulnT = def.vuln.dur * dur; e.vulnPct = Math.max(e.vulnPct, s.vuln); }
    if (def.seal) e.sealT = s.seal * dur;
    if (def.knock) this.pushBack(e, this.cc(e, 'knock', s.knock));
    if (def.pull) this.pushBack(e, this.cc(e, 'pull', s.pull));
  }
  pushBack(e, dist) {
    if (dist <= 0) return;
    e.d = Math.max(0, e.d - dist);
    posAt(e.path, e.d, e);
  }

  // ---------- 조준 ----------
  findTarget(t) {
    const r2 = t.range * t.range;
    const def = t.def;
    const mode = t.mode;
    let best = null;
    let bestScore = -Infinity;
    let bestPen = 2;
    for (const e of this.enemies) {
      if (e.dead || e.hidden) continue;
      const dx = e.x - t.x;
      const dy = e.y - t.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      const prog = e.d / e.path.len;
      const score = mode === 'strong' ? e.hp : mode === 'weak' ? -e.hp : mode === 'last' ? -prog : mode === 'near' ? -d2 : prog;
      // 상태이상 부여 캐릭터는 아직 안 걸린 적을 우선
      const pen = (def.slow && e.slowT > 0.3) || (def.poison && e.poisonT > 0.3) || (def.vuln && e.vulnT > 0.5) || (def.seal && e.sealT > 0.5) ? 1 : 0;
      if (pen < bestPen || (pen === bestPen && score > bestScore)) {
        bestPen = pen;
        bestScore = score;
        best = e;
      }
    }
    return best;
  }
  attack(t, target, echo) {
    const def = t.def;
    const s = t.s;
    let dmg = s.dmg * t.dmgMul;
    let crit = false;
    if (dmg > 0 && s.crit > 0 && this.rng() < s.crit) {
      dmg *= s.critMul;
      crit = true;
    }
    this.emit({ k: 'shot', x1: t.x, y1: t.y, x2: target.x, y2: target.y, attr: def.attr, crit, tid: t.id });
    this.critNow = crit;
    if (def.zone) {
      this.zones.push({ x: target.x, y: target.y, r: s.zoneR, dps: s.zoneDps * t.dmgMul, t: def.zone.dur * (1 + this.syn.cc + this.pk.cc), by: t });
    } else if (def.splash) {
      const r2 = s.splash * s.splash;
      const tx = target.x;
      const ty = target.y;
      dmg *= 1 + this.syn.aoe;
      this.emit({ k: 'splash', x: tx, y: ty, r: s.splash, attr: def.attr, big: s.splash >= 1.4 });
      for (const e of this.enemies) {
        if (e.dead) continue;
        const dx = e.x - tx;
        const dy = e.y - ty;
        if (dx * dx + dy * dy <= r2) this.hit(e, dmg, t);
      }
    } else if (def.pierce) {
      const dx = target.x - t.x;
      const dy = target.y - t.y;
      const l = Math.hypot(dx, dy) || 1;
      const ux = dx / l;
      const uy = dy / l;
      this.emit({ k: 'beam', x1: t.x, y1: t.y, x2: t.x + ux * t.range, y2: t.y + uy * t.range });
      for (const e of this.enemies) {
        if (e.dead) continue;
        const px = e.x - t.x;
        const py = e.y - t.y;
        const along = px * ux + py * uy;
        if (along < 0 || along > t.range) continue;
        if (Math.abs(px * uy - py * ux) <= 0.45) this.hit(e, dmg, t);
      }
    } else {
      this.hit(target, dmg, t);
    }
    this.critNow = false;
    // 연타 특수: 확률로 한 번 더
    if (!echo && s.key === 'double' && s.sp > 0 && !target.dead && this.rng() < 0.15 * s.sp) this.attack(t, target, true);
  }
  pulse(t) {
    const p = t.def.pulse;
    const r2 = t.range * t.range;
    const inRange = [];
    for (const e of this.enemies) {
      if (e.dead) continue;
      const dx = e.x - t.x;
      const dy = e.y - t.y;
      if (dx * dx + dy * dy <= r2) inRange.push(e);
    }
    if (!inRange.length) return false;
    const dur = 1 + this.syn.cc + this.pk.cc;
    if (p.sleep) {
      for (const e of inRange) e.sleepT = Math.max(e.sleepT, this.cc(e, 'sleep', t.s.sleep * dur));
      this.emit({ k: 'pulse', x: t.x, y: t.y, r: t.range, e: '💤' });
    }
    if (p.confuse) {
      inRange.sort((a, b) => b.d / b.path.len - a.d / a.path.len);
      for (const e of inRange.slice(0, t.s.confN)) e.confT = Math.max(e.confT, this.cc(e, 'confuse', p.confuse * dur));
      this.emit({ k: 'pulse', x: t.x, y: t.y, r: t.range, e: '🌀' });
    }
    return true;
  }

  // ---------- 한 틱 ----------
  step(dt) {
    if (this.result || this.perkOffer) return;
    this.t += dt;
    if (this.cheerT > 0) this.cheerT -= dt;
    if (this.cheerCd > 0) this.cheerCd -= dt;
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }

    // 웨이브 진행
    if (!this.started) {
      // 준비 시간: 배치만 가능
    } else if (this.spawnQ.length) {
      this.spawnClock += dt;
      while (this.spawnQ.length && this.spawnQ[0].t <= this.spawnClock) this.spawn(this.spawnQ.shift());
    } else if (!this.enemies.length) {
      if (this.waveIdx >= this.waves.length - 1) {
        this.result = 'win';
        return;
      }
      // 2웨이브를 넘길 때마다 특성 카드 한 장
      if (this.waveIdx >= 0 && this.perksGiven < 1 + Math.floor((this.waveIdx + 1) / 2)) {
        this.offerPerk();
        return;
      }
      this.gap -= dt;
      if (this.gap <= 0) {
        this.gap = RULES.waveDelay;
        this.startWave();
      }
    }

    // 장판
    for (const z of this.zones) z.t -= dt;
    if (this.zones.length && this.zones[0].t <= 0) this.zones = this.zones.filter((z) => z.t > 0);

    const detectors = this.towers.filter((t) => t.def.detect);
    const moveK = 1 - this.pk.enemySlow;

    // 적
    let anyDead = false;
    for (const e of this.enemies) {
      if (e.dead) { anyDead = true; continue; }
      if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowPct = 0; }
      if (e.vulnT > 0) { e.vulnT -= dt; if (e.vulnT <= 0) e.vulnPct = 0; }
      if (e.sealT > 0) e.sealT -= dt;
      if (e.ccReset > 0) { e.ccReset -= dt; if (e.ccReset <= 0) e.ccN = 0; }
      const sealed = e.sealT > 0;
      if (e.def.regen && !sealed && e.hp < e.maxHp) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.def.regen * dt);
      if (e.poisonT > 0) {
        e.poisonT -= dt;
        this.damage(e, e.poisonDps * dt, e.poisonBy, true);
      }
      if (this.zones.length && !e.dead) {
        // 장판끼리는 중첩되지 않고 가장 강한 것만 적용
        let zb = null;
        for (const z of this.zones) {
          const dx = e.x - z.x;
          const dy = e.y - z.y;
          if (dx * dx + dy * dy <= z.r * z.r && (!zb || z.dps > zb.dps)) zb = z;
        }
        if (zb) this.damage(e, zb.dps * dt, zb.by, true);
      }
      if (e.dead) { anyDead = true; continue; }

      // 이동
      if (e.sleepT > 0) {
        e.sleepT -= dt;
      } else if (e.confT > 0) {
        e.confT -= dt;
        e.d = Math.max(0, e.d - e.def.speed * dt);
      } else {
        e.d += e.def.speed * moveK * (1 - e.slowPct) * dt;
      }
      if (e.d >= e.path.len) {
        e.dead = true;
        anyDead = true;
        this.leaks++;
        this.hearts -= e.boss ? 10 : 1;
        this.emit({ k: 'leak' });
        if (this.hearts <= 0) {
          this.hearts = 0;
          this.result = 'lose';
          return;
        }
        continue;
      }
      posAt(e.path, e.d, e);

      // 은신: 3초 보이고 2초 숨음. 유령 사거리 안이거나 봉인되면 드러남.
      if (e.def.stealth) {
        e.st += dt;
        let hidden = !sealed && e.st % 5 >= 3;
        if (hidden) {
          for (const g of detectors) {
            const dx = e.x - g.x;
            const dy = e.y - g.y;
            if (dx * dx + dy * dy <= g.range * g.range) { hidden = false; break; }
          }
        }
        e.hidden = hidden;
      }
      // 문어 먹물: 10초마다 가장 가까운 아군을 3초간 멈춤
      if (e.def.ink && !sealed) {
        e.inkT -= dt;
        if (e.inkT <= 0) {
          e.inkT = 10;
          let near = null;
          let nd = Infinity;
          for (const t of this.towers) {
            const d2 = (t.x - e.x) ** 2 + (t.y - e.y) ** 2;
            if (d2 < nd) { nd = d2; near = t; }
          }
          if (near) {
            near.disT = 3;
            this.emit({ k: 'ink', x: near.x, y: near.y });
          }
        }
      }
    }
    if (anyDead) this.enemies = this.enemies.filter((e) => !e.dead);

    // 아군
    const cheer = this.cheerT > 0 ? SKILL.cheerMul : 1;
    for (const t of this.towers) {
      const def = t.def;
      if (def.income) {
        t.incT += dt;
        if (t.incT >= def.income.every) {
          t.incT -= def.income.every;
          this.energy += t.s.income;
          this.emit({ k: 'coin', x: t.x, y: t.y, n: t.s.income });
        }
      }
      if (def.heal) {
        t.healT += dt * (1 + 0.4 * t.up.sp);
        if (t.healT >= def.heal.every) {
          t.healT -= def.heal.every;
          if (this.hearts < this.maxHearts) {
            this.hearts++;
            this.emit({ k: 'heal', x: t.x, y: t.y });
          }
        }
      }
      if (t.disT > 0) { t.disT -= dt; continue; }
      if (def.pulse) {
        t.abilT -= dt;
        if (t.abilT <= 0) t.abilT = this.pulse(t) ? t.s.pulseEvery : 0;
      }
      if (def.itv > 0) {
        t.cd -= dt * t.spdMul * cheer;
        if (t.cd <= 0) {
          const target = this.findTarget(t);
          if (target) {
            this.attack(t, target);
            t.cd += t.s.itv;
          } else {
            t.cd = 0;
          }
        }
      }
    }
  }

  stars() {
    if (this.result !== 'win') return 0;
    return this.hearts >= 15 ? 3 : this.hearts >= 8 ? 2 : 1;
  }
}

// ===== bot.js =====
// 자동 배치 봇 — 시뮬레이터와 게임 내 "자동" 버튼이 함께 씀

const samples = [];
{
  const p = { x: 0, y: 0 };
  for (let d = 0; d <= MAP.ground.len; d += 0.25) {
    posAt(MAP.ground, d, p);
    samples.push({ x: p.x, y: p.y, w: 1 });
  }
  for (let d = 0; d <= MAP.air.len; d += 0.25) {
    posAt(MAP.air, d, p);
    samples.push({ x: p.x, y: p.y, w: 0.35 });
  }
}
const covCache = new Map();
function coverage(c, r, range) {
  const rr = Math.round(range * 4) / 4;
  const key = c + ',' + r + ',' + rr;
  let v = covCache.get(key);
  if (v === undefined) {
    v = 0;
    for (const s of samples) if ((s.x - c) ** 2 + (s.y - r) ** 2 <= rr * rr) v += s.w;
    covCache.set(key, v);
  }
  return v;
}

const roleOf = (def) =>
  def.income ? 'econ'
    : def.aura || (def.pulse && !def.dmg) ? 'support'
      : def.slow || def.vuln || def.knock || def.pull || def.pulse ? 'ctrl'
        : 'dmg';
const isAtk = (def) => def.itv > 0;
// 특성 카드 선호 순서 (앞일수록 먼저 고름)
const PERK_ORDER = ['dmg', 'a_', 'spd', 'bounty', 'crit', 'boss', 'sale', 'range', 'aoe', 'dot', 'cash', 'mud', 'cc', 'charge', 'heart', 'refund'];

class Bot {
  // novice: 사람 초보를 흉내 — 느리게 반응하고 자리 선택이 엉성하며 강화·기술을 잘 안 씀
  constructor(game, rng, { novice = false } = {}) {
    this.novice = novice;
    this.g = game;
    this.rng = rng;
    this.want = null;
    this.waited = 0;
    this.acc = 0;
  }
  tick(dt) {
    const g = this.g;
    g.started = true;
    if (g.perkOffer) {
      let best = 0;
      if (this.novice) best = Math.floor(this.rng() * g.perkOffer.length);
      else {
        let bi = 99;
        g.perkOffer.forEach((p, i) => {
          const k = PERK_ORDER.findIndex((o) => p.id.startsWith(o));
          if (k >= 0 && k < bi) { bi = k; best = i; }
        });
      }
      g.pickPerk(best);
    }
    this.acc += dt;
    const every = this.novice ? 3 : 0.5;
    if (this.acc < every) return;
    this.acc = 0;
    this.waited += every;
    const boss = g.enemies.some((e) => e.boss);
    if (g.blast >= 1 && (g.enemies.length >= (this.novice ? 8 : 5) || boss)) g.useBlast();
    if (!this.novice && g.cheerCd <= 0 && (g.enemies.length >= 6 || boss)) g.useCheer();
    for (let i = 0; i < (this.novice ? 1 : 4); i++) if (!this.act()) break;
  }
  counts() {
    const c = { econ: 0, support: 0, dmg: 0, ctrl: 0, by: {} };
    for (const t of this.g.towers) {
      c[roleOf(t.def)]++;
      c.by[t.def.id] = (c.by[t.def.id] || 0) + 1;
    }
    return c;
  }
  canNew(def) {
    const g = this.g;
    return g.towers.length < RULES.maxUnits && g.countOf(def.id) < (def.max || RULES.maxCopies);
  }
  pickNew() {
    const g = this.g;
    const c = this.counts();
    const avail = g.deck.filter((d) => this.canNew(d));
    const dmg = avail.filter((d) => roleOf(d) === 'dmg');
    const econ = avail.filter((d) => roleOf(d) === 'econ');
    const lim = c.dmg >= 5 ? 2 : 1;
    const sup = avail.filter((d) => (roleOf(d) === 'support' || roleOf(d) === 'ctrl') && (c.by[d.id] || 0) < lim);
    if (econ.length && c.dmg + c.ctrl >= 1 && g.waveIdx <= 2) return econ[0];
    let pool;
    if (c.dmg < 2 && dmg.length) {
      const cheap = dmg.filter((d) => d.cost <= Math.max(g.energy, 130));
      pool = cheap.length ? cheap : [dmg.slice().sort((a, b) => a.cost - b.cost)[0]];
    } else {
      pool = dmg.concat(sup);
    }
    if (!pool.length) pool = avail.filter((d) => isAtk(d) && roleOf(d) !== 'econ');
    if (!pool.length) return null;
    const late = g.waveIdx >= 3;
    let tot = 0;
    const ws = pool.map((d) => {
      const w = late ? d.cost : 100;
      tot += w;
      return w;
    });
    let x = this.rng() * tot;
    for (let i = 0; i < pool.length; i++) {
      x -= ws[i];
      if (x < 0) return pool[i];
    }
    return pool[pool.length - 1];
  }
  // 강화할 캐릭터와 갈래를 고름: 좋은 자리에 있는 캐릭터부터, 공격력과 공속을 번갈아
  pickUp() {
    const g = this.g;
    let best = null;
    for (const t of g.towers) {
      if (g.levelOf(t) >= UP.total) continue;
      const tracks = tracksOf(t.def).filter((k) => t.up[k] < UP.max);
      if (!tracks.length) continue;
      const role = roleOf(t.def);
      const s = coverage(t.col, t.row, t.range || 2.5) * (role === 'dmg' ? 1 : role === 'ctrl' ? 0.6 : 0.35) * (0.8 + this.rng() * 0.4) / (1 + g.levelOf(t) * 0.25);
      if (!best || s > best.s) best = { t, s, tracks };
    }
    if (!best) return null;
    const { t, tracks } = best;
    let track;
    const r = this.rng();
    if (this.novice) track = tracks[Math.floor(r * tracks.length)];
    else if (roleOf(t.def) === 'dmg' || roleOf(t.def) === 'ctrl') {
      const main = ['dmg', 'spd'].filter((k) => tracks.includes(k)).sort((a, b) => t.up[a] - t.up[b]);
      track = r < 0.14 && tracks.includes('rng') ? 'rng' : r < 0.32 && tracks.includes('sp') ? 'sp' : main[0] || tracks[0];
    } else track = tracks.includes('sp') ? 'sp' : tracks[0];
    return { t, track };
  }
  pickWant() {
    const g = this.g;
    const def = this.pickNew();
    const up = this.novice && g.towers.length < RULES.maxUnits && def ? null : this.pickUp();
    if (def && (!up || g.towers.length < 5 || this.rng() < 0.4)) return { def, cost: def.cost };
    if (up) return { up, cost: g.upCost(up.t, up.track) };
    return def ? { def, cost: def.cost } : null;
  }
  bestTile(def) {
    const g = this.g;
    const role = roleOf(def);
    const cand = [];
    for (let c = 0; c < MAP.cols; c++) {
      for (let r = 0; r < MAP.rows; r++) {
        if (!g.canBuild(c, r)) continue;
        let s;
        if (role === 'econ') {
          s = -coverage(c, r, 2.5);
        } else if (def.aura) {
          const R = g.rangeOf(def);
          s = 0;
          for (const t of g.towers) {
            if (isAtk(t.def) && (t.x - c) ** 2 + (t.y - r) ** 2 <= R * R) s += t.spent;
          }
          s -= coverage(c, r, 2.5) * 2;
        } else {
          s = coverage(c, r, g.rangeOf(def));
          for (const t of g.towers) {
            if (t.def.aura && (t.x - c) ** 2 + (t.y - r) ** 2 <= t.range * t.range) s *= 1.15;
          }
        }
        cand.push({ c, r, s });
      }
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.s - a.s);
    return cand[Math.floor(this.rng() * Math.min(this.novice ? Math.ceil(cand.length * 0.6) : 3, cand.length))];
  }
  act() {
    const g = this.g;
    if (g.result) return false;
    const w = this.want;
    const stale = !w || (w.def && !this.canNew(w.def)) || (w.up && (!g.towers.includes(w.up.t) || g.whyNoUp(w.up.t, w.up.track) === '이 갈래는 최대예요' || g.levelOf(w.up.t) >= UP.total));
    if (stale) {
      this.want = this.pickWant();
      this.waited = 0;
    }
    if (!this.want) return g.towers.length >= RULES.maxUnits ? this.swap() : false;
    if (g.energy < this.want.cost) {
      // 너무 오래 기다렸으면 다시 고름
      if (this.waited > 15) { this.want = null; this.waited = 0; }
      return false;
    }
    const want = this.want;
    this.want = null;
    if (want.up) return g.upgrade(want.up.t, want.up.track);
    const tile = this.bestTile(want.def);
    return tile ? !!g.place(want.def.id, tile.c, tile.r) : false;
  }
  // 12칸이 꽉 차고 강화할 것도 없으면 가장 적게 투자한 공격 캐릭터를 팔고 더 비싼 것으로 교체
  swap() {
    const g = this.g;
    let worst = null;
    for (const t of g.towers) {
      if (!isAtk(t.def)) continue;
      if (!worst || t.spent < worst.spent) worst = t;
    }
    if (!worst) return false;
    const refund = g.refundOf(worst);
    const opts = g.deck.filter(
      (d) => isAtk(d) && d.cost >= worst.spent * 1.4 && d.cost <= g.energy + refund && g.countOf(d.id) - (d === worst.def ? 1 : 0) < (d.max || RULES.maxCopies),
    );
    if (!opts.length) return false;
    const best = opts.sort((a, b) => b.cost - a.cost)[0];
    const { col, row } = worst;
    g.sell(worst);
    return !!g.place(best.id, col, row);
  }
}

// ===== brawl.js =====
// 이모지 디펜스 — 난투 모드 엔진: 캐릭터를 필드에 내보내면 스스로 걸어가 싸움 (DOM 의존 없음)

const BR = {
  W: 7, H: 11,
  maxE: 10, startE: 5, regen: 0.55, // 에너지: 초당 0.55, 최대 10
  time: 150,
  myBase: { x: 3.5, y: 10.2 }, enBase: { x: 3.5, y: 0.8 },
  baseHp: 1000, baseDmg: 14, baseItv: 0.8, baseRange: 2.6,
  deployMinY: 5.6,
};
// 디펜스 비용(50~260)을 난투 에너지(1~7)로 환산
// 공격하지 않는 지원형은 1 싸게
const bcost = (c) => Math.max(1, Math.round(c.cost / 40) - (c.dmg > 0 || c.zone ? 0 : 1));

// 디펜스 캐릭터 정의에서 난투 유닛 능력치를 만듦: 사거리 2 이하는 근접(튼튼), 그 외는 원거리(약함)
function unitOf(c) {
  const attacker = c.dmg > 0 || !!c.zone;
  const melee = attacker && c.range <= 2.0;
  return {
    e: c.e, src: c, attr: c.attr,
    hp: Math.round(c.cost * (melee ? 5.5 : c.income ? 2 : 3.2)),
    dmg: c.zone ? c.zone.dps * 1.6 : c.dmg,
    itv: c.zone ? 1.6 : c.itv,
    range: !attacker ? 0 : melee ? 0.75 : 1.2 + (c.range - 2) * 0.9,
    speed: c.income ? 0 : melee ? 0.95 : 0.75,
    melee, attacker,
    splash: c.splash ? Math.min(1.2, c.splash) : c.zone ? 1.0 : c.pierce ? 0.9 : 0,
    slow: c.slow, poison: c.poison || (c.zone ? { dps: 4, dur: 3 } : null), crit: c.crit || 0, critMul: c.critMul || 2,
    knock: c.knock || (c.pull ? 0.6 : 0), vuln: c.vuln, seal: c.seal,
    aura: c.aura, heal: c.heal ? { every: 2, amt: 30, r: 2.4 } : null,
    pulse: c.pulse ? { every: 6, stun: c.pulse.sleep ? 1.5 : 1.2, r: 1.8 } : null,
    income: c.income ? { every: 5, amt: 1 } : null, life: c.income ? 35 : 0,
    size: 0.62 + c.rar * 0.04,
  };
}

// 적 유닛 (동물 탭). cost는 적 AI가 쓰는 에너지, n은 한 번에 나오는 수
const BR_ENEMY = {
  ant: { hp: 60, dmg: 8, itv: 1.0, speed: 1.0, n: 3, cost: 2, size: 0.45 },
  bee: { hp: 42, dmg: 9, itv: 0.7, speed: 1.6, n: 2, cost: 2, size: 0.45 },
  boar: { hp: 430, dmg: 26, itv: 1.4, speed: 0.6, n: 1, cost: 4, size: 0.75 },
  bat: { hp: 85, dmg: 11, itv: 1.0, speed: 1.2, n: 2, cost: 3, size: 0.5, fly: true },
  worm: { hp: 210, dmg: 10, itv: 1.0, speed: 0.8, n: 1, cost: 3, size: 0.55, regen: 0.04 },
  turtle: { hp: 300, dmg: 16, itv: 1.3, speed: 0.55, n: 1, cost: 4, size: 0.65, armor: 3 },
  lizard: { hp: 130, dmg: 22, itv: 0.9, speed: 1.15, n: 1, cost: 3, size: 0.55, sniper: true },
  bear: { hp: 1500, dmg: 55, itv: 1.5, speed: 0.5, n: 1, cost: 0, size: 1.1, boss: true },
  octo: { hp: 1500, dmg: 45, itv: 1.2, speed: 0.45, n: 1, cost: 0, size: 1.2, boss: true, splash: 1.0 },
};
const ENEMY_E = { ant: '🐜', bee: '🐝', boar: '🐗', bat: '🦇', worm: '🐛', turtle: '🐢', lizard: '🦎', bear: '🐻', octo: '🐙' };
// 스테이지별 적 세기: [적 에너지 회복 배율, 능력치 배율, 적 기지 체력 배율] (시뮬레이터로 조정)
const BR_STAGE = (s) => ({ regen: 0.62 + 0.085 * s, stat: 0.85 + 0.09 * s, base: 0.85 + 0.15 * s });

let uid = 1;

class Brawl {
  constructor({ deck, stage, seed = 1, fx = false }) {
    this.rng = mulberry32(seed);
    this.deck = deck.map((id) => CHAR_BY_ID[id]);
    this.stage = stage;
    this.st = STAGES[stage - 1];
    this.k = BR_STAGE(stage);
    this.t = 0;
    this.energy = BR.startE;
    this.ee = 2;
    this.units = [];
    this.bases = [
      { team: 0, x: BR.myBase.x, y: BR.myBase.y, hp: BR.baseHp, maxHp: BR.baseHp, cd: 0, id: uid++, isBase: true, size: 1 },
      { team: 1, x: BR.enBase.x, y: BR.enBase.y, hp: Math.round(BR.baseHp * this.k.base), maxHp: Math.round(BR.baseHp * this.k.base), cd: 0, id: uid++, isBase: true, size: 1 },
    ];
    this.result = null;
    this.fxOn = fx;
    this.fx = [];
    this.aiPick = null;
    this.bossQ = Object.values(this.st.boss || {}).map((type, i) => ({ t: 30 + i * 45, type }));
    this.stats = {};
  }
  emit(ev) { if (this.fxOn) this.fx.push(ev); }

  // ---------- 배치 ----------
  whyNot(id, x, y) {
    const c = CHAR_BY_ID[id];
    if (y < BR.deployMinY) return '내 진영(아래쪽)에만 내보낼 수 있어요';
    if (this.energy < bcost(c)) return '에너지가 부족해요';
    return null;
  }
  deploy(id, x, y) {
    if (this.result || this.whyNot(id, x, y)) return null;
    const c = CHAR_BY_ID[id];
    this.energy -= bcost(c);
    const u = this.add(0, unitOf(c), Math.max(0.5, Math.min(BR.W - 0.5, x)), Math.max(BR.deployMinY, Math.min(BR.H - 1.4, y)));
    this.emit({ k: 'place', x: u.x, y: u.y });
    return u;
  }
  add(team, s, x, y) {
    const u = {
      ...s, id: uid++, team, x, y, maxHp: s.hp, cd: 0.3, abilT: 0, incT: 0,
      slowT: 0, slowPct: 0, poisonT: 0, poisonDps: 0, stunT: 0, vulnT: 0, sealT: 0, spdMul: 1, dmgMul: 1, dead: false,
    };
    this.units.push(u);
    return u;
  }
  spawnEnemy(type) {
    const d = BR_ENEMY[type];
    const x = 0.9 + this.rng() * (BR.W - 1.8);
    for (let i = 0; i < d.n; i++) {
      const s = this.k.stat;
      this.add(1, {
        e: ENEMY_E[type], type, attr: 'rage', hp: Math.round(d.hp * s), dmg: d.dmg * s, itv: d.itv, range: 0.7, speed: d.speed,
        melee: true, attacker: true, splash: d.splash || 0, crit: 0, critMul: 2, knock: 0, fly: d.fly, regen: d.regen, armor: d.armor,
        sniper: d.sniper, boss: d.boss, size: d.size, life: 0,
      }, x + (i - (d.n - 1) / 2) * 0.5, 1.7 + this.rng() * 0.4);
    }
  }

  // ---------- 전투 ----------
  damage(t, amt, src, crit, dot) {
    if (t.dead) return;
    if (!dot && t.armor && !(t.sealT > 0)) amt = Math.max(1, amt - t.armor);
    if (t.vulnT > 0) amt *= 1.15;
    const real = Math.min(t.hp, amt);
    t.hp -= amt;
    if (src) this.stats[src] = (this.stats[src] || 0) + real;
    if (!dot) this.emit({ k: 'hit', id: t.id, x: t.x, y: t.y, n: real, crit });
    if (t.hp <= 0 && !t.isBase) {
      t.dead = true;
      this.emit({ k: 'die', id: t.id, x: t.x, y: t.y, e: t.e, boss: t.boss, size: t.size });
    }
  }
  strike(u, target) {
    let dmg = u.dmg * u.dmgMul;
    const crit = u.crit > 0 && this.rng() < u.crit;
    if (crit) dmg *= u.critMul;
    if (!u.melee || u.isBase) this.emit({ k: 'shot', x1: u.x, y1: u.y, x2: target.x, y2: target.y, attr: u.attr || 'joy', crit, tid: u.id });
    else this.emit({ k: 'lunge', tid: u.id, x1: u.x, y1: u.y, x2: target.x, y2: target.y });
    const src = u.src ? u.src.id : null;
    const apply = (t) => {
      this.damage(t, dmg, src, crit, false);
      if (t.dead || t.isBase) return;
      if (u.slow && u.slow.pct >= t.slowPct) { t.slowPct = u.slow.pct; t.slowT = u.slow.dur; }
      if (u.poison) { t.poisonDps = Math.max(t.poisonDps, u.poison.dps); t.poisonT = u.poison.dur; t.poisonSrc = src; }
      if (u.vuln) t.vulnT = u.vuln.dur;
      if (u.seal) t.sealT = u.seal;
      if (u.knock && !t.boss) t.y += (t.team === 1 ? -1 : 1) * u.knock;
    };
    if (u.splash) {
      this.emit({ k: 'splash', x: target.x, y: target.y, r: u.splash, big: u.splash >= 1.2 && dmg >= 60 });
      for (const t of this.units) {
        if (t.team === u.team || t.dead) continue;
        if ((t.x - target.x) ** 2 + (t.y - target.y) ** 2 <= u.splash * u.splash) apply(t);
      }
      if (target.isBase) apply(target);
    } else apply(target);
  }
  nearest(u, maxD, filter) {
    let best = null;
    let bd = maxD * maxD;
    for (const t of this.units) {
      if (t.team === u.team || t.dead || (filter && !filter(t))) continue;
      const d = (t.x - u.x) ** 2 + (t.y - u.y) ** 2;
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }

  step(dt) {
    if (this.result) return;
    this.t += dt;
    this.energy = Math.min(BR.maxE, this.energy + BR.regen * dt);
    // 적 AI: 에너지가 모이면 무작위 유닛을 내보냄
    this.ee = Math.min(BR.maxE, this.ee + BR.regen * this.k.regen * dt);
    if (!this.aiPick) this.aiPick = this.st.pool[Math.floor(this.rng() * this.st.pool.length)];
    if (this.t > 3 && this.ee >= BR_ENEMY[this.aiPick].cost) {
      this.ee -= BR_ENEMY[this.aiPick].cost;
      this.spawnEnemy(this.aiPick);
      this.aiPick = null;
    }
    while (this.bossQ.length && this.bossQ[0].t <= this.t) {
      this.spawnEnemy(this.bossQ.shift().type);
      this.emit({ k: 'boss' });
    }

    // 오라
    for (const u of this.units) { u.spdMul = 1; u.dmgMul = 1; }
    for (const a of this.units) {
      if (!a.aura || a.dead) continue;
      for (const u of this.units) {
        if (u.team !== a.team || u === a) continue;
        if ((u.x - a.x) ** 2 + (u.y - a.y) ** 2 > 4) continue;
        if (a.aura.spd) u.spdMul = Math.max(u.spdMul, 1 + a.aura.spd);
        if (a.aura.dmg) u.dmgMul = Math.max(u.dmgMul, 1 + a.aura.dmg);
      }
    }

    for (const u of this.units) {
      if (u.dead) continue;
      if (u.slowT > 0) { u.slowT -= dt; if (u.slowT <= 0) u.slowPct = 0; }
      if (u.vulnT > 0) u.vulnT -= dt;
      if (u.sealT > 0) u.sealT -= dt;
      if (u.regen && !(u.sealT > 0)) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * u.regen * dt);
      if (u.poisonT > 0) { u.poisonT -= dt; this.damage(u, u.poisonDps * dt, u.poisonSrc, false, true); if (u.dead) continue; }
      if (u.life) { u.life -= dt; if (u.life <= 0) { u.dead = true; this.emit({ k: 'die', id: u.id, x: u.x, y: u.y, e: u.e, size: u.size }); continue; } }
      if (u.income) {
        u.incT += dt;
        if (u.incT >= u.income.every) { u.incT = 0; this.energy = Math.min(BR.maxE, this.energy + u.income.amt); this.emit({ k: 'coin', x: u.x, y: u.y, n: u.income.amt }); }
      }
      if (u.stunT > 0) { u.stunT -= dt; continue; }
      if (u.heal) {
        u.abilT += dt;
        if (u.abilT >= u.heal.every) {
          u.abilT = 0;
          for (const a of this.units) {
            if (a.team === u.team && !a.dead && a.hp < a.maxHp && (a.x - u.x) ** 2 + (a.y - u.y) ** 2 <= u.heal.r ** 2) a.hp = Math.min(a.maxHp, a.hp + u.heal.amt);
          }
          this.emit({ k: 'pulse', x: u.x, y: u.y, r: u.heal.r, e: '💗' });
        }
      }
      if (u.pulse) {
        u.abilT += dt;
        if (u.abilT >= u.pulse.every && this.nearest(u, u.pulse.r)) {
          u.abilT = 0;
          for (const t of this.units) {
            if (t.team !== u.team && !t.dead && (t.x - u.x) ** 2 + (t.y - u.y) ** 2 <= u.pulse.r ** 2) t.stunT = Math.max(t.stunT, u.pulse.stun * (t.boss ? 0.3 : 1));
          }
          this.emit({ k: 'pulse', x: u.x, y: u.y, r: u.pulse.r, e: '💤' });
        }
      }
      if (!u.speed) continue;

      const foeBase = this.bases[1 - u.team];
      const speed = u.speed * (1 - u.slowPct) * dt;
      if (!u.attacker) {
        // 지원형: 적이 가까워지면 멈추고, 아니면 아군을 따라 전진
        if (!this.nearest(u, 2.4) && Math.abs(foeBase.y - u.y) > 3) u.y += (u.team === 0 ? -1 : 1) * speed;
        continue;
      }
      // 박쥐는 유닛을 무시하고 기지로, 도마뱀은 원거리 유닛부터 노림. 근접 유닛은 나는 적을 못 때림.
      let target = null;
      if (!u.fly) {
        if (u.sniper) target = this.nearest(u, 4, (t) => !t.melee);
        if (!target) target = this.nearest(u, Math.max(3, u.range + 0.8), u.melee ? (t) => !t.fly : null);
      }
      if (!target) target = foeBase;
      const dx = target.x - u.x;
      const dy = target.y - u.y;
      const d = Math.hypot(dx, dy) || 0.001;
      const reach = u.range + (target.isBase ? 0.7 : 0.25);
      if (d <= reach) {
        u.cd -= dt * u.spdMul;
        if (u.cd <= 0) { u.cd += u.itv; this.strike(u, target); }
      } else {
        if (u.cd > 0) u.cd -= dt;
        u.x += (dx / d) * speed;
        u.y += (dy / d) * speed;
      }
    }
    // 기지도 가까운 적을 쏨
    for (const b of this.bases) {
      b.cd -= dt;
      if (b.cd > 0) continue;
      const t = this.nearest(b, BR.baseRange);
      if (t) { b.cd = BR.baseItv; this.strike({ ...b, dmg: BR.baseDmg, dmgMul: 1, crit: 0, attr: b.team ? 'rage' : 'joy' }, t); }
      else b.cd = 0;
    }
    // 겹침 방지
    const us = this.units;
    for (let i = 0; i < us.length; i++) {
      const a = us[i];
      for (let j = i + 1; j < us.length; j++) {
        const b = us[j];
        if (a.team !== b.team) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 0.2 && d2 > 0) {
          const d = Math.sqrt(d2);
          const p = (0.45 - d) * 0.25;
          a.x -= (dx / d) * p; b.x += (dx / d) * p;
        } else if (d2 === 0) b.x += 0.05;
      }
      a.x = Math.max(0.35, Math.min(BR.W - 0.35, a.x));
      a.y = Math.max(0.6, Math.min(BR.H - 0.6, a.y));
    }
    if (us.some((u) => u.dead)) this.units = us.filter((u) => !u.dead);

    const [me, en] = this.bases;
    if (en.hp <= 0) { en.hp = 0; this.result = 'win'; this.emit({ k: 'die', id: en.id, x: en.x, y: en.y, e: '🕳️', boss: true }); }
    else if (me.hp <= 0) { me.hp = 0; this.result = 'lose'; }
    else if (this.t >= BR.time) this.result = me.hp / me.maxHp > en.hp / en.maxHp ? 'win' : 'lose';
  }
  stars() {
    if (this.result !== 'win') return 0;
    const r = this.bases[0].hp / this.bases[0].maxHp;
    return r >= 0.7 ? 3 : r >= 0.35 ? 2 : 1;
  }
}

// 시뮬레이터용: 아무 카드나 낼 수 있을 때 내는 단순한 플레이어
class BrawlBot {
  constructor(g, rng) { this.g = g; this.rng = rng; this.pick = null; this.acc = 0; }
  tick(dt) {
    this.acc += dt;
    if (this.acc < 0.5) return;
    this.acc = 0;
    const g = this.g;
    if (!this.pick) this.pick = g.deck[Math.floor(this.rng() * g.deck.length)];
    if (g.energy < bcost(this.pick)) return;
    const u = unitOf(this.pick);
    g.deploy(this.pick.id, 1 + this.rng() * (BR.W - 2), u.melee ? 6 : u.attacker ? 7.6 : 8.4);
    this.pick = null;
  }
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

} catch (e) { /* 저장소를 못 쓰는 환경에서는 새 게임으로 진행 */ }

// ---------- 소리 (WebAudio로 즉석 합성) ----------
const TONES = {
  shot: [560, 0.04, 'square', 0.02, -220], hit: [210, 0.06, 'triangle', 0.07, -110], crit: [900, 0.1, 'square', 0.06, -520],
  die: [320, 0.11, 'sine', 0.1, 380], boom: [95, 0.28, 'sawtooth', 0.13, -60], leak: [130, 0.32, 'sawtooth', 0.15, -90],
  place: [420, 0.09, 'sine', 0.1, 260], up: [620, 0.16, 'sine', 0.1, 520], coin: [1250, 0.06, 'sine', 0.05, 300],
  tap: [300, 0.07, 'triangle', 0.1, 160], flip: [700, 0.05, 'triangle', 0.06, 200], rare: [520, 0.35, 'sine', 0.12, 900],
};
const Sfx = {
  ac: null, last: {},
  tone(f, dur, type, vol, slide, delay = 0) {
    const ac = this.ac;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  },
  play(name) {
    if (save.mute) return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < 50) return;
    this.last[name] = now;
    try {
      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ac.state === 'suspended') this.ac.resume();
      if (name === 'win') [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.1, 0, i * 0.11));
      else if (name === 'lose') [392, 330, 262].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.1, -30, i * 0.18));
      else this.tone(...TONES[name]);
    } catch (e) { /* 소리를 못 내는 환경은 조용히 진행 */ }
  },
};

const LINES = {
  any: ['출격하자!', '키보드는 우리가 지킨다', '오늘 기분 최고', '개미 싫어…', '□ 조심해!', '나도 덱에 넣어줘', '산책 중~'],
  joy: ['헤헤', '신난다!'], rage: ['다 덤벼!', '으으 열받아'], sad: ['훌쩍…', '비 올 것 같아'],
  fear: ['으악 깜짝이야', '뒤에 뭐 있어?'], calm: ['좋은 날씨네', '…'], prank: ['메롱~', '장난칠 사람?'],
};
const Home = {
  items: [], raf: 0, last: 0, talkT: 2,
  enter() {
    const ground = $('#ground');
    ground.innerHTML = '';
    this.items = Object.keys(save.owned).filter((id) => CHAR_BY_ID[id]).map((id) => {
      const c = CHAR_BY_ID[id];
      const el = document.createElement('div');
      el.className = 'w';
      const aura = c.rar >= 3 ? `<div class="aura" style="background:radial-gradient(${RARITY[c.rar].color}aa, transparent 68%)"></div>` : '';
      el.innerHTML = `<div class="shadow"></div>${aura}<div class="body">${c.e}</div>`;
      ground.appendChild(el);
      const it = { c, el, body: el.querySelector('.body'), x: Math.random(), y: Math.random(), tx: 0, ty: 0, pause: Math.random() * 2, speed: 0.05 + Math.random() * 0.05, dir: 1, sayT: 0 };
      this.retarget(it);
      el.onclick = () => this.poke(it);
      return it;
    });
    $('#homeStars').textContent = `⭐ ${totalStars()}/${STAGES.length * 6}`;
    cancelAnimationFrame(this.raf);
    this.last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      this.tick(dt);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  leave() { cancelAnimationFrame(this.raf); },
  retarget(it) {
    it.tx = 0.06 + Math.random() * 0.88;
    it.ty = Math.random();
  },
  say(it, html, dur = 2.2) {
    it.el.querySelector('.say')?.remove();
    const s = document.createElement('div');
    s.className = 'say';
    s.innerHTML = html;
    it.el.appendChild(s);
    it.sayT = dur;
  },
  poke(it) {
    const c = it.c;
    it.el.classList.remove('hop');
    void it.el.offsetWidth;
    it.el.classList.add('hop');
    it.pause = 1.6;
    this.say(it, `${c.name}<small style="color:${RARITY[c.rar].color}">${RARITY[c.rar].name} · ${ATTR[c.attr].icon}${ATTR[c.attr].name}${save.deck.includes(c.id) ? ' · 덱' : ''}</small>`, 2.6);
  },
  tick(dt) {
    const g = $('#ground');
    const W = g.clientWidth;
    const H = g.clientHeight;
    const top = 30;
    const bottom = H - 150; // 아래 버튼 영역은 비워 둠
    for (const it of this.items) {
      if (it.sayT > 0) { it.sayT -= dt; if (it.sayT <= 0) it.el.querySelector('.say')?.remove(); }
      let moving = false;
      if (it.pause > 0) {
        it.pause -= dt;
      } else {
        const dx = it.tx - it.x;
        const dy = it.ty - it.y;
        const d = Math.hypot(dx, dy);
        if (d < 0.01) { it.pause = 0.6 + Math.random() * 3; this.retarget(it); }
        else {
          const step = Math.min(d, it.speed * dt);
          it.x += (dx / d) * step;
          it.y += (dy / d) * step * (W / Math.max(200, bottom - top));
          it.y = Math.max(0, Math.min(1, it.y));
          if (Math.abs(dx) > 0.002) it.dir = dx > 0 ? 1 : -1;
          moving = true;
        }
      }
      const sc = (0.62 + 0.5 * it.y) * (1 + it.c.rar * 0.05);
      it.el.style.transform = `translate(${it.x * W}px, ${top + it.y * Math.max(60, bottom - top)}px) scale(${sc})`;
      it.el.style.zIndex = Math.round(it.y * 1000);
      it.body.style.scale = `${it.dir} 1`;
      it.el.classList.toggle('moving', moving);
    }
    this.talkT -= dt;
    if (this.talkT <= 0 && this.items.length) {
      this.talkT = 2.5 + Math.random() * 3;
      const it = this.items[Math.floor(Math.random() * this.items.length)];
      if (it.sayT <= 0) {
        const pool = LINES.any.concat(LINES[it.c.attr]);
        this.say(it, pool[Math.floor(Math.random() * pool.length)]);
      }
    }
  },
};

const gachaRng = mulberry32((Date.now() ^ (Math.random() * 1e9)) >>> 0);
function renderGacha() {
  const rows = [['영웅 확정', 'hero', 2], ['전설 확정', 'legend', 3], ['신화 확정', 'myth', 4]];
  $('#pityBox').innerHTML = rows.map(([label, k, r]) => {
    const left = PITY[k] - save.pity[k];
    return `<div class="row"><span style="color:${RARITY[r].color}">${label}</span><div class="track"><div class="fill" style="width:${(save.pity[k] / PITY[k]) * 100}%;background:${RARITY[r].color}"></div></div><span>${left}회 남음</span></div>`;
  }).join('');
  $('#rates').innerHTML = `확률: ${RARITY.map((r) => `<span style="color:${r.color}">${r.name} ${(r.rate * 100).toFixed(1)}%</span>`).join(' · ')}<br>
    천장: 영웅 ${PITY.hero}회 · 전설 ${PITY.legend}회 · 신화 ${PITY.myth}회 안에 확정 (천장은 해당 등급을 지급)`;
  $('#pull1').disabled = save.gems < PULL_COST;
  $('#pull10').disabled = save.gems < PULL_COST * 10;
  refreshGems();
}
function pull(n) {
  if (save.gems < PULL_COST * n) { toast('젬이 부족해요. 스테이지를 클리어해 모아 보세요'); return; }
  save.gems -= PULL_COST * n;
  const got = [];
  for (let i = 0; i < n; i++) {
    const c = gachaPull(save.pity, gachaRng);
    const isNew = !save.owned[c.id];
    save.owned[c.id] = (save.owned[c.id] || 0) + 1;
    got.push({ c, isNew });
  }
  save.pulls += n;
  persist();
  renderGacha();
  gachaShow(got);
}
// 연출: 상자를 세 번 두드려 열고(빛 색이 최고 등급을 예고), 뒤집힌 키캡을 하나씩 눌러 공개
function gachaShow(got) {
  const top = Math.max(...got.map((g) => g.c.rar));
  modal(`<div class="gbox-wrap"><div class="gbox" id="gbox" style="--glow:${RARITY[top].color}">🎁</div><p id="gboxHint">상자를 두드려 여세요 (0/3)</p></div>`);
  let taps = 0;
  const box = $('#gbox');
  box.onclick = () => {
    taps++;
    Sfx.play('tap');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    box.style.setProperty('--lv', taps);
    $('#gboxHint').textContent = `상자를 두드려 여세요 (${taps}/3)`;
    if (taps >= 3) setTimeout(reveal, 260);
  };
  function reveal() {
    Sfx.play(top >= 3 ? 'rare' : 'up');
    modal(`<h3>누가 나왔을까?</h3><div class="results ${got.length === 1 ? 'one' : ''}">${got.map((g, i) =>
      `<button class="rcard back" data-i="${i}" style="animation-delay:${i * 0.06}s"><span class="q">?</span></button>`).join('')}</div>
      <p>키를 눌러 한 명씩 확인하세요. 이미 가진 캐릭터는 조각(×N)으로 쌓여요.</p>
      <div class="btns"><button class="key" id="mAll">모두 열기</button><button class="key primary" id="mOk" hidden>확인</button></div>`);
    let left = got.length;
    const open = (el) => {
      if (!el.classList.contains('back')) return;
      const { c, isNew } = got[+el.dataset.i];
      el.classList.remove('back');
      el.classList.add('open');
      el.style.animationDelay = '0s';
      el.style.borderColor = RARITY[c.rar].color;
      if (c.rar >= 2) el.style.boxShadow = `0 0 ${6 + c.rar * 5}px ${RARITY[c.rar].color}`;
      el.innerHTML = `${isNew ? '<span class="new">NEW</span>' : ''}<div class="em">${c.e}</div><div>${c.name}</div><div style="color:${RARITY[c.rar].color}">${RARITY[c.rar].name}</div>`;
      Sfx.play(c.rar >= 3 ? 'rare' : 'flip');
      if (c.rar >= 3) { const sh = $('#sheet'); sh.classList.remove('flash'); void sh.offsetWidth; sh.style.setProperty('--glow', RARITY[c.rar].color); sh.classList.add('flash'); }
      if (--left === 0) { $('#mAll').hidden = true; $('#mOk').hidden = false; }
    };
    $$('#sheet .rcard').forEach((el) => (el.onclick = () => open(el)));
    $('#mAll').onclick = () => $$('#sheet .rcard.back').forEach((el, i) => setTimeout(() => open(el), i * 110));
    $('#mOk').onclick = closeModal;
  }
}
